# 로한북 테스트 — 푸시하면 GitHub 이 25개 스위트를 돌린다.
#
# 🔒 왜 있나: 검증이 로버트의 세션에만 있으면, 그 세션의 도구가 죽는 순간 검증이 사라진다.
#    2026-09-16 에 실제로 그랬다(명령 승인 검사기 장애로 3시간 넘게 테스트를 못 돌렸다).
#    CI 는 세션과 무관하게 돈다 — 로한이 푸시하면 깃허브가 대신 확인하고 ✓/✗ 를 남긴다.
#    보너스: 로버트가 "통과했다"고 잘못 말해도 여기서 걸린다.
name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:      # 깃허브 화면에서 손으로도 돌릴 수 있다

jobs:
  run:
    # 🔴 [결함·CI 2026-11] 「playwright + chromium 설치」에서 몇 주째 죽고 있었다(테스트는 돌지도 않았다).
    #    ubuntu-latest 가 바뀌면 고정한 playwright(1.56)의 --with-deps 가 시스템 패키지를 못 깐다.
    #    🔒 러너를 고정한다 — 바꿀 때는 playwright 판과 같이 올린다
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # playwright 는 package.json 없이도 이렇게 넣는다 (레포에 node_modules 를 두지 않는다)
      - name: playwright + chromium 설치
        run: |
          npm init -y >/dev/null
          npm i -D playwright@1.56.0
          npx playwright install --with-deps chromium

      # 🔒 로한의 PC 와 같게 — 한글 글꼴(글자 폭·넘침을 재는 테스트) · 한국 시간(날짜 경계를 재는 테스트)
      - name: 한글 글꼴
        run: sudo apt-get install -y fonts-noto-cjk >/dev/null

      # 🔒 CHROME 을 비워 둔다 — playwright 가 방금 받은 제 번들을 쓴다.
      #    (제작방 컨테이너에서만 /opt/pw-browsers/chromium 을 쓴다)
      # ⚠️ [결함·CI] `./run.sh` 로 부르면 **첫 실행부터 Permission denied 로 죽는다.**
      #    git index 의 run.sh 모드가 100644(실행권한 없음)다 — 윈도우에서 커밋했고
      #    .git/config 에 filemode=false 라 작업트리의 +x 가 git 에 안 올라간다.
      #    🔒 `bash` 로 불러라. 실행권한과 무관하게 돈다.
      #    (run.sh 가 스스로 자기 폴더로 cd 하므로 tests/ 로 들어갈 필요도 없다)
      - name: 전체 테스트
        env:
          TZ: Asia/Seoul
        run: HTML="$GITHUB_WORKSPACE/index.html" JOBS=4 bash tests/run.sh all

      # 🔒 실패한 스위트를 **공개 주석**으로 남긴다 — 작업 로그는 관리자만 받을 수 있어 제작방이 못 읽는다
      - name: 실패 요약(주석)
        if: failure()
        run: |
          for f in tests/.out/*.log; do
            n=$(basename "$f" .log)
            if grep -qE "✗|Error|실패 [1-9]" "$f"; then
              msg=$(grep -m6 -E "✗|Error|실패" "$f" | tr -s '[:space:]' ' ' | cut -c1-900)
              echo "::error title=$n::$msg"
            fi
          done

      # 실패했을 때 어느 스위트가 왜 깨졌는지 보려고 로그를 남긴다
      - name: 실패 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: tests/.out/*.log
          retention-days: 7
