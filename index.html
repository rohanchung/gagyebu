<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>💰 가계부</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--soft:#f8fafc;--line:#e4e8f0;--ink:#1b2333;--muted:#6b7789;--accent:#2f6df6;--accent-bg:#eaf1ff;--pos:#0f9d58;--neg:#e0483d;--warn:#b26a00;--warn-bg:#fff6e2;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif}
/* login */
.login{position:fixed;inset:0;background:linear-gradient(160deg,#eef2fb,#f6f8fc);display:flex;align-items:center;justify-content:center;z-index:50}
.login .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 26px;width:320px;box-shadow:0 16px 50px rgba(0,0,0,.1);text-align:center}
.login h1{font-size:22px;margin:0 0 4px}.login p{color:var(--muted);font-size:12px;margin:0 0 18px}
.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;text-align:center;letter-spacing:2px}
.login button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.login .err{color:var(--neg);font-size:12px;min-height:16px;margin-top:8px}
.app{display:none;min-height:100vh;max-width:1680px;margin:0 auto}
.app.on{display:flex}
.side{width:170px;background:var(--card);border-right:1px solid var(--line);padding:16px 10px;flex-shrink:0}
.brand{font-size:16px;font-weight:800;padding:4px 8px 16px}
.side .m{display:flex;gap:8px;padding:10px 11px;border-radius:9px;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:2px;font-weight:600}
.side .m.on{background:var(--accent-bg);color:var(--accent)}
.side .m.dim{opacity:.45;cursor:default}
.side .sub{color:#9aa6b6;font-size:10px;padding:14px 11px 4px;font-weight:700}
.main{flex:1;padding:18px;min-width:0}
.view{display:none}.view.on{display:block}
.updated{font-size:11px;color:var(--muted);margin-bottom:12px}.updated b{color:var(--pos)}
.cards3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.c3{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px;cursor:pointer}
.c3:hover{border-color:var(--accent)}
.c3 .l{font-size:11px;color:var(--muted)}.c3 .v{font-size:16px;font-weight:800;margin-top:5px}
.c3 .g{font-size:10px;color:var(--muted);margin-top:6px}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}
.sec h4{margin:0 0 8px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.grp{border-top:1px solid var(--line);padding-top:7px;margin-top:7px}.grp:first-of-type{border-top:0;margin-top:2px}
.ghd{display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;font-weight:700}
.chip{font-size:9px;padding:1px 6px;border-radius:4px;margin-left:5px}
.chip.auto{background:#e7f6ee;color:var(--pos)}.chip.manual,.chip.credit{background:#eef2fb;color:var(--accent)}.chip.check{background:#f0f0f4;color:#7a7a90}
.item{display:flex;justify-content:space-between;padding:8px 9px;margin:3px 0;font-size:12.5px;color:#33425e;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--soft)}
.item:hover{border-color:var(--accent);background:var(--accent-bg)}
.mut{color:var(--muted);font-size:11px}
.hint{font-size:11px;color:var(--muted);margin-top:8px}
.btn{background:var(--accent);border:0;color:#fff;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
.btn.sm{padding:6px 10px;font-size:11.5px}.btn.warn{background:var(--warn)}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 11px;font-size:11.5px;cursor:pointer;font-weight:600}
.cardbox{background:var(--warn-bg);border:1px solid #f0dca5}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.row:last-child{border-bottom:0}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;background:#eef2f8;color:#5a6b86;margin-right:5px}
.badge{font-size:9px;color:#fff;background:var(--warn);padding:1px 5px;border-radius:4px;margin-left:5px}
.acts span{color:var(--muted);cursor:pointer;font-size:11px;margin-left:8px}
.acts span:hover{color:var(--accent)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.mnav{display:flex;align-items:center;gap:12px}.mnav b{font-size:16px}.mnav span{cursor:pointer;color:var(--muted);padding:2px 8px;user-select:none;font-size:15px}
.msum{display:flex;gap:8px}.msum div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:11.5px;text-align:right}.msum .l{color:var(--muted);font-size:9.5px}
.calwrap{display:flex;gap:16px;align-items:flex-start}
.calmain{flex:1;min-width:0}
.calside{width:360px;flex-shrink:0;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
.calside .detail{margin-top:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{color:var(--muted);font-size:11px;text-align:center;padding:4px 0}.dow.s0{color:var(--neg)}.dow.s6{color:var(--accent)}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:96px;padding:5px 6px;cursor:pointer;position:relative;overflow:hidden}
.cell:hover{border-color:var(--accent)}.cell.empty{background:transparent;border:0;cursor:default}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cell.today .dn{color:var(--accent);font-weight:800}
.cell .dhdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.cell .dn{font-size:11px;color:var(--muted)}
.cell .dsum{font-size:9.5px;color:var(--neg);font-weight:700;font-variant-numeric:tabular-nums}
.cell .cl{display:flex;justify-content:space-between;gap:5px;font-size:9.5px;line-height:1.45}
.cell .cl .c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#5a6b86}
.cell .cl .a{flex-shrink:0;font-variant-numeric:tabular-nums;font-weight:600}
.cell .cl.in .a{color:var(--pos)}.cell .cl.ex .a{color:var(--neg)}
.cell .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.detail{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px;margin-top:14px}
.dhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.dhd h4{margin:0;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(20,30,50,.4);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.overlay.on{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:460px;padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.22);max-height:90vh;overflow:auto}
.mtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}.modal h3{margin:0;font-size:16px}
.x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.mcur{font-size:22px;font-weight:800;margin:4px 0}
.logrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.logrow .del{color:var(--neg);cursor:pointer;font-size:10.5px;margin-left:8px}
.field{margin-bottom:10px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--muted);font-size:12px;cursor:pointer;font-weight:600}.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.updrow{display:flex;gap:6px;margin-top:12px}.updrow input{flex:1;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px}
.autoNote{background:#e7f6ee;color:#0b6b3a;font-size:11.5px;padding:9px 11px;border-radius:8px;margin-top:10px}
.taxrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.taxrow.big{font-weight:800;font-size:14px;border-bottom:0;background:var(--warn-bg);padding:10px;border-radius:8px;margin-top:6px}
.taxin{width:130px;text-align:right;padding:5px 7px;border:1px solid var(--accent);border-radius:6px;font-size:12px;background:#f7faff}
.foot{padding:14px 8px;color:#9aa6b6;font-size:10.5px;text-align:center}.foot a{color:var(--accent);cursor:pointer}
@media(max-width:900px){.calwrap{flex-direction:column}.calside{width:100%;position:static;max-height:none}}
@media(max-width:640px){.app.on{flex-direction:column}.side{width:100%;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.side .brand{width:100%}.side .m{flex:1 0 auto}.side .sub{display:none}.side .m.dim{display:none}.msum div{padding:5px 7px}}
</style>
</head>

</div>
<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>

/* ====== 유틸 ====== */
function won(n){return '₩'+Math.round(Math.abs(n)).toLocaleString('ko-KR');}
function signWon(n){return (n<0?'-':'+')+won(n);}
function man(n){var v=Math.abs(n)/10000;return (n<0?'-':'+')+(v>=1?Math.round(v)+'만':v.toFixed(1)+'만');}
function comma(n){return Math.round(Math.abs(n)).toLocaleString('ko-KR');}
function uid(){return 'x'+Math.random().toString(36).slice(2,9);}
function latest(h){if(!h||!h.length)return 0;var s=h.slice().sort(function(a,b){return a.date<b.date?-1:1});return s[s.length-1].amount;}
function monthOf(d){return d.slice(0,7);}
function mIdx(d){return parseInt(d.slice(5,7),10)-1;}
function creditCard(name){var c=DB.cards.filter(function(x){return x.name===name})[0];return c&&c.type==='credit';}

/* ====== 선그래프 ====== */
function lineChart(series,opt){
  opt=opt||{};var W=380,H=170,PL=44,PR=12,PT=14,PB=26,col=opt.color||'#2f6df6';
  var pts=series.filter(function(p){return p.amount!=null}).map(function(p){return {x:mIdx(p.date),v:p.amount}}).sort(function(a,b){return a.x-b.x});
  if(!pts.length)return '<div class="mut" style="padding:14px 0">데이터 없음</div>';
  var vals=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(opt.zeroBase&&mn>0)mn=0;if(mn===mx){mn=mn-1;mx=mx+1;}var span=mx-mn;
  var X=function(i){return PL+(i/11)*(W-PL-PR)},Y=function(v){return PT+(1-(v-mn)/span)*(H-PT-PB)};
  var line=pts.map(function(p){return X(p.x)+','+Y(p.v)}).join(' ');
  var dots=pts.map(function(p){return '<circle cx="'+X(p.x)+'" cy="'+Y(p.v)+'" r="3" fill="'+col+'"/>'}).join('');
  var zero=(mn<0&&mx>0)?'<line x1="'+PL+'" y1="'+Y(0)+'" x2="'+(W-PR)+'" y2="'+Y(0)+'" stroke="#e4e8f0" stroke-dasharray="3 3"/>':'';
  var xl='';for(var i=0;i<12;i+=2){xl+='<text x="'+X(i)+'" y="'+(H-8)+'" font-size="9" fill="#9aa6b6" text-anchor="middle">'+(i+1)+'월</text>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+zero+'<polyline points="'+line+'" fill="none" stroke="'+col+'" stroke-width="2.5"/>'+dots+xl+'<text x="6" y="'+(PT+4)+'" font-size="9" fill="#9aa6b6">'+man(mx)+'</text><text x="6" y="'+(H-PB+2)+'" font-size="9" fill="#9aa6b6">'+man(mn)+'</text></svg>';
}

/* ====== 계산 ====== */
function accVal(a){return latest(a.hist);}
function groupTotals(){var g={};DB.accounts.forEach(function(a){g[a.group]=(g[a.group]||0)+accVal(a)});return g;}
function totalAssets(){return DB.accounts.reduce(function(s,a){return s+accVal(a)},0);}
function cardPendingByCard(){var m={};DB.transactions.forEach(function(t){if(t.card&&t.type==='expense'&&creditCard(t.method))m[t.method]=(m[t.method]||0)+t.amt;});return m;}
function cardPending(){var m=cardPendingByCard(),s=0;for(var k in m)s+=m[k];return s;}
function totalDebt(){return DB.debts.reduce(function(s,d){return s+d.balance},0)+cardPending();}
function monthTxns(m){return DB.transactions.filter(function(t){return monthOf(t.date)===m});}
function monthPL(m){var i=0,e=0;monthTxns(m).forEach(function(t){if(t.type==='income')i+=t.amt;else e+=t.amt});return {inc:i,exp:e,net:i-e};}

function computeMonthly(balance,ratePct,n,method){
  var r=(ratePct||0)/100/12; if(!n)return {monthly:0,note:'잔여 횟수를 입력하세요'};
  if(method==='만기일시')return {monthly:Math.round(balance*r),note:'이자만 매월 납부, 원금은 만기 일시상환'};
  if(method==='원리금균등'){var m=r===0?balance/n:balance*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);return {monthly:Math.round(m),note:'매월 동일액(원금+이자 합계 고정)'};}
  var p=balance/n, first=p+balance*r, last=p+(balance/n)*r;
  return {monthly:Math.round(first),note:'원금균등: 첫달 '+won(first)+' → 매월 감소(마지막 '+won(last)+'). 저장값=첫달 기준'};
}

   +'<div class="field"><label>이름</label><input id="ac_name" value="'+(a.name||'')+'" placeholder="예: 삼성전자 / 비트코인 / 신한 통장"></div>'
   +'<div class="field"><label>그룹</label><select id="ac_group" onchange="accGroupChange()">'+gsel+'</select></div>'
   +'<div class="field" id="ac_subwrap" style="display:'+(a.group==='투자'?'block':'none')+'"><label>투자 종류</label><select id="ac_sub">'+ss+'</select></div>'
   +'<div class="field" id="ac_curwrap" style="display:'+(a.group==='외환'?'block':'none')+'"><label>통화</label><select id="ac_cur">'+cs+'</select></div>'
   +'<div class="field"><label>현재 평가액(원화)</label><input id="ac_amt" value="'+(id?accVal(a):'')+'" placeholder="0"></div>'
   +'<button class="btn" onclick="saveAcc('+(id?"'"+id+"'":'null')+')">'+(id?'저장':'추가')+'</button>');
}
function accGroupChange(){var g=document.getElementById('ac_group').value;document.getElementById('ac_subwrap').style.display=g==='투자'?'block':'none';document.getElementById('ac_curwrap').style.display=g==='외환'?'block':'none';}
function saveAcc(id){
  var name=document.getElementById('ac_name').value.trim(),g=document.getElementById('ac_group').value,amt=parseFloat((document.getElementById('ac_amt').value+'').replace(/[^0-9.]/g,''))||0;
  if(!name)return alert('이름을 입력하세요');
  var TODAY='2026-08-10';
  if(id){var a=DB.accounts.filter(function(x){return x.id===id})[0];a.name=name;a.group=g;a.mode=g==='현금성'?'auto':'manual';a.subtype=g==='투자'?document.getElementById('ac_sub').value:undefined;a.currency=g==='외환'?document.getElementById('ac_cur').value:undefined;if(amt!==accVal(a)){a.hist=(a.hist||[]).filter(function(h){return h.date!==TODAY});a.hist.push({date:TODAY,amount:amt});}}
  else{var na={id:uid(),name:name,group:g,mode:g==='현금성'?'auto':'manual',hist:[{date:TODAY,amount:amt}]};if(g==='투자')na.subtype=document.getElementById('ac_sub').value;if(g==='외환')na.currency=document.getElementById('ac_cur').value;DB.accounts.push(na);}
  save();closeModal();renderAcct();renderDash();
}
function delAcc(id){if(!confirm('삭제할까요?'))return;DB.accounts=DB.accounts.filter(function(a){return a.id!==id});save();renderAcct();renderDash();}
function cardModal(id){
  var c=id?DB.cards.filter(function(x){return x.id===id})[0]:{name:'',type:'credit'};
  openModal('<div class="mtop"><h3>'+(id?'카드 수정':'카드 추가')+'</h3><span class="x" onclick="closeModal()">×</span></div>'
   +'<div class="field"><label>카드 이름</label><input id="cd_name" value="'+(c.name||'')+'" placeholder="예: 현대카드 / 국민 체크"></div>'
   +'<div class="field"><label>종류</label><select id="cd_type"><option value="credit"'+(c.type==='credit'?' selected':'')+'>신용(선결제·미결제 누적)</option><option value="check"'+(c.type==='check'?' selected':'')+'>체크(즉시결제)</option></select></div>'
   +'<button class="btn" onclick="saveCard('+(id?"'"+id+"'":'null')+')">'+(id?'저장':'추가')+'</button>');
}
function saveCard(id){var n=document.getElementById('cd_name').value.trim();if(!n)return alert('이름을 입력하세요');var type=document.getElementById('cd_type').value;if(id){var c=DB.cards.filter(function(x){return x.id===id})[0];c.name=n;c.type=type;}else DB.cards.push({id:uid(),name:n,type:type});save();closeModal();renderAcct();renderDash();}
function delCard(id){if(!confirm('삭제할까요?'))return;DB.cards=DB.cards.filter(function(c){return c.id!==id});save();renderAcct();renderDash();}
function debtModal(id){
  var d=id?DB.debts.filter(function(x){return x.id===id})[0]:{name:'',balance:'',rate:''};
  openModal('<div class="mtop"><h3>'+(id?'부채 수정':'부채 추가')+'</h3><span class="x" onclick="closeModal()">×</span></div>'
   +'<div class="field"><label>이름</label><input id="db_name" value="'+(d.name||'')+'" placeholder="예: 신용대출 / 전세자금"></div>'
   +'<div class="field"><label>잔액</label><input id="db_bal" value="'+(d.balance||'')+'" placeholder="0"></div>'
   +'<div class="field"><label>금리(연 %)</label><input id="db_rate" value="'+(d.rate!=null?d.rate:'')+'" placeholder="예: 4.5"></div>'
   +'<button class="btn" onclick="saveDebt('+(id?"'"+id+"'":'null')+')">'+(id?'저장':'추가')+'</button><div class="hint">스케줄(거치·상환방식)은 목록의 [스케줄] 버튼에서 관리.</div>');
}
function saveDebt(id){var n=document.getElementById('db_name').value.trim();if(!n)return alert('이름을 입력하세요');if(id){var d=DB.debts.filter(function(x){return x.id===id})[0];d.name=n;d.balance=numv('db_bal');d.rate=numv('db_rate')||null;}else DB.debts.push({id:uid(),name:n,balance:numv('db_bal'),rate:numv('db_rate')||null,schedule:null});save();closeModal();renderAcct();renderDash();}
function delDebt(id){if(!confirm('삭제할까요?'))return;DB.debts=DB.debts.filter(function(d){return d.id!==id});save();renderAcct();renderDash();}
function catModal(id){
  var c=id?DB.categories.filter(function(x){return x.id===id})[0]:{name:'',type:'expense',deductible:false,taxAccount:'지급수수료'};
  var accs=['지급수수료','통신비','매출원가','관리비(사업안분)','감가상각비','차량유지비','소모품비','여비교통비','광고선전비','도서·교육비','기타'];
  var accOpts=accs.map(function(a){return '<option'+(a===c.taxAccount?' selected':'')+'>'+a+'</option>'}).join('');
  openModal('<div class="mtop"><h3>'+(id?'카테고리 수정':'카테고리 추가')+'</h3><span class="x" onclick="closeModal()">×</span></div>'
   +'<div class="field"><label>이름</label><input id="k_name" value="'+(c.name||'')+'"></div>'
   +'<div class="field"><label>유형</label><div class="seg"><button class="'+(c.type==='expense'?'on':'')+'" onclick="catType(this,\'expense\')">지출</button><button class="'+(c.type==='income'?'on':'')+'" onclick="catType(this,\'income\')">수입</button></div></div>'
   +'<div id="k_taxwrap" style="display:'+(c.type==='expense'?'block':'none')+'">'
   +'<div class="field"><label>세무 구분</label><div class="seg"><button class="'+(!c.deductible?'on':'')+'" onclick="catDed(this,false)">개인(경비 아님)</button><button class="'+(c.deductible?'on':'')+'" onclick="catDed(this,true)">사업경비</button></div></div>'
   +'<div class="field"><label>계정과목(세무 매핑)</label><select id="k_acc">'+accOpts+'</select></div></div>'
   +'<button class="btn" onclick="saveCat('+(id?"'"+id+"'":'null')+')">저장</button>');
  modal._ctype=c.type;modal._cded=c.deductible;
}
function catType(b,v){modal._ctype=v;var bs=b.parentNode.querySelectorAll('button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');b.classList.add('on');document.getElementById('k_taxwrap').style.display=v==='expense'?'block':'none';}
function catDed(b,v){modal._cded=v;var bs=b.parentNode.querySelectorAll('button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');b.classList.add('on');}
function saveCat(id){
  var name=document.getElementById('k_name').value.trim();if(!name)return alert('이름 입력');
  var type=modal._ctype,ded=type==='expense'&&modal._cded,acc=ded?document.getElementById('k_acc').value:null;
  if(id){var c=DB.categories.filter(function(x){return x.id===id})[0];c.name=name;c.type=type;c.deductible=ded;c.taxAccount=acc;}
  else DB.categories.push({id:uid(),name:name,type:type,deductible:ded,taxAccount:acc});
  save();closeModal();renderAcct();
}
function delCat(id){if(!confirm('삭제할까요?'))return;DB.categories=DB.categories.filter(function(c){return c.id!==id});save();renderAcct();}
function txnModal(id){
  var t=id?DB.transactions.filter(function(x){return x.id===id})[0]:{date:selDate||'2026-08-10',type:'expense',scope:'personal',cat:'식비',method:DB.cards[0].name,amt:'',memo:''};
  var catOpts=DB.categories.filter(function(c){return c.type===t.type}).map(function(c){return '<option'+(c.name===t.cat?' selected':'')+'>'+c.name+'</option>'}).join('');
  var itemCatOpts=['해당없음'].concat(DB.itemCats||[]).map(function(c){return '<option'+(c===(t.itemCat||'해당없음')?' selected':'')+'>'+c+'</option>'}).join('');
  var methOpts=DB.cards.map(function(c){return c.name}).concat(['현금','이체']).map(function(m){return '<option'+(m===t.method?' selected':'')+'>'+m+'</option>'}).join('');
  openModal('<div class="mtop"><h3>'+(id?'거래 수정':'거래 추가')+'</h3><span class="x" onclick="closeModal()">×</span></div>'
   +'<div class="field"><label>유형</label><div class="seg"><button class="'+(t.type==='expense'?'on':'')+'" onclick="setType(this,\'expense\')">지출</button><button class="'+(t.type==='income'?'on':'')+'" onclick="setType(this,\'income\')">수입</button></div></div>'
   +'<div class="field"><label>대분류</label><div class="seg"><button class="'+(t.scope==='personal'?'on':'')+'" onclick="setScope(this,\'personal\')">개인</button><button class="'+(t.scope==='business'?'on':'')+'" onclick="setScope(this,\'business\')">사업</button></div></div>'
   +'<div class="field"><label>계정과목</label><select id="fCat">'+catOpts+'</select></div>'
   +'<div class="field"><label>세부계정과목 <span class="mut">(재물관리 카테고리 연동)</span></label><select id="fItemCat">'+itemCatOpts+'</select></div>'
   +'<div class="field"><label>결제수단</label><select id="fMethod">'+methOpts+'</select></div>'
   +'<div class="field"><label>금액</label><input id="fAmt" value="'+(t.amt||'')+'" placeholder="16900"></div>'
   +'<div class="field"><label>날짜</label><input id="fDate" value="'+t.date+'"></div>'
   +'<div class="field"><label>메모</label><textarea id="fMemo" rows="2">'+(t.memo||'')+'</textarea></div>'
   +'<label style="display:flex;align-items:center;gap:8px;font-size:12px;margin:4px 0 10px"><input type="checkbox" id="fAsset" style="width:auto"> 재물관리표에도 등록 (내구재 감가상각·식재료 제외)</label>'
   +'<button class="btn" onclick="saveTxn('+(id?"'"+id+"'":'null')+')">저장</button>');
  modal._type=t.type;modal._scope=t.scope;
}
function setType(b,v){modal._type=v;var bs=b.parentNode.querySelectorAll('button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');b.classList.add('on');document.getElementById('fCat').innerHTML=DB.categories.filter(function(c){return c.type===v}).map(function(c){return '<option>'+c.name+'</option>'}).join('');}
function setScope(b,v){modal._scope=v;var bs=b.parentNode.querySelectorAll('button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');b.classList.add('on');}
function saveTxn(id){
  var amt=parseFloat(document.getElementById('fAmt').value.replace(/[^0-9.]/g,'')),date=document.getElementById('fDate').value.trim();
  if(isNaN(amt)||!date)return alert('금액과 날짜 입력');
  var method=document.getElementById('fMethod').value;
  var itemCat=(document.getElementById('fItemCat')||{}).value||'해당없음';
  var rec={type:modal._type,scope:modal._scope,cat:document.getElementById('fCat').value,itemCat:itemCat,method:method,amt:amt,date:date,memo:document.getElementById('fMemo').value,card:creditCard(method)&&modal._type==='expense'};
  if(id){Object.assign(DB.transactions.filter(function(x){return x.id===id})[0],rec);}else{rec.id=uid();DB.transactions.push(rec);}
  var reg=document.getElementById('fAsset')&&document.getElementById('fAsset').checked;
  save();closeModal();renderCal();renderDash();
  if(reg&&rec.type==='expense')itemModal(null,{name:rec.cat,detail:rec.memo||'',cat:(itemCat&&itemCat!=='해당없음')?itemCat:'전자기기',cond:'신품',price:rec.amt,buy:rec.date,end:'',basis:'일간',units:'',status:'사용중'});
}
function delTxn(id){if(!confirm('삭제할까요?'))return;DB.transactions=DB.transactions.filter(function(t){return t.id!==id});save();renderCal();renderDash();}

/* ====== 이벤트 ====== */
var navs=document.querySelectorAll('.side .m[data-v]');
for(var i=0;i<navs.length;i++)(function(m){m.addEventListener('click',function(){
  var all=document.querySelectorAll('.side .m');for(var j=0;j<all.length;j++)all[j].classList.remove('on');m.classList.add('on');
  var vs=document.querySelectorAll('.view');for(var j=0;j<vs.length;j++)vs[j].classList.remove('on');
  document.getElementById('v-'+m.dataset.v).classList.add('on');
  if(m.dataset.v==='cal')renderCal();if(m.dataset.v==='acct')renderAcct();if(m.dataset.v==='tax')renderTax();if(m.dataset.v==='items')renderItems();if(m.dataset.v==='budget')renderBudget();if(m.dataset.v==='log')renderLog();
});})(navs[i]);
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-acc]');
  var vd=e.target.closest('[data-vdel]');if(vd)return delVal(vd.dataset.acc,vd.dataset.vdel);
  if(el&&el.dataset.acc&&el.classList.contains('item'))return assetModal(el.dataset.acc);
  var mt=e.target.closest('[data-metric]');if(mt)return metricModal(mt.dataset.metric);
  if(e.target.id==='settleBtn')return settleModal();
  var sc=e.target.closest('[data-sched]');if(sc)return schedModal(sc.dataset.sched);
  if(e.target.id==='addAccBtn')return accModal();
  var ea=e.target.closest('[data-editacc]');if(ea)return accModal(ea.dataset.editacc);
  var da=e.target.closest('[data-delacc]');if(da)return delAcc(da.dataset.delacc);
  if(e.target.id==='addCardBtn')return cardModal();
  var eca=e.target.closest('[data-editcard]');if(eca)return cardModal(eca.dataset.editcard);
  var dc=e.target.closest('[data-delcard]');if(dc)return delCard(dc.dataset.delcard);
  if(e.target.id==='addDebtBtn')return debtModal();
  var edb=e.target.closest('[data-editdebt]');if(edb)return debtModal(edb.dataset.editdebt);
  var dd=e.target.closest('[data-deldebt]');if(dd)return delDebt(dd.dataset.deldebt);
  if(e.target.id==='addCatBtn')return catModal(null);
  var ec=e.target.closest('[data-editcat]');if(ec)return catModal(ec.dataset.editcat);
  var kc=e.target.closest('[data-delcat]');if(kc)return delCat(kc.dataset.delcat);
  if(e.target.id==='addItemBtn')return itemModal(null);
  var ei=e.target.closest('[data-edititem]');if(ei)return itemModal(ei.dataset.edititem);
  var di=e.target.closest('[data-delitem]');if(di)return delItem(di.dataset.delitem);
  if(e.target.id==='addLogBtn')return logModal(null);
  var el2=e.target.closest('[data-editlog]');if(el2)return logModal(el2.dataset.editlog);
  var dl2=e.target.closest('[data-dellog]');if(dl2)return delLog(dl2.dataset.dellog);
  if(e.target.id==='taxCalc')return taxRecalc();
  var cell=e.target.closest('.cell[data-date]');if(cell)return renderDay(cell.dataset.date);
  var mv=e.target.closest('[data-mv]');if(mv){var d=new Date(DB.ui.month+'-01');d.setMonth(d.getMonth()+parseInt(mv.dataset.mv));DB.ui.month=d.toISOString().slice(0,7);save();selDate=null;return renderCal();}
  if(e.target.id==='calPick'||e.target.id==='calTitle')return monthPicker();
  if(e.target.id==='addTxn')return txnModal(null);
  var ed=e.target.closest('[data-edit]');if(ed)return txnModal(ed.dataset.edit);
  var dl=e.target.closest('[data-del]');if(dl)return delTxn(dl.dataset.del);
});
document.addEventListener('change',function(e){var b=e.target.closest('[data-budcat]');if(b)budgetChange(b.dataset.budcat,b.value);});
document.getElementById('reloadBtn').addEventListener('click',function(){location.reload();});
document.getElementById('logoutBtn').addEventListener('click',function(){SB.auth.signOut().then(function(){location.reload();});});

/* ====== Supabase 로그인 ====== */
function enter(){document.getElementById('login').style.display='none';document.getElementById('app').classList.add('on');loadState().then(function(d){DB=d;renderDash();});}
function doLogin(){var email=(document.getElementById('email').value||'').trim(),pw=document.getElementById('pw').value;document.getElementById('loginErr').textContent='로그인 중…';SB.auth.signInWithPassword({email:email,password:pw}).then(function(r){if(r.error){document.getElementById('loginErr').textContent=r.error.message;return;}USER=r.data.user;enter();});}
function doSignup(){var email=(document.getElementById('email').value||'').trim(),pw=document.getElementById('pw').value;if(!email||!pw){document.getElementById('loginErr').textContent='이메일·비밀번호 입력';return;}document.getElementById('loginErr').textContent='가입 중…';SB.auth.signUp({email:email,password:pw}).then(function(r){if(r.error){document.getElementById('loginErr').textContent=r.error.message;return;}if(r.data.session){USER=r.data.user;enter();}else{document.getElementById('loginErr').textContent='가입 완료. 이메일 인증이 켜져 있으면 메일 확인 후 로그인하세요.';}});}
document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('signupBtn').addEventListener('click',doSignup);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
SB.auth.getSession().then(function(r){if(r.data&&r.data.session){USER=r.data.session.user;enter();}});
</script>
</body>
