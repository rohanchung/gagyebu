<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rohan Book</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--card:#fff;--soft:#f8fafc;--line:#e4e8f0;--ink:#1b2333;--muted:#6b7789;--accent:#2f6df6;--accent-bg:#eaf1ff;--pos:#0f9d58;--neg:#e0483d;--warn:#b26a00;--warn-bg:#fff6e2;--gold:#a67c1a;--serif:'Cinzel','Gowun Batang',serif;}
*{box-sizing:border-box}
html{overflow-y:scroll}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif}
/* login */
.login{position:fixed;inset:0;background:linear-gradient(160deg,#eef2fb,#f6f8fc);display:flex;align-items:center;justify-content:center;z-index:50}
.login .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 26px;width:320px;box-shadow:0 16px 50px rgba(0,0,0,.1);text-align:center}
.login h1{font-size:22px;margin:0 0 4px}.login p{color:var(--muted);font-size:12px;margin:0 0 18px}
.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;text-align:center;letter-spacing:2px}
.login button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.login .err{color:var(--neg);font-size:12px;min-height:16px;margin-top:8px}
.app{display:none;min-height:100vh;max-width:1680px;margin:0 auto}
.app.on{display:flex}
.side{width:176px;background:linear-gradient(180deg,#fbfaf6,#fff);border-right:1px solid #e8e2cf;padding:10px 10px 16px;flex-shrink:0}
/* 로고가 세로 두 줄(크레스트+줄바꿈+텍스트)에 큰 여백까지 먹고 있었다 — 한 줄로 접는다 */
.brand{display:flex;align-items:center;justify-content:center;gap:7px;
  font-family:var(--serif);font-size:14.5px;font-weight:700;letter-spacing:.6px;color:var(--gold);
  padding:2px 6px 9px;border-bottom:1px solid #ece3c9;margin-bottom:6px;white-space:nowrap}
.brand br{display:none}
.side .m{display:flex;gap:8px;padding:10px 11px;border-radius:8px;color:#5a5240;font-size:13px;cursor:pointer;margin-bottom:2px;font-weight:600}
.side .m:hover{background:#f6f1e3}
.side .m.on{background:#f3ead2;color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.side .m.dim{opacity:.45;cursor:default}
.side .sub{font-family:var(--serif);color:var(--gold);font-size:10.5px;padding:10px 11px 3px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.sec h4{font-family:var(--serif);letter-spacing:.3px}
.brand-crest{width:22px;height:22px;flex-shrink:0;margin:0}
.main{flex:1;padding:18px;min-width:0}
.view{display:none}.view.on{display:block}
.updated{font-size:11px;color:var(--muted);margin-bottom:12px}.updated b{color:var(--pos)}
.cards3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.c3{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px;cursor:pointer}
.c3:hover{border-color:var(--accent)}
.c3 .l{font-size:11px;color:var(--muted)}.c3 .v{font-size:16px;font-weight:800;margin-top:5px}
.c3 .g{font-size:10px;color:var(--muted);margin-top:6px}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.sec h4{margin:0 0 8px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.grp{border-top:1px solid var(--line);padding-top:7px;margin-top:7px}.grp:first-of-type{border-top:0;margin-top:2px}
.ghd{display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;font-weight:700}
.chip{font-size:9px;padding:1px 6px;border-radius:4px;margin-left:5px}
.chip.auto{background:#e7f6ee;color:var(--pos)}.chip.manual,.chip.credit{background:#eef2fb;color:var(--accent)}.chip.check{background:#f0f0f4;color:#7a7a90}
.item{display:flex;justify-content:space-between;padding:8px 9px;margin:3px 0;font-size:12.5px;color:#33425e;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--soft)}
.item:hover{border-color:var(--accent);background:var(--accent-bg)}
.mut{color:var(--muted);font-size:11px}
.hint{font-size:11px;color:var(--muted);margin-top:8px}
.btn{background:var(--accent);border:0;color:#fff;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
.btn.sm{padding:6px 10px;font-size:11.5px}.btn.warn{background:var(--warn)}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 11px;font-size:11.5px;cursor:pointer;font-weight:600}
.cardbox{background:var(--warn-bg);border:1px solid #f0dca5}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.row:last-child{border-bottom:0}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;background:#eef2f8;color:#5a6b86;margin-right:5px}
.badge{font-size:9px;color:#fff;background:var(--warn);padding:1px 5px;border-radius:4px;margin-left:5px}
/* 11px 글자를 손가락으로 누르라는 건 무리다. 히트 영역을 26px로 넓힌다. */
.acts span{display:inline-flex;align-items:center;justify-content:center;
  min-width:26px;height:26px;border-radius:6px;color:var(--muted);cursor:pointer;font-size:12px;margin-left:4px;
  transition:background .12s,color .12s}
.acts span:hover{color:var(--accent);background:var(--soft)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.mnav{display:flex;align-items:center;gap:12px}.mnav b{font-size:16px}.mnav span{cursor:pointer;color:var(--muted);padding:2px 8px;user-select:none;font-size:15px}
.msum{display:flex;gap:8px}.msum div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:11.5px;text-align:right}.msum .l{color:var(--muted);font-size:9.5px}
.calwrap{display:flex;gap:16px;align-items:flex-start}
.calmain{flex:1;min-width:0}
.calside{width:360px;flex-shrink:0;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
.calside .detail{margin-top:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{color:var(--muted);font-size:11px;text-align:center;padding:4px 0}.dow.s0{color:var(--neg)}.dow.s6{color:var(--accent)}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:112px;padding:5px 6px;cursor:pointer;position:relative;overflow:hidden}
.cell:hover{border-color:var(--accent)}.cell.empty{background:transparent;border:0;cursor:default}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cell.today .dn{color:var(--accent);font-weight:800}
.cell .dhdr{display:flex;justify-content:space-between;align-items:center;gap:3px;margin-bottom:4px}
.dhdr .dn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;font-variant-numeric:tabular-nums}
.dhdr .dn.part{background:#f6efdb;color:#8a6d1f;font-weight:800}
.dhdr .dn.full{background:var(--gold);color:#fff;font-weight:800}
.mkw{flex:1 1 auto;display:flex;align-items:center;gap:2px;font-style:normal;line-height:1}
.mk{font-style:normal;font-size:11px;line-height:1;cursor:default}
.rwtxn select{border-color:#d9c79a;background:#fffdf6}
.cardbig{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--soft);margin-bottom:11px}
.cardbig.open{border-color:#a8ddc0;background:#f4fbf7}
.cardbig.used{opacity:.72}
.cardbig .cbt{font-family:var(--serif);font-size:14px;font-weight:700;margin-bottom:3px}
.cardbig .cbs{font-size:11.5px;color:var(--muted);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
/* ⚠️ 이 base 규칙이 통째로 없었다(v8.4까지). 클릭 가능한 목록이 글줄로만 보였다.
   교훈: 클릭되는 것은 반드시 (1) 경계 (2) cursor (3) hover/active 반응 (4) 의도 라벨 을 갖는다. */
.rwpick{position:relative;border:1px solid var(--line);border-radius:9px;background:var(--card);
  padding:10px 58px 10px 12px;margin:5px 0;cursor:pointer;font-size:12.5px;
  transition:border-color .12s,background .12s,box-shadow .12s}
.rwpick:hover{border-color:var(--gold);background:#fdfaf1;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.rwpick:active{background:#f7f0dd}
.rwpick::after{content:'선택';position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line);
  border-radius:5px;padding:2px 6px;background:var(--soft);transition:all .12s}
.rwpick:hover::after{content:'선택 →';color:#fff;background:var(--gold);border-color:var(--gold)}
.rwpick.sm{padding:7px 58px 7px 10px}
.rwchip.set{background:#fdf7e6;border-color:#e3d3a4}
/* ── 📅 데일리 ── */
.dtop{background:linear-gradient(180deg,#fbfaf6,#fff);border:1px solid #e8e2cf;border-radius:12px;padding:10px 13px;margin-bottom:12px}
.dtl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:11.5px}
.dtd{font-family:var(--serif);font-size:15px;color:var(--gold)}
.dfull{color:var(--pos);font-weight:800;font-size:11.5px}
.dgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed #ece3c9}
.dgchip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--soft);cursor:pointer;transition:border-color .12s,background .12s}
.dgchip:hover{border-color:var(--gold);background:#fdfaf1}
.dgchip i{font-style:normal;font-weight:800;color:var(--gold)}
.dgchip.full i{color:var(--pos)}
/* 칸 높이를 키웠으면 폭도 따라와야 한다 — 세로로 긴 칸은 달력으로 안 읽힌다.
   기록 칸을 줄여서 캘린더 칸을 1:1 에 가깝게 맞춘다(로한 지시). */
.g2col.dcol{grid-template-columns:2.1fr 1fr}
/* ── ⚙ 루틴 요일 매트릭스 ── */
.btbl.rtm th.c,.btbl.rtm td.c{text-align:center;padding:6px 2px;width:30px}
.btbl.rtm th.dw0{color:var(--neg)}
.btbl.rtm th.dw6{color:var(--accent)}
.btbl.rtm td.nw{white-space:nowrap}
.dwcell{display:inline-block;width:20px;height:20px;border-radius:6px;border:1px solid var(--line);
  background:#fafafa;cursor:pointer;transition:background .12s,border-color .12s;vertical-align:middle}
.dwcell:hover{border-color:var(--gold)}
.dwcell.on{background:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 0 2px #fff}
.rtmrow.paused{opacity:.5}
.warn3{color:var(--warn)}
/* ── ⏳ 타임로그 ── */
.g2col.tlcol{grid-template-columns:1.35fr 1fr}
.tlstrip{display:flex;width:100%;border-radius:3px;overflow:hidden;background:#f0f2f6;margin-top:auto}
.tlstrip i{display:block;height:100%}
.gcell.tlcell .tlstrip{height:11px!important}
.tlstrip.empty{background:repeating-linear-gradient(90deg,#f0f2f6 0 3px,transparent 3px 6px)}
.gcell.tlcell{min-height:70px}
.gcell.tlcell .gcr{font-size:9px;font-weight:700}
/* 미기록 칸은 비워두되 '비었다'가 읽혀야 한다 — 흰색이면 그냥 여백으로 보인다 */
.tlq:not(.has){background:repeating-linear-gradient(135deg,#fafbfc 0 5px,#f2f4f7 5px 10px)}
.gcell.tlcell.fut{min-height:40px}
.tllegend,.tlsums{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.tlsums{margin:0 0 9px;padding:8px 0 0}
.tlsum{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted)}
.tlsum i{width:9px;height:9px;border-radius:3px;display:inline-block}
.tlsum b{color:var(--ink)}
.tlhint{font-size:11px;margin:0 0 7px;padding:7px 9px;background:var(--soft);border-radius:7px}
.tlhint .acc{color:var(--accent)}
.tlgrid{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tlrow{display:flex;align-items:stretch;border-bottom:1px solid #f3f5f8}
.tlrow:last-child{border-bottom:0}
.tlh{flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);
  background:var(--soft);border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
.tlq{flex:1;min-height:22px;border-right:1px solid #f3f5f8;cursor:pointer;position:relative;
  transition:background .1s,box-shadow .1s;display:flex;align-items:center;padding:0 6px}
.tlq:last-child{border-right:0}
.tlq:hover{background:#f6f1e3;box-shadow:inset 0 0 0 1px var(--gold)}
.tlq.has{color:#fff}
.tlq.has em{font-style:normal;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 1px rgba(0,0,0,.18)}
.tlq.pick{box-shadow:inset 0 0 0 2px var(--accent);background:#e8effd}
.tlpicks{display:flex;flex-wrap:wrap;gap:5px}
.tlpick{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:11.5px;cursor:pointer;font-weight:600;transition:border-color .12s,background .12s}
.tlpick:hover{border-color:var(--tc)}
.tlpick.on{border-color:var(--tc);background:var(--tc);color:#fff}
.tlpick.on i{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.tlpick i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tlmiss{background:#fdf4ee;border:1px solid #f0d9c6;border-radius:8px;padding:8px 10px;margin-bottom:9px;font-size:11.5px}
.tlmiss b{margin-right:6px}
.tltime{display:flex;align-items:center;gap:8px}
.tltime select{flex:1}
.tltime span{color:var(--muted);font-size:12px}
.tlov{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:11.5px}
.tlov b{display:block;margin-bottom:5px;font-size:11px;color:var(--muted)}
.tlov .chip{margin:0 4px 4px 0;display:inline-flex;align-items:center;gap:4px}
.tlov .chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.tlnudge{margin-top:10px;padding:9px 11px;border-radius:8px;background:#fdf4ee;border:1px solid #f0d9c6;
  font-size:11.5px;cursor:pointer;transition:border-color .12s}
.tlnudge:hover{border-color:var(--warn)}
.dtabs{display:flex;gap:6px;margin:-2px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dtab{flex:1;text-align:center;padding:7px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--soft);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;
  transition:background .12s,border-color .12s,color .12s}
.dtab:hover{border-color:var(--gold)}
.dtab.on{background:#f3ead2;border-color:#e3d3a0;color:var(--gold)}
.dtab em{font-style:normal;font-weight:800;font-size:10.5px;opacity:.8}
.tlstat{font-size:11px;margin-bottom:8px}
.gcell .tlstrip{margin-top:auto;flex-shrink:0}
.chip.warn2{background:#fdf0e0;border:1px solid #e8c9a0;color:#8a5a1f;font-size:10px;padding:1px 5px;border-radius:5px;cursor:help}
.cell .dn{font-size:11px;color:var(--muted)}
.cell .dsum{font-size:9.5px;color:var(--neg);font-weight:700;font-variant-numeric:tabular-nums}
.cell .cl{display:flex;justify-content:space-between;gap:5px;font-size:9.5px;line-height:1.45}
.cell .cl .c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#5a6b86}
.cell .cl .a{flex-shrink:0;font-variant-numeric:tabular-nums;font-weight:600}
.cell .cl.in .a{color:var(--pos)}.cell .cl.ex .a{color:var(--neg)}
.cell .cl.tr .a,.cell .cl.tr .c{color:#8a7bd8}
.cell .cl.in{order:-2}.cell .cl.tr{order:-1}
.cell .cl .sc{display:inline-block;font-size:8px;font-weight:800;padding:0 3px;border-radius:3px;margin-right:3px;vertical-align:middle;line-height:1.5}
.cell .cl .sc.b{background:var(--accent-bg);color:var(--accent)}.cell .cl .sc.p{background:#eef0f4;color:#8a94a6}
/* 6칸이 폭 계산에 따라 5+1 로 깨졌다 — 고정 6열 그리드로 한 줄에 못박는다 */
.statbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;flex:1;max-width:820px;justify-self:end}
.stat{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 11px;min-width:92px;text-align:right}
.stat .sl{font-size:10px;color:var(--muted);margin-bottom:3px}
.stat .sv{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.watch{background:var(--soft)}
.stat.watch select{font-size:10px;color:var(--muted);border:0;background:transparent;padding:0;margin-bottom:3px;cursor:pointer;font-family:inherit;max-width:96px;text-align:right;direction:rtl}
.stat.watch select:hover{color:var(--accent)}
.cell .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.detail{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px;margin-top:14px}
.dhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.dhd h4{margin:0;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(20,30,50,.4);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.overlay.on{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:460px;padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.22);max-height:90vh;overflow:auto}
/* 모달은 max-height 90vh + overflow auto 다. 헤더가 같이 밀리면 닫기(×)를 잃는다. */
.mtop{position:sticky;top:-20px;z-index:3;background:var(--card);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:-20px -20px 8px;padding:16px 20px 10px;border-bottom:1px solid var(--line)}
.x{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;flex-shrink:0}
.x:hover{background:var(--soft);color:var(--ink)}
/* 목록형 모달의 액션 바 — 버튼은 상단, 내용과 선으로 구분한다 */
.mact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:0 0 10px;margin-bottom:4px;border-bottom:1px dashed var(--line)}
.mact .mnote{font-size:10.5px;color:var(--muted);line-height:1.35}
.mfoot{font-size:10.5px;color:var(--muted);margin-top:12px;padding-top:9px;border-top:1px dashed var(--line);line-height:1.4}
/* 키보드 접근성 — 전역 포커스 링이 없었다 */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}.modal h3{margin:0;font-size:16px}
.x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.mcur{font-size:22px;font-weight:800;margin:4px 0}
.logrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}

.rtask .bx{width:21px;height:21px;border:2px solid #cfc7ae;border-radius:6px;flex-shrink:0;text-align:center;line-height:18px;font-size:13px;font-weight:800;background:#fff}
.rtask.on .bx{background:var(--gold);border-color:var(--gold);color:#fff}
.rtask .rn{flex:1}
.rtask .rg{font-size:10px;color:var(--muted);margin-left:5px}

.hmdow{display:grid;grid-template-rows:repeat(7,14px);gap:3px;font-size:8.5px;color:var(--muted);flex-shrink:0}

.hm{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;flex-shrink:0}

.gyear{border-left:3px solid var(--gold);padding:7px 12px;margin:6px 0;background:#faf7ee;border-radius:0 8px 8px 0}

function save(){ if(!USER||!DB)return; clearTimeout(saveTimer); saveTimer=setTimeout(function(){ SB.from('app_state').upsert({user_id:USER.id,data:DB,updated_at:new Date().toISOString()}).then(function(){},function(){}); },400); }
function loadState(){ return SB.from('app_state').select('data').eq('user_id',USER.id).maybeSingle().then(function(r){ if(r&&r.data&&r.data.data&&Object.keys(r.data.data).length)return r.data.data; return JSON.parse(JSON.stringify(SEED)); },function(){ return JSON.parse(JSON.stringify(SEED)); }); }

/* ====== 유틸 ====== */
function won(n){return '₩'+Math.round(Math.abs(n)).toLocaleString('ko-KR');}
function signWon(n){return (n<0?'-':'+')+won(n);}
function man(n){var v=Math.abs(n)/10000;return (n<0?'-':'+')+(v>=1?Math.round(v)+'만':v.toFixed(1)+'만');}
function comma(n){return Math.round(Math.abs(n)).toLocaleString('ko-KR');}
function uid(){return 'x'+Math.random().toString(36).slice(2,9);}
function latest(h){if(!h||!h.length)return 0;var s=h.slice().sort(function(a,b){return a.date<b.date?-1:1});return s[s.length-1].amount;}
function monthOf(d){return d.slice(0,7);}
function mIdx(d){return parseInt(d.slice(5,7),10)-1;}
function creditCard(name){var c=DB.cards.filter(function(x){return x.name===name})[0];return c&&c.type==='credit';}

/* ====== 선그래프 ====== */
function lineChart(series,opt){
  opt=opt||{};var W=380,H=170,PL=44,PR=12,PT=14,PB=26,col=opt.color||'#2f6df6';
  var pts=series.filter(function(p){return p.amount!=null}).map(function(p){return {x:mIdx(p.date),v:p.amount}}).sort(function(a,b){return a.x-b.x});
  if(!pts.length)return '<div class="mut" style="padding:14px 0">데이터 없음</div>';
  var vals=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(opt.zeroBase&&mn>0)mn=0;if(mn===mx){mn=mn-1;mx=mx+1;}var span=mx-mn;
  var X=function(i){return PL+(i/11)*(W-PL-PR)},Y=function(v){return PT+(1-(v-mn)/span)*(H-PT-PB)};
  var line=pts.map(function(p){return X(p.x)+','+Y(p.v)}).join(' ');
  var dots=pts.map(function(p){return '<circle cx="'+X(p.x)+'" cy="'+Y(p.v)+'" r="3" fill="'+col+'"/>'}).join('');
  var zero=(mn<0&&mx>0)?'<line x1="'+PL+'" y1="'+Y(0)+'" x2="'+(W-PR)+'" y2="'+Y(0)+'" stroke="#e4e8f0" stroke-dasharray="3 3"/>':'';
  var xl='';for(var i=0;i<12;i+=2){xl+='<text x="'+X(i)+'" y="'+(H-8)+'" font-size="9" fill="#9aa6b6" text-anchor="middle">'+(i+1)+'월</text>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+zero+'<polyline points="'+line+'" fill="none" stroke="'+col+'" stroke-width="2.5"/>'+dots+xl+'<text x="6" y="'+(PT+4)+'" font-size="9" fill="#9aa6b6">'+man(mx)+'</text><text x="6" y="'+(H-PB+2)+'" font-size="9" fill="#9aa6b6">'+man(mn)+'</text></svg>';
}

/* ====== 계산 ====== */
function accVal(a){return latest(a.hist);}
function groupTotals(){var g={};DB.accounts.forEach(function(a){g[a.group]=(g[a.group]||0)+accVal(a)});return g;}
function totalAssets(){return DB.accounts.reduce(function(s,a){return s+accVal(a)},0);}
function cardPendingByCard(){var m={};DB.transactions.forEach(function(t){if(t.card&&t.type==='expense'&&creditCard(t.method))m[t.method]=(m[t.method]||0)+t.amt;});return m;}
function cardPending(){var m=cardPendingByCard(),s=0;for(var k in m)s+=m[k];return s;}
function totalDebt(){return DB.debts.reduce(function(s,d){return s+d.balance},0)+cardPending();}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function usageBy(field){var m={};DB.transactions.forEach(function(t){var k=t[field];if(k)m[k]=(m[k]||0)+1;});return m;}
function monthTxns(m){return DB.transactions.filter(function(t){return monthOf(t.date)===m});}
function monthPL(m){var i=0,e=0;monthTxns(m).forEach(function(t){if(t.type==='income')i+=t.amt;else if(t.type==='expense')e+=t.amt});return {inc:i,exp:e,net:i-e};}
/* ==== 현금흐름 계산 (P1) ==== */
function isCashAcct(a){return a.group!=='투자'&&a.group!=='저축';}
function cashAccts(){return DB.accounts.filter(isCashAcct);}
function acctName(id){var a=DB.accounts.filter(function(x){return x.id===id})[0];return a?a.name:'?';}
function acctBaseline(a){ if(a.opening&&a.opening.date)return {date:a.opening.date,amount:a.opening.amount||0}; var h=(a.hist&&a.hist.length)?a.hist.slice().sort(function(x,y){return x.date<y.date?-1:1}).slice(-1)[0]:null; return h?{date:h.date,amount:h.amount}:{date:'1900-01-01',amount:0}; }
function acctFlow(a){ var base=acctBaseline(a),s=0; DB.transactions.forEach(function(t){ if(!t.date||t.date<base.date)return;
  if(t.type==='income'&&t.acct===a.id)s+=t.amt;
  else if(t.type==='expense'&&t.acct===a.id)s-=t.amt;
  else if(t.type==='transfer'){ if(t.from===a.id)s-=t.amt; if(t.to===a.id)s+=t.amt; }
  else if(t.type==='settle'&&t.acct===a.id)s-=t.amt; }); return s; }
function acctComputed(a){return acctBaseline(a).amount+acctFlow(a);}

/* ====== 현황판 ====== */

    return '<div class="grp"><div class="ghd"><span>'+gn+' <span class="chip '+mode+'">'+(mode==='auto'?'자동':'수기')+'</span></span><span>'+won(g[gn])+'</span></div>'+items+'</div>';
  }).join('');
  var cbc=cardPendingByCard();

  var postList=posts.length?posts.map(function(p){return '<div class="row" style="cursor:pointer" data-post="'+p.id+'"><span>📜 '+p.title+'</span><span class="mut" style="font-size:10px;white-space:nowrap">'+(p.date||'')+'</span></div>';}).join(''):'<div class="mut" style="padding:8px 0">아직 정리 글 없음 — 로버트와 나눈 결론이 여기 쌓인다.</div>';
  document.getElementById('v-dash').innerHTML=''
   +'<div class="updated">🟢 실시간 · <b>'+todayStr()+' 기준 최신</b> · 행 클릭 → 12개월 추세</div>'
   +'<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">'
   +'<div class="sec" style="flex:1;min-width:280px;margin-bottom:0"><h4>자산 요약 <span class="mut">클릭→추세 📈</span></h4>'
   +'<table style="width:100%;border-collapse:collapse;font-size:14.5px">'
   +'<tr data-metric="assets" style="cursor:pointer;border-bottom:1px solid var(--line)"><td style="padding:11px 4px;color:var(--muted)">총자산</td><td style="padding:11px 4px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums">'+won(ta)+'</td></tr>'
   +'<tr data-metric="debt" style="cursor:pointer;border-bottom:1px solid var(--line)"><td style="padding:11px 4px;color:var(--muted)">총부채</td><td style="padding:11px 4px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums">'+won(td)+'</td></tr>'
   +'<tr data-metric="net" style="cursor:pointer"><td style="padding:11px 4px;color:var(--muted)">순자산</td><td style="padding:11px 4px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums" class="'+(net<0?'neg':'pos')+'">'+signWon(net)+'</td></tr>'
   +'</table></div>'
   +'<div class="sec" style="flex:1;min-width:280px;margin-bottom:0"><h4>🪶 로버트의 정리 <span class="mut">클릭→읽기</span></h4><div style="max-height:200px;overflow:auto">'+postList+'</div></div>'
   +'</div>'

   +'<div class="hint">🟢 자동=거래 연동 · 🔵 수기=평가액 직접 기록</div></div>'
   +'<div class="sec"><h4>부채</h4>'+DB.debts.map(function(d){return '<div class="row"><span>'+d.name+' <span class="mut">'+(d.rate!=null?d.rate+'%':'')+(d.schedule?' · '+d.schedule.start+'부터 상환':' · 상환일정 없음')+'</span></span><span>'+won(d.balance)+'</span></div>'}).join('')+'</div>'
   +'<div class="sec cardbox"><h4>💳 카드 미결제 (신용카드)</h4>'+(cardRows||'<div class="mut">미결제 없음</div>')+'<button class="btn warn sm" id="settleBtn" style="margin-top:8px">선결제 확정 →</button></div>';

/* 좁은 칸용 금액 축약 — 77,500 → 7.8만 · 3,000 → 3천 */
function shortWon(v){
  v=Math.abs(v||0);
  if(v>=10000){var m=v/10000;return (m>=10?Math.round(m):Math.round(m*10)/10)+'만';}
  if(v>=1000){var k=v/1000;return (k>=10?Math.round(k):Math.round(k*10)/10)+'천';}
  return comma(v);
}
/* ====== 가계부 캘린더 ====== */
var selDate=null;
function renderCal(){
  var m=DB.ui.month,y=parseInt(m.slice(0,4)),mo=parseInt(m.slice(5,7)),pl=monthPL(m);
  /* 좁은 화면에서 한 칸에 10줄을 넣으면 캘린더가 세로로 터진다 */
  var _narrow=(typeof window!=='undefined'&&window.innerWidth<=900);
  /* ⚠️ 모바일 칸 폭은 55px 안팎이다. '-3,039,761' 은 어떤 폰트로도 안 들어간다.
     → 개별 거래 줄은 접고 그날 합계만 만/천 단위로 보여준다. 상세는 날짜를 눌러서 본다. */
  var _lim=_narrow?0:10;
  var first=new Date(y,mo-1,1).getDay(),dim=new Date(y,mo,0).getDate(),today=todayStr(),cells='';
  ['일','월','화','수','목','금','토'].forEach(function(d,i){cells+='<div class="dow s'+i+'">'+d+'</div>'});
  for(var i=0;i<first;i++)cells+='<div class="cell empty"></div>';
  for(var d=1;d<=dim;d++){
    var ds=m+'-'+String(d).padStart(2,'0'),tx=DB.transactions.filter(function(t){return t.date===ds}),card=false,lines='',daysum=0;
    tx.forEach(function(t){if(t.type==='expense')daysum+=t.amt;if(t.card)card=true;});
    var inc=tx.filter(function(t){return t.type==='income';}),exp=tx.filter(function(t){return t.type==='expense';}),trs=tx.filter(function(t){return t.type==='transfer';});
    var ordered=inc.concat(trs).concat(exp);
    ordered.slice(0,_lim).forEach(function(t){
      if(t.type==='income'){lines+='<div class="cl in"><span class="c">'+t.cat+'</span><span class="a">+'+comma(t.amt)+'</span></div>';}
      else if(t.type==='transfer'){lines+='<div class="cl tr"><span class="c">'+acctName(t.from).slice(0,3)+'→'+acctName(t.to).slice(0,3)+'</span><span class="a">'+comma(t.amt)+'</span></div>';}
      else{var b=t.scope==='business';lines+='<div class="cl ex"><span class="c"><span class="sc '+(b?'b':'p')+'">'+(b?'사':'개')+'</span>'+t.cat+'</span><span class="a">-'+comma(t.amt)+'</span></div>';}
    });
    if(!_narrow&&tx.length>_lim)lines+='<div class="mut" style="font-size:9px">+'+(tx.length-_lim)+'건 더</div>';
    if(_narrow&&tx.length)lines='<div class="ccnt">'+tx.length+'건</div>';
    /* 마커 — 점만 찍으면 뜻이 안 읽힌다. 의미가 있는 것만 아이콘으로 보여준다.
       루틴 부분달성은 아이콘을 늘리지 않고 날짜 숫자 배경으로 표현한다(아이콘 남발 방지). */
    var _gr=dayRate(ds), _full=!!(_gr&&_gr.total>0&&_gr.done>=_gr.total),
        _part=!!(_gr&&_gr.total>0&&_gr.done>0&&!_full), mk='';
    if(_full)mk+='<i class="mk" data-tip="루틴 완전달성 '+_gr.done+'/'+_gr.total+'">✅</i>';
    if(card)mk+='<i class="mk" data-tip="신용카드 미결제 있음">💳</i>';
    var _rc=cardsUsedOn(ds);
    if(_rc.length)mk+='<i class="mk" data-tip="'+sajuEsc(_rc.map(function(c){return c.code+' '+c.title+(c.spent?' '+comma(c.spent)+'원':'');}).join(' / '))+'">🎁</i>';
    var hdr='<div class="dhdr"><span class="dn'+(_full?' full':(_part?' part':''))+'"'
      +(_gr&&_gr.total>0?' data-tip="루틴 '+_gr.done+'/'+_gr.total+'"':'')+'>'+d+'</span>'
      +'<span class="mkw">'+mk+'</span>'
      +(daysum?'<span class="dsum">-'+(_narrow?shortWon(daysum):comma(daysum))+'</span>':'')+'</div>';
    cells+='<div class="cell'+(ds===today?' today':'')+(ds===selDate?' sel':'')+'" data-date="'+ds+'">'+hdr+lines+'</div>';
  }
  var WATCH=(DB.ui.watchCats&&DB.ui.watchCats.length)?DB.ui.watchCats:['식비','카페','간식/편의점'];
  var catSum={};monthTxns(m).forEach(function(t){if(t.type==='expense')catSum[t.cat]=(catSum[t.cat]||0)+t.amt;});
  var expCatNames=DB.categories.filter(function(c){return c.type==='expense';}).map(function(c){return c.name;});
  var watchStats=WATCH.map(function(cat,i){
    var opts=expCatNames.map(function(n){return '<option'+(n===cat?' selected':'')+'>'+n+'</option>';}).join('');
    return '<div class="stat watch"><select data-watch="'+i+'">'+opts+'</select><div class="sv neg">'+won(catSum[cat]||0)+'</div></div>';
  }).join('');
  var statBar='<div class="statbar">'
   +'<div class="stat"><div class="sl">수입</div><div class="sv pos">'+signWon(pl.inc)+'</div></div>'
   +'<div class="stat"><div class="sl">지출</div><div class="sv neg">'+signWon(-pl.exp)+'</div></div>'
   +'<div class="stat"><div class="sl">월 손익</div><div class="sv '+(pl.net<0?'neg':'pos')+'">'+signWon(pl.net)+'</div></div>'
   +watchStats+'</div>';
  document.getElementById('v-cal').innerHTML=''
   +'<div class="calwrap"><div class="calmain">'
   +'<div class="mhead"><div class="mnav"><span id="calPick" style="cursor:pointer;margin-right:6px" title="연·월 선택">📅</span><span data-mv="-1">◀</span><b id="calTitle" style="cursor:pointer">'+y+'년 '+mo+'월</b><span data-mv="1">▶</span></div>'
   +statBar+'</div>'
   +'<div class="cal">'+cells+'</div></div>'
   +'<div class="calside" id="dayPanel"></div></div>';
  var def=(selDate&&selDate.slice(0,7)===m)?selDate:(today.slice(0,7)===m?today:m+'-01');
  renderDay(def);
}
function renderDay(ds){
  selDate=ds;
  var cells=document.querySelectorAll('#v-cal .cell');for(var i=0;i<cells.length;i++)cells[i].classList.toggle('sel',cells[i].dataset.date===ds);
  var tx=DB.transactions.filter(function(t){return t.date===ds}).sort(function(a,b){return b.amt-a.amt});
  var h='<div class="detail"><div class="dhd"><h4>'+parseInt(ds.slice(5,7),10)+'월 '+parseInt(ds.slice(8),10)+'일 <span class="mut">('+tx.length+'건)</span></h4><button class="btn sm" id="addTxn">+ 거래 추가</button></div>';
  if(!tx.length)h+='<div class="mut" style="padding:8px 0">거래 없음 — <b>+ 거래 추가</b>로 기록</div>';
  tx.forEach(function(t){
    if(t.type==='transfer'){h+='<div class="row"><span><span class="pill" style="background:#efeafb;color:#6f5fc7">이체</span>'+acctName(t.from)+' → '+acctName(t.to)+(t.memo?' <span class="mut" title="'+t.memo+'">📝</span>':'')+'</span><span style="color:#6f5fc7">'+won(t.amt)+' <span class="acts"><span data-edit="'+t.id+'">✎</span><span data-del="'+t.id+'">🗑</span></span></span></div>';return;}
    if(t.type==='settle'){h+='<div class="row"><span><span class="pill" style="background:#fff2d6;color:#b26a00">카드결제</span>'+(t.method||'')+'</span><span style="color:var(--neg)">-'+won(t.amt)+' <span class="acts"><span data-del="'+t.id+'">🗑</span></span></span></div>';return;}
    var acc=t.acct?' <span class="mut" style="font-size:10px">['+acctName(t.acct)+']</span>':'';
    h+='<div class="row"><span><span class="pill">'+(t.scope==='business'?'사업':'개인')+'</span>'+t.cat+' <span class="mut">· '+t.method+'</span>'+acc+(t.card?'<span class="badge">미결제</span>':'')+(t.memo?' <span class="mut" title="'+t.memo+'">📝</span>':'')+'</span><span style="color:'+(t.type==='income'?'var(--pos)':'var(--neg)')+'">'+(t.type==='income'?'+':'-')+won(t.amt)+' <span class="acts"><span data-edit="'+t.id+'">✎</span><span data-del="'+t.id+'">🗑</span></span></span></div>';});
  h+='</div>';document.getElementById('dayPanel').innerHTML=h;
}

/* ====== 계좌·부채 ====== */
function renderAcct(){
  function accRow(a){var ex=a.subtype?' <span class="chip credit">'+a.subtype+'</span>':(a.currency?' <span class="chip credit">'+a.currency+'</span>':'');var cf=(isCashAcct(a)&&a.opening)?'<br><span class="mut" style="font-size:10px">현금흐름 계산 '+won(acctComputed(a))+' <span class="chip auto">기초 '+a.opening.date+'</span></span>':'';return '<div class="row"><span><span class="pill">'+a.group+'</span>'+a.name+ex+' <span class="chip '+a.mode+'">'+(a.mode==='auto'?'자동':'수기')+'</span></span><span style="text-align:right">'+won(accVal(a))+cf+' <span class="acts"><span data-editacc="'+a.id+'">수정</span><span data-delacc="'+a.id+'">삭제</span></span></span></div>';}
  function accBucket(a){return a.group==='현금성'?'현금성':(a.group==='투자'?'투자':'기타');}

function cfSankeySVG(g){

  var paths='';
  g.linksSA.forEach(function(l){var sp=pS[l.s],ap=pA[l.a];if(!sp||!ap)return;var w=l.v*scale,cs=cursor('s'+l.s),ca=cursor('a'+l.a);var y1=sp.y+cs.outR+w/2;cs.outR+=w;var y2=ap.y+ca.inL+w/2;ca.inL+=w;paths+=link(sp.x+nw,y1,ap.x,y2,w,'#0f9d58');});
  g.linksAK.forEach(function(l){var ap=pA[l.a],kp=pK[l.k];if(!ap||!kp)return;var w=l.v*scale,ca=cursor('a'+l.a),ck=cursor('k'+l.k);var y1=ap.y+ca.outR+w/2;ca.outR+=w;var y2=kp.y+ck.inL+w/2;ck.inL+=w;var col=l.k.slice(0,3)==='sv:'?'#2f6df6':'#e0483d';paths+=link(ap.x+nw,y1,kp.x,y2,w,col);});
  var rects='';
  function drawCol(pos,fill,anchor){Object.keys(pos).forEach(function(k){if(k==='_bottom')return;var n=pos[k];rects+='<rect x="'+n.x+'" y="'+n.y+'" width="'+nw+'" height="'+n.h+'" rx="3" fill="'+fill+'"/>';var tx=anchor==='start'?n.x+5:(anchor==='end'?n.x+nw-5:n.x+nw/2);rects+='<text x="'+tx+'" y="'+(n.y+n.h/2+3.5)+'" font-size="10" fill="#1b2333" text-anchor="'+anchor+'">'+cfClip(n.label)+' '+cfShort(n.v)+'</text>';});}
  drawCol(pS,'#d6f0e0','start');drawCol(pA,'#e3e9f5','middle');drawCol(pK,'#f7ddd9','end');

function labSChart(name,m){var H=DB.health;var vals=H.labValues[name]||[];var n=H.labDates.length;
  var pts=[];for(var i=0;i<n;i++){if(typeof vals[i]==='number')pts.push({i:i,v:vals[i]});}
  if(!pts.length)return '<div class="mut" style="padding:10px 0">숫자 기록 없음</div>';
  var W=440,HH=150,PL=38,PR=10,PT=12,PB=18;var vv=pts.map(function(p){return p.v;});var mn=Math.min.apply(null,vv),mx=Math.max.apply(null,vv);
  if(m.low!=null)mn=Math.min(mn,m.low);if(m.high!=null)mx=Math.max(mx,m.high);if(mn===mx){mn-=1;mx+=1;}var span=mx-mn;
  var X=function(i){return PL+(i/(n-1||1))*(W-PL-PR);},Y=function(v){return PT+(1-(v-mn)/span)*(HH-PT-PB);};
  var band='';if(m.low!=null&&m.high!=null){var y1=Y(m.high),y2=Y(m.low);band='<rect x="'+PL+'" y="'+y1+'" width="'+(W-PL-PR)+'" height="'+Math.max(1,y2-y1)+'" fill="#e7f6ee"/>';}
  var line=pts.map(function(p){return X(p.i)+','+Y(p.v);}).join(' ');
  var dots=pts.map(function(p){var f=labFlag(m,p.v);var c=f==='hi'?'#e0483d':f==='lo'?'#2f6df6':'#0f9d58';return '<circle cx="'+X(p.i)+'" cy="'+Y(p.v)+'" r="3" fill="'+c+'"/>';}).join('');
  return '<svg viewBox="0 0 '+W+' '+HH+'" width="100%" style="display:block;margin-top:8px">'+band+'<polyline points="'+line+'" fill="none" stroke="#5a6b86" stroke-width="2"/>'+dots+'<text x="4" y="'+(PT+4)+'" font-size="9" fill="#9aa6b6">'+mx+'</text><text x="4" y="'+(HH-PB+4)+'" font-size="9" fill="#9aa6b6">'+mn+'</text></svg>';
}
function labCell(name,i){var H=DB.health;var m=H.metrics.filter(function(x){return x.name===name;})[0];var v=(H.labValues[name]||[])[i];

/* ====== 명리(사주) ====== */
var SAJU_GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var SAJU_JI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var SAJU_OH={甲:'목',乙:'목',丙:'화',丁:'화',戊:'토',己:'토',庚:'금',辛:'금',壬:'수',癸:'수'};
var SAJU_YIN={甲:0,乙:1,丙:0,丁:1,戊:0,己:1,庚:0,辛:1,壬:0,癸:1};
var JIJANG={子:'癸',丑:'己',寅:'甲',卯:'乙',辰:'戊',巳:'丙',午:'丁',未:'己',申:'庚',酉:'辛',戌:'戊',亥:'壬'};
var YUKHAP={子:'丑',丑:'子',寅:'亥',亥:'寅',卯:'戌',戌:'卯',辰:'酉',酉:'辰',巳:'申',申:'巳',午:'未',未:'午'};
var YUKCHUNG={子:'午',午:'子',丑:'未',未:'丑',寅:'申',申:'寅',卯:'酉',酉:'卯',辰:'戌',戌:'辰',巳:'亥',亥:'巳'};
var GANCHUNG={甲:'庚',庚:'甲',乙:'辛',辛:'乙',丙:'壬',壬:'丙',丁:'癸',癸:'丁'};
var SAMHAP=[['寅','午','戌'],['申','子','辰'],['亥','卯','未'],['巳','酉','丑']];
function sjJDN(y,m,d){var a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function sjSolarLong(JD){var T=(JD-2451545.0)/36525.0;var L0=280.46646+36000.76983*T+0.0003032*T*T;var M=(357.52911+35999.05029*T-0.0001537*T*T)*Math.PI/180;var C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);var lam=(L0+C)%360;return lam<0?lam+360:lam;}
function sjPillars(y,m,d){var J=sjJDN(y,m,d);var di=((J+49)%60+60)%60;var lam=sjSolarLong(J);var k=Math.floor(((((lam-315)%360)+360)%360)/30);var mb=(k+2)%12;var sy=y;if(m===1||(m===2&&lam<315))sy=y-1;var ys=((sy-4)%10+10)%10,yb=((sy-4)%12+12)%12;var mss=((ys%5)*2+2)%10;var ms=(mss+k)%10;return {year:SAJU_GAN[ys]+SAJU_JI[yb],month:SAJU_GAN[ms]+SAJU_JI[mb],day:SAJU_GAN[di%10]+SAJU_JI[di%12],dayStem:SAJU_GAN[di%10],dayBranch:SAJU_JI[di%12]};}
function sipsin(ilgan,g){if(!g)return '';var order=['목','화','토','금','수'];var ie=SAJU_OH[ilgan],te=SAJU_OH[g];var di=(order.indexOf(te)-order.indexOf(ie)+5)%5;var same=SAJU_YIN[ilgan]===SAJU_YIN[g];return {0:same?'비견':'겁재',1:same?'식신':'상관',2:same?'편재':'정재',3:same?'편관':'정관',4:same?'편인':'정인'}[di];}
function jiSipsin(ilgan,branch){return sipsin(ilgan,JIJANG[branch]);}
function seunGZ(year){var ys=((year-4)%10+10)%10,yb=((year-4)%12+12)%12;return SAJU_GAN[ys]+SAJU_JI[yb];}
function isSamjae(year){var yb=((year-4)%12+12)%12;return ['申','酉','戌'].indexOf(SAJU_JI[yb])>=0;}
function sajuAge(dateStr){var b=DB.saju.birth.solar.split('-'),d=dateStr.split('-');var a=+d[0]-+b[0];if(+d[1]<+b[1]||(+d[1]==+b[1]&&+d[2]<+b[2]))a--;return a;}
function sajuCurDaeun(){var age=sajuAge(todayStr()),L=DB.saju.daeun.list,cur=L[0];for(var i=0;i<L.length;i++){if(age>=L[i][0])cur=L[i];}return {age:age,gz:cur[1],from:cur[0]};}
function natalBranches(){var n=DB.saju.natal;return [n.year[1],n.month[1],n.day[1],n.hour[1]];}
function isHyeong(a,b){var g1=['寅','巳','申'],g2=['丑','戌','未'];if(a===b)return ['辰','午','酉','亥'].indexOf(a)>=0;if(g1.indexOf(a)>=0&&g1.indexOf(b)>=0)return true;if(g2.indexOf(a)>=0&&g2.indexOf(b)>=0)return true;if((a==='子'&&b==='卯')||(a==='卯'&&b==='子'))return true;return false;}
function dayFlags(y,m,d){var p=sjPillars(y,m,d),T=p.dayBranch,TG=p.dayStem,N=natalBranches(),fl=[];
  N.forEach(function(n){if(YUKCHUNG[T]===n)fl.push({t:'충',w:'주의',d:T+n+'충'});});
  N.forEach(function(n){if(isHyeong(T,n))fl.push({t:'형',w:'주의',d:T+n+'형'});});
  N.forEach(function(n){if(YUKHAP[T]===n)fl.push({t:'합',w:'특이',d:T+n+'합'});});
  SAMHAP.forEach(function(g){if(g.indexOf(T)>=0){var hit=N.filter(function(n){return g.indexOf(n)>=0&&n!==T;});if(hit.length>=2)fl.push({t:'삼합',w:'특이',d:g.join('')+'삼합'});else if(hit.length===1)fl.push({t:'반합',w:'특이',d:T+hit[0]+'반합'});}});
  if(GANCHUNG[DB.saju.ilgan]===TG)fl.push({t:'천간충',w:'주의',d:TG+DB.saju.ilgan+'충'});
  if(DB.saju.gongmang.indexOf(T)>=0)fl.push({t:'공망',w:'특이',d:T+'공망일'});
  // 중복 제거
  var seen={},out=[];fl.forEach(function(f){if(!seen[f.d]){seen[f.d]=1;out.push(f);}});return {gz:p.day,flags:out};}
function sajuEsc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rmk(key){return (DB.saju.readings&&DB.saju.readings[key])?' 💬':'';}

  openModal('<div class="mtop"><h3>'+title+'</h3><span class="x" onclick="closeModal()">×</span></div>'

      :'<div class="mut" style="padding:10px 0;line-height:1.6">아직 저장된 해석이 없습니다.<br>Claude에게 <b>"'+title+' 평가해줘"</b>라고 요청하면, 해석 후 여기에 저장할 수 있습니다.</div>')

function sajuPickYear(y){DB.ui.sajuYear=y;var mm=(DB.ui.sajuYM&&DB.ui.sajuYM.slice(5))||String(new Date().getMonth()+1).padStart(2,'0');DB.ui.sajuYM=y+'-'+mm;save();renderSaju();}
function sajuPickMonth(ym){DB.ui.sajuYM=ym;DB.ui.sajuYear=parseInt(ym.slice(0,4));save();renderSaju();}
function renderSaju(){

/* ====== 목표·루틴 엔진 (v6.0) ======
   설계: goal-design.md
   원칙 3가지 — ① 기록은 불변 ② 모든 체크는 목표에 귀속 ③ 삭제 대신 은퇴 */
var DOW_KO=['일','월','화','수','목','금','토'];
var MISS_TAGS=['야근','피로','날씨','약속','무기력','아픔','일정충돌','의지부족','기타'];

/* --- 날짜 --- */
function addDays(ds,n){var d=new Date(ds+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function dowOf(ds){return new Date(ds+'T00:00:00Z').getUTCDay();}
function lastDayOfYM(ym){var y=parseInt(ym.slice(0,4),10),m=parseInt(ym.slice(5),10);return ym+'-'+String(new Date(Date.UTC(y,m,0)).getUTCDate()).padStart(2,'0');}
function ymAdd(ym,n){var y=parseInt(ym.slice(0,4),10),m=parseInt(ym.slice(5),10)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0');}
function ymRange(a,b){var out=[],c=a,guard=0;while(c<=b&&guard++<400){out.push(c);c=ymAdd(c,1);}return out;}

/* --- 코드 발급 (재사용 금지: 단조증가 카운터) --- */
function seqNext(key){DB.meta=DB.meta||{};DB.meta.seq=DB.meta.seq||{};DB.meta.seq[key]=(DB.meta.seq[key]||0)+1;return DB.meta.seq[key];}
function numToAlpha(n){var s='';while(n>0){var r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;}
function numToLower(n){var s='';while(n>0){var r=(n-1)%26;s=String.fromCharCode(97+r)+s;n=Math.floor((n-1)/26);}return s;}
function codeTaken(c){return (DB.goals||[]).some(function(g){return g.code===c;})||(DB.routines||[]).some(function(r){return r.code===c;});}
function issueGoalCode(kind,parentId,period){
  var c;
  if(kind==='year'){do{c=numToAlpha(seqNext('year'));}while(codeTaken(c));return c;}
  if(kind==='milestone'){var p=goalById(parentId);return (p?p.code:'?')+'.'+parseInt(period.slice(5),10);}
  var mk='M'+parseInt(period.slice(5),10);
  do{c=mk+'.'+seqNext(mk);}while(codeTaken(c));
  return c;
}
function issueRoutineCode(goalId){
  var c;
  if(!goalId){do{c='Z'+seqNext('Z');}while(codeTaken(c));return c;}
  var g=goalById(goalId);
  if(!g){do{c='Z'+seqNext('Z');}while(codeTaken(c));return c;}
  if(g.kind==='year'){do{c=g.code+seqNext(g.code);}while(codeTaken(c));return c;}
  do{c=g.code+numToLower(seqNext(g.code));}while(codeTaken(c));
  return c;
}

/* --- 목표 조회 --- */
function goalById(id){return (DB.goals||[]).filter(function(g){return g.id===id;})[0];}
function goalByCode(c){return (DB.goals||[]).filter(function(g){return g.code===c;})[0];}
function yearGoals(y){return (DB.goals||[]).filter(function(g){return g.kind==='year'&&g.period===y;});}
function milestonesOf(gid){return (DB.goals||[]).filter(function(g){return g.kind==='milestone'&&g.parentId===gid;}).sort(function(a,b){return a.period<b.period?-1:1;});}
function milestoneAt(gid,ym){return (DB.goals||[]).filter(function(g){return g.kind==='milestone'&&g.parentId===gid&&g.period===ym;})[0];}
function soloGoals(ym){return (DB.goals||[]).filter(function(g){return g.kind==='month'&&g.period===ym;});}
function goalLabel(g){return g?(g.code+' '+g.title):'';}

/* --- 마일스톤 자동 생성 (due 기반, 과거 불변) --- */
function syncMilestones(g){
  if(!g||g.kind!=='year'||!g.due)return;
  var mt=(g.metric&&g.metric.type)||'binary';
  if(mt==='binary')return;
  var today=todayStr().slice(0,7);
  var startYM=g.startYM||today;
  var endYM=g.due.slice(0,7);
  if(endYM<startYM)return;
  var list=ymRange(startYM,endYM), n=list.length;
  var base=(g.baseline!=null&&g.baseline!=='')?parseFloat(g.baseline):0;
  var goalV=(g.metric&&g.metric.target)||0;
  list.forEach(function(ym,i){
    var m=milestoneAt(g.id,ym);
    if(m&&(m.manual||ym<today))return;
    var target=(mt==='autodays')?goalV:Math.round((base+(goalV-base)*((i+1)/n))*10)/10;
    if(m){m.metric.target=target;m.metric.unit=g.metric.unit;}
    else DB.goals.push({id:uid(),code:g.code+'.'+parseInt(ym.slice(5),10),kind:'milestone',parentId:g.id,
      period:ym,title:parseInt(ym.slice(5),10)+'월 눈금',
      metric:{type:mt,target:target,unit:(g.metric&&g.metric.unit)||''},progress:0,status:'active'});
  });
  milestonesOf(g.id).forEach(function(m){
    if(list.indexOf(m.period)<0&&m.period>=today&&!routinesOfGoal(m.id).length&&!m.progress)
      DB.goals=DB.goals.filter(function(x){return x.id!==m.id;});
  });
}
function syncAllMilestones(){(DB.goals||[]).filter(function(g){return g.kind==='year';}).forEach(syncMilestones);}

/* --- 루틴 --- */
function routineById(id){return (DB.routines||[]).filter(function(r){return r.id===id;})[0];}
function routineByCode(c){return (DB.routines||[]).filter(function(r){return r.code===c;})[0];}
function routinesOfGoal(gid){return (DB.routines||[]).filter(function(r){return r.goalId===gid;});}
function routineActiveOn(r,ds){
  if(r.status==='paused')return false;
  if(r.start&&ds<r.start)return false;
  if(r.end&&ds>r.end)return false;
  if(r.freq==='weekly')return (r.days||[]).indexOf(dowOf(ds))>=0;
  return true;
}
function routinesForDay(ds){
  return (DB.routines||[]).filter(function(r){return routineActiveOn(r,ds);})
    .sort(function(a,b){return (a.order||0)-(b.order||0);});
}

/* --- 체크 원장 (불변) --- */
function chkOf(ds){return (DB.checks||{})[ds]||null;}
function dueOf(ds){
  var c=chkOf(ds);
  if(c&&c.due&&c.due.length)return c.due;          // 스냅샷 우선 = 과거 불변
  return routinesForDay(ds).map(function(r){return r.code;});  // 폴백: start/end로 재구성
}
function doneOf(ds){var c=chkOf(ds);return (c&&c.done)||[];}
function missOf(ds){var c=chkOf(ds);return (c&&c.miss)||{};}
function checkGet(ds,code){return doneOf(ds).indexOf(code)>=0;}
function ensureDay(ds){
  DB.checks=DB.checks||{};
  var c=DB.checks[ds];
  if(!c){c={done:[],due:[],miss:{}};DB.checks[ds]=c;}
  if(!c.done)c.done=[];if(!c.miss)c.miss={};
  if(!c.due)c.due=[];
  if(ds>=todayStr()||!c.due.length)c.due=routinesForDay(ds).map(function(r){return r.code;});
  return c;
}
function pruneDay(ds){
  var c=(DB.checks||{})[ds];
  if(c&&!c.done.length&&!Object.keys(c.miss).length)delete DB.checks[ds];
}
function checkToggle(ds,code){
  var c=ensureDay(ds), i=c.done.indexOf(code);
  if(i>=0)c.done.splice(i,1);
  else{c.done.push(code);if(c.miss[code])delete c.miss[code];}
  pruneDay(ds);save();renderDG();
}
function setMiss(ds,code,tag,memo){
  var c=ensureDay(ds);
  if(!tag&&!memo)delete c.miss[code];
  else c.miss[code]={tag:tag||'',memo:memo||''};
  pruneDay(ds);save();renderDG();
}

/* --- 집계 --- */
function dayRate(ds){
  var due=dueOf(ds); if(!due.length)return null;
  var dn=doneOf(ds).filter(function(c){return due.indexOf(c)>=0;});
  return {done:dn.length,total:due.length,rate:dn.length/due.length};
}
function streakFrom(ds,full){
  var n=0,d=ds;
  for(var i=0;i<400;i++){
    var r=dayRate(d);
    if(r===null){d=addDays(d,-1);continue;}
    if(full?(r.done<r.total):(r.done===0))break;
    n++;d=addDays(d,-1);
  }
  return n;
}
function goalStreaks(){
  var t=todayStr(),r=dayRate(t);
  return {any:streakFrom((r&&r.done>0)?t:addDays(t,-1),false),
          full:streakFrom((r&&r.total&&r.done===r.total)?t:addDays(t,-1),true)};
}
function monthDoneDays(ym){
  var n=0;for(var k in (DB.checks||{})){if(k.slice(0,7)===ym&&(DB.checks[k].done||[]).length)n++;}return n;
}
/* 목표 산하 루틴 코드 (마일스톤 포함) — 회고의 기반 */
function goalRoutineCodes(gid){
  var ids=[gid];milestonesOf(gid).forEach(function(m){ids.push(m.id);});
  return (DB.routines||[]).filter(function(r){return ids.indexOf(r.goalId)>=0;}).map(function(r){return r.code;});
}
function goalStats(gid,fromDS,toDS){
  var codes=goalRoutineCodes(gid),done=0,due=0,days=0,d=fromDS,guard=0;
  if(!codes.length)return {done:0,due:0,rate:0,days:0};
  while(d<=toDS&&guard++<800){
    var dd=dueOf(d).filter(function(c){return codes.indexOf(c)>=0;});
    if(dd.length){
      var dn=doneOf(d).filter(function(c){return dd.indexOf(c)>=0;});
      due+=dd.length;done+=dn.length;if(dn.length)days++;
    }
    d=addDays(d,1);
  }
  return {done:done,due:due,rate:due?done/due:0,days:days};
}
function gnum(v){v=parseFloat(v)||0;return (Math.abs(v)>=1000)?comma(v):((Math.round(v*10)/10)+'');}
/* --- 앱 데이터 자동 연동: 목표의 '현재값'을 로한북 안에서 직접 끌어온다 --- */
var GOAL_SOURCES=[
  {k:'manual', label:'직접 입력'},
  {k:'weight', label:'체중 (체성분 최신 기록)', unit:'kg'},
  {k:'cash',   label:'현금성 자산 합계', unit:'원'},
  {k:'net',    label:'순자산 (자산-부채)', unit:'원'},
  {k:'debt',   label:'총부채', unit:'원'}
];
function sourceValue(src){
  try{
    if(src==='weight'){
      var w=((DB.health&&DB.health.weights)||[]).slice().sort(function(a,b){return a.date<b.date?-1:1;});
      for(var i=w.length-1;i>=0;i--){if(w[i].kg!=null&&w[i].kg!=='')return parseFloat(w[i].kg);}
      return null;
    }
    if(src==='cash')return DB.accounts.filter(function(a){return a.group==='현금성';}).reduce(function(t,a){return t+accVal(a);},0);
    if(src==='net') return totalAssets()-totalDebt();
    if(src==='debt')return totalDebt();
  }catch(e){}
  return null;
}
/* 마일스톤의 출발점: 직전 달 눈금값, 없으면 부모의 시작값 */
function msBaseline(m){
  var p=goalById(m.parentId); if(!p)return null;
  var list=milestonesOf(p.id), idx=-1;
  for(var i=0;i<list.length;i++){if(list[i].id===m.id){idx=i;break;}}
  if(idx>0){var pv=list[idx-1].metric&&list[idx-1].metric.target;return (pv!=null&&pv!=='')?parseFloat(pv):null;}
  return (p.baseline!=null&&p.baseline!=='')?parseFloat(p.baseline):null;
}
/* '현재값 미입력' 판정.
   ⚠️ v6.1에선 ''·null만 걸렀는데, 마이그레이션이 progress:0 을 넣는 바람에
      체중 목표가 (0-68.2)/(65-68.2)=2131% → 100% 로 튀었다(실측).
      숫자 0도 미입력으로 본다 — 단 목표값이 0인 경우(부채 0원 만들기)는
      0이 진짜 달성값일 수 있으므로 제외한다. */
function unsetProgress(g){
  if(g.progress===''||g.progress==null)return true;
  if(g.progress!==0)return false;
  var tg=(g.metric&&g.metric.target!=null&&g.metric.target!=='')?parseFloat(g.metric.target):0;
  if(tg===0)return false;
  var b=(g.baseline!=null&&g.baseline!=='')?parseFloat(g.baseline):(g.kind==='milestone'?msBaseline(g):null);
  return b!=null;
}
/* 이 목표에 어울리는 연동 소스가 로한북 안에 이미 있는가.
   있는데 수동이면 화면에 알린다 — v8.1까지 체중 79건이 있는데 목표가 안 읽고 있었다. */
function suggestSource(g){
  if(!g||g.kind!=='year')return null;
  var mt=(g.metric&&g.metric.type)||'binary';
  if(mt!=='amount'&&mt!=='count')return null;
  var u=((g.metric&&g.metric.unit)||'').trim();
  if(/kg/i.test(u)&&sourceValue('weight')!=null)return 'weight';
  if(/원|만원/.test(u))return 'cash';
  return null;
}
function goalValue(g){
  if(!g)return 0;
  if(g.metric&&g.metric.type==='autodays')return monthDoneDays(g.period||todayStr().slice(0,7));
  /* 눈금은 부모의 연동 소스를 그대로 따른다 (현재값은 하나뿐이므로) */
  if(g.kind==='milestone'){
    var p=goalById(g.parentId);
    if(p&&p.source&&p.source!=='manual'){
      var pv=sourceValue(p.source);
      if(pv!=null)return pv;
    }
    if(unsetProgress(g)){
      var mb=msBaseline(g);
      if(mb!=null)return mb;
    }
    return g.progress||0;
  }
  if(g.source&&g.source!=='manual'){
    var v=sourceValue(g.source);
    if(v!=null)return v;
  }
  if(unsetProgress(g)){
    /* 미입력이면 시작값으로 간주 — 0으로 두면 감소형 목표가 100%로 튄다 */
    var b=(g.baseline!=null&&g.baseline!=='')?parseFloat(g.baseline):null;
    if(b!=null)return b;
    return 0;
  }
  return g.progress||0;
}
function goalPct(g){
  if(!g)return 0;
  if(g.status==='done')return 100;
  var mt=(g.metric&&g.metric.type)||'binary';
  if(mt==='binary')return 0;
  var tg=(g.metric.target!=null&&g.metric.target!=='')?parseFloat(g.metric.target):0;
  var cur=goalValue(g);
  var base=(g.baseline!=null&&g.baseline!=='')?parseFloat(g.baseline):null;
  if(g.kind==='milestone'&&base==null)base=msBaseline(g);
  /* 시작값이 있으면 base→target 구간의 진척률. 감소형(체중 68.2→65)도 동일 식으로 처리 */
  if((mt==='amount'||mt==='count')&&base!=null&&base!==tg)
    return Math.max(0,Math.min(100,Math.round(((cur-base)/(tg-base))*100)));
  if(!tg)return 0;
  return Math.max(0,Math.min(100,Math.round((cur/tg)*100)));
}
/* 목표 달성 방향: 감소형이면 현재값이 목표보다 크면 아직 미달 */
function goalTrend(g){
  var base=(g&&g.baseline!=null&&g.baseline!=='')?parseFloat(g.baseline):null;
  var tg=(g&&g.metric&&g.metric.target!=null)?parseFloat(g.metric.target):null;
  if(base==null||tg==null)return 0;
  return tg<base?-1:1;
}

/* ====== 보상 시스템 — 계단 구조 ======
   일간 완전달성 → (주 4일) 주간 성공 → (월 4회) 월간 성공 → (연 9회) 연간 성공
   설계: goal-design.md 10장. 병렬이 아니라 아래 단계의 성공 횟수가 위 단계를 연다. */
var REWARD_KINDS=[
  {k:'spend',label:'소비',desc:'새 지출이 생긴다 · 가계부에 기록된다'},
  {k:'act',  label:'행동',desc:'시간·행위로 받는다 · 이미 산 것을 쓰는 것도 여기'}
];
var YIN_JI=['丑','卯','巳','未','酉','亥'];
/* 음기 점수 0~3. 60갑자 구조상 음간↔음지는 항상 짝이라 실질 변별은 오행(水金)이다.
   3점(음간·음지 + 水金) = 연 72일 ≈ 주 1.4회 → 이것만 '음기 강'으로 본다. */
function yinScore(ds){
  try{
    var p=sjPillars(parseInt(ds.slice(0,4),10),parseInt(ds.slice(5,7),10),parseInt(ds.slice(8,10),10));
    var s=0;
    if(SAJU_YIN[p.dayStem])s++;
    if(YIN_JI.indexOf(p.dayBranch)>=0)s++;
    var oh=SAJU_OH[p.dayStem];
    if(oh==='수'||oh==='금')s++;
    return s;
  }catch(e){return 0;}
}
function isYinDay(ds){return yinScore(ds)>=3;}
function nextYinDays(from,n){
  var out=[],d=from,guard=0;
  while(out.length<(n||3)&&guard++<120){ if(isYinDay(d))out.push(d); d=addDays(d,1); }
  return out;
}
var REWARD_TIERS=[
  {k:'week', label:'주간', pre:'W'},
  {k:'month',label:'월간', pre:'M'},
  {k:'year', label:'연간', pre:'Y'},
  {k:'goal', label:'목표 달성', pre:'G'}
];
function ensureRewardCat(){
  DB.categories=DB.categories||[];
  var c=DB.categories.filter(function(x){return x.name==='보상'&&x.type==='expense';})[0];
  if(!c){c={id:uid(),name:'보상',type:'expense',deductible:false,taxAccount:null};DB.categories.push(c);}
  return c;
}
function rwCfg(){
  DB.rewardCfg=DB.rewardCfg||{};
  var c=DB.rewardCfg;
  if(!c.weekFullDays)c.weekFullDays=4;
  if(!c.monthWeeks)c.monthWeeks=4;
  if(!c.yearMonths)c.yearMonths=9;
  return c;
}
function weekStart(ds){return addDays(ds,-dowOf(ds));}      /* 일요일 시작 */
function weekLabel(ws){var we=addDays(ws,6);
  return parseInt(ws.slice(5,7),10)+'/'+parseInt(ws.slice(8),10)+'~'+parseInt(we.slice(5,7),10)+'/'+parseInt(we.slice(8),10);}

/* ── 1단: 일간 완전달성 ── */
function isFullDay(ds){var r=dayRate(ds);return !!(r&&r.total>0&&r.done===r.total);}
function fullDaysInWeek(ws){
  var n=0,t=todayStr();
  for(var i=0;i<7;i++){var d=addDays(ws,i);if(d>t)break;if(isFullDay(d))n++;}
  return n;
}
/* ── 2단: 주간 성공 ── */
function weekSuccess(ws){return fullDaysInWeek(ws)>=rwCfg().weekFullDays;}
/* 그 달에 '시작일이 속한' 주 목록 */
function weeksOfMonth(ym){
  var first=ym+'-01',last=lastDayOfYM(ym),w=weekStart(first),out=[];
  if(w<first)w=addDays(w,7);
  while(w<=last){out.push(w);w=addDays(w,7);}
  return out;
}
/* ── 3단: 월간 성공 ── */
function monthWeekWins(ym){var n=0;weeksOfMonth(ym).forEach(function(w){if(weekSuccess(w))n++;});return n;}
function monthSuccess(ym){return monthWeekWins(ym)>=rwCfg().monthWeeks;}
/* ── 4단: 연간 성공 ── */
function yearMonthWins(y){
  var n=0,t=todayStr().slice(0,7);
  for(var m=1;m<=12;m++){var ym=y+'-'+String(m).padStart(2,'0');if(ym>t)break;if(monthSuccess(ym))n++;}
  return n;
}
function yearSuccess(y){return yearMonthWins(y)>=rwCfg().yearMonths;}
/* 연중 주간 성공 총계 + 최장 연속 */
function yearWeekStats(y){
  var w=weekStart(y+'-01-01'); if(w<y+'-01-01')w=addDays(w,7);
  var t=todayStr(),win=0,tot=0,run=0,best=0;
  for(var i=0;i<53;i++){
    if(w.slice(0,4)>y)break;
    if(w<=t){tot++; if(weekSuccess(w)){win++;run++;if(run>best)best=run;}else run=0;}
    w=addDays(w,7);
  }
  return {win:win,elapsed:tot,best:best};
}

/* ── 티어별 현황 ── */
function tierState(tier,ref){
  var c=rwCfg(),t=ref||todayStr();
  if(tier==='week'){var ws=weekStart(t),n=fullDaysInWeek(ws);
    return {period:ws,label:weekLabel(ws),cur:n,req:c.weekFullDays,unit:'일 완전달성',ok:n>=c.weekFullDays};}
  if(tier==='month'){var ym=t.slice(0,7),n2=monthWeekWins(ym);
    return {period:ym,label:parseInt(ym.slice(5),10)+'월',cur:n2,req:c.monthWeeks,unit:'주 성공',ok:n2>=c.monthWeeks};}
  if(tier==='year'){var y=t.slice(0,4),n3=yearMonthWins(y);
    return {period:y,label:y+'년',cur:n3,req:c.yearMonths,unit:'달 성공',ok:n3>=c.yearMonths};}
  return null;
}
function goalTierState(g){
  return {period:g.id,label:g.code+' '+g.title,cur:goalPct(g),req:100,unit:'%',ok:(g.status==='done')};
}
function logKey(tier,period){return tier+'@'+period;}
/* ════ 🎁 보상 카드 (v8.0) ════
   보상함 = 카드의 '종류'(덱). 목표관리에서 배치하면 예약,
   계단을 달성하면 활성, 실제로 소비하며 가계부를 쓸 때 카드가 소멸한다.
   ⚠️ v7까지는 '수령 확정'이 곳 가계부 거래를 만들었다. 그러면 받기로 해놓고
      안 쓴 보상이 유령 거래로 남아 가계부가 더러워진다.
      거래는 실제 지출이 발생하는 순간에만 생기고, 카드는 거기에 '붙는' 것이다.
   ⚠️ 상태는 저장하지 않고 파생한다. 저장하는 사실은 배치와 사용뿐이다.
      usedAt 있으면 used, 없으면 tierOpen() 계산 → open / placed.
      문턱을 바꾸거나 과거를 다시 볼 때 판정이 어긋나지 않는다.
   ⚠️ 카드는 종류를 스냅샷한다. 보상함 원본을 나중에 고쳐도 발급된 카드는 안 변한다.
      (v6.0 '과거 달성률 소급변동'과 같은 실수를 반복하지 않는다) */
/* ⚠️ 이름 주의: DB.cards 는 '신용카드', rwCards() 는 '보상 카드'다. 섞으면 안 된다. */
function rwCards(){DB.rewardCards=DB.rewardCards||{};return DB.rewardCards;}
function cardOf(tier,period){return rwCards()[logKey(tier,period)]||null;}
function tierOpen(tier,period){
  if(tier==='week')return weekSuccess(period);
  if(tier==='month')return monthSuccess(period);
  if(tier==='year')return yearSuccess(period);
  if(tier==='goal'){var g=goalById(period);return !!(g&&g.status==='done');}
  return false;
}
function cardStatus(c){
  if(!c)return null;
  if(c.usedAt)return 'used';
  return tierOpen(c.tier,c.period)?'open':'placed';
}
function kindLabel(k){return (REWARD_KINDS.filter(function(x){return x.k===(k||'act');})[0]||{}).label||'';}
/* ⚠️ 가계부를 타는 기준은 kind 가 아니라 budget 이다.
   '일본 3박4일 = 행동 + 예산 80만' 같은 복합 보상이 kind 기준이면 가계부를 못 탄다.
   budget>0 → 지출이 생긴다 → 가계부에서 소멸 / budget=0 → 목표 탭에서 직접 완료. */
function isSpendCard(c){return !!(c&&(c.budget||0)>0);}
/* 지금 쓸 수 있는 카드. kind를 주면 그 분류만 */
function openCards(kind){
  var m=rwCards(),out=[];
  for(var k in m){var c=m[k];
    if(cardStatus(c)!=='open')continue;
    if(kind&&(c.kind||'act')!==kind)continue;
    out.push(c);}
  return out.sort(function(a,b){return (a.placedAt||'')<(b.placedAt||'')?-1:1;});
}
function cardByTxn(txnId){var m=rwCards();for(var k in m){if(m[k].txnId===txnId)return m[k];}return null;}
function cardsUsedOn(ds){var m=rwCards(),o=[];for(var k in m){if(m[k].usedAt===ds)o.push(m[k]);}return o;}
function usedCards(){var m=rwCards(),o=[];for(var k in m){if(m[k].usedAt)o.push(m[k]);}
  return o.sort(function(a,b){return a.usedAt<b.usedAt?1:-1;});}
function cardTierLabel(c){
  if(c.tier==='goal'){var g=goalById(c.period);return (g?g.code+' 달성':'목표 달성');}
  if(c.tier==='week')return weekLabel(c.period)+' 주간';
  if(c.tier==='month')return parseInt(c.period.slice(5),10)+'월 월간';
  return c.period+'년 연간';
}
/* ── 배치(예약) ── */
function placeCard(tier,period,rewardId){
  var r=(DB.rewards||[]).filter(function(x){return x.id===rewardId;})[0]; if(!r)return null;
  var k=logKey(tier,period),old=rwCards()[k];
  if(old&&old.usedAt){alert('이미 사용한 카드는 바꿀 수 없다.');return null;}
  rwCards()[k]={key:k,tier:tier,period:period,rewardId:r.id,
    code:r.code,title:r.title,kind:r.kind||'act',budget:r.budget||0,timing:r.timing||'any',
    placedAt:todayStr(),usedAt:null,txnId:null,spent:0,memo:''};
  logAct('🎁 카드 배치 · '+r.code+' '+r.title+' ('+k+')');
  return rwCards()[k];
}
function doPlace(tier,period,rid){ if(placeCard(tier,period,rid)){save();closeModal();renderRW();} }
function doUnplace(tier,period){
  var k=logKey(tier,period),c=rwCards()[k]; if(!c)return;
  if(c.usedAt)return alert('이미 사용한 카드는 해제할 수 없다.');
  if(!confirm(c.code+' '+c.title+' 배치를 해제할까요?'))return;
  delete rwCards()[k];
  logAct('🎁 카드 해제 · '+c.code+' '+c.title);
  save();closeModal();renderRW();
}
/* ── 사용 ── */
function useActModal(tier,period){

function doUseAct(tier,period){

/* 올해 보상으로 나간 돈 */
function rewardSpend(year){
  var m=rwCards(),t=0,n=0;

/* ── 배치 · 상세 모달 ── */

/* 배치할 카드 고르기 — 보상함 / 버킷함 / 새로 만들기 (3경로) */
/* 배치할 카드 고르기.
   ⚠️ 버킷은 여기 안 뜬다 (로한 지적). 버킷은 목표와 보상이 공존하는 원장이고,
      '목표가 대가가 될 순 없다'. 보상으로 쓸 거면 보상 탭에서 → 로 보상함에 올린 뒤 배치한다.
      한 단계를 거치게 하는 게 오히려 옳은 UX다 — 승격 자체가 판단이기 때문이다.
   ⚠️ 보상함 항목의 tier 는 v8에서 '기본 제안'일 뿐이다. 실제 단계는 카드가 들고 있다.
      그래서 다른 단계에 등록한 것도 고를 수 있게 열어둔다 — 안 그러면
      목표 달성 보상처럼 등록분이 0개인 단계에서 아무것도 못 고른다. */
function cardPick(tier,period,head){
  var tl=(REWARD_TIERS.filter(function(x){return x.k===tier;})[0]||{}).label||tier;
  var all=rewardActive();
  var byPrice=function(a,b){return (a.budget||a.price||0)-(b.budget||b.price||0);};
  var mine,others;
  if(tier==='goal'){
    mine=all.filter(function(r){return r.tier==='goal'&&r.goalId===period;}).sort(byPrice);
    others=all.filter(function(r){return !(r.tier==='goal'&&r.goalId===period);}).sort(byPrice);
  }else{
    mine=all.filter(function(r){return r.tier===tier;}).sort(byPrice);
    others=all.filter(function(r){return r.tier!==tier;}).sort(byPrice);
  }
  var row=function(r){
    var g=(r.tier==='goal'&&r.goalId)?goalById(r.goalId):null;
    return '<div class="rwpick" onclick="doPlace(\''+tier+'\',\''+period+'\',\''+r.id+'\')">'
     +'<div class="rwpt"><span><span class="gcode">'+r.code+'</span> '+sajuEsc(r.title)
       +(g?' <span class="mut">← '+g.code+'</span>':'')+'</span>'
     +'<span class="mut">'+kindLabel(r.kind)+((r.budget||r.price)?' · '+comma(r.budget||r.price)+'원':'')
       +(r.timing==='yin'?' · 陰':'')+'</span></div></div>';
  };
  var mineHtml=mine.length?mine.map(row).join('')
    :'<div class="mut" style="padding:6px 0;font-size:11.5px">이 단계에 등록된 것이 없다. 아래에서 고르거나 새로 만들어라.</div>';
  var otherHtml=others.length?('<div class="pickhd" style="margin-top:11px">🎁 다른 단계 보상 <span class="mut">골라도 된다 — 단계는 카드가 정한다</span></div>'
    +others.map(row).join('')):'';
  /* ⚠️ 액션 버튼은 상단에 두고 내용과 선으로 가른다.
     v8.4까지 '+ 새로 만들기'가 목록 맨 아래에 있고 옆에 긴 설명이 인라인으로 붙어
     버튼이 문장 속에 묻혔다. 목록형 모달의 액션은 위, 폼 모달의 저장은 아래가 맞다. */
  openModal((head||('<div class="mtop"><h3>🎁 '+tl+' 카드 배치</h3><span class="x" onclick="closeModal()">×</span></div>'))
   +'<div class="mact"><button class="btn sm" onclick="closeModal();rewardModal(null,\''+tier+'\',\''+(tier==='goal'?period:'')+'\',\''+period+'\')">+ 새로 만들기</button>'
   +'<span class="mnote">아래에서 고르거나, 없으면 새로 만든다</span></div>'
   +'<div class="pickhd">🎁 보상함 <span class="mut">'+(tier==='goal'?'이 목표에 걸린 것':'이 단계에 등록된 것')+'</span></div>'+mineHtml
   +otherHtml
   +'<div class="mfoot">🪣 버킷은 여기 안 뜬다 — 🎁 보상 탭에서 보상함으로 올린 뒤 고른다</div>');
}

/* ── 52주 트래커 ── */
function weekTracker(y){
  var w=weekStart(y+'-01-01'); if(w<y+'-01-01')w=addDays(w,7);
  var t=todayStr(),cw=weekStart(t),cells='',lastM=-1;
  for(var i=0;i<53;i++){
    if(w.slice(0,4)>y)break;
    var future=w>t, ok=!future&&weekSuccess(w), n=future?0:fullDaysInWeek(w);
    var mo=parseInt(w.slice(5,7),10), mk=(mo!==lastM); lastM=mo;
    cells+='<i class="'+(future?'fut':(ok?'win':'miss'))+(w===cw?' cw':'')+(mk?' mstart':'')+'"'
      +' data-tip="'+weekLabel(w)+' · 완전달성 '+n+'일'+(ok?' · 🎁 성공':(future?'':' · 미달'))+'"'
      +' data-wjump="'+w+'"></i>';
    w=addDays(w,7);
  }
  return cells;
}

  var tseg=REWARD_TIERS.map(function(x){
    return '<button class="'+(rw.tier===x.k?'on':'')+'" onclick="rwTier(this,\''+x.k+'\')">'+x.label+'</button>';}).join('');
  var kseg=REWARD_KINDS.map(function(x){
    return '<button class="'+((rw.kind||'act')===x.k?'on':'')+'" onclick="rwKind(this,\''+x.k+'\')">'+x.label+'</button>';}).join('');

   +'<div class="field"><label>보상 내용</label><input id="rw_title" value="'+sajuEsc(rw.title)+'" placeholder="예: 3만원 이하 먹고 싶던 것 / 게임 3시간"></div>'
   +'<div class="field"><label>어느 단계</label><div class="seg">'+tseg+'</div><div class="hint" id="rw_hint"></div></div>'
   +'<div class="field" id="rw_gwrap" style="display:'+(rw.tier==='goal'?'block':'none')+'"><label>연결할 연간 목표</label><select id="rw_goal">'+gopts+'</select></div>'
   +'<div class="field"><label>분류</label><div class="seg">'+kseg+'</div><div class="hint" id="rw_khint"></div></div>'
   +'<div class="field"><label>예산 <span class="mut">— 새로 나가는 돈. 0이면 돈 안 드는 보상</span></label>'
   +'<input id="rw_budget" value="'+(rw.budget||'')+'" placeholder="0" oninput="rwBudgetHint()"><div class="hint" id="rw_bhint"></div></div>'

   +'<select id="rw_timing"><option value="any"'+(rw.timing==='any'||!rw.timing?' selected':'')+'>상관없음</option>'
   +'<option value="yin"'+(rw.timing==='yin'?' selected':'')+'>음기일 (陰 · 주 1~2회)</option></select>'
   +'<div class="hint">명리상 음기가 강한 날에 표시된다. <b>과학적 근거는 없다</b> — "아무 때나"보다 규칙이 있는 편이 절제에 낫다는 실용적 장치다.</div></div>'

function rwKind(b,v){

  rwKindHint(); rwBudgetHint();
}

  h.textContent=k.desc||'';
  var tw=document.getElementById('rw_twrap');
  if(tw)tw.style.display=(modal._rwkind==='act'?'block':'none');
}
function rwBudgetHint(){
  var h=document.getElementById('rw_bhint'); if(!h)return;
  var v=numv('rw_budget');
  if(v>0)h.innerHTML='수령할 때 실제 지출을 입력하고 <b>가계부에 자동 기록</b>된다.';
  else h.textContent=(modal._rwkind==='spend'?'소비 보상인데 예산이 0이다. 금액을 넣어라.':'돈이 안 드는 보상 — 가계부 연계 없음.');

function rwTier(b,v){

function rwHint(){

  h.textContent = v==='week' ? ('한 주에 완전달성 '+c.weekFullDays+'일 이상이면 열린다. 가장 자주 오고 가장 강력하다.')

    : v==='year' ? ('그 해 월간 성공 '+c.yearMonths+'회면 열린다. 크게 잡아라.')
    : '연간 목표를 완료하면 지급. 예: N4 합격 → 일본 3박4일';

function saveReward(id){
  var title=document.getElementById('rw_title').value.trim();
  if(!title)return alert('보상 내용을 입력하세요');
  var tier=modal._rwtier;
  var gid=tier==='goal'?document.getElementById('rw_goal').value:null;
  if(tier==='goal'&&!gid)return alert('연결할 목표를 선택하세요');
  var tmEl=document.getElementById('rw_timing');
  var rec={title:title,tier:tier,goalId:gid,kind:modal._rwkind||'act',
    budget:numv('rw_budget')||0, timing:(modal._rwkind==='act'&&tmEl)?tmEl.value:'any', active:true};
  DB.rewards=DB.rewards||[];
  if(id){
    var ex=(DB.rewards.filter(function(x){return x.id===id;})[0]);
    Object.assign(ex,rec); ex.updatedAt=todayStr();
    if(!ex.place)ex.place='reward';
    logAct('보상수정 · '+title);
  }
  else{
    var pre=(REWARD_TIERS.filter(function(x){return x.k===tier;})[0]||{}).pre||'R';
    rec.id=uid();
    rec.code=(tier==='goal')?(pre+':'+((goalById(gid)||{}).code||'?')):(pre+seqNext('rw'+pre));
    /* ⚠️ place/status/기록일을 여기서 채운다. v7.5까지 빠져 있어서 보상함 표(place==='reward' 필터)에
       안 잡히고, 새로고침해서 마이그레이션이 backfill 해야 비로소 보였다. */
    rec.place='reward'; rec.status='want';
    rec.addedAt=todayStr(); rec.updatedAt=rec.addedAt;
    rec.price=rec.budget||0;
    DB.rewards.push(rec);logAct('보상추가 · '+rec.code+' '+title);
    /* 배치 모달에서 '새로 만들기'로 들어왔으면 만든 즉시 그 기간의 카드로 배치한다.
       한 번 더 고르게 만들면 흐름이 끊긴다. */
    if(modal._placeFor)placeCard(tier,modal._placeFor,rec.id);
  }
  save();closeModal();renderRW();
}
function delReward(id){
  var rw=(DB.rewards||[]).filter(function(x){return x.id===id;})[0];if(!rw)return;
  if(!confirm('삭제할까요? 지난 수령 기록은 남습니다.'))return;
  DB.rewards=DB.rewards.filter(function(x){return x.id!==id;});
  logAct('보상삭제 · '+rw.code+' '+rw.title);save();closeModal();renderRW();
}

function saveRwCfg(){
  var c=rwCfg();
  c.weekFullDays=Math.max(1,Math.min(7,numv('cf_w')||4));
  c.monthWeeks=Math.max(1,Math.min(5,numv('cf_m')||4));
  c.yearMonths=Math.max(1,Math.min(12,numv('cf_y')||9));
  logAct('보상 문턱 변경 · 주'+c.weekFullDays+'일/월'+c.monthWeeks+'회/연'+c.yearMonths+'회');
  save();closeModal();renderRW();

function rewardHistory(){
  var cs=usedCards();
  var byTier={week:0,month:0,year:0,goal:0};
  cs.forEach(function(c){if(byTier[c.tier]!==undefined)byTier[c.tier]++;});
  var spent=cs.reduce(function(a,c){return a+(c.spent||0);},0);
  openModal('<div class="mtop"><h3>🎁 보상 사용 기록 <span class="mut" style="font-size:12px">'+cs.length+'건</span></h3><span class="x" onclick="closeModal()">×</span></div>'
   +'<div class="mut" style="font-size:11.5px;margin-bottom:9px">주간 '+byTier.week+' · 월간 '+byTier.month+' · 연간 '+byTier.year+' · 목표 '+byTier.goal
   +(spent?' · 지출 합계 <b>'+won(spent)+'</b>':'')+'</div>'
   +(cs.length?cs.map(function(c){
      return '<div class="row"><span><span class="pill">'+cardTierLabel(c)+'</span><span class="gcode">'+(c.code||'')+'</span> '+sajuEsc(c.title||'')
        +(c.memo?' <span class="mut">'+sajuEsc(c.memo)+'</span>':'')
        +'</span><span class="mut">'+c.usedAt+(c.spent?' · '+won(c.spent):'')+(c.txnId?' · 가계부':'')+'</span></div>';
     }).join(''):'<div class="mut">아직 사용한 보상이 없다.</div>'));
}


/* ====== 버킷함 — 욕망의 원장 ======
   설계: integration-design.md 7장.
   계단(tier)에 묶이지 않는다. 티어는 담을 때가 아니라 '고를 때' 정해진다.
   "서울에 집 사기"처럼 평생 못 받을 수도 있는 것이 같이 산다 — 그게 원장인 이유다. */
/* 버킷함과 보상함은 같은 배열에 산다. place 필드로 갈린다.
   이동이 빈번하므로 배열을 나누면 id·기록일·코드가 깨진다. */
function allItems(){return DB.rewards||[];}
function bucketAll(){return allItems().filter(function(b){return (b.place||'bucket')==='bucket';});}
function rewardAll(){return allItems().filter(function(b){return b.place==='reward';});}
function bucketById(id){return allItems().filter(function(b){return b.id===id;})[0];}
function bucketWant(){return bucketAll().filter(function(b){return b.status==='want';});}
function rewardActive(){return rewardAll().filter(function(b){return b.status!=='got'&&b.status!=='dropped'&&b.active!==false;});}
function issueBucketCode(){var c;do{c='K'+seqNext('K');}while(allItems().some(function(b){return b.code===c;}));return c;}

/* ── 버킷함 ⇄ 보상함 이동 ── */
function toRewardModal(id){
  var b=bucketById(id); if(!b)return;
  var yy=todayStr().slice(0,4);

function bucketSorted(){

  return rows.sort(function(x,y){

    if(key==='price'){a=x.price||0;b=y.price||0;}
    else if(key==='added'){a=x.addedAt||'';b=y.addedAt||'';}
    else if(key==='updated'){a=x.updatedAt||x.addedAt||'';b=y.updatedAt||y.addedAt||'';}
    else if(key==='kind'){a=x.kind||'';b=y.kind||'';}
    else {a=x.code||'';b=y.code||'';}
    return a<b?-dir:(a>b?dir:0);

/* --- (12주 잔디는 52주 주간 트래커로 대체됨: weekTracker) --- */

/* --- 월간 체크 캘린더 --- */
/* ══ 월간 캘린더 (v8.3)
   로한 제안: "캘린더를 크게 두고 칸을 최대한 활용".
   ⚠️ 칸을 키운 것만으론 의미가 없다. 넣을 것을 정하는 게 설계다:
      날짜(달성도 배경) · 비율 · 못한 루틴 이름 · 미달 사유 · 陰 · 🎁
   ⚠️ 행 끝에 '주' 칸을 붙였다. 캘린더 한 행 = 한 주이므로
      주간 계단이 캘린더 안에서 완결된다(4일 완전달성 → 이 행에 ✓ → 4개면 월간 열림).
   ⚠️ 좁은 화면에서는 7열에 내용을 못 넣는다. 이번 주 7칸만 보여주고 '월 전체'로 펼친다. */
function cut(t,n){t=t||'';return t.length>n?t.slice(0,n)+'…':t;}
function gcalWeekMode(){
  if(DB.ui.gcalMode==='week')return true;
  if(DB.ui.gcalMode==='month')return false;
  return (typeof window!=='undefined'&&window.innerWidth<=720);
}
function gcalToggle(){
  DB.ui.gcalMode=gcalWeekMode()?'month':'week';
  save();renderDG();
}
/* 그날 못 한 루틴 — 이름과 사유를 같이 낸다. 무엇이 무너졌는지가 달력 위에서 보여야 한다. */
function missRows(ds){
  var due=dueOf(ds),done=doneOf(ds),ms=missOf(ds),out=[];
  for(var i=0;i<due.length;i++){
    var c=due[i]; if(done.indexOf(c)>=0)continue;
    var r=routineByCode(c), m=ms[c];
    out.push({code:c,title:(r&&r.title)||c,tag:(m&&m.tag)||''});
  }
  return out;
}
function gcalCell(ds,compact){
  var sel=curDate(),t=todayStr();
  var dd=parseInt(ds.slice(8),10);
  var r=dayRate(ds),lv='';
  if(r)lv=(r.rate>=1?' l3':(r.rate>=0.5?' l2':(r.rate>0?' l1':' l0')));
  var future=ds>t, yin=isYinDay(ds);
  var used=cardsUsedOn(ds);
  var mk=(yin?'<i class="gmk yin" title="陰 음기일">陰</i>':'')
        +(used.length?'<i class="gmk" title="'+sajuEsc(used.map(function(c){return c.code+' '+c.title;}).join(', '))+'">🎁</i>':'');
  var body='',tip='';
  if(!future&&compact){
    /* 주간 스트립(모바일)은 칸이 좁다. 이름은 못 넣어도 '몇 개 무너졌나'는 넣는다. */
    var mc=missRows(ds);
    if(mc.length){body='<div class="gcmi"><span class="gcx">✗'+mc.length+'</span></div>';
      tip=mc.map(function(x){return x.title+(x.tag?' ('+x.tag+')':'');}).join(', ');}
    else if(r&&r.total)body='<div class="gcok">✓</div>';
  }
  if(!future&&!compact){
    /* ⚠️ 칸을 키운 목적은 여백이 아니라 정보다(로한: "눌러보지 않아도 지키고 있는지 알게").
       그날 루틴을 ✓/✗ 로 낱낱이 적는다. **못 한 것을 위로** — 그게 더 중요한 정보다.
       넘치면 +N 으로 접고 전체는 툴팁에 남긴다. */
    /* ⚠️ 핵심 정보는 '못 한 것의 이름과 이유'다. 한 것은 개수로 접는다.
       다 펼치면 루틴 5개일 때 칸이 172px 이 되어(실측) 달력이 세로로 늘어진다. */
    var mr=missRows(ds), dn=doneOf(ds), MAXL=2, rows=[];
    for(var q=0;q<mr.length&&q<MAXL;q++)
      rows.push('<div class="gcli x">✗<span>'+sajuEsc(cut(mr[q].title,mr[q].tag?8:12))+'</span>'
        +(mr[q].tag?'<b>'+sajuEsc(mr[q].tag)+'</b>':'')+'</div>');
    if(mr.length>MAXL)rows.push('<div class="gcli more">✗ +'+(mr.length-MAXL)+'</div>');
    if(dn.length)rows.push('<div class="gcli o">✓<span>'
      +(mr.length?dn.length+'개 완료':'완전달성')+'</span></div>');
    if(rows.length){
      body=rows.join('');
      tip=(mr.length?'못한 것 — '+mr.map(function(x){return x.title+(x.tag?'('+x.tag+')':'');}).join(', '):'')
        +(mr.length&&dn.length?' / ':'')
        +(dn.length?'한 것 — '+dn.map(function(c){var z=routineByCode(c);return (z&&z.title)||c;}).join(', '):'');
    }
  }
  return '<div class="gcell'+lv+(ds===sel?' sel':'')+(ds===t?' today':'')+(future?' fut':'')+(yin?' yin':'')+'" data-gcal="'+ds+'"'
    +(tip?' title="'+sajuEsc(tip)+'"':'')+'>'
    +'<div class="gchd"><span class="gcd">'+dd+'</span><span class="gcmks">'+mk+'</span></div>'
    +(r&&!future?'<span class="gcr">'+r.done+'/'+r.total+'</span>':'')
    +body
    /* 🔑 계획(루틴)과 실제(시간)를 한 칸에 겹쳐 본다 — v12.0에서 두 캘린더를 합쳤다 */
    +(future?'':tlStrip(ds,9))+'</div>';
}
/* 주 칸 — 그 주의 완전달성 일수와 성공 여부 */
function gcalWeekCell(ws){
  var t=todayStr(),cfg=rwCfg();
  if(ws>t)return '<div class="gwk fut"></div>';
  var n=fullDaysInWeek(ws), ok=n>=cfg.weekFullDays;
  return '<div class="gwk'+(ok?' ok':'')+'" data-wjump="'+ws+'" title="'+weekLabel(ws)+' · 완전달성 '+n+'/'+cfg.weekFullDays+'일">'
    +(ok?'<b>✓</b>':'<span>'+n+'</span>')+'</div>';
}
function goalCalendar(){
  var ym=curMonth(),sel=curDate();
  if(gcalWeekMode()){
    var wsx=weekStart(sel),cells='';
    cells+=DOW_KO.map(function(d,i){return '<div class="gcdow s'+i+'">'+d+'</div>';}).join('')+'<div class="gcdow">주</div>';
    for(var k=0;k<7;k++)cells+=gcalCell(addDays(wsx,k),true);
    cells+=gcalWeekCell(wsx);
    return cells;
  }
  var y=parseInt(ym.slice(0,4),10),mo=parseInt(ym.slice(5),10);
  var first=new Date(Date.UTC(y,mo-1,1)).getUTCDay(),dim=new Date(Date.UTC(y,mo,0)).getUTCDate();
  var out=DOW_KO.map(function(d,i){return '<div class="gcdow s'+i+'">'+d+'</div>';}).join('')+'<div class="gcdow">주</div>';
  var col=0, rowStart=null;
  for(var i=0;i<first;i++){ out+='<div class="gcell empty"></div>'; col++; }
  for(var dd=1;dd<=dim;dd++){
    var ds=ym+'-'+String(dd).padStart(2,'0');
    if(rowStart===null)rowStart=weekStart(ds);
    out+=gcalCell(ds,false); col++;
    if(col===7){ out+=gcalWeekCell(rowStart); col=0; rowStart=null; }
  }
  if(col>0){
    for(var z=col;z<7;z++)out+='<div class="gcell empty"></div>';
    out+=gcalWeekCell(rowStart||weekStart(ym+'-01'));
  }
  return out;
}

/* --- 목표 진행 행 --- */

  if(compact){
    return '<div class="goalrow one'+(g.status==='done'?' done':'')+(par?' ms':'')+'">'

     +(isM?'<span class="ctxbar"><span style="width:'+Math.min(100,Math.max(0,pct))+'%"></span></span>':'<span class="ctxbar ghost"></span>')
     +'<span class="ctxr">'+(isM?'<span class="mut">'+gnum(val)+'/'+gnum(g.metric.target)+(g.metric.unit||'')+'</span> '
        +'<b class="ctxpct'+(pct>=100?' full':'')+'">'+pct+'%</b>':'')
       +(g.manual?' <span class="chip check">수동</span>':'')
       +'<span class="acts"><span data-gdone="'+g.id+'" title="'+(g.status==='done'?'되돌리기':'완료')+'">'+(g.status==='done'?'↩':'✔')+'</span><span data-gedit="'+g.id+'">✎</span></span></span></div>';
  }
  return '<div class="goalrow'+(g.status==='done'?' done':'')+(par?' ms':'')+'">'
   +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:13px">'
   +'<span class="gt"><span class="gcode">'+g.code+'</span> '+sajuEsc(g.title)
   +(par?' <span class="rg">← '+par.code+' '+sajuEsc(par.title)+'</span>':' <span class="chip check">단발</span>')+'</span>'

   +(isM?('<div class="mut" style="font-size:11px;margin-top:5px">'+gnum(val)+' / '+gnum(g.metric.target)+' '+(g.metric.unit||'')+' <b>'+pct+'%</b>'
        +(mt==='autodays'?' <span class="chip auto">자동</span>':'')+(g.manual?' <span class="chip check">수동</span>':'')+'</div>'
        +'<div class="pbar"><span style="width:'+Math.min(100,Math.max(0,pct))+'%"></span></div>'):'')
   +(!compact&&g.memo?'<div class="mut" style="font-size:11px;margin-top:6px;white-space:pre-wrap">'+sajuEsc(g.memo)+'</div>':'')
