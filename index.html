}

/* --- 그날의 루틴 (목표별 그룹) --- */
function todayGroups(t){
  var rs=routinesForDay(t),groups=[],idx={};
  function bucket(key,label,cls){
    if(!idx[key]){idx[key]={key:key,label:label,cls:cls,rows:[]};groups.push(idx[key]);}
    return idx[key];
  }
  rs.forEach(function(r){
    var g=r.goalId?goalById(r.goalId):null;
    if(!g)bucket('_z','미연결','z').rows.push({r:r,g:null});
    else if(g.kind==='milestone'){
      var p=goalById(g.parentId);
      bucket(p?p.id:g.id,(p?p.code+' '+p.title:g.title),'y').rows.push({r:r,g:g});
    }
    else bucket(g.id,g.code+' '+g.title,g.kind==='year'?'y':'m').rows.push({r:r,g:g});
  });
  return groups;
}
function routineRow(t,r,g){
  var on=checkGet(t,r.code),ms=missOf(t)[r.code];
  return '<div class="rtask'+(on?' on':'')+'" data-rcheck="'+r.code+'">'
   +'<span class="bx">'+(on?'✓':'')+'</span>'
   +'<span class="rn"><span class="rcode">'+r.code+'</span> '+sajuEsc(r.title)
   +(g&&g.kind==='milestone'?'<span class="rg">'+g.code+(r.end?'':' <b style="color:var(--warn)">기간없음</b>')+'</span>':'')
   +(r.end?'<span class="rg">~'+parseInt(r.end.slice(5,7),10)+'/'+parseInt(r.end.slice(8),10)+'</span>':'')
   +(ms?'<span class="misstag">'+sajuEsc(ms.tag||'사유')+(ms.memo?' · '+sajuEsc(ms.memo):'')+'</span>':'')
   +'</span>'
   +'<span class="acts">'+(on?'':'<span data-rmiss="'+r.code+'" title="못한 이유">💬</span>')+'<span data-rtedit="'+r.id+'">✎</span></span></div>';
}

/* ── 보상 칩: 각 층에 붙어 그 층의 계단 상태를 말한다 ── */
function rwChip(tier,period,label){
  var st=(tier==='goal')?goalTierState(goalById(period)):tierState(tier);
  if(!st)return '';
  var pd=(tier==='goal')?period:(st.period||period);
  var key=tier+'|'+pd, c=cardOf(tier,pd), sx=cardStatus(c);
  var L=(label||'');
  if(sx==='used')
    return '<span class="rwchip done" data-rwcard="'+key+'" title="'+sajuEsc(c.title)+' 사용 · 누르면 상세">🎁 '+L+' ✓ '+sajuEsc(c.title)+'</span>';
  if(sx==='open')
    return '<span class="rwchip open" data-rwcard="'+key+'" title="'+(isSpendCard(c)?'가계부에 지출을 적을 때 고른다':'누르면 사용 확정')+'">🎁 '+L+' '+sajuEsc(c.title)+' <b>'+(isSpendCard(c)?'가계부에서':'받기')+'</b></span>';
  if(sx==='placed')
    return '<span class="rwchip set" data-rwcard="'+key+'" title="배치됨 · 누르면 변경">🎁 '+L+' '+st.cur+'/'+st.req+' · '+sajuEsc(c.title)+'</span>';
  return '<span class="rwchip empty" data-rwcard="'+key+'" title="카드 미배치 · 누르면 배치">🎁 '+L+' '+st.cur+'/'+st.req+' <b>카드 배치</b></span>';
}

/* ══════════ ⏳ 타임로그 (v11.0) ══════════
   로한: *"루틴 안 지키고 시간별로 무엇을 했는지 적고 싶다. 하루를 어떻게 보냈는지 낱낱이 드러내고 싶다."*
   ⚠️ 지금 X의 이유는 미달 사유 태그 하나뿐이다. 그건 라벨이지 사실이 아니다.
      '무기력' 대신 '21:00–23:30 유튜브'가 남아야 반성이 된다.
   ⚠️ 가계부와 구조가 다르다:
      가계부 = 건(件)·순서 무관·총량 무제한 / 타임로그 = 구간·순서가 의미·**하루 24시간 고정 총량**.
      총량이 고정이라 "이만큼 썼다"가 아니라 **"이만큼밖에 안 남았다"**가 보인다.
   ⚠️ 기록 안 된 시간은 채우지 않는다. **비어 있는 것 자체가 데이터다.**
   저장 단위: 30분 슬롯(0~47). blocks=[{s,e,tag,title,code}] — 슬롯 배열보다 훨씬 가볍다. */
var TL_TAGS=[
  {k:'sleep', label:'수면',  c:'#8b93a8'},
  {k:'work',  label:'일',    c:'#3f6fd8'},
  {k:'study', label:'학습',  c:'#2f9e6e'},
  {k:'make',  label:'창작',  c:'#a067d8'},
  {k:'move',  label:'운동',  c:'#e08a2f'},
  {k:'meal',  label:'식사',  c:'#d8a13f'},
  {k:'trip',  label:'이동',  c:'#6bb3c9'},
  {k:'rest',  label:'휴식',  c:'#7fc08a'},
  {k:'waste', label:'낭비',  c:'#d64545'},
  {k:'social',label:'사교',  c:'#d87fae'},
  {k:'home',  label:'집안일',c:'#a89070'},
  {k:'etc',   label:'기타',  c:'#9aa6b6'}
];
function tlTag(k){return TL_TAGS.filter(function(x){return x.k===k;})[0]||TL_TAGS[TL_TAGS.length-1];}
function tlAll(){DB.timelog=DB.timelog||{};return DB.timelog;}
function tlOf(ds){return (tlAll()[ds]||[]).slice().sort(function(a,b){return a.s-b.s;});}
function slotLabel(i){return String(Math.floor(i/2)).padStart(2,'0')+':'+((i%2)?'30':'00');}
function slotRange(a,b){return slotLabel(a)+'–'+slotLabel(b+1>47?48:b+1).replace('24:00','24:00');}
/* 슬롯 i 를 덮는 블록 */
function tlAt(ds,i){var b=tlOf(ds);for(var k=0;k<b.length;k++)if(i>=b[k].s&&i<=b[k].e)return b[k];return null;}
function tlUsed(ds){var n=0;tlOf(ds).forEach(function(b){n+=(b.e-b.s+1);});return n;}
/* 태그별 슬롯 수 */
function tlSum(ds){
  var m={};tlOf(ds).forEach(function(b){m[b.tag]=(m[b.tag]||0)+(b.e-b.s+1);});return m;
}
function tlMonthSum(ym){
  var m={},days=0,all=tlAll();
  for(var k in all){ if(k.slice(0,7)!==ym)continue; days++;
    var d=tlSum(k); for(var t in d)m[t]=(m[t]||0)+d[t]; }
  return {tags:m,days:days};
}
function hrs(slots){var h=slots/2;return (h%1?h.toFixed(1):h)+'h';}
/* 겹치는 구간을 잘라낸다 — 같은 시간에 두 가지를 했다고 기록할 순 없다 */
function tlPut(ds,blk){
  var all=tlAll(); var list=(all[ds]||[]).slice(), out=[];
  list.forEach(function(b){
    if(b.e<blk.s||b.s>blk.e){out.push(b);return;}
    if(b.s<blk.s)out.push({s:b.s,e:blk.s-1,tag:b.tag,title:b.title,code:b.code});
    if(b.e>blk.e)out.push({s:blk.e+1,e:b.e,tag:b.tag,title:b.title,code:b.code});
  });
  out.push(blk);
  out.sort(function(a,b){return a.s-b.s;});
  all[ds]=out;
}
/* 구간만 지운다 — 블록 한가운데를 지우면 앞뒤가 남는다 */
function tlDelRange(ds,a,z){
  var all=tlAll(), out=[];
  (all[ds]||[]).forEach(function(b){
    if(b.e<a||b.s>z){out.push(b);return;}
    if(b.s<a)out.push({s:b.s,e:a-1,tag:b.tag,title:b.title,code:b.code});
    if(b.e>z)out.push({s:z+1,e:b.e,tag:b.tag,title:b.title,code:b.code});
  });
  out.sort(function(x,y){return x.s-y.s;});
  if(out.length)all[ds]=out; else delete all[ds];
}
function tlDel(ds,i){
  var all=tlAll(); all[ds]=(all[ds]||[]).filter(function(b){return !(i>=b.s&&i<=b.e);});
  if(!all[ds].length)delete all[ds];
}

/* ══════════ 📅 데일리 — 매일 여는 화면 (v10.0) ══════════
   로한 설계: *"목표루틴 / 보상 / 데일리로 나누고, 캘린더를 데일리로 이관해 최대한 크게"*.
   ⚠️ '상단이 길다 → 과제가 캘린더 밑이라 안 보인다 → 게이지가 길 필요 있냐'
      이 세 지적은 전부 같은 뿌리였다. **사용 빈도가 다른 것을 한 페이지에 넣은 것.**
      루틴 설계는 월 1~2회, 체크는 매일. 레이아웃으로 풀 문제가 아니라 정보구조로 풀 문제였다.
   ⚠️ 다만 연계성이 끊기면 그냥 할 일 목록이 된다.
      → 상단에 연간 목표 진행률 칩을 두고, 체크리스트는 목표별로 묶는다. */
function gotoTab(v){var m=document.querySelector('.side .m[data-v="'+v+'"]');if(m)m.click();}
function dailyTab(){return (DB.ui&&DB.ui.dailyTab)==='log'?'log':'routine';}
function setDailyTab(v){DB.ui.dailyTab=v;DB.ui.tlPick=null;save();renderDaily();}

  var sajuD='';
  try{var ft=dayFlags(parseInt(d.slice(0,4),10),parseInt(d.slice(5,7),10),parseInt(d.slice(8,10),10));

   +'<div class="dtl"><b class="dtd">'+parseInt(d.slice(5,7),10)+'월 '+parseInt(d.slice(8),10)+'일 ('+DOW_KO[dowOf(d)]+')</b>'
   +'<span class="'+(full?'dfull':'mut')+'">'+(full?'✅ 완전달성':(r?'오늘 '+r.done+'/'+r.total:'루틴 없음'))+'</span>'
   +'<span class="mut">이번주 '+fullDaysInWeek(weekStart(d))+'/'+cfg.weekFullDays+'일</span>'
   +'<span class="mut">기록 '+hrs(used)+' · 미기록 '+hrs(48-used)+'</span>'+sajuD+'</div>'
   +'<div class="dgs">'+(gchips||'<span class="mut" data-gojump="">목표가 없다 — 목표·루틴 탭에서 시작해라</span>')+'</div></div>';

  var calPane='<div class="sec pane"><h4><span class="mnav2"><span data-mmv="-1">◀</span>'
   +'<b>'+parseInt(ym.slice(0,4),10)+'년 '+parseInt(ym.slice(5),10)+'월</b>'
   +'<span data-mmv="1">▶</span><span id="goalMonthPick" title="월 선택">📅</span></span>'
   +'<span class="hacts">'+rwChip('month',ym,'월간')
   +'<span class="gcalsw" id="gcalToggle">'+(gcalWeekMode()?'월 전체 ▾':'이번 주만 ▴')+'</span></span></h4>'
   +'<div class="mut" style="font-size:10.5px;margin:-2px 0 7px">'+monthDoneDays(ym)+'일 체크 · '
   +(function(){var ms=tlMonthSum(ym);var tot=0;for(var k in ms.tags)tot+=ms.tags[k];
      return ms.days?(ms.days+'일 기록 '+hrs(tot)):'시간 기록 없음';})()
   +' · 날짜를 눌러 지난 날도</div>'
   +'<div class="gcal'+(gcalWeekMode()?' wk':'')+'">'+goalCalendar()+'</div>'
   +'<div class="tllegend">'+TL_TAGS.map(function(x){
      return '<span class="tlsum"><i style="background:'+x.c+'"></i>'+x.label+'</span>';}).join('')+'</div></div>';

  /* ── 우: 날짜는 고정, 내용만 탭으로 바뀐다 ── */
  var groups=todayGroups(d);
  var tasks=groups.length?groups.map(function(gr){
    return '<div class="rgroup"><div class="rghd '+gr.cls+'">'+sajuEsc(gr.label)+'</div>'
     +gr.rows.map(function(x){return routineRow(d,x.r,x.g);}).join('')+'</div>';
  }).join(''):'<div class="mut" style="padding:10px 0;font-size:11.5px">이 날 해당하는 루틴이 없다. <b>목표·루틴</b> 탭에서 설계해라.</div>';
  var nMiss=missRows(d).length;
  var routinePane=tasks
   +(nMiss?('<div class="tlnudge" data-dtab="log">⏳ 못 한 게 '+nMiss+'개다 — <b>그 시간에 뭘 했는지</b> 적어라</div>'):'')

/* 날짜 상태는 curDate() 하나만 쓴다 — 두 개면 반드시 어긋난다 (v12.0 통합) */
function tlDate(){return curDate();}
function tlMonth(){return curMonth();}
function setTlDate(ds){DB.ui.tlPick=null;setGoalDate(ds);}
/* 하루를 가로 색띠 하나로 — 한 달을 펼치면 생활 패턴이 그림으로 드러난다 */
function tlStrip(ds,h){
  var b=tlOf(ds); if(!b.length)return '<div class="tlstrip empty" style="height:'+(h||6)+'px"></div>';
  var seg='',cur=0;
  b.forEach(function(x){
    if(x.s>cur)seg+='<i style="flex:'+(x.s-cur)+'"></i>';
    seg+='<i style="flex:'+(x.e-x.s+1)+';background:'+tlTag(x.tag).c+'"></i>';
    cur=x.e+1;
  });
  if(cur<48)seg+='<i style="flex:'+(48-cur)+'"></i>';
  return '<div class="tlstrip" style="height:'+(h||6)+'px">'+seg+'</div>';
}
/* 30분 그리드 — 한 행이 1시간, 좌우 반칸 */
function tlGrid(ds){
  var pick=(DB.ui&&DB.ui.tlPick), rows='';
  for(var h=0;h<24;h++){
    var cells='';
    for(var q=0;q<2;q++){
      var i=h*2+q, b=tlAt(ds,i);
      var st=b?(' has'+(b.s===i?' st':'')):'';
      var sel=(pick!=null&&i===pick)?' pick':'';
      cells+='<span class="tlq'+st+sel+'" data-tlq="'+i+'"'
        +(b?' style="background:'+tlTag(b.tag).c+'"':'')
        +' title="'+slotLabel(i)+(b?' · '+tlTag(b.tag).label+(b.title?' '+sajuEsc(b.title):''):'')+'">'
        +(b&&b.s===i?'<em>'+sajuEsc(b.title||tlTag(b.tag).label)+'</em>':'')+'</span>';
    }
    rows+='<div class="tlrow"><span class="tlh">'+String(h).padStart(2,'0')+'</span>'+cells+'</div>';
  }
  return rows;
}
/* ⏳ 로그 패널 — 데일리 우측 '로그' 탭의 내용 (v12.0에서 단독 탭에서 흡수) */
function tlPanel(ds){
  var used=tlUsed(ds), sum=tlSum(ds), pick=(DB.ui&&DB.ui.tlPick);
  var bars=TL_TAGS.filter(function(x){return sum[x.k];})
    .sort(function(a,b){return sum[b.k]-sum[a.k];})
    .map(function(x){return '<span class="tlsum"><i style="background:'+x.c+'"></i>'+x.label+' <b>'+hrs(sum[x.k])+'</b></span>';}).join('');
  var miss=missRows(ds);
  var missBox=miss.length?('<div class="tlmiss"><b>못 한 루틴</b> '
    +miss.map(function(m){return '<span class="chip check">'+sajuEsc(m.title)+(m.tag?' · '+sajuEsc(m.tag):'')+'</span>';}).join('')
    +'<div class="mut" style="font-size:10.5px;margin-top:5px">그 시간에 실제로 뭘 했는지 적어라. 그게 반성의 재료다.</div></div>'):'';
  return '<div class="mut tlstat">기록 <b>'+hrs(used)+'</b> · 미기록 <b>'+hrs(48-used)+'</b></div>'
   +missBox
   +(bars?'<div class="tlsums">'+bars+'</div>':'')
   +'<div class="mut tlhint">'+(pick!=null
      ? ('<b class="acc">'+slotLabel(pick)+'</b> 부터 — <b>끝나는 칸</b>을 눌러라 (같은 칸을 다시 누르면 30분)  <span class="chip check" data-tlcancel="1">취소</span>')
      : '시작 칸을 누르고 끝 칸을 눌러라 · <b>기록된 칸 위에도 덮어쓸 수 있다</b> (앞뒤는 남는다)')+'</div>'
   +'<div class="tlgrid">'+tlGrid(ds)+'</div>'
   +'<div class="tllegend">'+TL_TAGS.map(function(x){
      return '<span class="tlsum"><i style="background:'+x.c+'"></i>'+x.label+'</span>';}).join('')+'</div>';
}
/* 칸 클릭 — 두 번 눌러 범위를 잡는다(모바일에서 드래그보다 확실하다) */
/* ⚠️ v12.0까지 기록된 칸을 누르면 '블록 전체 수정'만 됐다.
   그래서 08:30–11:00 림월드 중 10:00–10:30만 식사로 바꾸려면 전체를 지우고 다시 써야 했다(로한 지적).
   → **규칙을 하나로 통일한다: 항상 두 칸을 눌러 범위를 정하고, 그 범위가 곧 편집 대상이다.**
   데이터 계층(tlPut)은 처음부터 겹침 분할을 지원했다. UI만 막고 있었다. */
function tlSlotClick(i){
  var ds=tlDate();
  var pick=(DB.ui&&DB.ui.tlPick);
  if(pick==null){ DB.ui.tlPick=i;save();return renderDaily(); }
  var a=Math.min(pick,i), z=Math.max(pick,i);
  DB.ui.tlPick=null;save();
  tlRangeModal(ds,a,z);
}
/* 구간 편집 모달 — 시작·끝을 직접 조절할 수 있어야 '시간 조절'이 된다 */
function tlRangeModal(ds,a,z){
  var routines=dueOf(ds).map(function(c){var r=routineByCode(c);return r?{code:c,title:r.title}:null;}).filter(Boolean);
  /* 이 구간에 걸친 기존 기록 — 덮어쓸 것을 미리 보여준다 */
  var ov=tlOf(ds).filter(function(b){return !(b.e<a||b.s>z);});
  var base=ov.length===1?ov[0]:null;   /* 하나에 완전히 걸치면 그 값을 이어받는다 */
  var cur=base||{tag:'',title:'',code:null};
  var opts='<option value="">— 연결 안 함 —</option>'+routines.map(function(r){
    return '<option value="'+r.code+'"'+(cur.code===r.code?' selected':'')+'>'+r.code+' · '+sajuEsc(r.title)+'</option>';}).join('');
  var seg=TL_TAGS.map(function(x){
    return '<button class="tlpick'+(cur.tag===x.k?' on':'')+'" style="--tc:'+x.c+'" onclick="tlSetTag(this,\''+x.k+'\')">'
      +'<i style="background:'+x.c+'"></i>'+x.label+'</button>';}).join('');
  var slotOpts=function(sel,from){var o='';
    for(var k=(from||0);k<48;k++)o+='<option value="'+k+'"'+(k===sel?' selected':'')+'>'+slotLabel(k)+'</option>';
    return o;};
  var endOpts=function(sel){var o='';
    for(var k=0;k<48;k++)o+='<option value="'+k+'"'+(k===sel?' selected':'')+'>'+slotLabel(k+1>47?48:k+1)+'</option>';
    return o;};
  openModal('<div class="mtop"><h3>⏳ <span id="tl_lab">'+slotRange(a,z)+'</span> <span class="mut" style="font-size:12px" id="tl_dur">'
      +hrs(z-a+1)+'</span></h3><span class="x" onclick="closeModal()">×</span></div>'
   +'<div class="field"><label>시간 <span class="mut">(끌어서 정한 뒤에도 여기서 조절할 수 있다)</span></label>'
   +'<div class="tltime"><select id="tl_s" onchange="tlTimeSync()">'+slotOpts(a)+'</select>'
   +'<span>→</span><select id="tl_e" onchange="tlTimeSync()">'+endOpts(z)+'</select></div></div>'
   +(ov.length?('<div class="tlov"><b>여기에 이미 있는 기록</b>'
      +ov.map(function(b){return '<span class="chip check"><i style="background:'+tlTag(b.tag).c+'"></i>'
        +slotRange(b.s,b.e)+' '+sajuEsc(b.title||tlTag(b.tag).label)+'</span>';}).join('')
      +'<div class="mut" style="font-size:10.5px;margin-top:4px">저장하면 이 구간만 덮어쓴다. 앞뒤는 그대로 남는다.</div></div>'):'')
   +'<div class="field"><label>무엇을 했나</label><div class="tlpicks">'+seg+'</div></div>'
   +'<div class="field"><label>내용 <span class="mut">(선택 · 구체적일수록 회고가 정확해진다)</span></label>'
   +'<input id="tl_title" value="'+sajuEsc(cur.title||'')+'" placeholder="예: 유튜브 · 뽀모 3회 · 지하철"></div>'
   +(routines.length?('<div class="field"><label>루틴 연결 <span class="mut">(이 시간이 그 루틴 수행이었나)</span></label>'
   +'<select id="tl_code">'+opts+'</select></div>'):'')
   +'<button class="btn" onclick="tlSave(\''+ds+'\')">저장</button>'
   +(ov.length?' <button class="ghost" onclick="tlWipe(\''+ds+'\')">이 구간 비우기</button>':''));
  modal._tltag=cur.tag||'';
}
function tlTimeSync(){
  var a=parseInt(document.getElementById('tl_s').value,10);
  var z=parseInt(document.getElementById('tl_e').value,10);
  if(z<a){z=a;document.getElementById('tl_e').value=a;}
  document.getElementById('tl_lab').textContent=slotRange(a,z);
  document.getElementById('tl_dur').textContent=hrs(z-a+1);
}
function tlBounds(){
  var a=parseInt(document.getElementById('tl_s').value,10);
  var z=parseInt(document.getElementById('tl_e').value,10);
  if(z<a)z=a;
  return [a,z];
}
function tlSetTag(el,k){
  modal._tltag=k;
  var bs=el.parentNode.querySelectorAll('button');
  for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');
  el.classList.add('on');
}
function tlSave(ds){
  if(!modal._tltag)return alert('무엇을 했는지 골라라');
  var b=tlBounds(), a=b[0], z=b[1];
  var el=document.getElementById('tl_title'), ce=document.getElementById('tl_code');
  tlPut(ds,{s:a,e:z,tag:modal._tltag,title:el?el.value.trim():'',code:(ce&&ce.value)||null});
  logAct('⏳ '+ds+' '+slotRange(a,z)+' '+tlTag(modal._tltag).label+(el&&el.value?' · '+el.value.trim():''));
  save();closeModal();renderDaily();
}
function tlWipe(ds){
  var b=tlBounds(), a=b[0], z=b[1];
  if(!confirm(slotRange(a,z)+' 구간의 기록을 지울까요?\n앞뒤 기록은 그대로 남습니다.'))return;
  tlDelRange(ds,a,z);logAct('⏳ 구간 비움 · '+ds+' '+slotRange(a,z));
  save();closeModal();renderDaily();
}

/* ══════════ 🎯 목표·루틴 — 설계 전용 (v10.0) ══════════
   여기서는 '무엇을 할 것인가'만 정한다. '했는가'는 데일리에서. */
function renderGoal(){
  syncAllMilestones();
  var t=todayStr(), ym=curMonth(), yy=t.slice(0,4), cfg=rwCfg();
  var yg=yearGoals(yy);

  var ctx=yg.map(function(g){
    var pct=goalPct(g),open=(DB.ui.goalOpen===g.id);
    var mt=(g.metric&&g.metric.type)||'binary', cur=goalValue(g);
    var stat=goalStats(g.id,ym+'-01',lastDayOfYM(ym));
    var mlist=milestonesOf(g.id);
    return '<div class="ctxrow'+(open?' open':'')+(g.status==='done'?' gdone':'')+'" data-gopen="'+g.id+'">'
     +'<div class="ctxhead"><span class="ctxnm"><b class="gcode">'+g.code+'</b> '+sajuEsc(g.title)
       +(g.status==='done'?' <span class="pill">완료</span>':'')+'</span>'
     +'<span class="ctxbar"><span style="width:'+Math.min(100,Math.max(0,pct))+'%"></span></span>'
     +'<span class="ctxr">'+(mt!=='binary'?'<span class="mut">'+gnum(cur)+'/'+gnum(g.metric.target)+(g.metric.unit||'')+'</span>'
         +(g.source&&g.source!=='manual'?' <span class="chip auto">연동</span>'
           :(suggestSource(g)?' <span class="chip warn2" title="로한북에 이 값이 이미 있다 — 목표 수정에서 연결해라">수동</span>':''))+' ':'')
       +'<b class="ctxpct'+(pct>=100?' full':'')+'">'+pct+'%</b> <span class="mut">'+(g.due?g.due.slice(2).replace(/-/g,'.'):'')+'</span> ▾</span></div>'
     +(open?('<div class="ctxbody">'
        +'<div class="ctxstat">'+parseInt(ym.slice(5),10)+'월 투입 <b>'+stat.days+'일</b> · 루틴 '+stat.done+'/'+stat.due
        +' ('+Math.round(stat.rate*100)+'%) · '+rwChip('goal',g.id,'달성')+'</div>'
        +(g.memo?'<div class="mut" style="font-size:11px;margin-top:4px;white-space:pre-wrap">'+sajuEsc(g.memo)+'</div>':'')
        +'<div class="msbox"><div class="mshd">월간 세부목표 <span class="mut">'+mlist.length+'</span>'
          +'<button class="ghost sm" data-msadd="'+g.id+'">+ 세부목표</button></div>'
        +(mlist.length?mlist.map(function(m){
            var isNow=(m.period===ym);
            var val=(m.metric&&m.metric.type!=='binary')?(gnum(m.metric.target)+(m.metric.unit||'')):'';
            return '<div class="msrow'+(isNow?' now':'')+(m.status==='done'?' done':'')+'">'
              +'<span><b class="gcode">'+m.code+'</b> '+sajuEsc(m.title)+(isNow?' <span class="chip auto">이달</span>':'')+'</span>'
              +'<span class="msr">'+(val?val+' · ':'')+(m.manual?'<span class="chip check">수동</span> ':'')
              +'<span class="acts"><span data-gdone="'+m.id+'">'+(m.status==='done'?'↩':'✔')+'</span><span data-gedit="'+m.id+'">✎</span></span></span></div>';
          }).join(''):'<div class="mut" style="font-size:11px;padding:4px 0">연간 목표를 달로 쪼개면 실행이 붙는다.</div>')
        +'</div>'
        +'<div style="margin-top:8px"><button class="ghost" data-gedit="'+g.id+'">목표 수정</button></div></div>'):'')
     +'</div>';
  }).join('');

  var ws=yearWeekStats(yy), mw=yearMonthWins(yy);
  var yearPane='<div class="ctxwrap"><div class="ctxtop">'
   +'<span class="ctxtitle">⚑ '+yy+'년 연간 목표</span>'
   +'<span class="ctxacts">'+rwChip('year',yy,'연간')+'<button class="ghost sm" id="addYGoalBtn">+ 목표</button></span></div>'
   +(ctx||'<div class="mut" style="font-size:12px;padding:6px 2px">올해 목표가 없다. 여기서부터 시작해라.</div>')
   +'<div class="wtwrap"><div class="wthd" id="wtToggle" style="cursor:pointer"><span class="wtt">📊 주간 성공 '+(DB.ui.wtOpen?'▴':'▾')+'</span>'
   +'<span class="mut"><b>'+ws.win+'</b>/'+ws.elapsed+'주 · 월 <b>'+mw+'</b>/'+cfg.yearMonths+' · 최장 <b>'+ws.best+'</b>주'
   +' <span class="mut" style="opacity:.7">(칸 1개=1주, 완전달성 '+cfg.weekFullDays+'일↑)</span></span></div>'
   +(DB.ui.wtOpen?('<div class="wtrack">'+weekTracker(yy)+'</div>'):'')+(function(){
      var rs=rewardSpend(yy); if(!rs.total)return '';
      var fin=(DB.goals||[]).filter(function(g){return g.kind==='year'&&g.period===yy&&g.source==='cash'&&g.metric&&g.metric.target;})[0];
      var ratio=fin?(' · <b>'+((rs.total/fin.metric.target)*100).toFixed(1)+'%</b> <span class="mut">of '+fin.code+' '+sajuEsc(fin.title)+'</span>'):'';
      return '<div class="rwspend">🎁 올해 보상 지출 <b>'+won(rs.total)+'</b> <span class="mut">'+rs.count+'건</span>'+ratio+'</div>';
   })()+'</div></div>';

  var msThis=(DB.goals||[]).filter(function(g){return g.kind==='milestone'&&g.period===ym;});
  var soloThis=soloGoals(ym);
  var all=msThis.concat(soloThis);
  var monthPane='<div class="sec pane"><h4><span class="mnav2"><span data-mmv="-1">◀</span>'
   +'<b>'+parseInt(ym.slice(0,4),10)+'년 '+parseInt(ym.slice(5),10)+'월 과제</b>'
   +'<span data-mmv="1">▶</span><span id="goalMonthPick" title="월 선택">📅</span></span>'
   +'<span class="hacts"><button class="btn sm" id="addSoloBtn">+ 과제</button></span></h4>'
   +'<div class="mut" style="font-size:10.5px;margin:-2px 0 6px">눈금 '+msThis.length+' · 단발 '+soloThis.length+'</div>'
   +(all.length?all.map(function(g){return goalRow(g,true);}).join('')
     :'<div class="mut" style="padding:5px 0;font-size:11.5px">이 달 과제가 없다.</div>')
   +'</div>';

  document.getElementById('v-goal').innerHTML=yearPane+monthPane+routineMatrix();
}

/* ── 루틴 설계 — 요일 매트릭스 ──
   ⚠️ 요일별 루틴은 v5.0부터 데이터에 있었다(freq:'weekly' + days[]). 화면에 안 보였을 뿐이다.
      격자로 펼치면 '월수금만 운동, 주말만 글쓰기' 같은 주간 설계가 한눈에 잡힌다. */
function rtActiveDow(r,dw){ return (r.freq==='daily')?true:((r.days||[]).indexOf(dw)>=0); }
function rtDayToggle(id,dw){
  var r=routineById(id); if(!r)return;
  var days;
  if(r.freq==='daily')days=[0,1,2,3,4,5,6];
  else days=(r.days||[]).slice();
  var i=days.indexOf(dw);
  if(i>=0)days.splice(i,1); else days.push(dw);
  days.sort(function(a,b){return a-b;});
  if(!days.length)return alert('요일을 하나 이상 남겨야 한다. 쉬려면 루틴 수정에서 잠시 쉼/은퇴를 써라.');
  if(days.length===7){r.freq='daily';r.days=[];}
  else{r.freq='weekly';r.days=days;}
  logAct('루틴 요일 변경 · '+r.code+' '+r.title+' ('+(r.freq==='daily'?'매일':r.days.map(function(x){return DOW_KO[x];}).join('')) +')');
  save();renderGoal();
}
function routineMatrix(){
  var rs=(DB.routines||[]).filter(function(r){return r.status!=='retired';})
    .sort(function(a,b){return (a.code||'')<(b.code||'')?-1:1;});
  var head='<tr><th>코드</th><th>루틴</th><th>목표</th>'
    +DOW_KO.map(function(d,i){return '<th class="c dw'+i+'">'+d+'</th>';}).join('')
    +'<th>기간</th><th class="r"></th></tr>';
  var body=rs.length?rs.map(function(r){
    var g=r.goalId?goalById(r.goalId):null;
    var par=(g&&g.kind==='milestone')?goalById(g.parentId):null;
    var span=r.end?('~'+parseInt(r.end.slice(5,7),10)+'/'+parseInt(r.end.slice(8),10))
      :((g&&g.kind==='milestone')?'<b class="warn3">기간없음</b>':'계속');
    return '<tr class="rtmrow'+(r.status==='paused'?' paused':'')+'">'
     +'<td><span class="gcode">'+r.code+'</span></td>'
     +'<td class="bkt" data-rtedit="'+r.id+'">'+sajuEsc(r.title)+(r.status==='paused'?' <span class="chip check">쉼</span>':'')+'</td>'
     +'<td class="mut">'+(g?(par?par.code+'.':'')+g.code:'—')+'</td>'
     +DOW_KO.map(function(d,i){
        return '<td class="c"><span class="dwcell'+(rtActiveDow(r,i)?' on':'')+'" data-rtdow="'+r.id+'|'+i+'" title="'+d+'요일 켜기/끄기"></span></td>';}).join('')
     +'<td class="mut nw">'+span+'</td>'
     +'<td class="r"><span class="acts"><span data-rtedit="'+r.id+'">✎</span></span></td></tr>';
  }).join(''):'<tr><td colspan="12" class="mut" style="padding:14px 6px;text-align:center">루틴이 없다. <b>+ 루틴</b>으로 시작해라.</td></tr>';
  var paused=(DB.routines||[]).filter(function(x){return x.status==='paused';}).length;
  var retired=(DB.routines||[]).filter(function(x){return x.status==='retired';}).length;
  return '<div class="sec pane"><h4><span class="subhd2">⚙ 루틴 설계</span>'
   +'<span class="hacts"><button class="btn sm" id="addRoutineBtn">+ 루틴</button>'
   +'<span class="mut" id="routineListBtn" style="font-size:11px;cursor:pointer">📋 전체'
   +(paused||retired?' <span class="chip check">쉼 '+paused+' · 은퇴 '+retired+'</span>':'')+'</span></span></h4>'
   +'<div class="mut" style="font-size:10.5px;margin:-2px 0 7px">요일 칸을 눌러 켜고 끈다 · 여기서 정한 것이 데일리에 뜬다</div>'
   +'<div class="tblwrap"><table class="btbl rtm"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div>';
}

/* ====== 🎁 보상 탭 (단독 페이지) ====== */
function bkTh(key,label,align){
  var on=(DB.ui.bkSort===key), dir=(DB.ui.bkDir===-1?'▼':'▲');
  return '<th class="'+(align||'')+(on?' on':'')+'" data-bksort="'+key+'">'+label+(on?' '+dir:'')+'</th>';
}
function bucketTable(){
  var rows=bucketSorted().filter(function(x){return (x.place||'bucket')==='bucket';});
  var f=(DB.ui.bkFilter||'want'), st=bucketStats();
  var body=rows.length?rows.map(function(b){
    var d=daysSince(b.addedAt), stale=(b.status==='want'&&d>=90);
    var stx=b.status==='want'?'대기':(b.status==='got'?'받음':'포기');
    return '<tr class="bkrow '+b.status+'">'
     +'<td data-bkedit="'+b.id+'"><span class="gcode">'+b.code+'</span></td>'
     +'<td class="bkt" data-bkedit="'+b.id+'">'+sajuEsc(b.title)
       +(b.status==='dropped'&&b.dropReason?'<span class="mut"> — '+sajuEsc(b.dropReason)+'</span>':'')+'</td>'
     +'<td data-bkedit="'+b.id+'"><span class="kchip '+(b.kind||'spend')+'">'+((REWARD_KINDS.filter(function(x){return x.k===(b.kind||'spend');})[0]||{}).label||'')+'</span></td>'
     +'<td class="r num" data-bkedit="'+b.id+'">'+(b.price?comma(b.price):'—')+'</td>'
     +'<td class="r'+(stale?' stale':' mut')+'" data-bkedit="'+b.id+'">'+(b.status==='want'?d+'일'+(stale?' ⚠':''):stx)+'</td>'
     +'<td class="r">'+(b.status==='want'?'<span class="mvbtn" data-tor="'+b.id+'" title="보상함으로">→</span>':'')+'</td></tr>';
  }).join(''):'<tr><td colspan="6" class="mut" style="padding:14px 6px;text-align:center">'
    +(f==='want'?'담긴 것이 없다. <b>+ 담기</b>로 지금 원하는 걸 적어라.':'해당 항목이 없다.')+'</td></tr>';
  return '<div class="pane"><div class="bkhd"><span class="subhd2">🪣 버킷함 <span class="mut">원하는 것 전부</span></span>'
   +'<button class="btn sm" id="addBucketBtn">+ 담기</button></div>'
   +'<div class="bkfil">'
   +['want|대기 '+st.want,'got|받음 '+st.got,'dropped|포기 '+st.dropped,'all|전체 '+(st.want+st.got+st.dropped)]
      .map(function(x){var p=x.split('|');
        return '<span class="fchip'+(f===p[0]?' on':'')+'" data-bkfil="'+p[0]+'">'+p[1]+'</span>';}).join('')+'</div>'
   +(st.stale?'<div class="mut" style="font-size:10.5px;margin:0 0 6px">⚠ 90일 넘게 담긴 것 '+st.stale+'개 — 아직 원하는지 물어볼 때다</div>':'')
   +'<div class="tblwrap"><table class="btbl"><thead><tr>'
   +bkTh('code','코드')+bkTh('title','내용')+bkTh('kind','분류')+bkTh('price','예상비용','r')
   +bkTh('added','경과','r')+'<th class="r">이동</th>'
   +'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
}
function rewardTable(){
  var rows=rewardAll().slice().sort(function(x,y){
    var o={week:1,month:2,year:3,goal:4};
    return (o[x.tier]||9)-(o[y.tier]||9)||((x.price||0)-(y.price||0));});
  var body=rows.length?rows.map(function(r){
    var tl=(REWARD_TIERS.filter(function(x){return x.k===r.tier;})[0]||{}).label||'';
    var g=r.goalId?goalById(r.goalId):null;
    var used=(r.status==='got');
    return '<tr class="bkrow'+(used?' got':'')+'">'
     +'<td data-bkedit="'+r.id+'"><span class="gcode">'+r.code+'</span></td>'
     +'<td class="bkt" data-bkedit="'+r.id+'">'+sajuEsc(r.title)+(g?'<span class="mut"> ← '+g.code+'</span>':'')
       +(r.timing==='yin'?' <span class="yinbadge">陰</span>':'')+'</td>'
     +'<td data-bkedit="'+r.id+'"><span class="pill">'+tl+'</span></td>'

function renderReward(){
  var t=todayStr(), yy=t.slice(0,4), cfg=rwCfg();
  var tiers=['week','month','year'].map(function(k){
    var st=tierState(k); if(!st)return '';
    var c=cardOf(k,st.period), sx=cardStatus(c);
    var pct=Math.min(100,Math.round(st.cur/st.req*100));
    var tl=(REWARD_TIERS.filter(function(x){return x.k===k;})[0]||{}).label;
    return '<div class="tcard2'+(sx==='used'?' claimed':(st.ok?' earned':''))+'">'
     +'<div class="tchd"><span class="tclv">'+tl+'</span><span class="mut">'+st.label+'</span></div>'
     +'<div class="tcbig">'+st.cur+'<span class="mut"> / '+st.req+' '+st.unit+'</span></div>'
     +'<div class="pbar"><span style="width:'+pct+'%;background:'+(st.ok?'var(--pos)':'var(--gold)')+'"></span></div>'
     +'<div class="tcfoot">'+rwChip(k,st.period,'')+'</div></div>';
  }).join('');

  var grw=(DB.rewards||[]).filter(function(r){return r.tier==='goal'&&r.active!==false;});
  var goalRows=grw.map(function(r){
    var g=goalById(r.goalId); if(!g)return '';
    var c=cardOf('goal',g.id), sx=cardStatus(c);
    return '<div class="grw'+(sx==='used'?' claimed':(g.status==='done'?' earned':''))+'">'
     +'<span><span class="gcode">'+r.code+'</span> '+sajuEsc(r.title)
       +' <span class="mut">← '+g.code+' '+sajuEsc(g.title)+' '+goalPct(g)+'%</span></span>'
     +'<span class="acts">'+rwChip('goal',g.id,'')+' <span data-rwedit="'+r.id+'">✎</span></span></div>';
  }).join('');

  var rs=rewardSpend(yy), logN=usedCards().length;
  var real=bucketRealistic().length;

  document.getElementById('v-reward').innerHTML=''
   +'<div class="sec"><h4>🎁 보상 계단 <span class="mut">일간 완전달성 → 주간 → 월간 → 연간</span>'
   +'<span class="hacts"><span class="mut" id="rwHistBtn2" style="font-size:11px;cursor:pointer">📜 사용 '+logN+'건</span>'
   +'<button class="ghost sm" id="rwCfgBtn2">문턱 조정</button></span></h4>'
   +'<div class="tgrid3">'+tiers+'</div>'
   +(goalRows?'<div class="grwbox">'+goalRows+'</div>':'')
   +'<div class="mut" style="font-size:11px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)">'
   +'문턱 — 주 완전달성 <b>'+cfg.weekFullDays+'일</b> · 월 주성공 <b>'+cfg.monthWeeks+'회</b> · 연 월성공 <b>'+cfg.yearMonths+'회</b>'
   +(rs.total?' · 🎁 올해 보상 지출 <b>'+won(rs.total)+'</b> ('+rs.count+'건)':'')
   +(real>=20?' · <b style="color:var(--warn)">현실적 가격대 대기 '+real+'개 — 문턱이 높은지 검토해라</b>':'')
   +'</div></div>'
   +'<div class="g2col">'+bucketTable()+rewardTable()+'</div>';
}

var MOODS=[['깨달음','#a67c1a'],['다짐','#00695c'],['기쁨','#2e7d32'],['재밌음','#1565c0'],['반성','#c2185b'],['슬픔','#c62828'],['우울함','#6a1b9a'],['쓸쓸함','#616161']];
function moodColor(n){var m=MOODS.filter(function(x){return x[0]===n})[0];return m?m[1]:'#888';}
function nowLocal(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}
function fmtJ(dt){if(!dt)return '';return dt.replace('T',' ');}
function renderJournal(){
  var J=(DB.journal||[]).slice().sort(function(a,b){return (a.date||'')<(b.date||'')?1:-1;});
  var rows=J.map(function(e){
    var tags=(e.moods||[]).map(function(mn){var c=moodColor(mn);return '<span class="jtag" style="background:'+c+'1f;color:'+c+'">'+mn+'</span>';}).join('');
    return '<div class="jentry" data-editjournal="'+e.id+'"><div style="margin-bottom:5px"><div style="font-family:var(--serif);font-weight:700;font-size:14px">'+(e.title||'(무제)')+'</div><div class="mut" style="font-size:10.5px">'+fmtJ(e.date)+(e.place?' · '+e.place:'')+'</div></div>'+(tags?'<div style="margin-bottom:6px">'+tags+'</div>':'')+((e.body||'')?'<div style="font-size:12.5px;color:#41506a;line-height:1.65;white-space:pre-wrap">'+sajuEsc(e.body)+'</div>':'')+'</div>';
  }).join('');
  var grid=rows?'<div class="jgrid">'+rows+'</div>':'<div class="mut" style="padding:10px 0">아직 기록이 없다. 생각·마음·흔들림·기쁨을 그때그때 남겨라.</div>';
  document.getElementById('v-journal').innerHTML='<div class="sec"><h4>📖 일지 <span class="mut">생각·마음·흔들림·기쁨 ('+J.length+') · 카드 클릭 → 수정/삭제</span> <button class="ghost" id="addJournalBtn" style="float:right">+ 기록</button></h4>'+grid+'</div>';
}
function journalModal(id){
  var e=id?(DB.journal||[]).filter(function(x){return x.id===id})[0]:{date:nowLocal(),title:'',moods:[],place:'',body:''};
  var chips=MOODS.map(function(m){var on=(e.moods||[]).indexOf(m[0])>=0;return '<span class="moodchip'+(on?' on':'')+'" data-mood="'+m[0]+'" style="--mc:'+m[1]+'" onclick="this.classList.toggle(\'on\')">'+m[0]+'</span>';}).join('');
  openModal('<div class="mtop"><h3 style="font-family:var(--serif)">'+(id?'일지 수정':'일지 기록')+'</h3><span class="x" onclick="closeModal()">×</span></div>'
   +'<div class="field"><label>한줄 메모</label><input id="j_title" value="'+(e.title||'').replace(/"/g,'&quot;')+'" placeholder="오늘의 한 줄"></div>'
   +'<div style="display:flex;gap:8px"><div class="field" style="flex:1"><label>날짜·시간</label><input id="j_date" type="datetime-local" value="'+(e.date||nowLocal())+'"></div><div class="field" style="flex:1"><label>장소</label><input id="j_place" value="'+(e.place||'').replace(/"/g,'&quot;')+'" placeholder="선택"></div></div>'
   +'<div class="field"><label>감정 <span class="mut">(복수 선택)</span></label><div id="j_moods">'+chips+'</div></div>'
   +'<div class="field"><label>텍스트</label><textarea id="j_body" rows="15" style="min-height:280px;line-height:1.7" placeholder="마음 가는 대로…">'+(e.body||'')+'</textarea></div>'
   +'<button class="btn" onclick="saveJournal('+(id?"'"+id+"'":'null')+')">저장</button>'+(id?' <button class="ghost" onclick="delJournal(\''+id+'\')">삭제</button>':''));
}
function saveJournal(id){
  var title=document.getElementById('j_title').value.trim(),body=document.getElementById('j_body').value;
  if(!title&&!body.trim())return alert('한줄 메모나 텍스트를 입력하세요');
  var moods=[];var ch=document.querySelectorAll('#j_moods .moodchip.on');for(var i=0;i<ch.length;i++)moods.push(ch[i].dataset.mood);
  var rec={date:document.getElementById('j_date').value||nowLocal(),title:title,moods:moods,place:document.getElementById('j_place').value.trim(),body:body};
  DB.journal=DB.journal||[];
  if(id){Object.assign(DB.journal.filter(function(x){return x.id===id})[0],rec);}else{rec.id=uid();DB.journal.push(rec);}
  logAct((id?'일지수정':'일지기록')+' · '+(title||'(무제)'));save();closeModal();renderJournal();
}
function delJournal(id){if(!confirm('이 기록을 삭제할까요?'))return;DB.journal=DB.journal.filter(function(e){return e.id!==id});save();closeModal();renderJournal();}

  {v:'10.0',date:'2026-08-20',note:"실행 카테고리 3분할 (로한 설계) — \ud83d\udcc5 데일리 / \ud83c\udfaf 목표·루틴 / \ud83c\udf81 보상. \u26a0\ufe0f '상단이 길다 → 과제가 캘린더 밑이라 안 보인다 → 게이지가 길 필요 있냐' 세 지적이 전부 같은 뿌리였다: 사용 빈도가 다른 것(설계=월 1~2회 / 체크=매일)을 한 페이지에 넣은 것. 레이아웃으로 풀 문제가 아니라 정보구조로 풀 문제였다 · 데일리 = 큰 월 캘린더 + 그날 체크, 첫 화면으로 승격 · 연계성이 끊기면 그냥 할 일 목록이 되므로 상단에 연간 목표 진행률 칩(누르면 그 목표로 점프) + 체크리스트는 목표별 그룹 유지 · 목표·루틴 = 설계 전용(연간 목표 · 월간 과제 · 루틴 요일 매트릭스) · \u2699 요일 매트릭스 신설: 요일별 루틴은 v5.0부터 데이터에 있었지만(freq/days) 화면에 없었다. 격자로 펼쳐 칸을 누르면 즉시 토글 — '월수금만 운동, 주말만 글쓰기'가 한눈에 잡힌다 · VIEW_RENDER 에 daily 등록(v5.0 dash 누락 회귀 재발 방지)"},
  {v:'9.0',date:'2026-08-20',note:"모바일 전면 정리 (로한: '누가 봐도 UI가 비틀려 있다') — \u26a0\ufe0f 메뉴: .side 를 flex-wrap 으로 펼쳐 14개 탭이 4줄, 화면 상단 절반을 먹었다. 한 줄 가로 스크롤 탭바로 바꾸고 sticky 고정, 탭 전환 시 활성 칩이 가운데로 자동 스크롤 · 로고: 크레스트+줄바꿈+텍스트 2줄에 큰 여백까지 쓰던 걸 한 줄로(34→22px, PC도 함께). 모바일에선 크레스트만 남긴다 · 가계부: .mhead 가 flex-wrap + statbar{flex:1;justify-content:flex-end} 라 좁은 폭에서 통계 6개가 세로로 쌓이고 월 네비가 홀로 남았다 → 헤더 세로 2단 + 통계 3열 그리드, 캘린더 칸 112→72px, 한 칸 거래 줄 10→3개 · 프레임 통일: .sec 15px / .pane 14px 제각각이던 패딩을 14px·radius 12px 로 맞추고 모바일은 12px·11px · 모바일 브레이크포인트를 640 → 900px 로 올려 태블릿 세로도 포함"},
  {v:'8.5',date:'2026-08-19',note:"[UI/UX 감사] 목표·루틴 / 보상 페이지. 로한 지적: '저 보상들이 결국 버튼인데 버튼으로 안 보인다 · 마우스 오버 반응이라도 있든가 · 버튼은 최대한 상단에, 내용과 구분될 것' — 전부 맞다. ⚠️ 근본 원인: .rwpick 의 base CSS 규칙이 통째로 없었다(.rwpick.sm / .rwpick .rwpt / .rwpick.offday 만 존재). 클릭 가능한 목록 전체가 '그냥 글줄'로 렌더됐다. v7.1 .tcard 삭제 사고와 같은 계열 — 클래스 사용 목록 vs CSS base 규칙 대조 스크립트로 잡았다 · 복원 + hover/active 반응 + 우측에 '선택' 배지(hover 시 '선택 →')로 클릭 대상임을 명시 · 모달 헤더 sticky — max-height 90vh + overflow auto 인데 헤더가 같이 밀려 긴 목록에서 제목과 ×를 잃었다 · 목록형 모달의 액션 버튼을 상단 .mact 바로 이동하고 점선으로 내용과 구분(폼 모달의 저장은 입력 흐름의 끝이므로 하단 유지) · 아이콘 액션(✔✎💬) 히트 영역 11px → 26px, 이동 버튼 22 → 28px · 전역 :focus-visible 포커스 링 신설(없었다) · 월간 과제·세부목표 행 hover 반응 · 표의 이동 열 헤더를 '이동'으로 명시 · 용어 통일 '수령' → '사용'"},
  {v:'8.4',date:'2026-08-19',note:"연간·월간 행 압축 (로한 지적: '게이지가 저렇게 길 필요 있냐 · 가운데가 비어 있다') — 전폭 게이지를 따로 한 줄 쓰면 목표 5개가 10줄이 되고 제목과 수치 사이가 텅 빈다. 게이지를 그 빈 공간으로 옮겨 flex로 늘렸다: 제목 → 게이지 → 수치/% → 기한이 한 줄. 연간 10줄→5줄, 월간 과제 3개 9줄→3줄 · 월간 과제를 캘린더 위로 (캘린더가 커지면서 아래로 밀려 시인성이 떨어졌다 — 로한 지적) · 100% 도달한 항목은 % 색을 초록으로"},
  {v:'8.3',date:'2026-08-19',note:"목표 탭 레이아웃 재구성 (로한 제안) — 캘린더를 주인공으로. \u26a0\ufe0f 병목은 '캘린더가 작다'가 아니라 '상단이 길다'였다: 연간 5줄 + 펼친 상세 + 52주 트래커 전폭이 화면 절반을 먹어 매일 하는 체크가 아래로 밀렸다. 52주 트래커를 접을 수 있게 하고 캘린더를 키웠다 · 칸을 최대한 활용: 날짜(달성도 배경)·비율·못한 루틴 이름·미달 사유 태그·陰·🎁 를 한 칸에 · 행 끝에 '주' 칸 신설 — 캘린더 한 행이 곧 한 주라 주간 계단이 캘린더 안에서 완결된다(완전달성 4일 → 그 행에 ✓ → 4개면 월간 열림) · 캘린더를 과제 위로 올리고 좌우 비율 1.45:1 · 좁은 화면에서는 이번 주 7칸만 보여주고 '월 전체'로 펼친다(7열에 내용을 넣으면 모바일에서 칸이 40px대가 된다)"},
  {v:'8.2',date:'2026-08-19',note:"[버그] 감소형 목표가 0/65kg 100%로 뜨던 문제 — 미입력 판정이 ''·null만 걸러 숫자 0을 놓쳤다(마이그레이션이 progress:0을 넣음). (0-68.2)/(65-68.2)=2131%→100% 클램프. 목표값이 0인 경우(부채 0원)는 진짜 달성일 수 있어 제외하고 0을 미입력으로 본다 · [신설] 루틴 기간(계속/이 달만/직접 지정) — v8.1까지 종료일 자체가 없어서 8월 눈금에 묶인 루틴이 9월에도 계속 떴다. 코드는 B.8a인데 12월까지 뜨면 기록이 거짓말을 한다. 마일스톤에 붙은 루틴은 기본이 '이 달만', 계속으로 잡으면 경고 · 루틴 행에 종료일 표시, 기간 없는 한시 루틴은 '기간없음' 경고 · 목표 선택에 '계속할 루틴은 연간 목표에 직접 붙여라' 안내 · 수치형 연간 목표인데 연동이 안 걸려 있으면 '수동' 칩으로 알림(체중 79건이 있는데 목표가 안 읽고 있었다) · 단위에 kg/원을 적으면 연동 소스 자동 제안"},
  {v:'8.1',date:'2026-08-19',note:"카드 배치 후보 정리 (로한 지적) — ① 목표 달성 카드에서 아무것도 못 고르던 문제: 후보를 그 단계에 등록된 보상으로만 걸렀는데 목표 tier 등록분이 0개라 빈 목록이 떴다. v8부터 단계는 카드가 들고 있으므로 보상함의 tier 는 '기본 제안'일 뿐 — 다른 단계 보상도 고를 수 있게 열었다(해당 단계 먼저, 그 아래 나머지, 예상비용 오름차순) · ② 배치 모달에서 버킷 제거: 버킷은 목표와 보상이 공존하는 원장이고 '목표가 대가가 될 순 없다'. 보상으로 쓸 거면 보상 탭에서 → 로 보상함에 올린 뒤 배치한다 — 승격이라는 한 단계가 곧 판단이다 · ③ '연간 계단'과 '목표 달성'이 같은 화면에 있어 헷갈리던 라벨 정리"},
  {v:'8.0',date:'2026-08-19',note:"🎁 보상 카드 모델 — 로한 설계. 보상함=카드의 '종류'(덱) → 목표관리에서 배치(예약) → 계단 달성 시 활성 → 실제로 소비하며 가계부를 쓸 때 카드가 소멸. ⚠️ v7까지는 '수령 확정'이 곧 가계부 거래를 만들어서, 받기로 해놓고 안 쓴 보상이 유령 거래로 남아 가계부가 더러워졌다. 거래는 실제 지출 순간에만 생기고 카드는 거기에 붙는다 · 카드 상태는 저장하지 않고 파생(usedAt/tierOpen) — 문턱을 바꿔도 과거 판정이 안 어긋난다 · 카드는 종류를 스냅샷 — 보상함 원본을 고쳐도 발급된 카드는 불변 · 배치 3경로(보상함에서 고르기/버킷에서 올리며 배치/새로 만들기) · 목표 달성 보상에 목표 id가 안 넘어가던 버그 수정 · 행동 보상은 가계부를 안 타므로 목표 탭에서 직접 사용 확정 · 거래 삭제 시 카드 복원, 사용 취소 시 거래는 남기고 연결만 해제(실제로 쓴 돈이므로) · 캘린더 마커 개편: 의미 없는 점 2개 → ✅ 루틴 완전달성 💳 카드 미결제 🎁 보상 사용, 부분달성은 날짜 배경으로(아이콘 남발 방지), 셀 높이 96→112"},
  {v:'7.6',date:'2026-08-19',note:"모달 오작동 2건 수정 — ① 입력이 있는 모달(작성 중)은 바깥 클릭으로 닫히지 않는다: 스치듯 눌러 쓰던 내용이 통째로 날아가던 문제. 판정을 모달 안의 input/textarea/select 유무로 하므로 앞으로 추가되는 폼에도 자동 적용된다(ESC·×는 그대로 닫힘) · ② 보상함에 추가·수정·삭제해도 표가 새로고침 전까지 안 바뀌던 문제: saveReward/delReward/saveRwCfg가 renderGoal()만 불렀다. 보상 데이터는 목표 탭(칩)과 보상 탭(표) 양쪽에 나오므로 renderRW()로 두 곳을 함께 갱신 · ③ toRewardModal이 modal._mvid를 안 세워 행동 보상의 '권장일(음기일)' 선택이 한 번도 안 뜨던 버그 수정"},
  {v:'7.5',date:'2026-08-19',note:"[치명] 마이그레이션이 통째로 스킵되던 구조 결함 — migrateV6() 상단 schemaVersion>=6 게이트에 막혀 v7.0~v7.4의 보정이 한 번도 실행되지 않았다. 버킷 7건이 d.bucket에 남고 화면은 빈 채로 떴다(데이터 손실은 없음) · 마이그레이션을 2층으로 분리: (A) 게이트 안 = 1회성 파괴적 전환, (B) 게이트 밖 = 매 로드 멱등 정규화. 새 필드·새 배열 통합은 반드시 (B)에 · schemaVersion 6→7 · 실제 DB 스냅샷으로 K1~K7 복원·멱등성 검증"},
  {v:'7.4',date:'2026-08-19',note:'버킷함 ⇄ 보상함 연계 — \'고정 메뉴\'를 \'보상함\'으로 개명하고 2열 배치(좌 버킷·우 보상함). → 로 승격, ← 로 되돌리기. 승격 시 단계(주/월/연/목표) 지정 · **보상함에 있는 것만** 계단 수령 선택지에 뜬다(버킷엔 \'스페인 1년 살기\' 같은 게 있어 그대로 두면 수령 모달이 무의미) · bucket 배열을 rewards로 흡수하고 place 필드로 구분 — 이동해도 코드·기록일 유지'},
  {v:'7.3',date:'2026-08-19',note:'🪣 버킷함 + 🎁 보상 탭 신설 — 원하는 것을 미리 담아두고 보상 수령 시 고른다(충동 지출→조건부 허용) · 버킷은 계단(tier)에 묶이지 않는다: \'서울에 집 사기\'처럼 평생 못 받을 수도 있는 것이 같이 사는 욕망의 원장 · 티어는 담을 때가 아니라 고를 때 정해진다(수령 모달에서 예상비용 오름차순) · 정렬 가능한 표 UI + 상태 필터(대기/받음/포기) · 90일 경과 표시 · 포기 사유 기록 · 보상 관리를 목표 탭에서 분리'},
  {v:'7.2',date:'2026-08-19',note:'파트 연계 1차 — 보상 2분류(소비/행동) + 예산(budget) 축 도입, 새 지출이 있으면 가계부 연계 발동 · 소비 보상 수령 시 실제 지출 입력→가계부 거래 자동 생성(rewardId↔txnId 양방향), 상한 초과는 경고만 · 수령 취소 시 연결 거래도 함께 삭제 · 보상 지출이 재정 목표에서 차지하는 비율 표시(의도된 긴장) · 명리 음기일(3점: 음간·음지+水金, 주 1.4회) 캘린더 마커 + 행동 보상 권장일 · 옛 cap→budget 자동 마이그레이션'},
  {v:'7.1',date:'2026-08-19',note:'[UI원칙] 좌=큰범위·우=조작 으로 좌우 교체 — 왼쪽 8월(과제+현황 캘린더) / 오른쪽 그날 루틴 체크. 모바일에서 연간→월간→일간 순으로 쌓인다 · 별도 보상 프레임 제거하고 각 층에 칩으로 분산(연간 보상→연간 헤더, 월간→8월 헤더, 주간→일간 헤더, 목표달성→목표 펼침) · 칩에 진행률과 남은 수치를 표시하고 누르면 조건·등록 목록이 열려 왜 안 열리는지 바로 보인다 · 52주 트래커를 연간 프레임에 통합 · 8월 체크→8월 현황'},
  {v:'7.0',date:'2026-08-18',note:'🎁 보상 계단 신설 — 일간 완전달성 → 주간(4일) → 월간(주성공 4회) → 연간(월성공 9회). 아래 단계의 성공이 위 단계를 여는 누적 구조 · 티어별 보상 메뉴에서 하나 선택 수령(기간당 1회) · 목표 달성 보상 별도 트랙 · 12주 잔디를 52주 주간 트래커로 교체(캘린더와 중복 제거, 보상 진행률이 그대로 보임) · 문턱 조정 가능 · 화면 순서 연간→월간→일간→보상'},

     ⚠️ v8.1까지 종료일 자체가 없어서, 8월 눈금에 묶인 루틴이 9월에도 계속 떴다.
        코드는 B.8a(8월)인데 12월까지 뜨면 기록이 거짓말을 한다. */
  var _pg=r.goalId?goalById(r.goalId):null;
  var _msYM=(_pg&&_pg.kind==='milestone')?_pg.period:null;
  var _defEnd=lastDayOfYM(_msYM||(r.start||todayStr()).slice(0,7));
  var _span=r.end?((r.end===lastDayOfYM(r.end.slice(0,7)))?'month':'date'):'on';
  openModal('<div class="mtop"><h3>'+(id?('루틴 수정 <span class="gcode">'+r.code+'</span>'):'루틴 추가')+'</h3><span class="x" onclick="closeModal()">×</span></div>'
   +(id&&nChk?'<div class="mut" style="font-size:11px;margin-bottom:8px">체크 기록 '+nChk+'일 — 삭제해도 이 기록은 남는다</div>':'')
   +'<div class="field"><label>루틴 이름</label><input id="rt_title" value="'+sajuEsc(r.title)+'" placeholder="예: 아침 스트레칭 10분"></div>'
   +'<div class="field"><label>어느 목표를 위한 것인가 <span class="mut">(코드가 여기서 정해진다)</span></label>'
   +'<div class="hint" style="margin:0 0 5px">계속할 루틴은 <b>연간 목표</b>에 직접 붙여라 — 월이 바뀌어도 안 끊긴다. 눈금(한시)은 그 달에만 하는 것에 쓴다.</div><select id="rt_goal" onchange="rtSpanHint()">'+goalOptions(r.goalId)+'</select></div>'
   +'<div class="field"><label>빈도</label><div class="seg"><button class="'+(r.freq==='daily'?'on':'')+'" onclick="rtFreq(this,\'daily\')">매일</button><button class="'+(r.freq==='weekly'?'on':'')+'" onclick="rtFreq(this,\'weekly\')">요일 지정</button></div></div>'
   +'<div class="field" id="rt_dayswrap" style="display:'+(r.freq==='weekly'?'block':'none')+'"><label>요일</label><div id="rt_days">'+chips+'</div></div>'
   +'<div class="field"><label>시작일 <span class="mut">(이 날짜부터 집계 — 과거는 건드리지 않는다)</span></label><input id="rt_start" type="date" value="'+(r.start||todayStr())+'"></div>'
   +'<div class="field"><label>기간</label><div class="seg">'
     +'<button class="'+(_span==='on'?'on':'')+'" onclick="rtSpan(this,\'on\')">계속</button>'
     +'<button class="'+(_span==='month'?'on':'')+'" onclick="rtSpan(this,\'month\')">이 달만</button>'
     +'<button class="'+(_span==='date'?'on':'')+'" onclick="rtSpan(this,\'date\')">직접 지정</button>'
     +'</div><div class="hint" id="rt_spanhint"></div></div>'
   +'<div class="field" id="rt_endwrap" style="display:'+(_span==='on'?'none':'block')+'"><label>종료일 <span class="mut">(이 날까지만 뜬다 · 기록은 남는다)</span></label>'
     +'<input id="rt_end" type="date" value="'+(r.end||_defEnd)+'"></div>'
   +'<button class="btn" onclick="saveRoutine('+(id?"'"+id+"'":'null')+')">저장</button>'
   +(id?(' <button class="ghost" onclick="retireRoutine(\''+id+'\')">'+(r.status==='retired'?'복귀':'은퇴')+'</button>'
        +' <button class="ghost" onclick="pauseRoutine(\''+id+'\')">'+(r.status==='paused'?'재개':'잠시 쉼')+'</button>'
        +(nChk?'':' <button class="ghost" style="color:var(--neg)" onclick="delRoutine(\''+id+'\')">삭제</button>')):''));
  modal._rfreq=r.freq; modal._rspan=_span;
  rtSpanHint();
}
function rtSpan(b,v){
  modal._rspan=v;
  var bs=b.parentNode.querySelectorAll('button');
  for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');
  b.classList.add('on');
  document.getElementById('rt_endwrap').style.display=(v==='on')?'none':'block';
  if(v==='month'){
    var g=document.getElementById('rt_goal').value;
    var pg=g?goalById(g):null;
    var ym=(pg&&pg.kind==='milestone')?pg.period:(document.getElementById('rt_start').value||todayStr()).slice(0,7);
    document.getElementById('rt_end').value=lastDayOfYM(ym);
  }
  rtSpanHint();
}
function rtSpanHint(){
  var h=document.getElementById('rt_spanhint'); if(!h)return;
  var g=document.getElementById('rt_goal'), pg=(g&&g.value)?goalById(g.value):null;
  var isMs=!!(pg&&pg.kind==='milestone');
  var v=modal._rspan;
  if(v==='on'){
    h.innerHTML=isMs
      ? '<b style="color:var(--warn)">이 루틴은 '+(pg.code||'')+' (그 달 눈금)에 묶여 있는데 계속으로 잡혀 있다.</b> 코드가 그 달을 가리키므로, 계속할 거면 <b>연간 목표에 직접</b> 붙이는 게 맞다.'
      : '월이 바뀌어도 안 끊긴다. 루틴의 기본값은 이쪽이다.';
  }
  else if(v==='month')h.textContent='그 달 말일에 자동 종료된다. 그 달에만 하는 것에 쓴다.';
  else h.textContent='종료일까지만 뜬다. 지난 기록은 그대로 남는다.';
}
function rtFreq(b,v){modal._rfreq=v;var bs=b.parentNode.querySelectorAll('button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');b.classList.add('on');document.getElementById('rt_dayswrap').style.display=(v==='weekly'?'block':'none');}
function saveRoutine(id){
  var title=document.getElementById('rt_title').value.trim();
  if(!title)return alert('루틴 이름을 입력하세요');
  var days=[],ch=document.querySelectorAll('#rt_days .dchip.on');
  for(var i=0;i<ch.length;i++)days.push(parseInt(ch[i].dataset.dow,10));
  if(modal._rfreq==='weekly'&&!days.length)return alert('요일을 하나 이상 선택하세요');
  var gid=document.getElementById('rt_goal').value||null;
  var _endEl=document.getElementById('rt_end');
  var _end=(modal._rspan==='on')?'':((_endEl&&_endEl.value)||'');
  var rec={title:title,freq:modal._rfreq,days:days,goalId:gid,
    start:document.getElementById('rt_start').value||todayStr(), end:_end};
  if(_end&&_end<rec.start)return alert('종료일이 시작일보다 빠릅니다');
  DB.routines=DB.routines||[];
  if(id){
    var r=routineById(id),old=r.goalId;
    Object.assign(r,rec);
    if(old!==gid&&!r.lockCode)r.code=issueRoutineCode(gid);   // 소속이 바뀌면 코드 재발급
    logAct('루틴수정 · '+r.code+' '+title);
  }else{
    rec.id=uid();rec.code=issueRoutineCode(gid);rec.status='active';rec.order=DB.routines.length+1;
    DB.routines.push(rec);logAct('루틴추가 · '+rec.code+' '+title);
  }
  save();closeModal();renderDG();
}
function retireRoutine(id){
  var r=routineById(id);if(!r)return;
  if(r.status==='retired'){r.status='active';r.end='';logAct('루틴복귀 · '+r.code);}
  else{
    if(!confirm(r.code+' 을(를) 은퇴시킬까요?\n오늘까지의 기록은 그대로 남고, 내일부터 집계에서 빠집니다.'))return;
    r.status='retired';r.end=todayStr();logAct('루틴은퇴 · '+r.code+' '+r.title);
  }
  save();closeModal();renderDG();
}
function pauseRoutine(id){
  var r=routineById(id);if(!r)return;
  r.status=(r.status==='paused')?'active':'paused';
  logAct('루틴'+(r.status==='paused'?'쉼':'재개')+' · '+r.code);
  save();closeModal();renderDG();
}
function delRoutine(id){
  var r=routineById(id);if(!r)return;
  var n=0;for(var k in (DB.checks||{})){if((DB.checks[k].done||[]).indexOf(r.code)>=0)n++;}
  if(n)return alert('체크 기록이 '+n+'일 있습니다. 삭제 대신 은퇴를 쓰세요.');
  if(!confirm('기록이 없는 루틴입니다. 완전히 삭제할까요?'))return;
  DB.routines=DB.routines.filter(function(x){return x.id!==id;});
  logAct('루틴삭제 · '+r.code+' '+r.title);save();closeModal();renderDG();
}
function routineList(){
  var rs=(DB.routines||[]).slice().sort(function(a,b){return (a.code||'')<(b.code||'')?-1:1;});
  openModal('<div class="mtop"><h3>전체 루틴 <span class="mut" style="font-size:12px">'+rs.length+'개</span></h3><span class="x" onclick="closeModal()">×</span></div>'
   +(rs.length?rs.map(function(r){
     var fq=r.freq==='weekly'?((r.days||[]).map(function(i){return DOW_KO[i];}).join('')):'매일';
     var g=r.goalId?goalById(r.goalId):null;
     var badge=r.status==='retired'?'<span class="pill">은퇴</span>':(r.status==='paused'?'<span class="pill">쉼</span>':'');

     return '<div class="row"><span>'+badge+'<span class="gcode">'+r.code+'</span> '+sajuEsc(r.title)
      +' <span class="mut">· '+fq+(g?' · '+g.code:'')+' · '+n+'일</span></span>'
      +'<span class="acts"><span data-rtedit="'+r.id+'">수정</span></span></div>';
   }).join(''):'<div class="mut">등록된 루틴이 없습니다.</div>')
   +'<div style="margin-top:12px"><button class="btn sm" id="addRoutineBtn">+ 루틴</button></div>');

  var parent=g?goalById(g.parentId):(parentId?goalById(parentId):null);

       period:(kd==='year'?today.slice(0,4):(period||today.slice(0,7))),

       +'수치형이면 목표값을 고치는 순간 자동 배분에서 제외됩니다(수동 고정).</div>':'')
   +'<div class="field"><label>'+(isMs?'세부목표 제목':'제목')+'</label><input id="g_title" value="'+sajuEsc(g.title)+'" placeholder="'
     +(isY?'올해 어디로 갈 것인가':(isMs?'예: 히라가나·가타카나 완성 / 67.6kg 도달':'이 달 안에 끝낼 것'))+'"></div>'
   +(isY?'':'<div class="field"><label>기간 (YYYY-MM)</label><input id="g_period" value="'+g.period+'"></div>')
   +(isY?'<div class="field"><label>기간 (YYYY)</label><input id="g_period" value="'+g.period+'"></div>'
        +'<div class="field"><label>기한 (due) <span class="mut">— 여기서 월별 눈금이 자동 생성된다</span></label><input id="g_due" type="date" value="'+(g.due||'')+'"></div>':'')
   +'<div class="field"><label>측정 방식</label><div class="seg">'+seg('binary','완료/미완')+seg('autodays','체크일수·자동')+seg('count','횟수')+seg('amount','수치')+'</div><div class="hint" id="g_methint"></div></div>'
   +'<div id="g_mwrap" style="display:'+(mt==='binary'?'none':'block')+'">'

   +'<div class="field"><label>목표값</label><input id="g_target" value="'+((g.metric&&g.metric.target)||'')+'"></div>'

function gSrc(){
  var sel=document.getElementById('g_src'); if(!sel)return;
  var v=sel.value, hi=document.getElementById('g_srchint'), pw=document.getElementById('g_pwrap');
  var found=GOAL_SOURCES.filter(function(x){return x.k===v;})[0]||{};
  if(pw)pw.style.display=(v!=='manual'||modal._gmet==='autodays')?'none':'block';
  if(hi){
    if(v==='manual')hi.textContent='현재값을 직접 입력합니다.';
    else{
      var cur=sourceValue(v);
      hi.textContent=(cur!=null)?('지금 값 '+gnum(cur)+(found.unit||'')+' — 앱 기록이 바뀌면 진행률이 자동으로 따라갑니다.')
                                :'아직 해당 데이터가 없습니다.';
    }
  }
  var u=document.getElementById('g_unit');
  if(u&&!u.value&&found.unit)u.value=found.unit;
}
/* 단위만 적어도 연동을 제안한다. 이미 고른 게 있으면 건드리지 않는다. */
function gUnitSuggest(){
  var sel=document.getElementById('g_src'); if(!sel||sel.value!=='manual')return;
  var u=(document.getElementById('g_unit').value||'').trim();
  var want=/kg/i.test(u)?'weight':(/원|만원/.test(u)?'cash':null);
  if(!want)return;
  for(var i=0;i<sel.options.length;i++)if(sel.options[i].value===want){sel.selectedIndex=i;gSrc();return;}
}
function gMet(b,v){
  modal._gmet=v;var bs=b.parentNode.querySelectorAll('button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');b.classList.add('on');
  document.getElementById('g_mwrap').style.display=(v==='binary'?'none':'block');
  var pw=document.getElementById('g_pwrap');
  var sc=document.getElementById('g_src');
  if(pw)pw.style.display=(v==='autodays'||(sc&&sc.value!=='manual'))?'none':'block';
  var hi=document.getElementById('g_methint');
  if(hi)hi.textContent=(v==='autodays'?'루틴을 하나라도 체크한 날의 수를 자동으로 셉니다.':(v==='amount'?'체중·금액처럼 시작값에서 목표값으로 가는 수치. 월별 눈금이 선형 배분됩니다.':''));
  var u=document.getElementById('g_unit');if(v==='autodays'&&u&&!u.value)u.value='일';
}
function saveGoal(id,kd,parentId){
  var title=document.getElementById('g_title').value.trim();
  if(!title)return alert('제목을 입력하세요');
  var g=id?goalById(id):null;
  var mt=modal._gmet;
  var rec={title:title,memo:document.getElementById('g_memo').value};
  var per=document.getElementById('g_period').value.trim();
  var re=(kd==='year')?/^\d{4}$/:/^\d{4}-\d{2}$/;
  if(!re.test(per))return alert(kd==='year'?'기간은 YYYY (예: 2026)':'기간은 YYYY-MM (예: 2026-08)');
  rec.period=per;
  rec.metric={type:mt,
    target:mt==='binary'?0:numv('g_target'),
    unit:mt==='binary'?'':document.getElementById('g_unit').value.trim()};
  var pEl=document.getElementById('g_progress');
  rec.progress=(mt==='binary'||mt==='autodays')?0:((pEl&&pEl.value!=='')?numv('g_progress'):'');
  if(kd==='year'){
    rec.due=document.getElementById('g_due').value||(per+'-12-31');
    var bs=document.getElementById('g_base');
    rec.baseline=(bs&&bs.value!=='')?numv('g_base'):null;
    var sc=document.getElementById('g_src');
    rec.source=sc?sc.value:'manual';
    rec.startYM=(g&&g.startYM)||todayStr().slice(0,7);
  }else{
    rec.due=lastDayOfYM(per);
    if(kd==='milestone')rec.manual=true;   /* 손댄 눈금은 자동 배분에서 제외 */
  }
  DB.goals=DB.goals||[];
  if(id){Object.assign(g,rec);logAct('목표수정 · '+g.code+' '+title);}
  else{
    rec.id=uid(); rec.kind=kd; rec.status='active';
    rec.parentId=(kd==='milestone')?(parentId||modal._gparent||null):null;

/* ==== 은행 실제 상환스케줄 (원금 고정 + 일할이자) ====
   검증: 경기신보 소상공인대환 스케줄 6회차 원 단위 일치 (2026-08-14) */
function bankPayDate(y,m,payDay){var d=new Date(Date.UTC(y,m-1,payDay));var w=d.getUTCDay();if(w===6)d.setUTCDate(payDay+2);else if(w===0)d.setUTCDate(payDay+1);return d;}
function bankSchedule(d){
  var b=d&&d.schedule&&d.schedule.bank; if(!b)return null;
  var rate=(d.rate||0)/100, basis=b.basis||365, n=d.schedule.remain||0;
  var ym=((b.firstYM||d.schedule.start||'')+'').split('-'); if(ym.length<2)return null;
  var y=parseInt(ym[0],10), m=parseInt(ym[1],10);
  var prev=new Date(b.prevDate+'T00:00:00Z'), bal=d.balance, rows=[], ti=0, tp=0;
  for(var i=0;i<n;i++){
    var dt=bankPayDate(y,m,b.payDay||19);
    var days=Math.round((dt-prev)/86400000);
    var p=(i===0&&b.firstPrincipal)?b.firstPrincipal:b.principal;
    if(p>bal)p=bal;
    var it=Math.floor(bal*rate*days/basis);
    bal-=p; ti+=it; tp+=(p+it);
    rows.push({no:i+1,date:dt.toISOString().slice(0,10),days:days,principal:p,interest:it,total:p+it,balance:bal});
    prev=dt; m++; if(m>12){m=1;y++;}
    if(bal<=0)break;
  }
  return {rows:rows,totalInterest:ti,totalPay:tp};
}
function bankNextPay(d){var s=bankSchedule(d); if(!s)return null; var t=todayStr();
  for(var i=0;i<s.rows.length;i++){if(s.rows[i].date>=t)return s.rows[i];} return null;}
function bankYearTotal(d,year){var s=bankSchedule(d); if(!s)return 0; var y=''+year,t=0;
  s.rows.forEach(function(r){if(r.date.slice(0,4)===y)t+=r.total;}); return t;}
function bankSchedTable(d){
  var s=bankSchedule(d); if(!s)return '';
  var b=d.schedule.bank, t=todayStr();
  return '<div class="sec" style="margin-top:14px;padding:11px"><h4>🏦 은행 실제 스케줄 <span class="mut">'+s.rows.length+'회 · 총이자 '+won(s.totalInterest)+' · 총상환 '+won(s.totalPay)+'</span></h4>'

   +'</div><div class="hint">원금 고정 '+comma(b.principal)+'원(1회차 '+comma(b.firstPrincipal||b.principal)+') · 이자 = 잔액 × '+d.rate+'% × 경과일수 / '+(b.basis||365)+' · 납입일 매월 '+(b.payDay||19)+'일(주말이면 익영업일). <b>공휴일은 미반영</b>이라 해당 회차는 하루이틀 차이 날 수 있음.</div></div>';

function computeMonthly(balance,ratePct,n,method){
  var r=(ratePct||0)/100/12; if(!n)return {monthly:0,note:'잔여 횟수를 입력하세요'};
  if(method==='만기일시')return {monthly:Math.round(balance*r),note:'이자만 매월 납부, 원금은 만기 일시상환'};
  if(method==='원리금균등'){var m=r===0?balance/n:balance*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);return {monthly:Math.round(m),note:'매월 동일액(원금+이자 합계 고정)'};}
  var p=balance/n, first=p+balance*r, last=p+(balance/n)*r;
  return {monthly:Math.round(first),note:'원금균등: 첫달 '+won(first)+' → 매월 감소(마지막 '+won(last)+'). 저장값=첫달 기준'};
}

   막혀 한 번도 안 돌았다. 버킷 7건이 d.bucket에 남고 화면은 빈 채로 떴다. */
function migrateV6(d){
  var today=(function(){var x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');})();
  if((d.schemaVersion||0)<6){  /* ===== (A) 1회성 전환 시작 ===== */
  d.meta=d.meta||{}; d.meta.seq=d.meta.seq||{};
  var seq=function(k){d.meta.seq[k]=(d.meta.seq[k]||0)+1;return d.meta.seq[k];};
  var alpha=function(n){var s='';while(n>0){var r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;};
  var lower=function(n){var s='';while(n>0){var r=(n-1)%26;s=String.fromCharCode(97+r)+s;n=Math.floor((n-1)/26);}return s;};
  /* today 는 함수 최상단에서 선언됨 */

  /* 1) 목표: level → kind, 코드 부여 */
  (d.goals||[]).forEach(function(g){
    if(!g.kind)g.kind=(g.level==='year'?'year':'month');
    if(g.parentId===undefined)g.parentId=null;
    if(!g.code){
      if(g.kind==='year')g.code=alpha(seq('year'));
      else{var mk='M'+parseInt((g.period||today).slice(5),10);g.code=mk+'.'+seq(mk);}
    }
    if(!g.due)g.due=(g.kind==='year')?((g.period||today.slice(0,4))+'-12-31')
      :(function(ym){var y=parseInt(ym.slice(0,4),10),m=parseInt(ym.slice(5),10);return ym+'-'+String(new Date(Date.UTC(y,m,0)).getUTCDate()).padStart(2,'0');})(g.period||today.slice(0,7));
    if(g.kind==='year'&&!g.startYM)g.startYM=today.slice(0,7);
    if(g.baseline===undefined)g.baseline=null;
    if(!g.metric)g.metric={type:'binary',target:0,unit:''};
  });

  /* 2) 루틴: status/start/code. start는 첫 체크일(없으면 오늘) — 과거 소급 방지 */
  var firstCheck={};
  Object.keys(d.checks||{}).forEach(function(k){
    var v=d.checks[k]||{};
    var ids=(v.done&&v.done.length!==undefined&&typeof v.done[0]!=='undefined')?null:Object.keys(v);
    (ids||[]).forEach(function(rid){ if(!firstCheck[rid]||k<firstCheck[rid])firstCheck[rid]=k; });
  });
  (d.routines||[]).forEach(function(r){
    if(!r.status)r.status=(r.active===false?'paused':'active');
    if(!r.days)r.days=[];
    if(!r.start)r.start=firstCheck[r.id]||today;
    if(!r.code){
      var g=r.goalId?(d.goals||[]).filter(function(x){return x.id===r.goalId;})[0]:null;
      if(!g)r.code='Z'+seq('Z');
      else if(g.kind==='year')r.code=g.code+seq(g.code);
      else r.code=g.code+lower(seq(g.code));
    }
    delete r.active;
  });

  /* 3) checks: {rid:1} → {done:[code], due:[], miss:{}}
        due는 비워 두고 start/end 기반 폴백에 맡긴다(가짜 100% 방지) */
  var nc={};
  Object.keys(d.checks||{}).forEach(function(k){
    var v=d.checks[k]||{};
    if(v.done&&Object.prototype.toString.call(v.done)==='[object Array]'){
      nc[k]={done:v.done,due:v.due||[],miss:v.miss||{}}; return;
    }
    var done=[];
    Object.keys(v).forEach(function(rid){
      var r=(d.routines||[]).filter(function(x){return x.id===rid;})[0];
      if(r&&r.code)done.push(r.code);
    });
    if(done.length)nc[k]={done:done,due:[],miss:{}};
  });
  d.checks=nc;
  }  /* ===== (A) 1회성 전환 끝 ===== */

  /* ===== (B) 매 로드 멱등 정규화 — 새 필드는 반드시 여기에 ===== */

  if(!d.missTags)d.missTags=MISS_TAGS.slice();
  if(!d.rewards)d.rewards=[];
  /* v8.0 — rewardLog(수령 기록) → rewardCards(카드) 승계.
     v7까지는 '수령'이 곧 가계부 거래였고, v8은 배치 → 활성 → 사용 카드 모델이다. */
  if(!d.timelog)d.timelog={};   /* v11.0 ⏳ 타임로그 */
  if(!d.rewardCards)d.rewardCards={};
  if(d.rewardLog){
    for(var _lk in d.rewardLog){
      if(d.rewardCards[_lk])continue;
      var _lg=d.rewardLog[_lk], _pp=_lk.split('@');
      d.rewardCards[_lk]={key:_lk,tier:_pp[0],period:_pp[1],
        rewardId:_lg.rewardId||_lg.bucketId||null,
        code:_lg.code||'',title:_lg.title||'',kind:_lg.kind||'act',budget:_lg.spent||0,timing:'any',
        placedAt:_lg.claimedAt||today,usedAt:_lg.claimedAt||today,
        txnId:_lg.txnId||null,spent:_lg.spent||0,memo:_lg.memo||''};
    }
    delete d.rewardLog;
  }

  /* v7.4 — bucket 배열을 rewards로 흡수하고 place로 구분 */
  if(d.bucket){
    (d.bucket||[]).forEach(function(b){
      if(!d.rewards.some(function(x){return x.id===b.id;})){b.place='bucket';d.rewards.push(b);}
    });
    delete d.bucket;   /* 빈 배열이어도 지운다 — 남아 있으면 다음 판단이 헷갈린다 */
  }
  (d.rewards||[]).forEach(function(b){
    if(!b.place)b.place=(b.tier?'reward':'bucket');
    if(!b.status)b.status='want';
    if(!b.addedAt)b.addedAt=today;
    if(!b.updatedAt)b.updatedAt=b.addedAt;
    if(b.price===undefined)b.price=b.budget||0;
    if(b.budget===undefined)b.budget=b.price||0;
  });
  if(d.ui&&!d.ui.bkSort){d.ui.bkSort='price';d.ui.bkDir=1;d.ui.bkFilter='want';}
  if(!d.rewardCfg)d.rewardCfg={weekFullDays:4,monthWeeks:4,yearMonths:9};
  (d.rewards||[]).forEach(function(r){
    if(r.budget===undefined)r.budget=r.cap||0;      /* 옛 cap → budget */
    if(!r.kind)r.kind=(r.budget>0?'spend':'act');   /* 예산 있으면 소비로 추정 */
    if(!r.timing)r.timing='any';
    delete r.cap;
  });
  if(d.ui&&d.ui.goalOpen===undefined)d.ui.goalOpen=null;
  if(d.ui&&!d.ui.goalDate)d.ui.goalDate=today;
  if(d.ui&&!d.ui.goalMonth)d.ui.goalMonth=today.slice(0,7);
  d.schemaVersion=7;
  return d;
}

  var method=modal._type==='income'?'이체':document.getElementById('fMethod').value;
  var itemCat=(document.getElementById('fItemCat')||{}).value||'해당없음';
  var cardObj=DB.cards.filter(function(c){return c.name===method;})[0];
  var isCardPay=cardObj&&cardObj.type==='credit'&&modal._type==='expense';
  var acctEl=document.getElementById('fAcct');
  var acct;
  if(modal._type==='income')acct=acctEl?acctEl.value:undefined;
  else if(cardObj)acct=cardObj.type==='check'?cardObj.acct:undefined; // 체크=연결계좌 즉시출금, 신용=선결제시
  else acct=acctEl?acctEl.value:undefined; // 현금·이체
  var rec={type:modal._type,scope:modal._scope,cat:document.getElementById('fCat').value,itemCat:itemCat,method:method,acct:acct,amt:amt,date:date,memo:document.getElementById('fMemo').value,card:isCardPay};
  if(id){Object.assign(DB.transactions.filter(function(x){return x.id===id})[0],rec);}else{rec.id=uid();DB.transactions.push(rec);}
  logAct((id?'거래수정':'거래추가')+' · '+rec.date+' '+rec.cat+' '+(rec.type==='income'?'+':'-')+won(rec.amt));
  /* 🎁 보상 카드 연결 — 거래가 생긴 뒤에 붙인다 */
  var _rwEl=document.getElementById('fRwCard');
  if(_rwEl){
    var _tid=id||rec.id, _nk=_rwEl.value;
    var _txo=DB.transactions.filter(function(x){return x.id===_tid;})[0];
    var _prev=cardByTxn(_tid);
    if(_prev&&_prev.key!==_nk){_prev.usedAt=null;_prev.txnId=null;_prev.spent=0;_prev.memo='';}
    var _tg=_nk?rwCards()[_nk]:null;
    if(_tg){
      _tg.usedAt=rec.date;_tg.txnId=_tid;_tg.spent=rec.amt;_tg.memo=rec.memo||'';
      if(_txo)_txo.rewardKey=_nk;
      logAct('🎁 보상 사용 · '+_tg.code+' '+_tg.title+' · '+won(rec.amt)+' (가계부)');
      if(_tg.budget&&rec.amt>_tg.budget)
        setTimeout(function(){alert('상한 '+comma(rec.amt-_tg.budget)+'원 초과 — 막지는 않는다. 기록이 목적이다.');},60);
    } else if(_txo) delete _txo.rewardKey;
    renderRW();
  }
  var reg=document.getElementById('fAsset')&&document.getElementById('fAsset').checked;
  save();closeModal();renderCal();renderDash();
  if(reg&&rec.type==='expense')itemModal(null,{name:rec.cat,detail:rec.memo||'',cat:(itemCat&&itemCat!=='해당없음')?itemCat:'전자기기',cond:'신품',price:rec.amt,buy:rec.date,end:'',basis:'일간',units:'',status:'사용중'});
}
