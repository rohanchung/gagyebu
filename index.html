<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rohan Book</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--card:#fff;--soft:#f8fafc;--line:#e4e8f0;--ink:#1b2333;--muted:#6b7789;--accent:#2f6df6;--accent-bg:#eaf1ff;--pos:#0f9d58;--neg:#e0483d;--warn:#b26a00;--warn-bg:#fff6e2;--gold:#a67c1a;--serif:'Cinzel','Gowun Batang',serif;}
*{box-sizing:border-box}
html{overflow-y:scroll}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif}
/* login */
.login{position:fixed;inset:0;background:linear-gradient(160deg,#eef2fb,#f6f8fc);display:flex;align-items:center;justify-content:center;z-index:50}
.login .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 26px;width:320px;box-shadow:0 16px 50px rgba(0,0,0,.1);text-align:center}
.login h1{font-size:22px;margin:0 0 4px}.login p{color:var(--muted);font-size:12px;margin:0 0 18px}
.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;text-align:center;letter-spacing:2px}
.login button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.login .err{color:var(--neg);font-size:12px;min-height:16px;margin-top:8px}
.app{display:none;min-height:100vh;max-width:1680px;margin:0 auto}
.app.on{display:flex}
.side{width:176px;background:linear-gradient(180deg,#fbfaf6,#fff);border-right:1px solid #e8e2cf;padding:16px 10px;flex-shrink:0}
.brand{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px;color:var(--gold);padding:6px 8px 14px;border-bottom:2px solid #ece3c9;margin-bottom:8px;text-align:center}
.side .m{display:flex;gap:8px;padding:10px 11px;border-radius:8px;color:#5a5240;font-size:13px;cursor:pointer;margin-bottom:2px;font-weight:600}
.side .m:hover{background:#f6f1e3}
.side .m.on{background:#f3ead2;color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.side .m.dim{opacity:.45;cursor:default}
.side .sub{font-family:var(--serif);color:var(--gold);font-size:10.5px;padding:14px 11px 4px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.sec h4{font-family:var(--serif);letter-spacing:.3px}
.brand-crest{width:34px;height:34px;vertical-align:middle;margin-bottom:4px}
.main{flex:1;padding:18px;min-width:0}
.view{display:none}.view.on{display:block}
.updated{font-size:11px;color:var(--muted);margin-bottom:12px}.updated b{color:var(--pos)}
.cards3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.c3{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px;cursor:pointer}
.c3:hover{border-color:var(--accent)}
.c3 .l{font-size:11px;color:var(--muted)}.c3 .v{font-size:16px;font-weight:800;margin-top:5px}
.c3 .g{font-size:10px;color:var(--muted);margin-top:6px}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}
.sec h4{margin:0 0 8px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.grp{border-top:1px solid var(--line);padding-top:7px;margin-top:7px}.grp:first-of-type{border-top:0;margin-top:2px}
.ghd{display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;font-weight:700}
.chip{font-size:9px;padding:1px 6px;border-radius:4px;margin-left:5px}
.chip.auto{background:#e7f6ee;color:var(--pos)}.chip.manual,.chip.credit{background:#eef2fb;color:var(--accent)}.chip.check{background:#f0f0f4;color:#7a7a90}
.item{display:flex;justify-content:space-between;padding:8px 9px;margin:3px 0;font-size:12.5px;color:#33425e;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--soft)}
.item:hover{border-color:var(--accent);background:var(--accent-bg)}
.mut{color:var(--muted);font-size:11px}
.hint{font-size:11px;color:var(--muted);margin-top:8px}
.btn{background:var(--accent);border:0;color:#fff;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
.btn.sm{padding:6px 10px;font-size:11.5px}.btn.warn{background:var(--warn)}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 11px;font-size:11.5px;cursor:pointer;font-weight:600}
.cardbox{background:var(--warn-bg);border:1px solid #f0dca5}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.row:last-child{border-bottom:0}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;background:#eef2f8;color:#5a6b86;margin-right:5px}
.badge{font-size:9px;color:#fff;background:var(--warn);padding:1px 5px;border-radius:4px;margin-left:5px}
.acts span{color:var(--muted);cursor:pointer;font-size:11px;margin-left:8px}
.acts span:hover{color:var(--accent)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.mnav{display:flex;align-items:center;gap:12px}.mnav b{font-size:16px}.mnav span{cursor:pointer;color:var(--muted);padding:2px 8px;user-select:none;font-size:15px}
.msum{display:flex;gap:8px}.msum div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:11.5px;text-align:right}.msum .l{color:var(--muted);font-size:9.5px}
.calwrap{display:flex;gap:16px;align-items:flex-start}
.calmain{flex:1;min-width:0}
.calside{width:360px;flex-shrink:0;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
.calside .detail{margin-top:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{color:var(--muted);font-size:11px;text-align:center;padding:4px 0}.dow.s0{color:var(--neg)}.dow.s6{color:var(--accent)}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:96px;padding:5px 6px;cursor:pointer;position:relative;overflow:hidden}
.cell:hover{border-color:var(--accent)}.cell.empty{background:transparent;border:0;cursor:default}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cell.today .dn{color:var(--accent);font-weight:800}
.cell .dhdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.cell .dn{font-size:11px;color:var(--muted)}
.cell .dsum{font-size:9.5px;color:var(--neg);font-weight:700;font-variant-numeric:tabular-nums}
.cell .cl{display:flex;justify-content:space-between;gap:5px;font-size:9.5px;line-height:1.45}
.cell .cl .c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#5a6b86}
.cell .cl .a{flex-shrink:0;font-variant-numeric:tabular-nums;font-weight:600}
.cell .cl.in .a{color:var(--pos)}.cell .cl.ex .a{color:var(--neg)}
.cell .cl.tr .a,.cell .cl.tr .c{color:#8a7bd8}
.cell .cl.in{order:-2}.cell .cl.tr{order:-1}
.cell .cl .sc{display:inline-block;font-size:8px;font-weight:800;padding:0 3px;border-radius:3px;margin-right:3px;vertical-align:middle;line-height:1.5}
.cell .cl .sc.b{background:var(--accent-bg);color:var(--accent)}.cell .cl .sc.p{background:#eef0f4;color:#8a94a6}
.statbar{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;flex:1}
.stat{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 11px;min-width:92px;text-align:right}
.stat .sl{font-size:10px;color:var(--muted);margin-bottom:3px}
.stat .sv{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.watch{background:var(--soft)}
.stat.watch select{font-size:10px;color:var(--muted);border:0;background:transparent;padding:0;margin-bottom:3px;cursor:pointer;font-family:inherit;max-width:96px;text-align:right;direction:rtl}
.stat.watch select:hover{color:var(--accent)}
.cell .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.detail{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px;margin-top:14px}
.dhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.dhd h4{margin:0;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(20,30,50,.4);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.overlay.on{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:460px;padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.22);max-height:90vh;overflow:auto}
.mtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}.modal h3{margin:0;font-size:16px}
.x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.mcur{font-size:22px;font-weight:800;margin:4px 0}
.logrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.logrow .del{color:var(--neg);cursor:pointer;font-size:10.5px;margin-left:8px}
.field{margin-bottom:10px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--muted);font-size:12px;cursor:pointer;font-weight:600}.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.updrow{display:flex;gap:6px;margin-top:12px}.updrow input{flex:1;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px}
.autoNote{background:#e7f6ee;color:#0b6b3a;font-size:11.5px;padding:9px 11px;border-radius:8px;margin-top:10px}
.taxrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.taxrow.big{font-weight:800;font-size:14px;border-bottom:0;background:var(--warn-bg);padding:10px;border-radius:8px;margin-top:6px}
.taxin{width:130px;text-align:right;padding:5px 7px;border:1px solid var(--accent);border-radius:6px;font-size:12px;background:#f7faff}
.settle-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.settle-row:last-child{border-bottom:0}
.settle-row input{width:auto;flex-shrink:0}
.settle-row .sr-d{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.settle-row .sr-c{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settle-row .sr-a{font-weight:700;color:var(--neg);white-space:nowrap;font-variant-numeric:tabular-nums}
.labwrap{overflow:auto;max-height:85vh;border:1px solid var(--line);border-radius:8px}
.labtbl{border-collapse:collapse;font-size:11px;white-space:nowrap}
.labtbl th,.labtbl td{padding:5px 8px;border-bottom:1px solid #eef1f6}
.labtbl thead th{position:sticky;top:0;background:#f8fafc;z-index:2;font-weight:700;text-align:right;cursor:pointer;font-size:10.5px}
.labtbl .cM{position:sticky;left:0;background:#fff;text-align:left;font-weight:600;z-index:1;min-width:130px;box-shadow:1px 0 0 var(--line)}
.labtbl thead .cM{z-index:4;background:#f8fafc}
.labtbl td.v{text-align:right;font-variant-numeric:tabular-nums;cursor:pointer;color:#41506a}
.labtbl td.v:hover{background:var(--accent-bg)}
.labtbl tr.catrow td{background:#eef2f8;font-weight:800;color:#33425e;font-size:10.5px}
.labtbl tr.catrow .cM{background:#eef2f8;z-index:3}
.lab-hi{color:var(--neg);font-weight:800}.lab-lo{color:var(--accent);font-weight:800}
.sajucols{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.sajucols .sc{flex:1;min-width:280px;margin-bottom:0}
.sajucols .scbody{max-height:460px;overflow:auto}
.bub{cursor:pointer;font-size:13px;margin-left:6px;opacity:.28;user-select:none}
.bub.on{opacity:1}.bub:hover{opacity:.8}
.fbadge{font-family:var(--serif);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.5px;white-space:nowrap}
.fbadge.good{background:#f3ead2;color:#8a6d12;border:1px solid #e3d3a0}
.fbadge.bad{background:#fadfd9;color:#a3301f;border:1px solid #edb6ab}
.fbadge.neu{background:#eceae3;color:#6b6552;border:1px solid #ddd8c8}
.moodchip{display:inline-block;font-family:var(--serif);font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--mc);color:var(--mc);cursor:pointer;margin:3px 3px 0 0;user-select:none}
.moodchip.on{background:var(--mc);color:#fff}
.jgrid{column-count:3;column-gap:12px}
@media(max-width:1100px){.jgrid{column-count:2}}
@media(max-width:680px){.jgrid{column-count:1}}
.jentry{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;cursor:pointer;background:var(--card);break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%;vertical-align:top}
.jentry:hover{border-color:var(--gold)}
.jtag{display:inline-block;font-size:9.5px;padding:1px 7px;border-radius:4px;margin-right:4px;font-weight:700}
.wtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.wtab{font-family:var(--serif);font-size:11px;padding:4px 11px;border:1px solid #e3d8bd;border-radius:999px;color:#7a5c12;cursor:pointer;background:#faf7ee}
.wtab.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.gcode{font-family:var(--serif);font-size:10.5px;font-weight:700;color:var(--gold);background:#f7f2e2;border:1px solid #e8ddbe;padding:1px 5px;border-radius:4px;letter-spacing:.3px}
.rcode{font-family:var(--serif);font-size:10px;font-weight:700;color:#8a7c55;letter-spacing:.3px;margin-right:2px}
.rwchip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--soft);color:var(--muted);cursor:pointer;white-space:nowrap;user-select:none}
.rwchip:hover{border-color:var(--gold)}
.rwchip.empty{border-style:dashed}
.rwchip.empty b{color:var(--accent);font-weight:700}
.rwchip.open{background:#e7f6ee;border-color:#a8ddc0;color:#0b6b3a;font-weight:700}
.rwchip.done{background:var(--soft);color:#9aa6b6;opacity:.75}
.ctxacts,.hacts{display:flex;align-items:center;gap:7px}
.pane h4{align-items:center;gap:8px;flex-wrap:wrap}
.subhd{font-family:var(--serif);font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--gold);
  margin:9px 0 5px;padding-bottom:3px;border-bottom:1px dashed #ece3c9}
.ctxstat{font-size:11.5px;color:var(--muted)}
.dsum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px;margin:2px 0 4px;
  padding-bottom:7px;border-bottom:1px dashed #ece3c9}
.dfull{color:var(--pos);font-weight:700}
.wtwrap{margin-top:11px;padding-top:9px;border-top:1px solid #ece3c9}
.wthd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:11px;margin-bottom:6px;flex-wrap:wrap}
.wtt{font-family:var(--serif);font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.4px}
.wthd b{color:var(--gold);font-size:12.5px}
.wtrack{display:grid;grid-template-columns:repeat(53,1fr);gap:2px}
@media(max-width:900px){.wtrack{grid-template-columns:repeat(27,1fr)}}
.wtrack i{width:100%;aspect-ratio:1;border-radius:3px;background:#eef0f4;display:block;cursor:pointer;border:1px solid transparent}
.wtrack i.win{background:var(--gold)}
.wtrack i.miss{background:#e8e4dc}
.wtrack i.fut{background:#f6f7f9;cursor:default}
.wtrack i.cw{outline:2px solid var(--accent);outline-offset:1px}
.wtrack i.mstart{border-left:1px solid #cfc7ae}
.g2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;margin-bottom:12px}
.g2col>.sec,.g2col>.gtoday{margin-bottom:0}
@media(max-width:1080px){.g2col{grid-template-columns:1fr}}
.dnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.dnav b{font-family:var(--serif);font-size:16px;color:var(--gold)}
.dnav>span[data-dmv],.dnav #goalDatePick{cursor:pointer;color:var(--muted);font-size:14px;padding:1px 5px;user-select:none;border-radius:5px}
.dnav>span[data-dmv]:hover,.dnav #goalDatePick:hover{background:#f3ead2;color:var(--gold)}
.dnav>span.off{opacity:.22;pointer-events:none}
.dnav #goalToday{cursor:pointer}
.mnav2{display:inline-flex;align-items:center;gap:6px}
.mnav2 span{cursor:pointer;color:var(--muted);font-size:13px;padding:0 4px;user-select:none;border-radius:4px}
.mnav2 span:hover{background:#f3ead2;color:var(--gold)}
.mnav2 b{font-size:13.5px}
.gcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.gcdow{text-align:center;font-size:10px;color:var(--muted);padding:2px 0}
.gcdow.s0{color:var(--neg)}.gcdow.s6{color:var(--accent)}
.gcell{position:relative;height:38px;border:1px solid var(--line);border-radius:7px;background:var(--card);cursor:pointer;padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between}
.gcell.empty{border:0;background:transparent;cursor:default;height:38px}
.gcell:hover{border-color:var(--gold)}
.gcell .gcd{font-size:10.5px;color:var(--muted);line-height:1}
.gcell .gcr{font-size:9px;font-weight:700;color:#8a6d12;text-align:right;line-height:1}
.gcell.l0{background:#fafafa}
.gcell.l1{background:#f6efdc;border-color:#ece0bf}
.gcell.l2{background:#ecdcaf;border-color:#ddc27c}
.gcell.l3{background:#d8bd77;border-color:var(--gold)}
.gcell.l3 .gcd,.gcell.l2 .gcd{color:#5d4a12}
.gcell.today{box-shadow:inset 0 0 0 1px var(--accent)}
.gcell.sel{outline:2px solid var(--gold);outline-offset:1px}
.gcell.fut{opacity:.35;cursor:default;pointer-events:none}
.gcell .gcm{position:absolute;top:3px;right:4px;width:4px;height:4px;border-radius:50%;background:var(--neg)}
.goalrow.ms{border-left:3px solid var(--gold)}
.hm i[data-gcal]{cursor:pointer}
.ctxtop{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid #ece3c9}
.ctxtitle{font-family:var(--serif);font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--gold)}
.ghost.sm{padding:4px 9px;font-size:11px}
.ctxrow.gdone .ctxhead{opacity:.5}
.msbox{margin-top:9px;padding-top:8px;border-top:1px dashed #ece3c9}
.mshd{display:flex;justify-content:space-between;align-items:center;font-family:var(--serif);font-size:10.5px;font-weight:700;color:var(--gold);letter-spacing:.4px;margin-bottom:5px}
.msrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;padding:5px 7px;border-radius:6px;background:#fff;border:1px solid var(--line);margin:3px 0}
.msrow.now{border-color:#e3d3a0;background:#faf7ee}
.msrow.done{opacity:.45}.msrow.done span:first-child{text-decoration:line-through}
.msrow>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msr{white-space:nowrap;color:var(--muted)}
.ctxwrap{background:linear-gradient(180deg,#fbfaf6,#fff);border:1px solid #e8e2cf;border-radius:12px;padding:11px 13px;margin-bottom:12px}
.ctxrow{padding:7px 0;border-bottom:1px dashed #ece3c9;cursor:pointer}
.ctxrow:last-of-type{border-bottom:0}
.ctxhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px}
.ctxhead>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctxr{white-space:nowrap;font-size:11.5px;color:var(--muted)}
.ctxr b{color:var(--gold);font-size:12.5px}
.ctxbar{height:4px;background:#eef0f4;border-radius:3px;overflow:hidden;margin-top:5px}
.ctxbar span{display:block;height:100%;background:var(--gold)}
.ctxrow.open{background:#faf7ee;margin:0 -6px;padding:7px 6px;border-radius:7px}
.ctxbody{margin-top:8px;padding-top:7px;border-top:1px solid #ece3c9}
.ctxadd{margin-top:9px;padding-top:8px;border-top:1px solid #ece3c9}
.rgroup{margin-top:9px}
.rghd{font-family:var(--serif);font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:2px 2px 4px;color:var(--gold)}
.rghd.m{color:#6f5fc7}.rghd.z{color:#9aa6b6}
.misstag{display:inline-block;font-size:10px;background:#fadfd9;color:#a3301f;border:1px solid #edb6ab;padding:1px 6px;border-radius:4px;margin-left:6px}
.gtoday{background:linear-gradient(160deg,#fbfaf6,#fff);border:1px solid #e8e2cf;border-radius:12px;padding:16px;margin-bottom:12px}
.gtoday h3{font-family:var(--serif);margin:0;font-size:16px;color:var(--gold)}
.gstreak{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0 13px}
.gstreak div{font-family:var(--serif);font-size:11.5px;background:#f3ead2;color:#8a6d12;border:1px solid #e3d3a0;padding:3px 11px;border-radius:999px}
.gstreak div.cold{background:#f0f0f4;color:#8a8a9a;border-color:#e0e0e8}
.rtask{display:flex;align-items:center;gap:11px;padding:12px 13px;margin:5px 0;border:1px solid var(--line);border-radius:10px;background:var(--soft);cursor:pointer;font-size:13.5px;user-select:none}
.rtask:hover{border-color:var(--gold)}
.rtask.on{background:#f3ead2;border-color:#e3d3a0;color:#7a5c12}
.rtask .bx{width:21px;height:21px;border:2px solid #cfc7ae;border-radius:6px;flex-shrink:0;text-align:center;line-height:18px;font-size:13px;font-weight:800;background:#fff}
.rtask.on .bx{background:var(--gold);border-color:var(--gold);color:#fff}
.rtask .rn{flex:1}
.rtask .rg{font-size:10px;color:var(--muted);margin-left:5px}
.hmwrap{display:flex;gap:6px;align-items:flex-start;overflow-x:auto;padding:2px 0}
.hmdow{display:grid;grid-template-rows:repeat(7,14px);gap:3px;font-size:8.5px;color:var(--muted);flex-shrink:0}
.hmdow span{line-height:14px;height:14px}
.hm{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;flex-shrink:0}
.hm i{width:14px;height:14px;border-radius:3px;background:#eef0f4;display:block;position:relative;cursor:default}
.hm i.l1{background:#ece0bf}.hm i.l2{background:#d8bd77}.hm i.l3{background:var(--gold)}
.hm i.warn::after{content:'';position:absolute;top:-1px;right:-1px;width:4px;height:4px;border-radius:50%;background:var(--neg)}
.hm i.td{outline:2px solid var(--accent);outline-offset:1px}
.pbar{height:7px;background:#eef0f4;border-radius:4px;overflow:hidden;margin-top:6px}
.pbar span{display:block;height:100%;background:var(--gold);transition:width .2s}
.goalrow{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:6px 0;background:var(--card)}
.goalrow.done{opacity:.48}
.goalrow.done .gt{text-decoration:line-through}
.gyear{border-left:3px solid var(--gold);padding:7px 12px;margin:6px 0;background:#faf7ee;border-radius:0 8px 8px 0}
.gdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#e4e8f0;vertical-align:middle;margin-left:4px}
.gdot.part{background:#d8bd77}.gdot.full{background:var(--gold)}
.dchip{display:inline-block;font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;margin:2px 3px 0 0;user-select:none;background:var(--soft);color:var(--muted)}
.dchip.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.foot{padding:14px 8px;color:#9aa6b6;font-size:10.5px;text-align:center}.foot a{color:var(--accent);cursor:pointer}

function lineChart(series,opt){
  opt=opt||{};var W=380,H=170,PL=44,PR=12,PT=14,PB=26,col=opt.color||'#2f6df6';
  var pts=series.filter(function(p){return p.amount!=null}).map(function(p){return {x:mIdx(p.date),v:p.amount}}).sort(function(a,b){return a.x-b.x});
  if(!pts.length)return '<div class="mut" style="padding:14px 0">데이터 없음</div>';
  var vals=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(opt.zeroBase&&mn>0)mn=0;if(mn===mx){mn=mn-1;mx=mx+1;}var span=mx-mn;
  var X=function(i){return PL+(i/11)*(W-PL-PR)},Y=function(v){return PT+(1-(v-mn)/span)*(H-PT-PB)};
  var line=pts.map(function(p){return X(p.x)+','+Y(p.v)}).join(' ');
  var dots=pts.map(function(p){return '<circle cx="'+X(p.x)+'" cy="'+Y(p.v)+'" r="3" fill="'+col+'"/>'}).join('');
  var zero=(mn<0&&mx>0)?'<line x1="'+PL+'" y1="'+Y(0)+'" x2="'+(W-PR)+'" y2="'+Y(0)+'" stroke="#e4e8f0" stroke-dasharray="3 3"/>':'';
  var xl='';for(var i=0;i<12;i+=2){xl+='<text x="'+X(i)+'" y="'+(H-8)+'" font-size="9" fill="#9aa6b6" text-anchor="middle">'+(i+1)+'월</text>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+zero+'<polyline points="'+line+'" fill="none" stroke="'+col+'" stroke-width="2.5"/>'+dots+xl+'<text x="6" y="'+(PT+4)+'" font-size="9" fill="#9aa6b6">'+man(mx)+'</text><text x="6" y="'+(H-PB+2)+'" font-size="9" fill="#9aa6b6">'+man(mn)+'</text></svg>';
}

/* ====== 계산 ====== */
function accVal(a){return latest(a.hist);}
function groupTotals(){var g={};DB.accounts.forEach(function(a){g[a.group]=(g[a.group]||0)+accVal(a)});return g;}
function totalAssets(){return DB.accounts.reduce(function(s,a){return s+accVal(a)},0);}
function cardPendingByCard(){var m={};DB.transactions.forEach(function(t){if(t.card&&t.type==='expense'&&creditCard(t.method))m[t.method]=(m[t.method]||0)+t.amt;});return m;}
function cardPending(){var m=cardPendingByCard(),s=0;for(var k in m)s+=m[k];return s;}
function totalDebt(){return DB.debts.reduce(function(s,d){return s+d.balance},0)+cardPending();}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function usageBy(field){var m={};DB.transactions.forEach(function(t){var k=t[field];if(k)m[k]=(m[k]||0)+1;});return m;}
function monthTxns(m){return DB.transactions.filter(function(t){return monthOf(t.date)===m});}
function monthPL(m){var i=0,e=0;monthTxns(m).forEach(function(t){if(t.type==='income')i+=t.amt;else if(t.type==='expense')e+=t.amt});return {inc:i,exp:e,net:i-e};}
/* ==== 현금흐름 계산 (P1) ==== */
function isCashAcct(a){return a.group!=='투자'&&a.group!=='저축';}
function cashAccts(){return DB.accounts.filter(isCashAcct);}
function acctName(id){var a=DB.accounts.filter(function(x){return x.id===id})[0];return a?a.name:'?';}
function acctBaseline(a){ if(a.opening&&a.opening.date)return {date:a.opening.date,amount:a.opening.amount||0}; var h=(a.hist&&a.hist.length)?a.hist.slice().sort(function(x,y){return x.date<y.date?-1:1}).slice(-1)[0]:null; return h?{date:h.date,amount:h.amount}:{date:'1900-01-01',amount:0}; }
function acctFlow(a){ var base=acctBaseline(a),s=0; DB.transactions.forEach(function(t){ if(!t.date||t.date<base.date)return;
  if(t.type==='income'&&t.acct===a.id)s+=t.amt;
  else if(t.type==='expense'&&t.acct===a.id)s-=t.amt;
  else if(t.type==='transfer'){ if(t.from===a.id)s-=t.amt; if(t.to===a.id)s+=t.amt; }
  else if(t.type==='settle'&&t.acct===a.id)s-=t.amt; }); return s; }
function acctComputed(a){return acctBaseline(a).amount+acctFlow(a);}

function cfBuildSankey(txns){
  var S={},A={},K={},linksSA=[],linksAK=[];

    else if(t.type==='expense'&&t.acct){K['ex:'+t.cat]=(K['ex:'+t.cat]||0)+t.amt;A[t.acct]=A[t.acct]||{in:0,out:0};A[t.acct].out+=t.amt;linksAK.push({a:t.acct,k:'ex:'+t.cat,v:t.amt});}
    else if(t.type==='settle'&&t.acct){K['ex:카드결제']=(K['ex:카드결제']||0)+t.amt;A[t.acct]=A[t.acct]||{in:0,out:0};A[t.acct].out+=t.amt;linksAK.push({a:t.acct,k:'ex:카드결제',v:t.amt});}
    else if(t.type==='transfer'){var toA=acctById(t.to);if(toA&&!isCashAcct(toA)){K['sv:'+t.to]=(K['sv:'+t.to]||0)+t.amt;A[t.from]=A[t.from]||{in:0,out:0};A[t.from].out+=t.amt;linksAK.push({a:t.from,k:'sv:'+t.to,v:t.amt});}}
  });
  return {S:S,A:A,K:K,linksSA:linksSA,linksAK:linksAK};
}
function cfSankeySVG(g){
  var sK=Object.keys(g.S),aK=Object.keys(g.A),kK=Object.keys(g.K);
  if(!sK.length&&!kK.length)return '<div class="mut" style="padding:24px 0;text-align:center">계좌를 붙인 수입·지출 거래가 있어야 흐름이 그려집니다.<br>9월부터 새 방식으로 입력하면 자동으로 채워집니다.</div>';
  var colS=sK.map(function(k){return {key:k,label:k.slice(3),v:g.S[k]};});
  var colA=aK.map(function(k){return {key:k,label:acctName(k),v:Math.max(g.A[k].in,g.A[k].out)};});
  var colK=kK.map(function(k){return {key:k,label:k.slice(0,3)==='sv:'?('▶'+acctName(k.slice(3))):k.slice(3),v:g.K[k]};});
  [colS,colA,colK].forEach(function(c){c.sort(function(a,b){return b.v-a.v;});});
  var sum=function(c){return c.reduce(function(s,n){return s+n.v;},0);};
  var maxTot=Math.max(sum(colS),sum(colA),sum(colK),1);
  var maxN=Math.max(colS.length,colA.length,colK.length,1);
  var gap=8,minH=12,targetH=Math.max(280,maxN*30);
  var scale=(targetH-gap*(maxN-1))/maxTot;
  var W=680,nw=120,xS=6,xA=(W-nw)/2,xK=W-nw-6;
  function layout(col,x){var y=8,pos={};col.forEach(function(n){var h=Math.max(minH,n.v*scale);pos[n.key]={x:x,y:y,h:h,v:n.v,label:n.label};y+=h+gap;});pos._bottom=y;return pos;}
  var pS=layout(colS,xS),pA=layout(colA,xA),pK=layout(colK,xK);
  var svgH=Math.max(pS._bottom,pA._bottom,pK._bottom,300);
  var cur={};function cursor(k){if(!cur[k])cur[k]={inL:0,outR:0};return cur[k];}
  function link(x1,y1,x2,y2,w,color){var mx=(x1+x2)/2;return '<path d="M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2+'" stroke="'+color+'" stroke-width="'+Math.max(1,w)+'" fill="none" opacity="0.3"/>';}
  var paths='';
  g.linksSA.forEach(function(l){var sp=pS[l.s],ap=pA[l.a];if(!sp||!ap)return;var w=l.v*scale,cs=cursor('s'+l.s),ca=cursor('a'+l.a);var y1=sp.y+cs.outR+w/2;cs.outR+=w;var y2=ap.y+ca.inL+w/2;ca.inL+=w;paths+=link(sp.x+nw,y1,ap.x,y2,w,'#0f9d58');});
  g.linksAK.forEach(function(l){var ap=pA[l.a],kp=pK[l.k];if(!ap||!kp)return;var w=l.v*scale,ca=cursor('a'+l.a),ck=cursor('k'+l.k);var y1=ap.y+ca.outR+w/2;ca.outR+=w;var y2=kp.y+ck.inL+w/2;ck.inL+=w;var col=l.k.slice(0,3)==='sv:'?'#2f6df6':'#e0483d';paths+=link(ap.x+nw,y1,kp.x,y2,w,col);});
  var rects='';
  function drawCol(pos,fill,anchor){Object.keys(pos).forEach(function(k){if(k==='_bottom')return;var n=pos[k];rects+='<rect x="'+n.x+'" y="'+n.y+'" width="'+nw+'" height="'+n.h+'" rx="3" fill="'+fill+'"/>';var tx=anchor==='start'?n.x+5:(anchor==='end'?n.x+nw-5:n.x+nw/2);rects+='<text x="'+tx+'" y="'+(n.y+n.h/2+3.5)+'" font-size="10" fill="#1b2333" text-anchor="'+anchor+'">'+cfClip(n.label)+' '+cfShort(n.v)+'</text>';});}
  drawCol(pS,'#d6f0e0','start');drawCol(pA,'#e3e9f5','middle');drawCol(pK,'#f7ddd9','end');
  return '<svg viewBox="0 0 '+W+' '+svgH+'" style="width:100%;height:auto;max-height:520px">'+paths+rects+'</svg>';
}

  var line=pts.map(function(p,i){return X(i)+','+Y(p.v);}).join(' ');
  var dots=pts.map(function(p,i){return '<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="2.6" fill="#a67c1a" data-tip="'+p.date+' · '+p.v.toFixed(1)+m.u+'" style="cursor:pointer"/>';}).join('');
  var lbls='';var step=Math.max(1,Math.ceil(n/8));for(var i=0;i<n;i+=step){lbls+='<text x="'+X(i)+'" y="'+(HH-7)+'" font-size="8.5" fill="#a2967a" text-anchor="middle">'+pts[i].date.slice(2,7)+'</text>';}

}

function labSChart(name,m){var H=DB.health;var vals=H.labValues[name]||[];var n=H.labDates.length;
  var pts=[];for(var i=0;i<n;i++){if(typeof vals[i]==='number')pts.push({i:i,v:vals[i]});}
  if(!pts.length)return '<div class="mut" style="padding:10px 0">숫자 기록 없음</div>';
  var W=440,HH=150,PL=38,PR=10,PT=12,PB=18;var vv=pts.map(function(p){return p.v;});var mn=Math.min.apply(null,vv),mx=Math.max.apply(null,vv);
  if(m.low!=null)mn=Math.min(mn,m.low);if(m.high!=null)mx=Math.max(mx,m.high);if(mn===mx){mn-=1;mx+=1;}var span=mx-mn;
  var X=function(i){return PL+(i/(n-1||1))*(W-PL-PR);},Y=function(v){return PT+(1-(v-mn)/span)*(HH-PT-PB);};
  var band='';if(m.low!=null&&m.high!=null){var y1=Y(m.high),y2=Y(m.low);band='<rect x="'+PL+'" y="'+y1+'" width="'+(W-PL-PR)+'" height="'+Math.max(1,y2-y1)+'" fill="#e7f6ee"/>';}
  var line=pts.map(function(p){return X(p.i)+','+Y(p.v);}).join(' ');
  var dots=pts.map(function(p){var f=labFlag(m,p.v);var c=f==='hi'?'#e0483d':f==='lo'?'#2f6df6':'#0f9d58';return '<circle cx="'+X(p.i)+'" cy="'+Y(p.v)+'" r="3" fill="'+c+'"/>';}).join('');
  return '<svg viewBox="0 0 '+W+' '+HH+'" width="100%" style="display:block;margin-top:8px">'+band+'<polyline points="'+line+'" fill="none" stroke="#5a6b86" stroke-width="2"/>'+dots+'<text x="4" y="'+(PT+4)+'" font-size="9" fill="#9aa6b6">'+mx+'</text><text x="4" y="'+(HH-PB+4)+'" font-size="9" fill="#9aa6b6">'+mn+'</text></svg>';
}
function labCell(name,i){var H=DB.health;var m=H.metrics.filter(function(x){return x.name===name;})[0];var v=(H.labValues[name]||[])[i];

/* ====== 명리(사주) ====== */
var SAJU_GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var SAJU_JI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var SAJU_OH={甲:'목',乙:'목',丙:'화',丁:'화',戊:'토',己:'토',庚:'금',辛:'금',壬:'수',癸:'수'};
var SAJU_YIN={甲:0,乙:1,丙:0,丁:1,戊:0,己:1,庚:0,辛:1,壬:0,癸:1};
var JIJANG={子:'癸',丑:'己',寅:'甲',卯:'乙',辰:'戊',巳:'丙',午:'丁',未:'己',申:'庚',酉:'辛',戌:'戊',亥:'壬'};
var YUKHAP={子:'丑',丑:'子',寅:'亥',亥:'寅',卯:'戌',戌:'卯',辰:'酉',酉:'辰',巳:'申',申:'巳',午:'未',未:'午'};
var YUKCHUNG={子:'午',午:'子',丑:'未',未:'丑',寅:'申',申:'寅',卯:'酉',酉:'卯',辰:'戌',戌:'辰',巳:'亥',亥:'巳'};
var GANCHUNG={甲:'庚',庚:'甲',乙:'辛',辛:'乙',丙:'壬',壬:'丙',丁:'癸',癸:'丁'};
var SAMHAP=[['寅','午','戌'],['申','子','辰'],['亥','卯','未'],['巳','酉','丑']];
function sjJDN(y,m,d){var a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function sjSolarLong(JD){var T=(JD-2451545.0)/36525.0;var L0=280.46646+36000.76983*T+0.0003032*T*T;var M=(357.52911+35999.05029*T-0.0001537*T*T)*Math.PI/180;var C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);var lam=(L0+C)%360;return lam<0?lam+360:lam;}
function sjPillars(y,m,d){var J=sjJDN(y,m,d);var di=((J+49)%60+60)%60;var lam=sjSolarLong(J);var k=Math.floor(((((lam-315)%360)+360)%360)/30);var mb=(k+2)%12;var sy=y;if(m===1||(m===2&&lam<315))sy=y-1;var ys=((sy-4)%10+10)%10,yb=((sy-4)%12+12)%12;var mss=((ys%5)*2+2)%10;var ms=(mss+k)%10;return {year:SAJU_GAN[ys]+SAJU_JI[yb],month:SAJU_GAN[ms]+SAJU_JI[mb],day:SAJU_GAN[di%10]+SAJU_JI[di%12],dayStem:SAJU_GAN[di%10],dayBranch:SAJU_JI[di%12]};}
function sipsin(ilgan,g){if(!g)return '';var order=['목','화','토','금','수'];var ie=SAJU_OH[ilgan],te=SAJU_OH[g];var di=(order.indexOf(te)-order.indexOf(ie)+5)%5;var same=SAJU_YIN[ilgan]===SAJU_YIN[g];return {0:same?'비견':'겁재',1:same?'식신':'상관',2:same?'편재':'정재',3:same?'편관':'정관',4:same?'편인':'정인'}[di];}
function jiSipsin(ilgan,branch){return sipsin(ilgan,JIJANG[branch]);}
function seunGZ(year){var ys=((year-4)%10+10)%10,yb=((year-4)%12+12)%12;return SAJU_GAN[ys]+SAJU_JI[yb];}
function isSamjae(year){var yb=((year-4)%12+12)%12;return ['申','酉','戌'].indexOf(SAJU_JI[yb])>=0;}
function sajuAge(dateStr){var b=DB.saju.birth.solar.split('-'),d=dateStr.split('-');var a=+d[0]-+b[0];if(+d[1]<+b[1]||(+d[1]==+b[1]&&+d[2]<+b[2]))a--;return a;}
function sajuCurDaeun(){var age=sajuAge(todayStr()),L=DB.saju.daeun.list,cur=L[0];for(var i=0;i<L.length;i++){if(age>=L[i][0])cur=L[i];}return {age:age,gz:cur[1],from:cur[0]};}
function natalBranches(){var n=DB.saju.natal;return [n.year[1],n.month[1],n.day[1],n.hour[1]];}
function isHyeong(a,b){var g1=['寅','巳','申'],g2=['丑','戌','未'];if(a===b)return ['辰','午','酉','亥'].indexOf(a)>=0;if(g1.indexOf(a)>=0&&g1.indexOf(b)>=0)return true;if(g2.indexOf(a)>=0&&g2.indexOf(b)>=0)return true;if((a==='子'&&b==='卯')||(a==='卯'&&b==='子'))return true;return false;}
function dayFlags(y,m,d){var p=sjPillars(y,m,d),T=p.dayBranch,TG=p.dayStem,N=natalBranches(),fl=[];
  N.forEach(function(n){if(YUKCHUNG[T]===n)fl.push({t:'충',w:'주의',d:T+n+'충'});});
  N.forEach(function(n){if(isHyeong(T,n))fl.push({t:'형',w:'주의',d:T+n+'형'});});
  N.forEach(function(n){if(YUKHAP[T]===n)fl.push({t:'합',w:'특이',d:T+n+'합'});});
  SAMHAP.forEach(function(g){if(g.indexOf(T)>=0){var hit=N.filter(function(n){return g.indexOf(n)>=0&&n!==T;});if(hit.length>=2)fl.push({t:'삼합',w:'특이',d:g.join('')+'삼합'});else if(hit.length===1)fl.push({t:'반합',w:'특이',d:T+hit[0]+'반합'});}});
  if(GANCHUNG[DB.saju.ilgan]===TG)fl.push({t:'천간충',w:'주의',d:TG+DB.saju.ilgan+'충'});
  if(DB.saju.gongmang.indexOf(T)>=0)fl.push({t:'공망',w:'특이',d:T+'공망일'});
  // 중복 제거
  var seen={},out=[];fl.forEach(function(f){if(!seen[f.d]){seen[f.d]=1;out.push(f);}});return {gz:p.day,flags:out};}
function sajuEsc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

   +'<div class="sec"><h4>🧭 인생 총운 <span class="mut">스토리 · 차후 업데이트됨</span></h4><div style="font-size:13.5px;line-height:1.85;white-space:pre-wrap;color:#33425e">'+(S.story?sajuEsc(S.story):'<span class="mut">아직 스토리 없음 — "인생 총운 스토리 써줘" 하면 Claude가 작성·저장.</span>')+'</div></div>';
}

/* ====== 목표·루틴 엔진 (v6.0) ======
   설계: goal-design.md
   원칙 3가지 — ① 기록은 불변 ② 모든 체크는 목표에 귀속 ③ 삭제 대신 은퇴 */
var DOW_KO=['일','월','화','수','목','금','토'];
var MISS_TAGS=['야근','피로','날씨','약속','무기력','아픔','일정충돌','의지부족','기타'];

/* --- 날짜 --- */
function addDays(ds,n){var d=new Date(ds+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function dowOf(ds){return new Date(ds+'T00:00:00Z').getUTCDay();}
function lastDayOfYM(ym){var y=parseInt(ym.slice(0,4),10),m=parseInt(ym.slice(5),10);return ym+'-'+String(new Date(Date.UTC(y,m,0)).getUTCDate()).padStart(2,'0');}
function ymAdd(ym,n){var y=parseInt(ym.slice(0,4),10),m=parseInt(ym.slice(5),10)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0');}
function ymRange(a,b){var out=[],c=a,guard=0;while(c<=b&&guard++<400){out.push(c);c=ymAdd(c,1);}return out;}

/* --- 코드 발급 (재사용 금지: 단조증가 카운터) --- */
function seqNext(key){DB.meta=DB.meta||{};DB.meta.seq=DB.meta.seq||{};DB.meta.seq[key]=(DB.meta.seq[key]||0)+1;return DB.meta.seq[key];}
function numToAlpha(n){var s='';while(n>0){var r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;}
function numToLower(n){var s='';while(n>0){var r=(n-1)%26;s=String.fromCharCode(97+r)+s;n=Math.floor((n-1)/26);}return s;}
function codeTaken(c){return (DB.goals||[]).some(function(g){return g.code===c;})||(DB.routines||[]).some(function(r){return r.code===c;});}
function issueGoalCode(kind,parentId,period){
  var c;
  if(kind==='year'){do{c=numToAlpha(seqNext('year'));}while(codeTaken(c));return c;}
  if(kind==='milestone'){var p=goalById(parentId);return (p?p.code:'?')+'.'+parseInt(period.slice(5),10);}
  var mk='M'+parseInt(period.slice(5),10);
  do{c=mk+'.'+seqNext(mk);}while(codeTaken(c));
  return c;
}
function issueRoutineCode(goalId){
  var c;
  if(!goalId){do{c='Z'+seqNext('Z');}while(codeTaken(c));return c;}
  var g=goalById(goalId);
  if(!g){do{c='Z'+seqNext('Z');}while(codeTaken(c));return c;}
  if(g.kind==='year'){do{c=g.code+seqNext(g.code);}while(codeTaken(c));return c;}
  do{c=g.code+numToLower(seqNext(g.code));}while(codeTaken(c));
  return c;
}

/* --- 목표 조회 --- */
function goalById(id){return (DB.goals||[]).filter(function(g){return g.id===id;})[0];}
function goalByCode(c){return (DB.goals||[]).filter(function(g){return g.code===c;})[0];}
function yearGoals(y){return (DB.goals||[]).filter(function(g){return g.kind==='year'&&g.period===y;});}
function milestonesOf(gid){return (DB.goals||[]).filter(function(g){return g.kind==='milestone'&&g.parentId===gid;}).sort(function(a,b){return a.period<b.period?-1:1;});}
function milestoneAt(gid,ym){return (DB.goals||[]).filter(function(g){return g.kind==='milestone'&&g.parentId===gid&&g.period===ym;})[0];}
function soloGoals(ym){return (DB.goals||[]).filter(function(g){return g.kind==='month'&&g.period===ym;});}
function goalLabel(g){return g?(g.code+' '+g.title):'';}

/* --- 마일스톤 자동 생성 (due 기반, 과거 불변) --- */
function syncMilestones(g){
  if(!g||g.kind!=='year'||!g.due)return;
  var mt=(g.metric&&g.metric.type)||'binary';
  if(mt==='binary')return;
  var today=todayStr().slice(0,7);
  var startYM=g.startYM||today;
  var endYM=g.due.slice(0,7);
  if(endYM<startYM)return;
  var list=ymRange(startYM,endYM), n=list.length;
  var base=(g.baseline!=null&&g.baseline!=='')?parseFloat(g.baseline):0;
  var goalV=(g.metric&&g.metric.target)||0;
  list.forEach(function(ym,i){
    var m=milestoneAt(g.id,ym);
    if(m&&(m.manual||ym<today))return;
    var target=(mt==='autodays')?goalV:Math.round((base+(goalV-base)*((i+1)/n))*10)/10;
    if(m){m.metric.target=target;m.metric.unit=g.metric.unit;}
    else DB.goals.push({id:uid(),code:g.code+'.'+parseInt(ym.slice(5),10),kind:'milestone',parentId:g.id,
      period:ym,title:parseInt(ym.slice(5),10)+'월 눈금',
      metric:{type:mt,target:target,unit:(g.metric&&g.metric.unit)||''},progress:0,status:'active'});
  });
  milestonesOf(g.id).forEach(function(m){
    if(list.indexOf(m.period)<0&&m.period>=today&&!routinesOfGoal(m.id).length&&!m.progress)
      DB.goals=DB.goals.filter(function(x){return x.id!==m.id;});
  });
}
function syncAllMilestones(){(DB.goals||[]).filter(function(g){return g.kind==='year';}).forEach(syncMilestones);}

/* --- 루틴 --- */
function routineById(id){return (DB.routines||[]).filter(function(r){return r.id===id;})[0];}
function routineByCode(c){return (DB.routines||[]).filter(function(r){return r.code===c;})[0];}
function routinesOfGoal(gid){return (DB.routines||[]).filter(function(r){return r.goalId===gid;});}
function routineActiveOn(r,ds){
  if(r.status==='paused')return false;
  if(r.start&&ds<r.start)return false;
  if(r.end&&ds>r.end)return false;
  if(r.freq==='weekly')return (r.days||[]).indexOf(dowOf(ds))>=0;
  return true;
}
function routinesForDay(ds){
  return (DB.routines||[]).filter(function(r){return routineActiveOn(r,ds);})
    .sort(function(a,b){return (a.order||0)-(b.order||0);});
}

/* --- 체크 원장 (불변) --- */
function chkOf(ds){return (DB.checks||{})[ds]||null;}
function dueOf(ds){
  var c=chkOf(ds);
  if(c&&c.due&&c.due.length)return c.due;          // 스냅샷 우선 = 과거 불변
  return routinesForDay(ds).map(function(r){return r.code;});  // 폴백: start/end로 재구성
}
function doneOf(ds){var c=chkOf(ds);return (c&&c.done)||[];}
function missOf(ds){var c=chkOf(ds);return (c&&c.miss)||{};}
function checkGet(ds,code){return doneOf(ds).indexOf(code)>=0;}
function ensureDay(ds){
  DB.checks=DB.checks||{};
  var c=DB.checks[ds];
  if(!c){c={done:[],due:[],miss:{}};DB.checks[ds]=c;}
  if(!c.done)c.done=[];if(!c.miss)c.miss={};
  if(!c.due)c.due=[];
  if(ds>=todayStr()||!c.due.length)c.due=routinesForDay(ds).map(function(r){return r.code;});
  return c;
}
function pruneDay(ds){
  var c=(DB.checks||{})[ds];
  if(c&&!c.done.length&&!Object.keys(c.miss).length)delete DB.checks[ds];
}
function checkToggle(ds,code){
  var c=ensureDay(ds), i=c.done.indexOf(code);
  if(i>=0)c.done.splice(i,1);
  else{c.done.push(code);if(c.miss[code])delete c.miss[code];}
  pruneDay(ds);save();renderGoal();
}
function setMiss(ds,code,tag,memo){
  var c=ensureDay(ds);
  if(!tag&&!memo)delete c.miss[code];
  else c.miss[code]={tag:tag||'',memo:memo||''};
  pruneDay(ds);save();renderGoal();
}

/* --- 집계 --- */
function dayRate(ds){
  var due=dueOf(ds); if(!due.length)return null;
  var dn=doneOf(ds).filter(function(c){return due.indexOf(c)>=0;});
  return {done:dn.length,total:due.length,rate:dn.length/due.length};
}
function streakFrom(ds,full){
  var n=0,d=ds;
  for(var i=0;i<400;i++){
    var r=dayRate(d);
    if(r===null){d=addDays(d,-1);continue;}
    if(full?(r.done<r.total):(r.done===0))break;
    n++;d=addDays(d,-1);
  }
  return n;
}
function goalStreaks(){
  var t=todayStr(),r=dayRate(t);
  return {any:streakFrom((r&&r.done>0)?t:addDays(t,-1),false),
          full:streakFrom((r&&r.total&&r.done===r.total)?t:addDays(t,-1),true)};
}
function monthDoneDays(ym){
  var n=0;for(var k in (DB.checks||{})){if(k.slice(0,7)===ym&&(DB.checks[k].done||[]).length)n++;}return n;
}
/* 목표 산하 루틴 코드 (마일스톤 포함) — 회고의 기반 */
function goalRoutineCodes(gid){
  var ids=[gid];milestonesOf(gid).forEach(function(m){ids.push(m.id);});
  return (DB.routines||[]).filter(function(r){return ids.indexOf(r.goalId)>=0;}).map(function(r){return r.code;});
}
function goalStats(gid,fromDS,toDS){
  var codes=goalRoutineCodes(gid),done=0,due=0,days=0,d=fromDS,guard=0;
  if(!codes.length)return {done:0,due:0,rate:0,days:0};
  while(d<=toDS&&guard++<800){
    var dd=dueOf(d).filter(function(c){return codes.indexOf(c)>=0;});
    if(dd.length){
      var dn=doneOf(d).filter(function(c){return dd.indexOf(c)>=0;});
      due+=dd.length;done+=dn.length;if(dn.length)days++;
    }
    d=addDays(d,1);
  }
  return {done:done,due:due,rate:due?done/due:0,days:days};
}
function gnum(v){v=parseFloat(v)||0;return (Math.abs(v)>=1000)?comma(v):((Math.round(v*10)/10)+'');}
/* --- 앱 데이터 자동 연동: 목표의 '현재값'을 로한북 안에서 직접 끌어온다 --- */
var GOAL_SOURCES=[
  {k:'manual', label:'직접 입력'},
  {k:'weight', label:'체중 (체성분 최신 기록)', unit:'kg'},
  {k:'cash',   label:'현금성 자산 합계', unit:'원'},
  {k:'net',    label:'순자산 (자산-부채)', unit:'원'},
  {k:'debt',   label:'총부채', unit:'원'}
];
function sourceValue(src){
  try{
    if(src==='weight'){
      var w=((DB.health&&DB.health.weights)||[]).slice().sort(function(a,b){return a.date<b.date?-1:1;});
      for(var i=w.length-1;i>=0;i--){if(w[i].kg!=null&&w[i].kg!=='')return parseFloat(w[i].kg);}
      return null;
    }
    if(src==='cash')return DB.accounts.filter(function(a){return a.group==='현금성';}).reduce(function(t,a){return t+accVal(a);},0);
    if(src==='net') return totalAssets()-totalDebt();
    if(src==='debt')return totalDebt();
  }catch(e){}
  return null;
}
/* 마일스톤의 출발점: 직전 달 눈금값, 없으면 부모의 시작값 */
function msBaseline(m){
  var p=goalById(m.parentId); if(!p)return null;
  var list=milestonesOf(p.id), idx=-1;
  for(var i=0;i<list.length;i++){if(list[i].id===m.id){idx=i;break;}}
  if(idx>0){var pv=list[idx-1].metric&&list[idx-1].metric.target;return (pv!=null&&pv!=='')?parseFloat(pv):null;}
  return (p.baseline!=null&&p.baseline!=='')?parseFloat(p.baseline):null;
}
function goalValue(g){
  if(!g)return 0;
  if(g.metric&&g.metric.type==='autodays')return monthDoneDays(g.period||todayStr().slice(0,7));
  /* 눈금은 부모의 연동 소스를 그대로 따른다 (현재값은 하나뿐이므로) */
  if(g.kind==='milestone'){
    var p=goalById(g.parentId);
    if(p&&p.source&&p.source!=='manual'){
      var pv=sourceValue(p.source);
      if(pv!=null)return pv;
    }
    if(g.progress===''||g.progress==null){
      var mb=msBaseline(g);
      if(mb!=null)return mb;
    }
    return g.progress||0;
  }
  if(g.source&&g.source!=='manual'){
    var v=sourceValue(g.source);
    if(v!=null)return v;
  }
  if(g.progress===''||g.progress==null){
    /* 미입력이면 시작값으로 간주 — 0으로 두면 감소형 목표가 100%로 튄다 */
    var b=(g.baseline!=null&&g.baseline!=='')?parseFloat(g.baseline):null;
    if(b!=null)return b;
    return 0;
  }
  return g.progress||0;
}
function goalPct(g){
  if(!g)return 0;
  if(g.status==='done')return 100;
  var mt=(g.metric&&g.metric.type)||'binary';
  if(mt==='binary')return 0;
  var tg=(g.metric.target!=null&&g.metric.target!=='')?parseFloat(g.metric.target):0;
  var cur=goalValue(g);
  var base=(g.baseline!=null&&g.baseline!=='')?parseFloat(g.baseline):null;
  if(g.kind==='milestone'&&base==null)base=msBaseline(g);
  /* 시작값이 있으면 base→target 구간의 진척률. 감소형(체중 68.2→65)도 동일 식으로 처리 */
  if((mt==='amount'||mt==='count')&&base!=null&&base!==tg)
    return Math.max(0,Math.min(100,Math.round(((cur-base)/(tg-base))*100)));
  if(!tg)return 0;
  return Math.max(0,Math.min(100,Math.round((cur/tg)*100)));
}
/* 목표 달성 방향: 감소형이면 현재값이 목표보다 크면 아직 미달 */
function goalTrend(g){
  var base=(g&&g.baseline!=null&&g.baseline!=='')?parseFloat(g.baseline):null;
  var tg=(g&&g.metric&&g.metric.target!=null)?parseFloat(g.metric.target):null;
  if(base==null||tg==null)return 0;
  return tg<base?-1:1;
}

/* --- 보고 있는 날짜 · 달 --- */
function curDate(){var d=(DB.ui&&DB.ui.goalDate)||todayStr();return d>todayStr()?todayStr():d;}
function curMonth(){return (DB.ui&&DB.ui.goalMonth)||todayStr().slice(0,7);}
function setGoalDate(ds){

  DB.ui.goalDate=ds; DB.ui.goalMonth=ds.slice(0,7); save(); renderGoal();
}
function moveGoalDate(n){setGoalDate(addDays(curDate(),n));}
function moveGoalMonth(n){

}
function goalDatePicker(){

}
function applyGoalDate(){

  if(!v)return; setGoalDate(v); closeModal();
}
function goalMonthPicker(){

  openModal('<div class="mtop"><h3>월 선택</h3><span class="x" onclick="closeModal()">×</span></div>'
   +'<div style="display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0">'
   +'<span class="x" style="font-size:18px" onclick="shiftGoalYear(-1)">◀</span><b style="font-size:17px">'+y+'년</b>'
   +'<span class="x" style="font-size:18px" onclick="shiftGoalYear(1)">▶</span></div>'
   +'<div style="display:flex;flex-wrap:wrap;justify-content:center">'+months+'</div>');
}
function shiftGoalYear(d){DB.ui.goalMonth=(parseInt(curMonth().slice(0,4),10)+d)+'-'+curMonth().slice(5);goalMonthPicker();}
function jumpGoalMonth(mm){DB.ui.goalMonth=mm;save();closeModal();renderGoal();}



/* ====== 보상 시스템 — 계단 구조 ======
   일간 완전달성 → (주 4일) 주간 성공 → (월 4회) 월간 성공 → (연 9회) 연간 성공
   설계: goal-design.md 10장. 병렬이 아니라 아래 단계의 성공 횟수가 위 단계를 연다. */
var REWARD_TIERS=[
  {k:'week', label:'주간', pre:'W'},
  {k:'month',label:'월간', pre:'M'},
  {k:'year', label:'연간', pre:'Y'},
  {k:'goal', label:'목표 달성', pre:'G'}
];
function rwCfg(){
  DB.rewardCfg=DB.rewardCfg||{};
  var c=DB.rewardCfg;
  if(!c.weekFullDays)c.weekFullDays=4;
  if(!c.monthWeeks)c.monthWeeks=4;
  if(!c.yearMonths)c.yearMonths=9;
  return c;
}
function weekStart(ds){return addDays(ds,-dowOf(ds));}      /* 일요일 시작 */
function weekLabel(ws){var we=addDays(ws,6);
  return parseInt(ws.slice(5,7),10)+'/'+parseInt(ws.slice(8),10)+'~'+parseInt(we.slice(5,7),10)+'/'+parseInt(we.slice(8),10);}

/* ── 1단: 일간 완전달성 ── */
function isFullDay(ds){var r=dayRate(ds);return !!(r&&r.total>0&&r.done===r.total);}
function fullDaysInWeek(ws){
  var n=0,t=todayStr();
  for(var i=0;i<7;i++){var d=addDays(ws,i);if(d>t)break;if(isFullDay(d))n++;}
  return n;
}
/* ── 2단: 주간 성공 ── */
function weekSuccess(ws){return fullDaysInWeek(ws)>=rwCfg().weekFullDays;}
/* 그 달에 '시작일이 속한' 주 목록 */
function weeksOfMonth(ym){
  var first=ym+'-01',last=lastDayOfYM(ym),w=weekStart(first),out=[];
  if(w<first)w=addDays(w,7);
  while(w<=last){out.push(w);w=addDays(w,7);}
  return out;
}
/* ── 3단: 월간 성공 ── */
function monthWeekWins(ym){var n=0;weeksOfMonth(ym).forEach(function(w){if(weekSuccess(w))n++;});return n;}
function monthSuccess(ym){return monthWeekWins(ym)>=rwCfg().monthWeeks;}
/* ── 4단: 연간 성공 ── */
function yearMonthWins(y){
  var n=0,t=todayStr().slice(0,7);
  for(var m=1;m<=12;m++){var ym=y+'-'+String(m).padStart(2,'0');if(ym>t)break;if(monthSuccess(ym))n++;}
  return n;
}
function yearSuccess(y){return yearMonthWins(y)>=rwCfg().yearMonths;}
/* 연중 주간 성공 총계 + 최장 연속 */
function yearWeekStats(y){
  var w=weekStart(y+'-01-01'); if(w<y+'-01-01')w=addDays(w,7);
  var t=todayStr(),win=0,tot=0,run=0,best=0;
  for(var i=0;i<53;i++){
    if(w.slice(0,4)>y)break;
    if(w<=t){tot++; if(weekSuccess(w)){win++;run++;if(run>best)best=run;}else run=0;}
    w=addDays(w,7);
  }
  return {win:win,elapsed:tot,best:best};
}

/* ── 티어별 현황 ── */
function tierState(tier,ref){
  var c=rwCfg(),t=ref||todayStr();
  if(tier==='week'){var ws=weekStart(t),n=fullDaysInWeek(ws);
    return {period:ws,label:weekLabel(ws),cur:n,req:c.weekFullDays,unit:'일 완전달성',ok:n>=c.weekFullDays};}
  if(tier==='month'){var ym=t.slice(0,7),n2=monthWeekWins(ym);
    return {period:ym,label:parseInt(ym.slice(5),10)+'월',cur:n2,req:c.monthWeeks,unit:'주 성공',ok:n2>=c.monthWeeks};}
  if(tier==='year'){var y=t.slice(0,4),n3=yearMonthWins(y);
    return {period:y,label:y+'년',cur:n3,req:c.yearMonths,unit:'달 성공',ok:n3>=c.yearMonths};}
  return null;
}
function goalTierState(g){
  return {period:g.id,label:g.code+' '+g.title,cur:goalPct(g),req:100,unit:'%',ok:(g.status==='done')};
}

/* ── 52주 트래커 ── */
function weekTracker(y){
  var w=weekStart(y+'-01-01'); if(w<y+'-01-01')w=addDays(w,7);
  var t=todayStr(),cw=weekStart(t),cells='',lastM=-1;
  for(var i=0;i<53;i++){
    if(w.slice(0,4)>y)break;
    var future=w>t, ok=!future&&weekSuccess(w), n=future?0:fullDaysInWeek(w);
    var mo=parseInt(w.slice(5,7),10), mk=(mo!==lastM); lastM=mo;
    cells+='<i class="'+(future?'fut':(ok?'win':'miss'))+(w===cw?' cw':'')+(mk?' mstart':'')+'"'
      +' data-tip="'+weekLabel(w)+' · 완전달성 '+n+'일'+(ok?' · 🎁 성공':(future?'':' · 미달'))+'"'
      +' data-wjump="'+w+'"></i>';
    w=addDays(w,7);
  }
  return cells;
}

/* --- 그날의 루틴 (목표별 그룹) --- */
function todayGroups(t){
  var rs=routinesForDay(t),groups=[],idx={};
  function bucket(key,label,cls){
    if(!idx[key]){idx[key]={key:key,label:label,cls:cls,rows:[]};groups.push(idx[key]);}
    return idx[key];
  }
  rs.forEach(function(r){
    var g=r.goalId?goalById(r.goalId):null;
    if(!g)bucket('_z','미연결','z').rows.push({r:r,g:null});
    else if(g.kind==='milestone'){
      var p=goalById(g.parentId);
      bucket(p?p.id:g.id,(p?p.code+' '+p.title:g.title),'y').rows.push({r:r,g:g});
    }
    else bucket(g.id,g.code+' '+g.title,g.kind==='year'?'y':'m').rows.push({r:r,g:g});
  });
  return groups;
}

var MOODS=[['깨달음','#a67c1a'],['다짐','#00695c'],['기쁨','#2e7d32'],['재밌음','#1565c0'],['반성','#c2185b'],['슬픔','#c62828'],['우울함','#6a1b9a'],['쓸쓸함','#616161']];
function moodColor(n){var m=MOODS.filter(function(x){return x[0]===n})[0];return m?m[1]:'#888';}
function nowLocal(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}
function fmtJ(dt){if(!dt)return '';return dt.replace('T',' ');}
function renderJournal(){
  var J=(DB.journal||[]).slice().sort(function(a,b){return (a.date||'')<(b.date||'')?1:-1;});
  var rows=J.map(function(e){
    var tags=(e.moods||[]).map(function(mn){var c=moodColor(mn);return '<span class="jtag" style="background:'+c+'1f;color:'+c+'">'+mn+'</span>';}).join('');
    return '<div class="jentry" data-editjournal="'+e.id+'"><div style="margin-bottom:5px"><div style="font-family:var(--serif);font-weight:700;font-size:14px">'+(e.title||'(무제)')+'</div><div class="mut" style="font-size:10.5px">'+fmtJ(e.date)+(e.place?' · '+e.place:'')+'</div></div>'+(tags?'<div style="margin-bottom:6px">'+tags+'</div>':'')+((e.body||'')?'<div style="font-size:12.5px;color:#41506a;line-height:1.65;white-space:pre-wrap">'+sajuEsc(e.body)+'</div>':'')+'</div>';
  }).join('');
  var grid=rows?'<div class="jgrid">'+rows+'</div>':'<div class="mut" style="padding:10px 0">아직 기록이 없다. 생각·마음·흔들림·기쁨을 그때그때 남겨라.</div>';
  document.getElementById('v-journal').innerHTML='<div class="sec"><h4>📖 일지 <span class="mut">생각·마음·흔들림·기쁨 ('+J.length+') · 카드 클릭 → 수정/삭제</span> <button class="ghost" id="addJournalBtn" style="float:right">+ 기록</button></h4>'+grid+'</div>';
}
function journalModal(id){
  var e=id?(DB.journal||[]).filter(function(x){return x.id===id})[0]:{date:nowLocal(),title:'',moods:[],place:'',body:''};
  var chips=MOODS.map(function(m){var on=(e.moods||[]).indexOf(m[0])>=0;return '<span class="moodchip'+(on?' on':'')+'" data-mood="'+m[0]+'" style="--mc:'+m[1]+'" onclick="this.classList.toggle(\'on\')">'+m[0]+'</span>';}).join('');
  openModal('<div class="mtop"><h3 style="font-family:var(--serif)">'+(id?'일지 수정':'일지 기록')+'</h3><span class="x" onclick="closeModal()">×</span></div>'
   +'<div class="field"><label>한줄 메모</label><input id="j_title" value="'+(e.title||'').replace(/"/g,'&quot;')+'" placeholder="오늘의 한 줄"></div>'
   +'<div style="display:flex;gap:8px"><div class="field" style="flex:1"><label>날짜·시간</label><input id="j_date" type="datetime-local" value="'+(e.date||nowLocal())+'"></div><div class="field" style="flex:1"><label>장소</label><input id="j_place" value="'+(e.place||'').replace(/"/g,'&quot;')+'" placeholder="선택"></div></div>'
   +'<div class="field"><label>감정 <span class="mut">(복수 선택)</span></label><div id="j_moods">'+chips+'</div></div>'
   +'<div class="field"><label>텍스트</label><textarea id="j_body" rows="15" style="min-height:280px;line-height:1.7" placeholder="마음 가는 대로…">'+(e.body||'')+'</textarea></div>'
   +'<button class="btn" onclick="saveJournal('+(id?"'"+id+"'":'null')+')">저장</button>'+(id?' <button class="ghost" onclick="delJournal(\''+id+'\')">삭제</button>':''));
}
function saveJournal(id){
  var title=document.getElementById('j_title').value.trim(),body=document.getElementById('j_body').value;
  if(!title&&!body.trim())return alert('한줄 메모나 텍스트를 입력하세요');
  var moods=[];var ch=document.querySelectorAll('#j_moods .moodchip.on');for(var i=0;i<ch.length;i++)moods.push(ch[i].dataset.mood);
  var rec={date:document.getElementById('j_date').value||nowLocal(),title:title,moods:moods,place:document.getElementById('j_place').value.trim(),body:body};
  DB.journal=DB.journal||[];
  if(id){Object.assign(DB.journal.filter(function(x){return x.id===id})[0],rec);}else{rec.id=uid();DB.journal.push(rec);}
  logAct((id?'일지수정':'일지기록')+' · '+(title||'(무제)'));save();closeModal();renderJournal();
}
function delJournal(id){if(!confirm('이 기록을 삭제할까요?'))return;DB.journal=DB.journal.filter(function(e){return e.id!==id});save();closeModal();renderJournal();}

function goalOptions(sel){
  var out='<option value="">— 미연결 (Z) —</option>';
  var yy=todayStr().slice(0,4),ym=todayStr().slice(0,7);
  yearGoals(yy).forEach(function(g){
    out+='<option value="'+g.id+'"'+(g.id===sel?' selected':'')+'>'+g.code+' · '+sajuEsc(g.title)+' (연간·상시)</option>';
    var m=milestoneAt(g.id,ym);
    if(m)out+='<option value="'+m.id+'"'+(m.id===sel?' selected':'')+'>　└ '+m.code+' · '+parseInt(ym.slice(5),10)+'월 눈금 (이 달 한시)</option>';
  });
  soloGoals(ym).forEach(function(g){
    out+='<option value="'+g.id+'"'+(g.id===sel?' selected':'')+'>'+g.code+' · '+sajuEsc(g.title)+' (단독과제)</option>';
  });
  return out;
}

function rtFreq(b,v){modal._rfreq=v;var bs=b.parentNode.querySelectorAll('button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');b.classList.add('on');document.getElementById('rt_dayswrap').style.display=(v==='weekly'?'block':'none');}
function saveRoutine(id){
  var title=document.getElementById('rt_title').value.trim();
  if(!title)return alert('루틴 이름을 입력하세요');
  var days=[],ch=document.querySelectorAll('#rt_days .dchip.on');
  for(var i=0;i<ch.length;i++)days.push(parseInt(ch[i].dataset.dow,10));
  if(modal._rfreq==='weekly'&&!days.length)return alert('요일을 하나 이상 선택하세요');
  var gid=document.getElementById('rt_goal').value||null;
  var rec={title:title,freq:modal._rfreq,days:days,goalId:gid,start:document.getElementById('rt_start').value||todayStr()};
  DB.routines=DB.routines||[];
  if(id){
    var r=routineById(id),old=r.goalId;
    Object.assign(r,rec);
    if(old!==gid&&!r.lockCode)r.code=issueRoutineCode(gid);   // 소속이 바뀌면 코드 재발급
    logAct('루틴수정 · '+r.code+' '+title);
  }else{
    rec.id=uid();rec.code=issueRoutineCode(gid);rec.status='active';rec.order=DB.routines.length+1;
    DB.routines.push(rec);logAct('루틴추가 · '+rec.code+' '+title);
  }
  save();closeModal();renderGoal();
}
function retireRoutine(id){
  var r=routineById(id);if(!r)return;
  if(r.status==='retired'){r.status='active';r.end='';logAct('루틴복귀 · '+r.code);}
  else{
    if(!confirm(r.code+' 을(를) 은퇴시킬까요?\n오늘까지의 기록은 그대로 남고, 내일부터 집계에서 빠집니다.'))return;
    r.status='retired';r.end=todayStr();logAct('루틴은퇴 · '+r.code+' '+r.title);
  }
  save();closeModal();renderGoal();
}
function pauseRoutine(id){
  var r=routineById(id);if(!r)return;
  r.status=(r.status==='paused')?'active':'paused';
  logAct('루틴'+(r.status==='paused'?'쉼':'재개')+' · '+r.code);
  save();closeModal();renderGoal();
}
function delRoutine(id){
  var r=routineById(id);if(!r)return;
  var n=0;for(var k in (DB.checks||{})){if((DB.checks[k].done||[]).indexOf(r.code)>=0)n++;}
  if(n)return alert('체크 기록이 '+n+'일 있습니다. 삭제 대신 은퇴를 쓰세요.');
  if(!confirm('기록이 없는 루틴입니다. 완전히 삭제할까요?'))return;
  DB.routines=DB.routines.filter(function(x){return x.id!==id;});

}

function saveGoal(id,kd,parentId){
  var title=document.getElementById('g_title').value.trim();
  if(!title)return alert('제목을 입력하세요');
  var g=id?goalById(id):null;
  var mt=modal._gmet;
  var rec={title:title,memo:document.getElementById('g_memo').value};
  var per=document.getElementById('g_period').value.trim();
  var re=(kd==='year')?/^\d{4}$/:/^\d{4}-\d{2}$/;
  if(!re.test(per))return alert(kd==='year'?'기간은 YYYY (예: 2026)':'기간은 YYYY-MM (예: 2026-08)');
  rec.period=per;
  rec.metric={type:mt,
    target:mt==='binary'?0:numv('g_target'),
    unit:mt==='binary'?'':document.getElementById('g_unit').value.trim()};
  var pEl=document.getElementById('g_progress');
  rec.progress=(mt==='binary'||mt==='autodays')?0:((pEl&&pEl.value!=='')?numv('g_progress'):'');
  if(kd==='year'){
    rec.due=document.getElementById('g_due').value||(per+'-12-31');
    var bs=document.getElementById('g_base');
    rec.baseline=(bs&&bs.value!=='')?numv('g_base'):null;
    var sc=document.getElementById('g_src');
    rec.source=sc?sc.value:'manual';
    rec.startYM=(g&&g.startYM)||todayStr().slice(0,7);
  }else{
    rec.due=lastDayOfYM(per);
    if(kd==='milestone')rec.manual=true;   /* 손댄 눈금은 자동 배분에서 제외 */
  }
  DB.goals=DB.goals||[];
  if(id){Object.assign(g,rec);logAct('목표수정 · '+g.code+' '+title);}
  else{
    rec.id=uid(); rec.kind=kd; rec.status='active';
    rec.parentId=(kd==='milestone')?(parentId||modal._gparent||null):null;
    if(kd==='milestone'){
      var p=goalById(rec.parentId);
      var mnum=parseInt(per.slice(5),10);
      var base=(p?p.code:'?')+'.'+mnum, c=base, n=2;
      while(codeTaken(c))c=base+'-'+(n++);
      rec.code=c;
    }else rec.code=issueGoalCode(kd,null,rec.period);
    DB.goals.push(rec); logAct('목표추가 · '+rec.code+' '+title);
  }
  syncAllMilestones();
  save();closeModal();renderGoal();
}

function delGoal(id){
  var g=goalById(id);if(!g)return;
  var kids=routinesOfGoal(id);
  var msg=(g.kind==='year')?('연간 목표 '+g.code+' 를 삭제합니다.\n산하 월별 눈금도 함께 사라지고, 연결된 루틴 '+kids.length+'개는 미연결(Z)로 내려갑니다.\n체크 기록은 그대로 남습니다.')
    :('목표 '+g.code+' 를 삭제합니다.\n연결된 루틴 '+kids.length+'개는 미연결(Z)로 내려갑니다.');
  if(!confirm(msg))return;
  var ids=[id];
  if(g.kind==='year')milestonesOf(id).forEach(function(m){ids.push(m.id);});

function bankPayDate(y,m,payDay){var d=new Date(Date.UTC(y,m-1,payDay));var w=d.getUTCDay();if(w===6)d.setUTCDate(payDay+2);else if(w===0)d.setUTCDate(payDay+1);return d;}
function bankSchedule(d){
  var b=d&&d.schedule&&d.schedule.bank; if(!b)return null;
  var rate=(d.rate||0)/100, basis=b.basis||365, n=d.schedule.remain||0;
  var ym=((b.firstYM||d.schedule.start||'')+'').split('-'); if(ym.length<2)return null;
  var y=parseInt(ym[0],10), m=parseInt(ym[1],10);
  var prev=new Date(b.prevDate+'T00:00:00Z'), bal=d.balance, rows=[], ti=0, tp=0;
  for(var i=0;i<n;i++){
    var dt=bankPayDate(y,m,b.payDay||19);
    var days=Math.round((dt-prev)/86400000);
    var p=(i===0&&b.firstPrincipal)?b.firstPrincipal:b.principal;
    if(p>bal)p=bal;
    var it=Math.floor(bal*rate*days/basis);
    bal-=p; ti+=it; tp+=(p+it);
    rows.push({no:i+1,date:dt.toISOString().slice(0,10),days:days,principal:p,interest:it,total:p+it,balance:bal});
    prev=dt; m++; if(m>12){m=1;y++;}
    if(bal<=0)break;
  }
  return {rows:rows,totalInterest:ti,totalPay:tp};
}
function bankNextPay(d){var s=bankSchedule(d); if(!s)return null; var t=todayStr();

function bankYearTotal(d,year){var s=bankSchedule(d); if(!s)return 0; var y=''+year,t=0;

function computeMonthly(balance,ratePct,n,method){
  var r=(ratePct||0)/100/12; if(!n)return {monthly:0,note:'잔여 횟수를 입력하세요'};
  if(method==='만기일시')return {monthly:Math.round(balance*r),note:'이자만 매월 납부, 원금은 만기 일시상환'};
  if(method==='원리금균등'){var m=r===0?balance/n:balance*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);return {monthly:Math.round(m),note:'매월 동일액(원금+이자 합계 고정)'};}
  var p=balance/n, first=p+balance*r, last=p+(balance/n)*r;
  return {monthly:Math.round(first),note:'원금균등: 첫달 '+won(first)+' → 매월 감소(마지막 '+won(last)+'). 저장값=첫달 기준'};
}

function migrateV6(d){

  var alpha=function(n){var s='';while(n>0){var r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;};

      :(function(ym){var y=parseInt(ym.slice(0,4),10),m=parseInt(ym.slice(5),10);return ym+'-'+String(new Date(Date.UTC(y,m,0)).getUTCDate()).padStart(2,'0');})(g.period||today.slice(0,7));

  });

  /* 2) 루틴: status/start/code. start는 첫 체크일(없으면 오늘) — 과거 소급 방지 */
  var firstCheck={};
  Object.keys(d.checks||{}).forEach(function(k){
    var v=d.checks[k]||{};
    var ids=(v.done&&v.done.length!==undefined&&typeof v.done[0]!=='undefined')?null:Object.keys(v);
    (ids||[]).forEach(function(rid){ if(!firstCheck[rid]||k<firstCheck[rid])firstCheck[rid]=k; });

        due는 비워 두고 start/end 기반 폴백에 맡긴다(가짜 100% 방지) */
  var nc={};

    var v=d.checks[k]||{};

    }

  if(d.ui&&d.ui.goalOpen===undefined)d.ui.goalOpen=null;

  if(d.ui&&!d.ui.goalMonth)d.ui.goalMonth=today.slice(0,7);

}

  document.getElementById('txnBody').style.display=isTr?'none':'block';
  document.getElementById('transferBody').style.display=isTr?'block':'none';
  document.getElementById('assetChk').style.display=(inc||isTr)?'none':'flex';
  if(!isTr){var _u=usageBy('cat');document.getElementById('fCat').innerHTML=DB.categories.filter(function(c){return c.type===v}).sort(function(a,b){return (_u[b.name]||0)-(_u[a.name]||0);}).map(function(c){return '<option>'+c.name+'</option>'}).join('');
    document.getElementById('incomeOnly').style.display=inc?'block':'none';
    document.getElementById('expenseOnly').style.display=inc?'none':'block';
    document.getElementById('methodField').style.display=inc?'none':'block';
    document.getElementById('acctLabel').textContent=inc?'입금계좌':'출금계좌';
    updIncInfo();}
  methodChange();}
function setScope(b,v){modal._scope=v;var bs=b.parentNode.querySelectorAll('button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');b.classList.add('on');}
function saveTxn(id){
  var amt=parseFloat((document.getElementById('fAmt').value||'').replace(/[^0-9.]/g,'')),date=document.getElementById('fDate').value.trim();
  if(isNaN(amt)||!date)return alert('금액과 날짜 입력');
  if(modal._type==='transfer'){
    var from=document.getElementById('fFrom').value,to=document.getElementById('fTo').value;
    if(from===to)return alert('출발/도착 계좌가 같습니다');
    var trec={type:'transfer',from:from,to:to,amt:amt,date:date,memo:document.getElementById('fMemo').value,cat:'이체'};
    if(id){Object.assign(DB.transactions.filter(function(x){return x.id===id})[0],trec);}else{trec.id=uid();DB.transactions.push(trec);}
    logAct((id?'이체수정':'이체추가')+' · '+date+' '+acctName(from)+'→'+acctName(to)+' '+won(amt));
    save();closeModal();renderCal();renderDash();return;
  }
  var method=modal._type==='income'?'이체':document.getElementById('fMethod').value;
  var itemCat=(document.getElementById('fItemCat')||{}).value||'해당없음';
  var cardObj=DB.cards.filter(function(c){return c.name===method;})[0];
  var isCardPay=cardObj&&cardObj.type==='credit'&&modal._type==='expense';
  var acctEl=document.getElementById('fAcct');
  var acct;
  if(modal._type==='income')acct=acctEl?acctEl.value:undefined;
  else if(cardObj)acct=cardObj.type==='check'?cardObj.acct:undefined; // 체크=연결계좌 즉시출금, 신용=선결제시
  else acct=acctEl?acctEl.value:undefined; // 현금·이체
  var rec={type:modal._type,scope:modal._scope,cat:document.getElementById('fCat').value,itemCat:itemCat,method:method,acct:acct,amt:amt,date:date,memo:document.getElementById('fMemo').value,card:isCardPay};
  if(id){Object.assign(DB.transactions.filter(function(x){return x.id===id})[0],rec);}else{rec.id=uid();DB.transactions.push(rec);}
  logAct((id?'거래수정':'거래추가')+' · '+rec.date+' '+rec.cat+' '+(rec.type==='income'?'+':'-')+won(rec.amt));
  var reg=document.getElementById('fAsset')&&document.getElementById('fAsset').checked;
  save();closeModal();renderCal();renderDash();
  if(reg&&rec.type==='expense')itemModal(null,{name:rec.cat,detail:rec.memo||'',cat:(itemCat&&itemCat!=='해당없음')?itemCat:'전자기기',cond:'신품',price:rec.amt,buy:rec.date,end:'',basis:'일간',units:'',status:'사용중'});
}
function delTxn(id){if(!confirm('삭제할까요?'))return;var _t=DB.transactions.filter(function(t){return t.id===id})[0];logAct('거래삭제 · '+(_t?_t.date+' '+_t.cat+' '+won(_t.amt):id));DB.transactions=DB.transactions.filter(function(t){return t.id!==id});save();renderCal();renderDash();}

/* ====== Supabase 로그인 ====== */
function enter(){document.getElementById('login').style.display='none';document.getElementById('app').classList.add('on');loadState().then(function(d){DB=migrateDB(d);renderGoal();});}
function doLogin(){var email=(document.getElementById('email').value||'').trim(),pw=document.getElementById('pw').value;document.getElementById('loginErr').textContent='로그인 중…';SB.auth.signInWithPassword({email:email,password:pw}).then(function(r){if(r.error){document.getElementById('loginErr').textContent=r.error.message;return;}USER=r.data.user;enter();});}
function doSignup(){var email=(document.getElementById('email').value||'').trim(),pw=document.getElementById('pw').value;if(!email||!pw){document.getElementById('loginErr').textContent='이메일·비밀번호 입력';return;}document.getElementById('loginErr').textContent='가입 중…';SB.auth.signUp({email:email,password:pw}).then(function(r){if(r.error){document.getElementById('loginErr').textContent=r.error.message;return;}if(r.data.session){USER=r.data.user;enter();}else{document.getElementById('loginErr').textContent='가입 완료. 이메일 인증이 켜져 있으면 메일 확인 후 로그인하세요.';}});}
document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('signupBtn').addEventListener('click',doSignup);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
SB.auth.getSession().then(function(r){if(r.data&&r.data.session){USER=r.data.session.user;enter();}});
</script>
