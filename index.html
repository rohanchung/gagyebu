<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rohan Book</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--card:#fff;--soft:#f8fafc;--line:#e4e8f0;--ink:#1b2333;--muted:#6b7789;--accent:#2f6df6;--accent-bg:#eaf1ff;--pos:#0f9d58;--neg:#e0483d;--warn:#b26a00;--warn-bg:#fff6e2;--gold:#a67c1a;--serif:'Cinzel','Gowun Batang',serif;}
*{box-sizing:border-box}
html{overflow-y:scroll}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif}
/* login */
.login{position:fixed;inset:0;background:linear-gradient(160deg,#eef2fb,#f6f8fc);display:flex;align-items:center;justify-content:center;z-index:50}
.login .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 26px;width:320px;box-shadow:0 16px 50px rgba(0,0,0,.1);text-align:center}
.login h1{font-size:22px;margin:0 0 4px}.login p{color:var(--muted);font-size:12px;margin:0 0 18px}
.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;text-align:center;letter-spacing:2px}
.login button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.login .err{color:var(--neg);font-size:12px;min-height:16px;margin-top:8px}
.app{display:none;min-height:100vh;max-width:1680px;margin:0 auto}
.app.on{display:flex}
.side{width:176px;background:linear-gradient(180deg,#fbfaf6,#fff);border-right:1px solid #e8e2cf;padding:16px 10px;flex-shrink:0}
.brand{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px;color:var(--gold);padding:6px 8px 14px;border-bottom:2px solid #ece3c9;margin-bottom:8px;text-align:center}
.side .m{display:flex;gap:8px;padding:10px 11px;border-radius:8px;color:#5a5240;font-size:13px;cursor:pointer;margin-bottom:2px;font-weight:600}
.side .m:hover{background:#f6f1e3}
.side .m.on{background:#f3ead2;color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.side .m.dim{opacity:.45;cursor:default}
.side .sub{font-family:var(--serif);color:var(--gold);font-size:10.5px;padding:14px 11px 4px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.sec h4{font-family:var(--serif);letter-spacing:.3px}
.brand-crest{width:34px;height:34px;vertical-align:middle;margin-bottom:4px}
.main{flex:1;padding:18px;min-width:0}
.view{display:none}.view.on{display:block}
.updated{font-size:11px;color:var(--muted);margin-bottom:12px}.updated b{color:var(--pos)}
.cards3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.c3{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px;cursor:pointer}
.c3:hover{border-color:var(--accent)}
.c3 .l{font-size:11px;color:var(--muted)}.c3 .v{font-size:16px;font-weight:800;margin-top:5px}
.c3 .g{font-size:10px;color:var(--muted);margin-top:6px}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}
.sec h4{margin:0 0 8px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.grp{border-top:1px solid var(--line);padding-top:7px;margin-top:7px}.grp:first-of-type{border-top:0;margin-top:2px}
.ghd{display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;font-weight:700}
.chip{font-size:9px;padding:1px 6px;border-radius:4px;margin-left:5px}
.chip.auto{background:#e7f6ee;color:var(--pos)}.chip.manual,.chip.credit{background:#eef2fb;color:var(--accent)}.chip.check{background:#f0f0f4;color:#7a7a90}
.item{display:flex;justify-content:space-between;padding:8px 9px;margin:3px 0;font-size:12.5px;color:#33425e;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--soft)}
.item:hover{border-color:var(--accent);background:var(--accent-bg)}
.mut{color:var(--muted);font-size:11px}
.hint{font-size:11px;color:var(--muted);margin-top:8px}
.btn{background:var(--accent);border:0;color:#fff;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
.btn.sm{padding:6px 10px;font-size:11.5px}.btn.warn{background:var(--warn)}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 11px;font-size:11.5px;cursor:pointer;font-weight:600}
.cardbox{background:var(--warn-bg);border:1px solid #f0dca5}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.row:last-child{border-bottom:0}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;background:#eef2f8;color:#5a6b86;margin-right:5px}
.badge{font-size:9px;color:#fff;background:var(--warn);padding:1px 5px;border-radius:4px;margin-left:5px}
.acts span{color:var(--muted);cursor:pointer;font-size:11px;margin-left:8px}
.acts span:hover{color:var(--accent)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.mnav{display:flex;align-items:center;gap:12px}.mnav b{font-size:16px}.mnav span{cursor:pointer;color:var(--muted);padding:2px 8px;user-select:none;font-size:15px}
.msum{display:flex;gap:8px}.msum div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:11.5px;text-align:right}.msum .l{color:var(--muted);font-size:9.5px}
.calwrap{display:flex;gap:16px;align-items:flex-start}
.calmain{flex:1;min-width:0}
.calside{width:360px;flex-shrink:0;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
.calside .detail{margin-top:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{color:var(--muted);font-size:11px;text-align:center;padding:4px 0}.dow.s0{color:var(--neg)}.dow.s6{color:var(--accent)}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:96px;padding:5px 6px;cursor:pointer;position:relative;overflow:hidden}
.cell:hover{border-color:var(--accent)}.cell.empty{background:transparent;border:0;cursor:default}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cell.today .dn{color:var(--accent);font-weight:800}
.cell .dhdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.cell .dn{font-size:11px;color:var(--muted)}
.cell .dsum{font-size:9.5px;color:var(--neg);font-weight:700;font-variant-numeric:tabular-nums}
.cell .cl{display:flex;justify-content:space-between;gap:5px;font-size:9.5px;line-height:1.45}
.cell .cl .c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#5a6b86}
.cell .cl .a{flex-shrink:0;font-variant-numeric:tabular-nums;font-weight:600}
.cell .cl.in .a{color:var(--pos)}.cell .cl.ex .a{color:var(--neg)}
.cell .cl.tr .a,.cell .cl.tr .c{color:#8a7bd8}
.cell .cl.in{order:-2}.cell .cl.tr{order:-1}
.cell .cl .sc{display:inline-block;font-size:8px;font-weight:800;padding:0 3px;border-radius:3px;margin-right:3px;vertical-align:middle;line-height:1.5}
.cell .cl .sc.b{background:var(--accent-bg);color:var(--accent)}.cell .cl .sc.p{background:#eef0f4;color:#8a94a6}
.statbar{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;flex:1}
.stat{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 11px;min-width:92px;text-align:right}
.stat .sl{font-size:10px;color:var(--muted);margin-bottom:3px}
.stat .sv{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.watch{background:var(--soft)}
.stat.watch select{font-size:10px;color:var(--muted);border:0;background:transparent;padding:0;margin-bottom:3px;cursor:pointer;font-family:inherit;max-width:96px;text-align:right;direction:rtl}
.stat.watch select:hover{color:var(--accent)}
.cell .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.detail{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px;margin-top:14px}
.dhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.dhd h4{margin:0;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(20,30,50,.4);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.overlay.on{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:460px;padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.22);max-height:90vh;overflow:auto}
.mtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}.modal h3{margin:0;font-size:16px}
.x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.mcur{font-size:22px;font-weight:800;margin:4px 0}
.logrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.logrow .del{color:var(--neg);cursor:pointer;font-size:10.5px;margin-left:8px}
.field{margin-bottom:10px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--muted);font-size:12px;cursor:pointer;font-weight:600}.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.updrow{display:flex;gap:6px;margin-top:12px}.updrow input{flex:1;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px}
.autoNote{background:#e7f6ee;color:#0b6b3a;font-size:11.5px;padding:9px 11px;border-radius:8px;margin-top:10px}
.taxrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.taxrow.big{font-weight:800;font-size:14px;border-bottom:0;background:var(--warn-bg);padding:10px;border-radius:8px;margin-top:6px}
.taxin{width:130px;text-align:right;padding:5px 7px;border:1px solid var(--accent);border-radius:6px;font-size:12px;background:#f7faff}
.settle-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.settle-row:last-child{border-bottom:0}
.settle-row input{width:auto;flex-shrink:0}
.settle-row .sr-d{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.settle-row .sr-c{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settle-row .sr-a{font-weight:700;color:var(--neg);white-space:nowrap;font-variant-numeric:tabular-nums}
.labwrap{overflow:auto;max-height:85vh;border:1px solid var(--line);border-radius:8px}
.labtbl{border-collapse:collapse;font-size:11px;white-space:nowrap}
.labtbl th,.labtbl td{padding:5px 8px;border-bottom:1px solid #eef1f6}
.labtbl thead th{position:sticky;top:0;background:#f8fafc;z-index:2;font-weight:700;text-align:right;cursor:pointer;font-size:10.5px}
.labtbl .cM{position:sticky;left:0;background:#fff;text-align:left;font-weight:600;z-index:1;min-width:130px;box-shadow:1px 0 0 var(--line)}
.labtbl thead .cM{z-index:4;background:#f8fafc}
.labtbl td.v{text-align:right;font-variant-numeric:tabular-nums;cursor:pointer;color:#41506a}
.labtbl td.v:hover{background:var(--accent-bg)}
.labtbl tr.catrow td{background:#eef2f8;font-weight:800;color:#33425e;font-size:10.5px}
.labtbl tr.catrow .cM{background:#eef2f8;z-index:3}
.lab-hi{color:var(--neg);font-weight:800}.lab-lo{color:var(--accent);font-weight:800}
.sajucols{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.sajucols .sc{flex:1;min-width:280px;margin-bottom:0}
.sajucols .scbody{max-height:460px;overflow:auto}
.bub{cursor:pointer;font-size:13px;margin-left:6px;opacity:.28;user-select:none}
.bub.on{opacity:1}.bub:hover{opacity:.8}
.fbadge{font-family:var(--serif);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.5px;white-space:nowrap}
.fbadge.good{background:#f3ead2;color:#8a6d12;border:1px solid #e3d3a0}
.fbadge.bad{background:#fadfd9;color:#a3301f;border:1px solid #edb6ab}
.fbadge.neu{background:#eceae3;color:#6b6552;border:1px solid #ddd8c8}
.moodchip{display:inline-block;font-family:var(--serif);font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--mc);color:var(--mc);cursor:pointer;margin:3px 3px 0 0;user-select:none}
.moodchip.on{background:var(--mc);color:#fff}
.jgrid{column-count:3;column-gap:12px}
@media(max-width:1100px){.jgrid{column-count:2}}
@media(max-width:680px){.jgrid{column-count:1}}
.jentry{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;cursor:pointer;background:var(--card);break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%;vertical-align:top}
.jentry:hover{border-color:var(--gold)}
.jtag{display:inline-block;font-size:9.5px;padding:1px 7px;border-radius:4px;margin-right:4px;font-weight:700}
.wtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.wtab{font-family:var(--serif);font-size:11px;padding:4px 11px;border:1px solid #e3d8bd;border-radius:999px;color:#7a5c12;cursor:pointer;background:#faf7ee}
.wtab.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.foot{padding:14px 8px;color:#9aa6b6;font-size:10.5px;text-align:center}.foot a{color:var(--accent);cursor:pointer}
@media(max-width:900px){.calwrap{flex-direction:column}.calside{width:100%;position:static;max-height:none}}
@media(max-width:640px){.app.on{flex-direction:column}.side{width:100%;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.side .brand{width:100%}.side .m{flex:1 0 auto}.side .sub{display:none}.side .m.dim{display:none}.msum div{padding:5px 7px}}
</style>
</head>
<body>
<!-- 로그인 -->
<div class="login" id="login">
  <div class="box">
    <h1 style="font-family:var(--serif);color:var(--gold);letter-spacing:1px"><img src="favicon.png" style="width:40px;vertical-align:middle;margin-right:4px" alt="">Rohan Book</h1>
    <p>나만 볼 수 있는 개인 재무·건강·명리 · Supabase 로그인</p>
    <input id="email" type="email" placeholder="이메일" autofocus>
    <input id="pw" type="password" placeholder="비밀번호">
    <div class="err" id="loginErr"></div>
    <button id="loginBtn">로그인</button>
    <button id="signupBtn" style="background:#fff;border:1px solid var(--line);color:var(--ink);margin-top:8px">회원가입</button>
    <div class="mut" style="margin-top:12px">처음이면 회원가입 → 이 계정이 본인 계정이 됩니다.</div>
  </div>
</div>

<div class="app" id="app">
  <div class="side">
    <div class="brand"><img src="favicon.png" class="brand-crest" alt=""><br>Rohan Book</div>
    <div class="sub">⚜ 재정</div>
    <div class="m on" data-v="dash">🏰 현황판</div>
    <div class="m" data-v="cal">📜 가계부</div>
    <div class="m" data-v="cashflow">🌊 현금흐름</div>
    <div class="m" data-v="acct">🪙 계좌·부채</div>
    <div class="m" data-v="tax">⚖️ 세무</div>
    <div class="m" data-v="budget">🗝️ 예산</div>
    <div class="sub">⚕ 건강</div>
    <div class="m" data-v="weight">🩹 체중·사고</div>
    <div class="m" data-v="labs">🧪 피검사</div>
    <div class="sub">🔮 명리</div>
    <div class="m" data-v="saju">🕯️ 사주</div>
    <div class="sub">🖋 성찰</div>
    <div class="m" data-v="journal">📖 일지</div>
    <div class="sub">🛡 기타</div>
    <div class="m" data-v="items">🗡️ 재물관리</div>
    <div class="m" data-v="log">🪶 로그</div>
  </div>
  <div class="main">
    <div class="view on" id="v-dash"></div>
    <div class="view" id="v-cal"></div>
    <div class="view" id="v-cashflow"></div>
    <div class="view" id="v-acct"></div>
    <div class="view" id="v-tax"></div>
    <div class="view" id="v-weight"></div>
    <div class="view" id="v-labs"></div>
    <div class="view" id="v-saju"></div>
    <div class="view" id="v-journal"></div>
    <div class="view" id="v-items"></div>
    <div class="view" id="v-budget"></div>
    <div class="view" id="v-log"></div>
    <div class="foot">v1.1 · 데이터는 Supabase에 안전 저장 · <a id="reloadBtn">새로고침</a> · <a id="logoutBtn">로그아웃</a></div>
  </div>
</div>
<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

  opt=opt||{};var W=380,H=170,PL=44,PR=12,PT=14,PB=26,col=opt.color||'#2f6df6';
  var pts=series.filter(function(p){return p.amount!=null}).map(function(p){return {x:mIdx(p.date),v:p.amount}}).sort(function(a,b){return a.x-b.x});
  if(!pts.length)return '<div class="mut" style="padding:14px 0">데이터 없음</div>';
  var vals=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(opt.zeroBase&&mn>0)mn=0;if(mn===mx){mn=mn-1;mx=mx+1;}var span=mx-mn;
  var X=function(i){return PL+(i/11)*(W-PL-PR)},Y=function(v){return PT+(1-(v-mn)/span)*(H-PT-PB)};
  var line=pts.map(function(p){return X(p.x)+','+Y(p.v)}).join(' ');
  var dots=pts.map(function(p){return '<circle cx="'+X(p.x)+'" cy="'+Y(p.v)+'" r="3" fill="'+col+'"/>'}).join('');
  var zero=(mn<0&&mx>0)?'<line x1="'+PL+'" y1="'+Y(0)+'" x2="'+(W-PR)+'" y2="'+Y(0)+'" stroke="#e4e8f0" stroke-dasharray="3 3"/>':'';

function cardPending(){var m=cardPendingByCard(),s=0;for(var k in m)s+=m[k];return s;}

function monthPL(m){var i=0,e=0;monthTxns(m).forEach(function(t){if(t.type==='income')i+=t.amt;else if(t.type==='expense')e+=t.amt});return {inc:i,exp:e,net:i-e};}

function acctBaseline(a){ if(a.opening&&a.opening.date)return {date:a.opening.date,amount:a.opening.amount||0}; var h=(a.hist&&a.hist.length)?a.hist.slice().sort(function(x,y){return x.date<y.date?-1:1}).slice(-1)[0]:null; return h?{date:h.date,amount:h.amount}:{date:'1900-01-01',amount:0}; }
function acctFlow(a){ var base=acctBaseline(a),s=0; DB.transactions.forEach(function(t){ if(!t.date||t.date<base.date)return;
  if(t.type==='income'&&t.acct===a.id)s+=t.amt;
  else if(t.type==='expense'&&t.acct===a.id)s-=t.amt;

   +'<div class="taxrow"><span>강사 연수입(940903)</span>'+fld('t_gangsa',p.gangsaIncome)+'</div>'

   +'<div class="taxrow"><span>(−) 노랑우산 연납(한도 500만)</span>'+fld('t_noorang',p.noorang)+'</div>'
   +'<div class="taxrow"><span>(−) 국민연금 연납</span>'+fld('t_pension',p.pension)+'</div>'
   +'<div class="taxrow"><span>(−) 기본공제</span>'+fld('t_basic',p.basic)+'</div>'

   +'<div class="taxrow"><span>소득공제 합계</span><span>'+won(sodeuk)+'</span></div>'
   +'<div class="taxrow"><span>과세표준</span><b>'+won(base)+'</b></div>'

function cfBuildSankey(txns){

    else if(t.type==='settle'&&t.acct){K['ex:카드결제']=(K['ex:카드결제']||0)+t.amt;A[t.acct]=A[t.acct]||{in:0,out:0};A[t.acct].out+=t.amt;linksAK.push({a:t.acct,k:'ex:카드결제',v:t.amt});}

function cfSankeySVG(g){
  var sK=Object.keys(g.S),aK=Object.keys(g.A),kK=Object.keys(g.K);
  if(!sK.length&&!kK.length)return '<div class="mut" style="padding:24px 0;text-align:center">계좌를 붙인 수입·지출 거래가 있어야 흐름이 그려집니다.<br>9월부터 새 방식으로 입력하면 자동으로 채워집니다.</div>';

  var colK=kK.map(function(k){return {key:k,label:k.slice(0,3)==='sv:'?('▶'+acctName(k.slice(3))):k.slice(3),v:g.K[k]};});

  var sum=function(c){return c.reduce(function(s,n){return s+n.v;},0);};

  var maxN=Math.max(colS.length,colA.length,colK.length,1);
  var gap=8,minH=12,targetH=Math.max(280,maxN*30);
  var scale=(targetH-gap*(maxN-1))/maxTot;
  var W=680,nw=120,xS=6,xA=(W-nw)/2,xK=W-nw-6;
  function layout(col,x){var y=8,pos={};col.forEach(function(n){var h=Math.max(minH,n.v*scale);pos[n.key]={x:x,y:y,h:h,v:n.v,label:n.label};y+=h+gap;});pos._bottom=y;return pos;}
  var pS=layout(colS,xS),pA=layout(colA,xA),pK=layout(colK,xK);
  var svgH=Math.max(pS._bottom,pA._bottom,pK._bottom,300);
  var cur={};function cursor(k){if(!cur[k])cur[k]={inL:0,outR:0};return cur[k];}
  function link(x1,y1,x2,y2,w,color){var mx=(x1+x2)/2;return '<path d="M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2+'" stroke="'+color+'" stroke-width="'+Math.max(1,w)+'" fill="none" opacity="0.3"/>';}
  var paths='';
  g.linksSA.forEach(function(l){var sp=pS[l.s],ap=pA[l.a];if(!sp||!ap)return;var w=l.v*scale,cs=cursor('s'+l.s),ca=cursor('a'+l.a);var y1=sp.y+cs.outR+w/2;cs.outR+=w;var y2=ap.y+ca.inL+w/2;ca.inL+=w;paths+=link(sp.x+nw,y1,ap.x,y2,w,'#0f9d58');});
  g.linksAK.forEach(function(l){var ap=pA[l.a],kp=pK[l.k];if(!ap||!kp)return;var w=l.v*scale,ca=cursor('a'+l.a),ck=cursor('k'+l.k);var y1=ap.y+ca.outR+w/2;ca.outR+=w;var y2=kp.y+ck.inL+w/2;ck.inL+=w;var col=l.k.slice(0,3)==='sv:'?'#2f6df6':'#e0483d';paths+=link(ap.x+nw,y1,kp.x,y2,w,col);});
  var rects='';
  function drawCol(pos,fill,anchor){Object.keys(pos).forEach(function(k){if(k==='_bottom')return;var n=pos[k];rects+='<rect x="'+n.x+'" y="'+n.y+'" width="'+nw+'" height="'+n.h+'" rx="3" fill="'+fill+'"/>';var tx=anchor==='start'?n.x+5:(anchor==='end'?n.x+nw-5:n.x+nw/2);rects+='<text x="'+tx+'" y="'+(n.y+n.h/2+3.5)+'" font-size="10" fill="#1b2333" text-anchor="'+anchor+'">'+cfClip(n.label)+' '+cfShort(n.v)+'</text>';});}
  drawCol(pS,'#d6f0e0','start');drawCol(pA,'#e3e9f5','middle');drawCol(pK,'#f7ddd9','end');
  return '<svg viewBox="0 0 '+W+' '+svgH+'" style="width:100%;height:auto;max-height:520px">'+paths+rects+'</svg>';
}

function labSChart(name,m){var H=DB.health;var vals=H.labValues[name]||[];var n=H.labDates.length;
  var pts=[];for(var i=0;i<n;i++){if(typeof vals[i]==='number')pts.push({i:i,v:vals[i]});}
  if(!pts.length)return '<div class="mut" style="padding:10px 0">숫자 기록 없음</div>';
  var W=440,HH=150,PL=38,PR=10,PT=12,PB=18;var vv=pts.map(function(p){return p.v;});var mn=Math.min.apply(null,vv),mx=Math.max.apply(null,vv);
  if(m.low!=null)mn=Math.min(mn,m.low);if(m.high!=null)mx=Math.max(mx,m.high);if(mn===mx){mn-=1;mx+=1;}var span=mx-mn;
  var X=function(i){return PL+(i/(n-1||1))*(W-PL-PR);},Y=function(v){return PT+(1-(v-mn)/span)*(HH-PT-PB);};
  var band='';if(m.low!=null&&m.high!=null){var y1=Y(m.high),y2=Y(m.low);band='<rect x="'+PL+'" y="'+y1+'" width="'+(W-PL-PR)+'" height="'+Math.max(1,y2-y1)+'" fill="#e7f6ee"/>';}
  var line=pts.map(function(p){return X(p.i)+','+Y(p.v);}).join(' ');
  var dots=pts.map(function(p){var f=labFlag(m,p.v);var c=f==='hi'?'#e0483d':f==='lo'?'#2f6df6':'#0f9d58';return '<circle cx="'+X(p.i)+'" cy="'+Y(p.v)+'" r="3" fill="'+c+'"/>';}).join('');
  return '<svg viewBox="0 0 '+W+' '+HH+'" width="100%" style="display:block;margin-top:8px">'+band+'<polyline points="'+line+'" fill="none" stroke="#5a6b86" stroke-width="2"/>'+dots+'<text x="4" y="'+(PT+4)+'" font-size="9" fill="#9aa6b6">'+mx+'</text><text x="4" y="'+(HH-PB+4)+'" font-size="9" fill="#9aa6b6">'+mn+'</text></svg>';
}

/* ====== 명리(사주) ====== */
var SAJU_GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var SAJU_JI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var SAJU_OH={甲:'목',乙:'목',丙:'화',丁:'화',戊:'토',己:'토',庚:'금',辛:'금',壬:'수',癸:'수'};
var SAJU_YIN={甲:0,乙:1,丙:0,丁:1,戊:0,己:1,庚:0,辛:1,壬:0,癸:1};
var JIJANG={子:'癸',丑:'己',寅:'甲',卯:'乙',辰:'戊',巳:'丙',午:'丁',未:'己',申:'庚',酉:'辛',戌:'戊',亥:'壬'};
var YUKHAP={子:'丑',丑:'子',寅:'亥',亥:'寅',卯:'戌',戌:'卯',辰:'酉',酉:'辰',巳:'申',申:'巳',午:'未',未:'午'};
var YUKCHUNG={子:'午',午:'子',丑:'未',未:'丑',寅:'申',申:'寅',卯:'酉',酉:'卯',辰:'戌',戌:'辰',巳:'亥',亥:'巳'};
var GANCHUNG={甲:'庚',庚:'甲',乙:'辛',辛:'乙',丙:'壬',壬:'丙',丁:'癸',癸:'丁'};
var SAMHAP=[['寅','午','戌'],['申','子','辰'],['亥','卯','未'],['巳','酉','丑']];
function sjJDN(y,m,d){var a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function sjSolarLong(JD){var T=(JD-2451545.0)/36525.0;var L0=280.46646+36000.76983*T+0.0003032*T*T;var M=(357.52911+35999.05029*T-0.0001537*T*T)*Math.PI/180;var C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);var lam=(L0+C)%360;return lam<0?lam+360:lam;}
function sjPillars(y,m,d){var J=sjJDN(y,m,d);var di=((J+49)%60+60)%60;var lam=sjSolarLong(J);var k=Math.floor(((((lam-315)%360)+360)%360)/30);var mb=(k+2)%12;var sy=y;if(m===1||(m===2&&lam<315))sy=y-1;var ys=((sy-4)%10+10)%10,yb=((sy-4)%12+12)%12;var mss=((ys%5)*2+2)%10;var ms=(mss+k)%10;return {year:SAJU_GAN[ys]+SAJU_JI[yb],month:SAJU_GAN[ms]+SAJU_JI[mb],day:SAJU_GAN[di%10]+SAJU_JI[di%12],dayStem:SAJU_GAN[di%10],dayBranch:SAJU_JI[di%12]};}
function sipsin(ilgan,g){if(!g)return '';var order=['목','화','토','금','수'];var ie=SAJU_OH[ilgan],te=SAJU_OH[g];var di=(order.indexOf(te)-order.indexOf(ie)+5)%5;var same=SAJU_YIN[ilgan]===SAJU_YIN[g];return {0:same?'비견':'겁재',1:same?'식신':'상관',2:same?'편재':'정재',3:same?'편관':'정관',4:same?'편인':'정인'}[di];}
function jiSipsin(ilgan,branch){return sipsin(ilgan,JIJANG[branch]);}
function seunGZ(year){var ys=((year-4)%10+10)%10,yb=((year-4)%12+12)%12;return SAJU_GAN[ys]+SAJU_JI[yb];}
function isSamjae(year){var yb=((year-4)%12+12)%12;return ['申','酉','戌'].indexOf(SAJU_JI[yb])>=0;}
function sajuAge(dateStr){var b=DB.saju.birth.solar.split('-'),d=dateStr.split('-');var a=+d[0]-+b[0];if(+d[1]<+b[1]||(+d[1]==+b[1]&&+d[2]<+b[2]))a--;return a;}
function sajuCurDaeun(){var age=sajuAge(todayStr()),L=DB.saju.daeun.list,cur=L[0];for(var i=0;i<L.length;i++){if(age>=L[i][0])cur=L[i];}return {age:age,gz:cur[1],from:cur[0]};}
function natalBranches(){var n=DB.saju.natal;return [n.year[1],n.month[1],n.day[1],n.hour[1]];}
function isHyeong(a,b){var g1=['寅','巳','申'],g2=['丑','戌','未'];if(a===b)return ['辰','午','酉','亥'].indexOf(a)>=0;if(g1.indexOf(a)>=0&&g1.indexOf(b)>=0)return true;if(g2.indexOf(a)>=0&&g2.indexOf(b)>=0)return true;if((a==='子'&&b==='卯')||(a==='卯'&&b==='子'))return true;return false;}
function dayFlags(y,m,d){var p=sjPillars(y,m,d),T=p.dayBranch,TG=p.dayStem,N=natalBranches(),fl=[];
  N.forEach(function(n){if(YUKCHUNG[T]===n)fl.push({t:'충',w:'주의',d:T+n+'충'});});
  N.forEach(function(n){if(isHyeong(T,n))fl.push({t:'형',w:'주의',d:T+n+'형'});});
  N.forEach(function(n){if(YUKHAP[T]===n)fl.push({t:'합',w:'특이',d:T+n+'합'});});
  SAMHAP.forEach(function(g){if(g.indexOf(T)>=0){var hit=N.filter(function(n){return g.indexOf(n)>=0&&n!==T;});if(hit.length>=2)fl.push({t:'삼합',w:'특이',d:g.join('')+'삼합'});else if(hit.length===1)fl.push({t:'반합',w:'특이',d:T+hit[0]+'반합'});}});
  if(GANCHUNG[DB.saju.ilgan]===TG)fl.push({t:'천간충',w:'주의',d:TG+DB.saju.ilgan+'충'});
  if(DB.saju.gongmang.indexOf(T)>=0)fl.push({t:'공망',w:'특이',d:T+'공망일'});
  // 중복 제거
  var seen={},out=[];fl.forEach(function(f){if(!seen[f.d]){seen[f.d]=1;out.push(f);}});return {gz:p.day,flags:out};}
function sajuEsc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rmk(key){return (DB.saju.readings&&DB.saju.readings[key])?' 💬':'';}
function sajuRead(key,title){var r=(DB.saju.readings||{})[key];
  openModal('<div class="mtop"><h3>'+title+'</h3><span class="x" onclick="closeModal()">×</span></div>'
   +(r?'<div style="font-size:13px;line-height:1.7;white-space:pre-wrap">'+sajuEsc(r.text)+'</div><div class="mut" style="margin-top:10px;font-size:10px">Claude 해석 · 저장 '+(r.savedAt||'')+'</div>'
      :'<div class="mut" style="padding:10px 0;line-height:1.6">아직 저장된 해석이 없습니다.<br>Claude에게 <b>"'+title+' 평가해줘"</b>라고 요청하면, 해석 후 여기에 저장할 수 있습니다.</div>')
   +'</div>');}
function bub(key,title){var has=DB.saju.readings&&DB.saju.readings[key];return '<span class="bub'+(has?' on':'')+'" onclick="event.stopPropagation();sajuRead(\''+key+'\',\''+(''+title).replace(/'/g,'')+'\')" title="해석">💬</span>';}
function sajuPickYear(y){DB.ui.sajuYear=y;var mm=(DB.ui.sajuYM&&DB.ui.sajuYM.slice(5))||String(new Date().getMonth()+1).padStart(2,'0');DB.ui.sajuYM=y+'-'+mm;save();renderSaju();}
function sajuPickMonth(ym){DB.ui.sajuYM=ym;DB.ui.sajuYear=parseInt(ym.slice(0,4));save();renderSaju();}
function renderSaju(){
  var S=DB.saju,ig=S.ilgan,N=S.natal,cd=sajuCurDaeun(),curY=new Date().getFullYear();
  var selY=DB.ui.sajuYear||curY;
  function pillCard(lbl,gz){return '<div style="text-align:center"><div class="mut" style="font-size:10px">'+lbl+'</div><div style="font-size:22px;font-weight:800;margin:2px 0">'+gz[0]+'</div><div style="font-size:22px;font-weight:800">'+gz[1]+'</div><div style="font-size:9.5px;color:var(--muted);margin-top:3px">'+sipsin(ig,gz[0])+'<br>'+jiSipsin(ig,gz[1])+'</div></div>';}
  var wonguk='<div style="display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap">'+pillCard('연주',N.year)+pillCard('월주',N.month)+pillCard('일주 (나)',N.day)+pillCard('시주',N.hour)+'</div>';
  var daeun=S.daeun.list.map(function(x){var on=(cd.from===x[0]);var key='daeun:'+x[0];return '<div class="stat'+(on?'':' watch')+'" style="min-width:64px;text-align:center'+(on?';border:2px solid var(--accent)':'')+'"><div class="sl">'+x[0]+'~ '+bub(key,x[0]+'세 대운 '+x[1])+'</div><div class="sv" style="font-size:13px">'+x[1]+'</div></div>';}).join('');
  var yrs='';for(var yy=curY-5;yy<=curY+10;yy++){var gz=seunGZ(yy),sj=isSamjae(yy),on=(yy===curY),sel=(yy===selY),key='year:'+yy;
    yrs+='<div class="row" style="cursor:pointer'+(sel?';background:var(--accent-bg)':'')+'" onclick="sajuPickYear('+yy+')"><span><b>'+yy+'</b> <span style="font-size:15px;font-weight:800">'+gz+'</span> <span class="mut">'+sipsin(ig,gz[0])+'·'+jiSipsin(ig,gz[1])+'</span>'+(on?' <span class="chip auto">올해</span>':'')+(sj?' <span class="chip" style="background:#fde2e2;color:#a32d2d">삼재</span>':'')+'</span>'+bub(key,yy+' 세운 '+gz)+'</div>';}
  var ym=DB.ui.sajuYM||todayStr().slice(0,7); if(ym.slice(0,4)!==(''+selY))ym=selY+'-'+ym.slice(5); var selMM=ym.slice(5);
  var months='';for(var M=1;M<=12;M++){var mm=String(M).padStart(2,'0');var mp=sjPillars(selY,M,15).month;var mkey='month:'+selY+'-'+mm;var msel=(selMM===mm);
    months+='<div class="row" style="cursor:pointer'+(msel?';background:var(--accent-bg)':'')+'" onclick="sajuPickMonth(\''+selY+'-'+mm+'\')"><span><b>'+M+'월</b> <span style="font-size:15px;font-weight:800">'+mp+'</span> <span class="mut">'+sipsin(ig,mp[0])+'·'+jiSipsin(ig,mp[1])+'</span></span>'+bub(mkey,selY+'년 '+M+'월 '+mp)+'</div>';}
  var mA=+selMM,dim=new Date(selY,mA,0).getDate();
  var special='';for(var dd=1;dd<=dim;dd++){var df=dayFlags(selY,mA,dd);if(df.flags.length){
    var bad=df.flags.some(function(f){return f.t==='충'||f.t==='형'||f.t==='천간충';});
    var good=df.flags.some(function(f){return f.t==='합'||f.t==='삼합'||f.t==='반합';});
    var vb=bad?'<span class="fbadge bad">⚔ 凶</span>':(good?'<span class="fbadge good">⚜ 吉</span>':'<span class="fbadge neu">◈ 平</span>');
    var ds=selY+'-'+selMM+'-'+String(dd).padStart(2,'0'),dkey='day:'+ds;
    special+='<div class="row"><span>'+vb+' <b>'+mA+'/'+dd+'</b> <span style="font-weight:800">'+df.gz+'</span> <span class="mut" style="font-size:10px">'+df.flags.map(function(f){return f.d;}).join('·')+'</span></span>'+bub(dkey,ds+' '+df.gz)+'</div>';}}
  if(!special)special='<div class="mut" style="padding:8px 0">이 달 특이일 없음</div>';
  document.getElementById('v-saju').innerHTML=''
   +'<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">'
   +'<div class="sec" style="flex:2;min-width:340px;margin-bottom:0"><h4>🔮 총운 <span class="mut">'+S.birth.solar+' · 일간 '+ig+'('+SAJU_OH[ig]+') · '+S.gyeok+' · 공망 '+S.gongmang.join('')+'</span>'+bub('natal','총운(원국) 해석')+'</h4>'+wonguk
   +'<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12px"><b>현재 대운</b> '+cd.gz+' <span class="mut">('+cd.from+'~'+(cd.from+9)+'세, 만 '+cd.age+'세) · '+sipsin(ig,cd.gz[0])+'·'+jiSipsin(ig,cd.gz[1])+'</span></div></div>'
   +'<div class="sec" style="flex:1.5;min-width:300px;margin-bottom:0"><h4>대운 흐름 <span class="mut">💬 클릭</span></h4><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">'+daeun+'</div></div>'
   +'</div>'
   +'<div class="sajucols">'
   +'<div class="sec sc"><h4>연도별 세운 <span class="mut">클릭→월별 / 💬</span></h4><div class="scbody">'+yrs+'</div></div>'
   +'<div class="sec sc"><h4>'+selY+'년 월별 <span class="mut">클릭→특이일 / 💬</span></h4><div class="scbody">'+months+'</div></div>'
   +'<div class="sec sc"><h4>특이일 <span class="mut">'+ym+' / 💬</span></h4><div class="scbody">'+special+'</div></div>'
   +'</div>'
   +'<div class="hint" style="padding:0 4px 8px">행 클릭 = 드릴다운(연도→월→일). 💬 = 저장된 해석 모달.</div>'
   +'<div class="sec"><h4>🧭 인생 총운 <span class="mut">스토리 · 차후 업데이트됨</span></h4><div style="font-size:13.5px;line-height:1.85;white-space:pre-wrap;color:#33425e">'+(S.story?sajuEsc(S.story):'<span class="mut">아직 스토리 없음 — "인생 총운 스토리 써줘" 하면 Claude가 작성·저장.</span>')+'</div></div>';
}

var MOODS=[['깨달음','#a67c1a'],['다짐','#00695c'],['기쁨','#2e7d32'],['재밌음','#1565c0'],['반성','#c2185b'],['슬픔','#c62828'],['우울함','#6a1b9a'],['쓸쓸함','#616161']];
function moodColor(n){var m=MOODS.filter(function(x){return x[0]===n})[0];return m?m[1]:'#888';}
function nowLocal(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}
function fmtJ(dt){if(!dt)return '';return dt.replace('T',' ');}
function renderJournal(){
  var J=(DB.journal||[]).slice().sort(function(a,b){return (a.date||'')<(b.date||'')?1:-1;});
  var rows=J.map(function(e){
    var tags=(e.moods||[]).map(function(mn){var c=moodColor(mn);return '<span class="jtag" style="background:'+c+'1f;color:'+c+'">'+mn+'</span>';}).join('');
    return '<div class="jentry" data-editjournal="'+e.id+'"><div style="margin-bottom:5px"><div style="font-family:var(--serif);font-weight:700;font-size:14px">'+(e.title||'(무제)')+'</div><div class="mut" style="font-size:10.5px">'+fmtJ(e.date)+(e.place?' · '+e.place:'')+'</div></div>'+(tags?'<div style="margin-bottom:6px">'+tags+'</div>':'')+((e.body||'')?'<div style="font-size:12.5px;color:#41506a;line-height:1.65;white-space:pre-wrap">'+sajuEsc(e.body)+'</div>':'')+'</div>';
  }).join('');
  var grid=rows?'<div class="jgrid">'+rows+'</div>':'<div class="mut" style="padding:10px 0">아직 기록이 없다. 생각·마음·흔들림·기쁨을 그때그때 남겨라.</div>';
  document.getElementById('v-journal').innerHTML='<div class="sec"><h4>📖 일지 <span class="mut">생각·마음·흔들림·기쁨 ('+J.length+') · 카드 클릭 → 수정/삭제</span> <button class="ghost" id="addJournalBtn" style="float:right">+ 기록</button></h4>'+grid+'</div>';
}
function journalModal(id){
  var e=id?(DB.journal||[]).filter(function(x){return x.id===id})[0]:{date:nowLocal(),title:'',moods:[],place:'',body:''};
  var chips=MOODS.map(function(m){var on=(e.moods||[]).indexOf(m[0])>=0;return '<span class="moodchip'+(on?' on':'')+'" data-mood="'+m[0]+'" style="--mc:'+m[1]+'" onclick="this.classList.toggle(\'on\')">'+m[0]+'</span>';}).join('');
  openModal('<div class="mtop"><h3 style="font-family:var(--serif)">'+(id?'일지 수정':'일지 기록')+'</h3><span class="x" onclick="closeModal()">×</span></div>'
   +'<div class="field"><label>한줄 메모</label><input id="j_title" value="'+(e.title||'').replace(/"/g,'&quot;')+'" placeholder="오늘의 한 줄"></div>'
   +'<div style="display:flex;gap:8px"><div class="field" style="flex:1"><label>날짜·시간</label><input id="j_date" type="datetime-local" value="'+(e.date||nowLocal())+'"></div><div class="field" style="flex:1"><label>장소</label><input id="j_place" value="'+(e.place||'').replace(/"/g,'&quot;')+'" placeholder="선택"></div></div>'
   +'<div class="field"><label>감정 <span class="mut">(복수 선택)</span></label><div id="j_moods">'+chips+'</div></div>'
   +'<div class="field"><label>텍스트</label><textarea id="j_body" rows="15" style="min-height:280px;line-height:1.7" placeholder="마음 가는 대로…">'+(e.body||'')+'</textarea></div>'
   +'<button class="btn" onclick="saveJournal('+(id?"'"+id+"'":'null')+')">저장</button>'+(id?' <button class="ghost" onclick="delJournal(\''+id+'\')">삭제</button>':''));
}
function saveJournal(id){
  var title=document.getElementById('j_title').value.trim(),body=document.getElementById('j_body').value;
  if(!title&&!body.trim())return alert('한줄 메모나 텍스트를 입력하세요');
  var moods=[];var ch=document.querySelectorAll('#j_moods .moodchip.on');for(var i=0;i<ch.length;i++)moods.push(ch[i].dataset.mood);
  var rec={date:document.getElementById('j_date').value||nowLocal(),title:title,moods:moods,place:document.getElementById('j_place').value.trim(),body:body};
  DB.journal=DB.journal||[];
  if(id){Object.assign(DB.journal.filter(function(x){return x.id===id})[0],rec);}else{rec.id=uid();DB.journal.push(rec);}
  logAct((id?'일지수정':'일지기록')+' · '+(title||'(무제)'));save();closeModal();renderJournal();
}
function delJournal(id){if(!confirm('이 기록을 삭제할까요?'))return;DB.journal=DB.journal.filter(function(e){return e.id!==id});save();closeModal();renderJournal();}

function computeMonthly(balance,ratePct,n,method){
  var r=(ratePct||0)/100/12; if(!n)return {monthly:0,note:'잔여 횟수를 입력하세요'};
  if(method==='만기일시')return {monthly:Math.round(balance*r),note:'이자만 매월 납부, 원금은 만기 일시상환'};
  if(method==='원리금균등'){var m=r===0?balance/n:balance*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);return {monthly:Math.round(m),note:'매월 동일액(원금+이자 합계 고정)'};}
  var p=balance/n, first=p+balance*r, last=p+(balance/n)*r;
  return {monthly:Math.round(first),note:'원금균등: 첫달 '+won(first)+' → 매월 감소(마지막 '+won(last)+'). 저장값=첫달 기준'};
}

function calcSched(id){
  var d=DB.debts.filter(function(x){return x.id===id})[0];
  var res=computeMonthly(d.balance,numv('s_rate'),numv('s_remain'),document.getElementById('s_method').value);
  document.getElementById('s_out').innerHTML='월 상환액 <b>'+won(res.monthly)+'</b>';
  document.getElementById('s_note').textContent=res.note;
}
function saveSched(id){
  var d=DB.debts.filter(function(x){return x.id===id})[0];
  var method=document.getElementById('s_method').value,rate=numv('s_rate'),n=numv('s_remain');
  var res=computeMonthly(d.balance,rate,n,method); d.rate=rate;
  d.schedule={grace:document.getElementById('s_grace').value,start:document.getElementById('s_start').value,method:method,monthly:res.monthly,remain:n};
  save();closeModal();renderAcct();renderDash();
}

  if(m.dataset.v==='cal')renderCal();if(m.dataset.v==='cashflow')renderCashflow();if(m.dataset.v==='acct')renderAcct();if(m.dataset.v==='tax')renderTax();if(m.dataset.v==='items')renderItems();if(m.dataset.v==='budget')renderBudget();if(m.dataset.v==='log')renderLog();if(m.dataset.v==='weight')renderWeight();if(m.dataset.v==='labs')renderLabs();if(m.dataset.v==='saju')renderSaju();if(m.dataset.v==='journal')renderJournal();
});})(navs[i]);

var _labtip=document.createElement('div');_labtip.style.cssText='position:fixed;z-index:100;background:#1b2333;color:#fff;font-size:11px;padding:6px 9px;border-radius:6px;max-width:240px;pointer-events:none;display:none;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.22)';document.body.appendChild(_labtip);
document.addEventListener('mouseover',function(e){var t=e.target.closest('[data-tip]');if(t){_labtip.textContent=t.getAttribute('data-tip');_labtip.style.display='block';}});
document.addEventListener('mousemove',function(e){if(_labtip.style.display==='block'){var x=e.clientX+14,y=e.clientY+16;if(x>window.innerWidth-250)x=e.clientX-250;_labtip.style.left=x+'px';_labtip.style.top=y+'px';}});

document.getElementById('reloadBtn').addEventListener('click',function(){location.reload();});
document.getElementById('logoutBtn').addEventListener('click',function(){SB.auth.signOut().then(function(){location.reload();});});

/* ====== Supabase 로그인 ====== */
function enter(){document.getElementById('login').style.display='none';document.getElementById('app').classList.add('on');loadState().then(function(d){DB=migrateDB(d);renderDash();});}
function doLogin(){var email=(document.getElementById('email').value||'').trim(),pw=document.getElementById('pw').value;document.getElementById('loginErr').textContent='로그인 중…';SB.auth.signInWithPassword({email:email,password:pw}).then(function(r){if(r.error){document.getElementById('loginErr').textContent=r.error.message;return;}USER=r.data.user;enter();});}
function doSignup(){var email=(document.getElementById('email').value||'').trim(),pw=document.getElementById('pw').value;if(!email||!pw){document.getElementById('loginErr').textContent='이메일·비밀번호 입력';return;}document.getElementById('loginErr').textContent='가입 중…';SB.auth.signUp({email:email,password:pw}).then(function(r){if(r.error){document.getElementById('loginErr').textContent=r.error.message;return;}if(r.data.session){USER=r.data.user;enter();}else{document.getElementById('loginErr').textContent='가입 완료. 이메일 인증이 켜져 있으면 메일 확인 후 로그인하세요.';}});}
document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('signupBtn').addEventListener('click',doSignup);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
SB.auth.getSession().then(function(r){if(r.data&&r.data.session){USER=r.data.session.user;enter();}});
</script>
