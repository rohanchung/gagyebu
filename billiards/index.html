<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>당구 연습장</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!--
  🎱 아버지 당구 연습장 — 로한북과 완전히 별개인 앱. (2026-09-26 v1)
  🔒 같은 Supabase 프로젝트를 쓰지만 코드·테이블·계정은 공유하지 않는다.
     · 테이블: bb_boards · bb_attempts · bb_events (RLS: 본인 + app_metadata.app='billiards')
     · 로한 계정으로 들어오면 로그아웃시킨다(반대쪽 로한북도 똑같이 아버지를 막는다)
  🔒 실버 UX 원칙 — 60세 이상 · 32인치 이상 모니터 · 마우스
     1. 글자 20px↑ · 버튼 56px↑ · 아이콘엔 반드시 글자를 같이
     2. 클릭만으로 전부 된다. 더블클릭·우클릭·마우스 올려야 보이는 기능 없음
     3. 지금 무슨 모드인지 글자로 늘 보인다
     4. 자동 저장. 지우기는 휴지통(30일). 되돌리기는 늘 보인다
  좌표: 다이아 단위. 가로 0~8 · 세로 0~4 (화면은 ×100)
-->
<style>
:root{
  --bg:#f3efe6; --card:#ffffff; --ink:#161616; --sub:#4d4d4d; --line:#bdb5a4;
  --green:#1d6b3f; --green-d:#11482a; --cloth:#2a8a52; --cushion:#17613a; --wood:#5b3a22;
  --blue:#1650d8; --red:#d0231a; --warn:#b3261e; --focus:#ff9f1a; --pick:#fff3cf;
}
*{box-sizing:border-box}
/* 글자 크기 = 화면 폭·높이 중 작은 쪽에 맞춘다(스크롤이 안 생기게).
   32인치 브라우저 창(2560×1300) ≈ 24px · 4K 100% 배율이면 30px 까지.
   🔒 v1.1: 폭만 보고 키웠더니 실제 브라우저 창(주소창·탭 빼면 높이 ~1300)에서 오른쪽 패널에 스크롤이 생겼다 */
html{font-size:clamp(15px,min(0.95vw,1.85vh),30px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:1rem;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{min-height:2.6rem;padding:.25rem .8rem;border:2px solid #857d6c;border-radius:.6rem;background:#fff;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:700;white-space:nowrap}
button:hover{background:var(--pick);border-color:#4d4637}
button:disabled{opacity:.4;cursor:not-allowed;background:#fff}
button.on{background:var(--green);border-color:var(--green-d);color:#fff}
button.primary{background:var(--green);border-color:var(--green-d);color:#fff}
button.primary:hover{background:#15552f}
button.danger{border-color:var(--warn);color:var(--warn)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
.ic{font-size:1.35em;line-height:1}
input[type=text],input[type=email],input[type=password],input[type=number],select{
  min-height:2.8rem;padding:.3rem .7rem;border:2px solid #857d6c;border-radius:.5rem;background:#fff;width:100%}
.hide{display:none!important}

/* ── 로그인 ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.lcard{background:var(--card);border:2px solid var(--line);border-radius:1rem;padding:2rem 2.2rem;width:min(30rem,94vw);box-shadow:0 .4rem 1.4rem rgba(0,0,0,.08)}
.lcard h1{font-size:1.6rem;margin:0 0 1.4rem;text-align:center}
.lcard label{display:block;font-weight:700;margin:1rem 0 .35rem}
.lcard input{min-height:3.2rem;font-size:1.1rem}
.pwrow{display:flex;gap:.5rem}
.pwrow button{flex:none}
#loginBtn{width:100%;min-height:3.6rem;font-size:1.25rem;margin-top:1.5rem}
#loginErr{margin-top:1rem;color:var(--warn);font-weight:700;min-height:1.5em}

/* ── 앱 머리 ── */
.top{display:flex;align-items:center;gap:.5rem;padding:.35rem .8rem;background:#fff;border-bottom:2px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;font-size:1.2rem;margin-right:.5rem}
#tabs{display:flex;gap:.35rem;flex-wrap:wrap}
#tabs button{min-height:2.6rem;border-radius:.6rem .6rem 0 0;border-bottom-width:4px}
#tabs button.on{border-bottom-color:var(--focus)}
.sp{flex:1}
.bbar{display:flex;align-items:center;gap:.5rem;padding:.35rem .8rem;flex-wrap:wrap}
.bname{font-size:1.25rem;font-weight:800;margin-right:.5rem}
.save{font-weight:700;color:var(--green)}
.save.bad{color:var(--warn)}

/* ── 작업판 ──
   🔒 한 화면에 전부 들어간다(스크롤 없음). 당구대는 "남은 자리"를 채운다 —
      도구줄이 두 줄로 접혀도 당구대가 줄어들 뿐, [기록하기]·[긋기 끝] 이 화면 밖으로 밀리지 않는다.
      (v1 첫 판: 도구줄을 당구대 아래에 뒀더니 32인치에서 잘렸다) */
#app{height:100vh;display:flex;flex-direction:column}
#workv{flex:1;min-height:0;display:flex;flex-direction:column}
#logv{flex:1;min-height:0;overflow:auto}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 19rem;gap:.7rem;padding:0 .8rem .6rem}
.stage,.box{background:var(--card);border:2px solid var(--line);border-radius:.9rem}
.stage{padding:.4rem .5rem .4rem;display:flex;flex-direction:column;min-height:0}
.hint{flex:1;min-width:14rem;min-height:2.6rem;display:flex;align-items:center;font-size:1rem;line-height:1.25;font-weight:700;padding:.15rem .7rem;margin-left:.4rem;border-radius:.5rem;background:#eef6f0;border:2px solid #b9d9c4}
.tblwrap{flex:1;min-height:10rem;position:relative;margin-top:.35rem}
#tbl{position:absolute;inset:0;display:block;width:100%;height:100%;user-select:none;touch-action:none}
#tbl.m-ball{cursor:default}
#tbl.m-draw{cursor:crosshair}
.seq{font-size:1.05rem;margin:0 .6rem;white-space:nowrap}
.seq b{font-size:1.1rem}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.tools .lbl{font-weight:700}
.tools .div{width:2px;align-self:stretch;background:var(--line);margin:0 .15rem}
.grp{display:inline-flex;gap:.3rem;align-items:center}
.side{display:flex;flex-direction:column;gap:.4rem;min-height:0;overflow:auto}
.box{padding:.35rem .7rem .5rem}
.box h3{margin:0 0 .3rem;font-size:1.05rem}
.box h3 small{font-weight:400;color:var(--sub)}
.row{display:flex;gap:.4rem;flex-wrap:wrap}
.row button{flex:1}
.tipgrid{display:flex;align-items:center;gap:.6rem;margin-top:.35rem}
#tip{display:block;flex:none;width:8rem;height:8rem;cursor:crosshair}
.tipbtn{flex:1;display:flex;flex-direction:column;gap:.5rem}
#tipTxt{text-align:center;font-weight:800;font-size:1.05rem;min-height:1.4em;margin-top:.2rem}
#tipTxt2{text-align:center;color:var(--sub);font-size:.9rem;min-height:1.3em}
.spd{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem}
.spd button{flex-direction:column;gap:0;padding:.15rem 0;min-height:3rem;line-height:1.1}
.spd button b{font-size:1.2rem}
.spd button span{font-size:.72rem;font-weight:600}
.kmh{display:flex;align-items:center;gap:.5rem;margin-top:.35rem}
.kmh input{width:7rem}
.res button{min-height:2.8rem;font-size:1.05rem}
.res button.hit.on{background:var(--blue);border-color:#0d3aa3}
.res button.miss.on{background:var(--warn);border-color:#7d1a14}
#memo{margin-top:.35rem}
#bRec{min-height:3.2rem;font-size:1.15rem;width:100%;flex:none}

/* 점 지우기 떠 있는 버튼 */
#ptPop{position:fixed;z-index:30;display:flex;gap:.35rem;background:#fff;border:2px solid var(--line);border-radius:.6rem;padding:.3rem;box-shadow:0 .3rem 1rem rgba(0,0,0,.18)}

/* ── 기록 화면 ── */
#logv{padding:0 1rem 1rem}
.lhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:.5rem 0 .8rem}
.lhead select{width:auto;min-width:12rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;margin-bottom:.8rem}
.stat{background:#fff;border:2px solid var(--line);border-radius:.8rem;padding:.5rem .8rem}
.stat .k{color:var(--sub);font-weight:700}
.stat .v{font-size:1.7rem;font-weight:800;white-space:nowrap}
table.t{width:100%;border-collapse:collapse;background:#fff;border:2px solid var(--line);border-radius:.8rem;overflow:hidden}
.t th,.t td{padding:.55rem .7rem;border-bottom:1px solid #e3ddd0;text-align:left;vertical-align:middle}
.t th{background:#f7f3ea;font-size:.95rem}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--pick)}
.t td.num{white-space:nowrap}
.tag{display:inline-block;padding:.05rem .6rem;border-radius:1rem;font-weight:800;white-space:nowrap}
.tag.hit{background:#dfe8ff;color:#0d3aa3}
.tag.miss{background:#fde0dd;color:#7d1a14}
.tag.none{background:#eee;color:#555}
.spdt{margin-bottom:.8rem}
.empty{padding:2rem;text-align:center;color:var(--sub);background:#fff;border:2px dashed var(--line);border-radius:.8rem}

/* ── 모달 · 알림 ── */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:#fff;border-radius:1rem;padding:1.4rem 1.6rem;width:min(38rem,96vw);max-height:92vh;overflow:auto;box-shadow:0 1rem 3rem rgba(0,0,0,.3)}
.modal.wide{width:min(70rem,96vw)}
.modal h2{margin:0 0 .8rem;font-size:1.35rem}
.modal .body{font-size:1.1rem;margin-bottom:1rem}
.modal input{min-height:3.2rem;font-size:1.15rem;margin-bottom:1rem}
.modal .btns{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap}
.modal .btns button{min-height:3.2rem;min-width:7rem;font-size:1.1rem}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);z-index:60;background:#1c1c1c;color:#fff;
  padding:.8rem 1.4rem;border-radius:.8rem;font-size:1.15rem;font-weight:700;box-shadow:0 .4rem 1.2rem rgba(0,0,0,.3)}
.list{display:flex;flex-direction:column;gap:.4rem}
.litem{display:flex;align-items:center;gap:.6rem;padding:.45rem .6rem;border:2px solid #e3ddd0;border-radius:.6rem}
.litem .grow{flex:1}
.litem.on{border-color:var(--green);background:#eef6f0}
.mini{width:100%;height:auto;display:block;margin-bottom:.8rem}

/* 좁은 창(125% 배율 노트북 등): 도구줄이 두 줄로 접히지 않게 여백만 줄인다 */
@media (max-width:1700px){
  .tools button{padding:.25rem .55rem;gap:.25rem}
  .tools .lbl{display:none}
}
@media (max-width:1100px){
  #app{height:auto}
  .work{grid-template-columns:1fr}
  .tblwrap{min-height:55vw}
  .side{overflow:visible}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>

<!-- ═════════ 로그인 ═════════ -->
<div id="login" class="hide">
  <form class="lcard" id="lform" autocomplete="on" onsubmit="return false">
    <h1>🎱 당구 연습장</h1>
    <label for="email">아이디 (이메일)</label>
    <input id="email" type="email" autocomplete="username" inputmode="email">
    <label for="pw">비밀번호</label>
    <div class="pwrow">
      <input id="pw" type="password" autocomplete="current-password">
      <button type="button" id="pwEye"><span class="ic">👁</span> 보기</button>
    </div>
    <button type="submit" id="loginBtn" class="primary">로그인하기</button>
    <div id="loginErr" role="alert"></div>
  </form>
</div>

<!-- ═════════ 앱 ═════════ -->
<div id="app" class="hide">
  <header class="top">
    <div class="brand">🎱 당구 연습장</div>
    <nav id="tabs"></nav>
    <button id="bMore"><span class="ic">📂</span> 판 목록</button>
    <button id="bNew" class="primary"><span class="ic">＋</span> 새 판</button>
    <div class="sp"></div>
    <button id="bLog"><span class="ic">📋</span> 기록</button>
    <button id="bTrash"><span class="ic">🗑</span> 휴지통</button>
    <button id="bSet"><span class="ic">⚙</span> 설정</button>
  </header>

  <div id="workv">
    <div class="bbar">
      <span class="bname" id="bName"></span>
      <button id="bRename"><span class="ic">✏️</span> 이름 바꾸기</button>
      <button id="bCopy"><span class="ic">📄</span> 복제</button>
      <button id="bDel" class="danger"><span class="ic">🗑</span> 이 판 지우기</button>
      <div class="hint" id="hint"></div>
      <div class="seq" id="seq"></div>
      <span id="saveSt" class="save"></span>
    </div>
    <div class="work">
      <section class="stage">
        <!-- 🔒 v1.1 도구는 한 줄. 모드 | 선 종류 | 모드별 도구 + 안내 | 되돌리기 -->
        <div class="tools">
          <span class="grp">
            <button id="mBall" data-m="ball"><span class="ic">✋</span> 공 옮기기</button>
            <button id="mDraw" data-m="draw"><span class="ic">✏️</span> 선 긋기</button>
            <button id="mEdit" data-m="edit"><span class="ic">🖐</span> 선 고치기</button>
          </span>
          <span class="div"></span>
          <span class="grp">
            <button id="lPre" data-l="predict"><span style="color:#1650d8">━</span> 예측선</button>
            <button id="lAct" data-l="actual"><span style="color:#d0231a">━</span> 실제선</button>
          </span>
          <span class="div"></span>
          <span id="tBall" class="grp">
            <span class="lbl">내 공</span>
            <button id="cW" data-c="w">⚪ 흰 공</button>
            <button id="cY" data-c="y">🟡 노란 공</button>
            <button id="bReset"><span class="ic">↺</span> 처음 자리</button>
          </span>
          <span id="tDraw" class="grp">
            <button id="bDone" class="primary"><span class="ic">✔</span> 긋기 끝</button>
            <button id="bClear" class="danger"><span class="ic">🧹</span> 선 지우기</button>
          </span>
          <span class="sp"></span>
          <span class="grp">
            <button id="bUndo"><span class="ic">↶</span> 되돌리기</button>
            <button id="bRedo"><span class="ic">↷</span> 다시하기</button>
          </span>
        </div>
        <div class="tblwrap">
        <svg id="tbl" viewBox="-94 -94 988 588" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1650d8"/></marker>
            <marker id="arR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0231a"/></marker>
          </defs>
          <g id="gStatic"></g><g id="gDyn"></g>
        </svg>
        </div>
      </section>

      <aside class="side">
        <section class="box">
          <h3>① 당점 <small>— 원을 클릭하세요</small></h3>
          <div class="row" id="tipGuide">
            <button data-g="cross">십자</button><button data-g="c12">12시</button><button data-g="c16">16방향</button>
          </div>
          <div class="tipgrid">
            <svg id="tip" viewBox="-115 -115 230 230"></svg>
            <div class="tipbtn"><button id="tipMid">⊙ 정중앙</button><button id="tipClr">지우기</button></div>
          </div>
          <div id="tipTxt"></div><div id="tipTxt2"></div>
        </section>
        <section class="box">
          <h3>② 속도</h3>
          <div class="spd" id="spd"></div>
          <div class="kmh"><span>또는</span><input id="kmh" type="number" min="0" max="99" step="0.5" inputmode="decimal" placeholder="숫자"><b>km/h</b></div>
        </section>
        <section class="box res">
          <h3>③ 결과 <small>— 쳐본 뒤에</small></h3>
          <div class="row">
            <button id="rHit" class="hit">⭕ 성공</button>
            <button id="rMiss" class="miss">❌ 실패</button>
          </div>
          <input id="memo" type="text" maxlength="200" placeholder="메모 (예: 속도 한 단 낮춰야)">
        </section>
        <button id="bRec" class="primary"><span class="ic">✅</span> 이 시도 기록하기</button>
      </aside>
    </div>
  </div>

  <!-- ═════════ 기록 화면 ═════════ -->
  <div id="logv" class="hide">
    <div class="lhead">
      <button id="bBack" class="primary"><span class="ic">←</span> 당구대로 돌아가기</button>
      <span class="grp" style="margin-left:.8rem">
        <button id="vAtt" data-v="att">🎯 시도 기록</button>
        <button id="vEvt" data-v="evt">🕘 변경 이력</button>
      </span>
      <span class="sp"></span>
      <label for="lBoard" style="font-weight:700">판</label>
      <select id="lBoard"></select>
    </div>
    <div id="logBody"></div>
  </div>
</div>

<div id="ptPop" class="hide">
  <button id="ptDel" class="danger"><span class="ic">🗑</span> 이 점 지우기</button>
</div>
<div id="mask" class="hide"></div>
<div id="toast" class="hide"></div>

<script>
'use strict';
var SUPA_URL='https://ytkbrdgbklnijbwkvino.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0a2JyZGdia2xuaWpid2t2aW5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MjA0NTQsImV4cCI6MjEwMTk5NjQ1NH0.7ymaJsdADQ1RhodMMuJxV58nE9httVltWllKq1QmXQM';
var SB=window.supabase.createClient(SUPA_URL,SUPA_KEY);

var S=100;               /* 다이아 1칸 = 화면 단위 100 */
var W=8, H=4;            /* 가로 8칸 · 세로 4칸 */
var BR=0.1;              /* 공 반지름(그림) — 실제 공(0.087)보다 살짝 크게 */
var KEEP_DAYS=30;
var SPEEDS=['아주 약하게','약하게','보통','세게','아주 세게'];
var BALL_NAME={w:'흰 공',y:'노란 공',r:'빨간 공'};

var USER=null, BOARDS=[], CUR=null, ST=null;
var MODE='ball', LAYER='predict', UNDO=[], REDO=[], SEL=null, HOVER=null, DRAG=null;
var GUIDE=pref('guide')||'cross';
var saveTimer=null, saveBusy=false, saveAgain=false, lastSaved=null;
var LOGVIEW='att', LOGBOARD='', ATTS=[], EVTS=[];

/* ═════════ 작은 도구 ═════════ */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function r2(v){return Math.round(v*100)/100;}
function pref(k,v){try{if(v===undefined)return localStorage.getItem('bb.'+k);localStorage.setItem('bb.'+k,v);}catch(e){return null;}}
function isBB(u){return !!(u&&u.app_metadata&&u.app_metadata.app==='billiards');}
function fmtTime(d){d=new Date(d);var h=d.getHours(),m=d.getMinutes();return (h<12?'오전 ':'오후 ')+((h%12)||12)+':'+(m<10?'0':'')+m;}
function fmtDate(d){d=new Date(d);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+'일월화수목금토'[d.getDay()]+')';}
function fmtDT(d){return fmtDate(d)+' '+fmtTime(d);}

function defaultBalls(){return {w:{x:2,y:2.5},y:{x:2,y:1.5},r:{x:6,y:2},cue:'w'};}
function emptyDraft(){return {predict:[],actual:[],tip:null,speed:null,kmh:null,result:null,memo:''};}
function normBoard(b){
  var d=defaultBalls(),bl=b.balls||{};
  b.balls={w:bl.w||d.w,y:bl.y||d.y,r:bl.r||d.r,cue:bl.cue==='y'?'y':'w'};
  var e=emptyDraft(),dr=b.draft||{};
  Object.keys(e).forEach(function(k){if(dr[k]===undefined)dr[k]=e[k];});
  b.draft=dr; return b;
}
function curBoard(){for(var i=0;i<BOARDS.length;i++)if(BOARDS[i].id===CUR)return BOARDS[i];return null;}

/* ═════════ 알림 · 모달 ═════════ */
var toastT=null;
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.add('hide');},2800);}
/* modal({title, body, html, input, wide, buttons:[{label,value,cls}]}) → Promise({value,text}) · Esc = 취소 */
function modal(o){
  return new Promise(function(res){
    var m=$('mask');
    var btns=o.buttons||[{label:'확인',value:true,cls:'primary'}];
    m.innerHTML='<div class="modal'+(o.wide?' wide':'')+'" role="dialog" aria-modal="true"><h2>'+esc(o.title||'')+'</h2>'+
      (o.html!=null?'<div class="body">'+o.html+'</div>':(o.body?'<div class="body">'+esc(o.body)+'</div>':''))+
      (o.input?'<input type="'+(o.input.type||'text')+'" id="mIn" maxlength="'+(o.input.max||40)+'" autocomplete="'+(o.input.ac||'off')+'" value="'+esc(o.input.value||'')+'">':'')+
      (o.input2?'<input type="'+(o.input2.type||'text')+'" id="mIn2" placeholder="'+esc(o.input2.placeholder||'')+'" autocomplete="'+(o.input2.ac||'off')+'">':'')+
      '<div class="btns">'+btns.map(function(b,i){return '<button data-i="'+i+'" class="'+(b.cls||'')+'">'+b.label+'</button>';}).join('')+'</div></div>';
    m.classList.remove('hide');
    var inp=$('mIn');
    function done(v){
      var t=inp?inp.value:null,t2=$('mIn2')?$('mIn2').value:null;
      m.classList.add('hide');m.innerHTML='';document.removeEventListener('keydown',key,true);res({value:v,text:t,text2:t2});
    }
    function key(e){
      if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done(null);}
      else if(e.key==='Enter'&&(e.target.tagName==='INPUT')){e.preventDefault();e.stopPropagation();
        var p=btns.filter(function(b){return /primary|danger/.test(b.cls||'');})[0]||btns[0];done(p.value);}
    }
    document.addEventListener('keydown',key,true);
    m.querySelectorAll('.btns button').forEach(function(b){b.addEventListener('click',function(){done(btns[+b.dataset.i].value);});});
    m.onclick=function(e){if(e.target===m&&!o.sticky)done(null);};
    if(o.onOpen)o.onOpen(m);
    setTimeout(function(){if(inp){inp.focus();inp.select();}else{var f=m.querySelector('.btns button.primary')||m.querySelector('.btns button');if(f)f.focus();}},30);
  });
}
function confirmBox(title,body,okLabel,danger){
  return modal({title:title,body:body,buttons:[{label:'아니오',value:false},{label:okLabel||'예',value:true,cls:danger?'danger':'primary'}]}).then(function(r){return r.value===true;});
}

/* ═════════ 로그인 ═════════ */
function loginMsg(err){
  var m=(err&&err.message)||String(err||'');
  if(/Invalid login credentials/i.test(m))return '아이디(이메일) 또는 비밀번호가 맞지 않습니다. 다시 확인해 주세요.';
  if(/Email not confirmed/i.test(m))return '아직 인증되지 않은 계정입니다. 로한에게 말씀해 주세요.';
  if(/fetch|network|Failed/i.test(m))return '인터넷 연결을 확인해 주세요.';
  if(/rate|too many/i.test(m))return '잠시 후에 다시 시도해 주세요.';
  return '로그인하지 못했습니다. ('+m+')';
}
function showLogin(msg){$('app').classList.add('hide');$('login').classList.remove('hide');$('loginErr').textContent=msg||'';setTimeout(function(){$('email').focus();},30);}
function doLogin(){
  var email=$('email').value.trim(),pw=$('pw').value;
  if(!email||!pw){$('loginErr').textContent='아이디와 비밀번호를 모두 넣어 주세요.';return;}
  $('loginErr').textContent='로그인 중입니다…';$('loginBtn').disabled=true;
  SB.auth.signInWithPassword({email:email,password:pw}).then(function(r){
    $('loginBtn').disabled=false;
    if(r.error){$('loginErr').textContent=loginMsg(r.error);return;}
    enter(r.data.user);
  },function(e){$('loginBtn').disabled=false;$('loginErr').textContent=loginMsg(e);});
}
/* 🔒 문지기 — billiards 표식이 없는 계정(로한)은 들이지 않는다 */
function enter(u){
  if(!isBB(u)){USER=null;SB.auth.signOut();showLogin('이 계정은 당구 연습장 계정이 아닙니다.');return;}
  USER=u;$('pw').value='';
  $('login').classList.add('hide');$('app').classList.remove('hide');
  loadBoards();
}

/* ═════════ DB ═════════ */
function logEvent(kind,boardId,payload){
  SB.from('bb_events').insert({kind:kind,board_id:boardId||null,payload:payload||null}).then(function(){},function(){});
}
function purgeOld(){
  var cut=new Date(Date.now()-KEEP_DAYS*864e5).toISOString();
  SB.from('bb_attempts').delete().lt('deleted_at',cut).then(function(){},function(){});
  SB.from('bb_boards').delete().lt('deleted_at',cut).then(function(){},function(){});
}
function loadBoards(){
  setSave('불러오는 중…');
  SB.from('bb_boards').select('*').is('deleted_at',null).order('sort',{ascending:true}).order('created_at',{ascending:true}).then(function(r){
    if(r.error){setSave('⚠ 불러오지 못했습니다 — 새로고침(F5) 해 주세요',true);return;}
    BOARDS=(r.data||[]).map(normBoard);
    purgeOld();
    if(!BOARDS.length){createBoard('판 1',defaultBalls(),emptyDraft(),true);return;}
    var last=pref('board');
    switchBoard(BOARDS.some(function(b){return b.id===last;})?last:BOARDS[0].id);
    setSave('');
  });
}
function createBoard(name,balls,draft,silent,from){
  var sort=BOARDS.reduce(function(m,b){return Math.max(m,b.sort||0);},0)+1;
  return SB.from('bb_boards').insert({name:name,balls:balls,draft:draft,sort:sort}).select().single().then(function(r){
    if(r.error||!r.data){toast('⚠ 새 판을 만들지 못했습니다');return;}
    var b=normBoard(r.data);BOARDS.push(b);
    logEvent(from?'board.copy':'board.create',b.id,from?{from:from,name:name}:{name:name});
    switchBoard(b.id);
    if(!silent)toast(from?'‘'+name+'’(으)로 복제했습니다':'새 판 ‘'+name+'’을 만들었습니다');
  });
}
function setSave(t,bad){var s=$('saveSt');s.textContent=t;s.classList.toggle('bad',!!bad);}
/* 자동 저장 — 손을 뗀 뒤 0.7초 */
function saveSoon(){
  var b=curBoard();if(!b)return;
  b.balls=ST.balls;b.draft=ST.draft;
  setSave('저장 중…');
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
function flush(){
  clearTimeout(saveTimer);saveTimer=null;
  var b=curBoard();if(!b)return Promise.resolve();
  if(saveBusy){saveAgain=true;return Promise.resolve();}
  saveBusy=true;
  var id=b.id;
  return SB.from('bb_boards').update({balls:b.balls,draft:b.draft}).eq('id',id).then(function(r){
    saveBusy=false;
    if(r&&r.error){setSave('⚠ 저장하지 못했습니다 — 인터넷을 확인해 주세요',true);saveTimer=setTimeout(flush,5000);return;}
    lastSaved=new Date();setSave('✓ 저장됨 '+fmtTime(lastSaved));
    if(saveAgain){saveAgain=false;flush();}
  },function(){saveBusy=false;setSave('⚠ 저장하지 못했습니다 — 인터넷을 확인해 주세요',true);saveTimer=setTimeout(flush,5000);});
}
window.addEventListener('beforeunload',function(e){if(saveTimer){flush();e.preventDefault();e.returnValue='';}});
document.addEventListener('visibilitychange',function(){if(document.hidden&&saveTimer)flush();});

/* ═════════ 판 CRUD ═════════ */
function switchBoard(id){
  if(saveTimer)flush();
  CUR=id;pref('board',id);
  var b=curBoard();ST={balls:clone(b.balls),draft:clone(b.draft)};
  UNDO=[];REDO=[];SEL=null;HOVER=null;DRAG=null;
  if(MODE==='draw'&&!ST.draft[LAYER].length)MODE='ball';
  hidePop();renderAll();
}
function newBoard(){
  modal({title:'＋ 새 판 만들기',body:'판 이름을 적어 주세요.',input:{value:'판 '+(BOARDS.length+1),max:30},
    buttons:[{label:'취소',value:null},{label:'만들기',value:'ok',cls:'primary'}]}).then(function(r){
    if(r.value!=='ok')return;var n=(r.text||'').trim()||('판 '+(BOARDS.length+1));
    createBoard(n,defaultBalls(),emptyDraft());
  });
}
function renameBoard(){
  var b=curBoard();if(!b)return;
  modal({title:'✏️ 이름 바꾸기',input:{value:b.name,max:30},buttons:[{label:'취소',value:null},{label:'바꾸기',value:'ok',cls:'primary'}]}).then(function(r){
    if(r.value!=='ok')return;var n=(r.text||'').trim();if(!n||n===b.name)return;
    var old=b.name;b.name=n;renderTabs();
    SB.from('bb_boards').update({name:n}).eq('id',b.id).then(function(x){
      if(x&&x.error){b.name=old;renderTabs();toast('⚠ 이름을 바꾸지 못했습니다');return;}
      logEvent('board.rename',b.id,{from:old,to:n});toast('이름을 ‘'+n+'’(으)로 바꿨습니다');
    });
  });
}
function copyBoard(){
  var b=curBoard();if(!b)return;
  if(saveTimer)flush();
  createBoard(b.name+' (복사)',clone(ST.balls),clone(ST.draft),false,b.name);
}
function deleteBoard(){
  var b=curBoard();if(!b)return;
  confirmBox('🗑 이 판을 지울까요?','‘'+b.name+'’을 휴지통으로 옮깁니다. '+KEEP_DAYS+'일 안에는 휴지통에서 다시 살릴 수 있습니다.','지우기',true).then(function(ok){
    if(!ok)return;
    if(saveTimer)flush();
    SB.from('bb_boards').update({deleted_at:new Date().toISOString()}).eq('id',b.id).then(function(x){
      if(x&&x.error){toast('⚠ 지우지 못했습니다');return;}
      logEvent('board.delete',b.id,{name:b.name});
      var i=BOARDS.indexOf(b);BOARDS.splice(i,1);
      toast('‘'+b.name+'’을 휴지통으로 옮겼습니다');
      if(!BOARDS.length){createBoard('판 1',defaultBalls(),emptyDraft(),true);return;}
      switchBoard(BOARDS[Math.min(i,BOARDS.length-1)].id);
    });
  });
}
function boardList(){
  modal({title:'📂 판 목록 ('+BOARDS.length+'개)',wide:false,
    html:'<div class="list">'+BOARDS.map(function(b){
      return '<div class="litem'+(b.id===CUR?' on':'')+'"><span class="grow"><b>'+esc(b.name)+'</b></span><button data-go="'+b.id+'" class="'+(b.id===CUR?'':'primary')+'">'+(b.id===CUR?'지금 보는 판':'이 판 열기')+'</button></div>';
    }).join('')+'</div>',
    buttons:[{label:'닫기',value:null}],
    onOpen:function(m){m.querySelectorAll('[data-go]').forEach(function(x){x.addEventListener('click',function(){
      var id=x.dataset.go;$('mask').querySelector('.btns button').click();if(id!==CUR)switchBoard(id);});});}
  });
}

/* ═════════ 되돌리기 ═════════ */
function snap(){return JSON.stringify({balls:ST.balls,draft:ST.draft});}
function pushUndo(){UNDO.push(snap());if(UNDO.length>150)UNDO.shift();REDO=[];}
function restore(s){var o=JSON.parse(s);ST.balls=o.balls;ST.draft=o.draft;SEL=null;hidePop();}
function undo(){if(!UNDO.length)return;REDO.push(snap());restore(UNDO.pop());saveSoon();renderAll();}
function redo(){if(!REDO.length)return;UNDO.push(snap());restore(REDO.pop());saveSoon();renderAll();}

/* ═════════ 좌표 ═════════ */
function svg(){return $('tbl');}
function pxK(){var m=svg().getScreenCTM();return m&&m.a?1/m.a:1;}         /* 화면 1px = 몇 단위 */
function evPt(e){var s=svg(),p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var m=s.getScreenCTM();if(!m)return {x:0,y:0};p=p.matrixTransform(m.inverse());return {x:p.x/S,y:p.y/S};}
function ballAt(k){return ST.balls[k];}
function resolve(p){
  if(p.ref==='cue')return ballAt(ST.balls.cue);
  if(p.ref&&ST.balls[p.ref])return ballAt(p.ref);
  return p;
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
/* 🧲 자석 — 공 근처면 공 중심, 쿠션 근처면 쿠션 위 0.5칸 눈금, 나머지는 0.05칸 */
function snapPt(p){
  var k=pxK()/S, ballR=Math.max(0.22,22*k), band=Math.max(0.4,30*k);
  var best=null;['w','y','r'].forEach(function(n){var d=dist(p,ST.balls[n]);if(d<ballR&&(!best||d<best.d))best={n:n,d:d};});
  if(best){var b=ST.balls[best.n];return {x:b.x,y:b.y,ref:best.n===ST.balls.cue?'cue':best.n};}
  var nx=p.x<band?0:(p.x>W-band?W:null), ny=p.y<band?0:(p.y>H-band?H:null);
  if(nx!==null||ny!==null){
    return {x:nx!==null?nx:clamp(Math.round(p.x*2)/2,0,W), y:ny!==null?ny:clamp(Math.round(p.y*2)/2,0,H), rail:true};
  }
  return {x:clamp(Math.round(p.x*20)/20,0,W),y:clamp(Math.round(p.y*20)/20,0,H)};
}
/* 쿠션 지점의 다이아 수치 — 장쿠션은 가로 ×10, 단쿠션은 세로 ×10 */
function railVal(p){
  if(!p.rail)return null;
  if(p.y===0||p.y===H)return Math.round(p.x*10);
  if(p.x===0||p.x===W)return Math.round(p.y*10);
  return null;
}
function railSeq(path){return path.map(railVal).filter(function(v){return v!==null;});}

/* ═════════ 그리기 ═════════ */
function staticTable(){
  var h=[];
  h.push('<rect x="-92" y="-92" width="984" height="584" rx="30" fill="#5b3a22"/>');
  h.push('<rect x="-22" y="-22" width="844" height="444" rx="5" fill="#17613a"/>');
  h.push('<rect x="0" y="0" width="800" height="400" fill="#2a8a52"/>');
  for(var i=1;i<W;i++)h.push('<line x1="'+i*S+'" y1="0" x2="'+i*S+'" y2="400" stroke="rgba(255,255,255,.2)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>');
  for(var j=1;j<H;j++)h.push('<line x1="0" y1="'+j*S+'" x2="800" y2="'+j*S+'" stroke="rgba(255,255,255,.2)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>');
  for(i=0;i<=W;i++){
    h.push(dot(i*S,-36),dot(i*S,436));
    h.push(num(i*S,-58,i*10),num(i*S,480,i*10));
  }
  for(j=0;j<=H;j++){
    h.push(dot(-36,j*S),dot(836,j*S));
    h.push(num(-68,j*S+8,j*10),num(868,j*S+8,j*10));
  }
  function dot(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="6" fill="#f3e6c8" stroke="#1a1a1a" stroke-width="2"/>';}
  function num(x,y,t){return '<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="25" font-weight="800" fill="#f3e6c8" font-family="inherit">'+t+'</text>';}
  return h.join('');
}
function pathSvg(path,color,marker,faint,k){
  if(path.length<2)return '';
  var pts=path.map(function(p){var q=resolve(p);return (q.x*S)+','+(q.y*S);}).join(' ');
  var op=faint?' opacity="0.4"':'';
  return '<polyline points="'+pts+'" fill="none" stroke="#fff" stroke-width="'+(faint?7:11)+'" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"'+op+'/>'+
         '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="'+(faint?4:6)+'" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#'+marker+')"'+op+'/>';
}
function bubble(x,y,t,color,k){
  var fs=22*k, w=(String(t).length*0.62+0.9)*fs, hgt=fs*1.4;
  var bx=x-w/2, by=y-hgt-12*k;
  if(y<=0.01)by=y+12*k;                       /* 윗쿠션이면 아래로 */
  return '<g pointer-events="none"><rect x="'+bx+'" y="'+by+'" width="'+w+'" height="'+hgt+'" rx="'+6*k+'" fill="#fff" stroke="'+color+'" stroke-width="'+3*k+'"/>'+
    '<text x="'+x+'" y="'+(by+hgt*0.74)+'" text-anchor="middle" font-size="'+fs+'" font-weight="800" fill="'+color+'">'+esc(t)+'</text></g>';
}
function ballSvg(n,b,k,isCue,big){
  var col={w:'#fbfbf5',y:'#f5c400',r:'#d8231b'}[n];
  var h='';
  if(isCue){h+='<circle cx="'+b.x*S+'" cy="'+b.y*S+'" r="'+(BR*S+9*k)+'" fill="none" stroke="#fff" stroke-width="'+3*k+'" stroke-dasharray="'+6*k+' '+4*k+'"/>';
    h+='<text x="'+b.x*S+'" y="'+(b.y*S-BR*S-14*k)+'" text-anchor="middle" font-size="'+18*k+'" font-weight="800" fill="#fff" stroke="#11482a" stroke-width="'+4*k+'" paint-order="stroke">내 공</text>';}
  h+='<circle cx="'+b.x*S+'" cy="'+b.y*S+'" r="'+BR*S+'" fill="'+col+'" stroke="#222" stroke-width="2"'+(big?' data-ball="'+n+'" style="cursor:grab"':'')+'/>';
  return h;
}
function renderTable(){
  var s=svg();if(!ST||s.getBoundingClientRect().width===0)return;
  if(!$('gStatic').firstChild)$('gStatic').innerHTML=staticTable();
  var k=pxK(), h=[], d=ST.draft;
  var other=LAYER==='predict'?'actual':'predict';
  h.push(pathSvg(d[other],other==='predict'?'#1650d8':'#d0231a',other==='predict'?'arB':'arR',true,k));
  var col=LAYER==='predict'?'#1650d8':'#d0231a';
  h.push(pathSvg(d[LAYER],col,LAYER==='predict'?'arB':'arR',false,k));
  /* 공 */
  ['r','y','w'].forEach(function(n){h.push(ballSvg(n,ST.balls[n],k,ST.balls.cue===n,MODE==='ball'));});
  /* 쿠션 지점 숫자 */
  d[LAYER].forEach(function(p){var v=railVal(p);if(v!==null)h.push(bubble(p.x*S,p.y*S,v,col,k));});
  /* 미리보기 */
  if(MODE==='draw'&&HOVER){
    var path=d[LAYER],last=path.length?resolve(path[path.length-1]):ballAt(ST.balls.cue);
    h.push('<line x1="'+last.x*S+'" y1="'+last.y*S+'" x2="'+HOVER.x*S+'" y2="'+HOVER.y*S+'" stroke="'+col+'" stroke-width="4" stroke-dasharray="10 8" vector-effect="non-scaling-stroke" pointer-events="none"/>');
    h.push('<circle cx="'+HOVER.x*S+'" cy="'+HOVER.y*S+'" r="'+10*k+'" fill="#fff" stroke="'+col+'" stroke-width="'+4*k+'" pointer-events="none"/>');
    var v=railVal(HOVER);if(v!==null)h.push(bubble(HOVER.x*S,HOVER.y*S,v,col,k));
  }
  /* 손잡이 */
  if(MODE==='edit'){
    d[LAYER].forEach(function(p,i){if(i===0)return;var q=resolve(p);
      h.push('<circle class="hd" data-i="'+i+'" cx="'+q.x*S+'" cy="'+q.y*S+'" r="'+15*k+'" fill="'+(SEL===i?'#ff9f1a':p.ref?'rgba(255,255,255,.15)':'#fff')+'" stroke="'+col+'" stroke-width="'+5*k+'" style="cursor:move"/>');
    });
  }
  $('gDyn').innerHTML=h.join('');
  s.setAttribute('class','m-'+MODE);
}
function renderSeq(){
  var d=ST.draft,a=railSeq(d.predict),b=railSeq(d.actual),h=[];
  h.push('<span style="color:#1650d8">예측 쿠션 지점:</span> '+(a.length?'<b>'+a.join(' → ')+'</b>':'—'));

  $('seq').innerHTML=h.join('');
}
function renderHint(){

function renderAll(){if(!ST)return;renderTabs();renderTools();renderHint();renderSeq();renderSide();renderTable();}

/* ═════════ 당점 ═════════ */
function tipDesc(t){
  if(!t)return ['아직 안 정했습니다',''];
  var d=Math.hypot(t.x,t.y);
  if(d<0.12)return ['정중앙','무회전'];
  var hr=Math.round(Math.atan2(t.x,-t.y)/(2*Math.PI)*12);hr=((hr%12)+12)%12;if(hr===0)hr=12;
  var tips=Math.min(3,Math.max(0.5,Math.round(d*3*2)/2));
  var parts=[];
  if(t.y<-0.25)parts.push('위 (밀어치기)');else if(t.y>0.25)parts.push('아래 (끌어치기)');
  if(t.x<-0.25)parts.push('왼쪽 회전');else if(t.x>0.25)parts.push('오른쪽 회전');
  return [hr+'시 방향 · '+tips+'팁',parts.join(' · ')];
}
function renderTip(){
  var h=['<circle cx="0" cy="0" r="100" fill="#fbfbf5" stroke="#222" stroke-width="3"/>'];
  var g='stroke="#9a9a9a" stroke-width="1.6"';
  if(GUIDE==='cross'){
    h.push('<line x1="-100" y1="0" x2="100" y2="0" '+g+'/><line x1="0" y1="-100" x2="0" y2="100" '+g+'/>');
    h.push('<circle r="33.3" fill="none" '+g+' stroke-dasharray="4 4"/><circle r="66.6" fill="none" '+g+' stroke-dasharray="4 4"/>');
  }else{
    var n=GUIDE==='c12'?12:16;
    for(var i=0;i<n;i++){var a=i/n*2*Math.PI;h.push('<line x1="0" y1="0" x2="'+(Math.sin(a)*100).toFixed(1)+'" y2="'+(-Math.cos(a)*100).toFixed(1)+'" '+g+'/>');}
    if(n===12)for(i=1;i<=12;i++){var b=i/12*2*Math.PI;h.push('<text x="'+(Math.sin(b)*109).toFixed(1)+'" y="'+(-Math.cos(b)*109+5).toFixed(1)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#444">'+i+'</text>');}
    h.push('<circle r="4" fill="#222"/>');
  }
  var t=ST.draft.tip;
  if(t)h.push('<circle cx="'+t.x*100+'" cy="'+t.y*100+'" r="13" fill="#d0231a" stroke="#fff" stroke-width="3"/>');
  $('tip').innerHTML=h.join('');
  var ds=tipDesc(t);$('tipTxt').textContent=ds[0];$('tipTxt2').textContent=ds[1];
}
function setTip(t){pushUndo();ST.draft.tip=t;saveSoon();renderSide();renderTools();}

/* ═════════ 마우스 — 당구대 ═════════ */
function segHit(p,path){
  var k=pxK()/S, tol=12*k, best=null;
  for(var i=0;i<path.length-1;i++){
    var a=resolve(path[i]),b=resolve(path[i+1]);
    var dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;if(!L)continue;
    var t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/L,0,1);
    var d=Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
    if(d<tol&&(!best||d<best.d))best={i:i,d:d};
  }
  return best;
}
function handleAt(p){
  var k=pxK()/S, r=20*k, path=ST.draft[LAYER], best=null;
  for(var i=1;i<path.length;i++){var d=dist(p,resolve(path[i]));if(d<r&&(!best||d<best.d))best={i:i,d:d};}
  return best?best.i:null;
}
function ballHit(p){
  var k=pxK()/S, r=Math.max(BR*1.5,20*k), best=null;
  ['w','y','r'].forEach(function(n){var d=dist(p,ST.balls[n]);if(d<r&&(!best||d<best.d))best={n:n,d:d};});
  return best?best.n:null;
}
function onDown(e){
  if(e.button!==0||!ST)return;
  var p=evPt(e);hidePop();
  if(MODE==='ball'){
    var n=ballHit(p);if(!n)return;
    DRAG={type:'ball',n:n,moved:false,start:snap()};svg().setPointerCapture(e.pointerId);e.preventDefault();
  }else if(MODE==='draw'){
    var q=snapPt(p),path=ST.draft[LAYER];
    pushUndo();
    if(!path.length)path.push({ref:'cue'});
    var last=resolve(path[path.length-1]);
    if(dist(last,resolve(q))<0.01)return;         /* 같은 곳 두 번 = 무시 */
    path.push(q);saveSoon();renderSeq();renderTools();renderTable();
  }else if(MODE==='edit'){
    var i=handleAt(p);
    if(i!==null){DRAG={type:'pt',i:i,moved:false,start:snap(),x0:e.clientX,y0:e.clientY};svg().setPointerCapture(e.pointerId);e.preventDefault();return;}
    var sg=segHit(p,ST.draft[LAYER]);
    if(sg){pushUndo();var np=snapPt(p);if(np.ref)np={x:np.x,y:np.y};
      ST.draft[LAYER].splice(sg.i+1,0,np);SEL=sg.i+1;
      DRAG={type:'pt',i:sg.i+1,moved:false,start:null,x0:e.clientX,y0:e.clientY};svg().setPointerCapture(e.pointerId);
      saveSoon();renderSeq();renderTools();renderTable();e.preventDefault();return;}
    SEL=null;renderTable();
  }
}
function onMove(e){
  if(!ST)return;
  var p=evPt(e);
  if(DRAG&&DRAG.type==='ball'){
    var n=DRAG.n,nx=clamp(p.x,BR,W-BR),ny=clamp(p.y,BR,H-BR);
    var ok=['w','y','r'].every(function(o){return o===n||dist({x:nx,y:ny},ST.balls[o])>=BR*2;});
    if(ok){ST.balls[n]={x:r2(nx),y:r2(ny)};DRAG.moved=true;renderTable();}
    return;
  }
  if(DRAG&&DRAG.type==='pt'){
    if(!DRAG.moved&&Math.hypot(e.clientX-DRAG.x0,e.clientY-DRAG.y0)<4)return;
    DRAG.moved=true;var q=snapPt(p);ST.draft[LAYER][DRAG.i]=q;SEL=DRAG.i;renderSeq();renderTable();return;
  }
  if(MODE==='draw'){HOVER=snapPt(p);renderTable();}
}
function onUp(e){
  if(!DRAG)return;
  var d=DRAG;DRAG=null;
  try{svg().releasePointerCapture(e.pointerId);}catch(x){}
  if(d.type==='ball'){if(d.moved){UNDO.push(d.start);REDO=[];saveSoon();renderTools();}return;}
  if(d.type==='pt'){
    if(d.moved){if(d.start){UNDO.push(d.start);REDO=[];}saveSoon();renderTools();renderTable();}
    else{SEL=d.i;renderTable();showPop(d.i);}
  }
}
function onLeave(){if(HOVER){HOVER=null;renderTable();}}
function showPop(i){
  var q=resolve(ST.draft[LAYER][i]),s=svg(),pt=s.createSVGPoint();pt.x=q.x*S;pt.y=q.y*S;
  var sc=pt.matrixTransform(s.getScreenCTM());
  var pop=$('ptPop');pop.classList.remove('hide');
  var w=pop.offsetWidth,h=pop.offsetHeight;
  pop.style.left=clamp(sc.x-w/2,8,window.innerWidth-w-8)+'px';
  pop.style.top=clamp(sc.y+28,8,window.innerHeight-h-8)+'px';
}
function hidePop(){$('ptPop').classList.add('hide');}
function delPoint(){
  if(SEL===null)return;pushUndo();ST.draft[LAYER].splice(SEL,1);
  if(ST.draft[LAYER].length<2)ST.draft[LAYER]=[];
  SEL=null;hidePop();saveSoon();renderAll();
}
function setMode(m){
  MODE=m;SEL=null;HOVER=null;hidePop();renderAll();
}
function doneDraw(){setMode(ST.draft[LAYER].length?'edit':'ball');}
function clearLayer(){
  if(!ST.draft[LAYER].length)return;
  confirmBox('🧹 이 선을 지울까요?',(LAYER==='predict'?'예측 선(파랑)':'실제 간 길(빨강)')+'을 모두 지웁니다. [↶ 되돌리기]로 다시 살릴 수 있습니다.','지우기',true).then(function(ok){
    if(!ok)return;pushUndo();ST.draft[LAYER]=[];SEL=null;saveSoon();renderAll();
  });
}

/* ═════════ 시도 기록 ═════════ */
function pathOut(path){return path.map(function(p){var q=resolve(p);var o={x:r2(q.x),y:r2(q.y)};if(p.rail)o.rail=true;if(p.ref)o.ref=p.ref;return o;});}
function record(){
  var d=ST.draft,b=curBoard();if(!b)return;
  if(d.predict.length<2){modal({title:'먼저 예측 선을 그어 주세요',body:'[✏️ 선 긋기]를 누르고, 내 공에서 시작해 쿠션을 차례로 클릭하면 됩니다.',buttons:[{label:'알겠습니다',value:true,cls:'primary'}]});return;}
  var row={board_id:b.id,balls:clone(ST.balls),predict:pathOut(d.predict),actual:d.actual.length>1?pathOut(d.actual):null,
    tip:d.tip,speed:d.speed,kmh:d.kmh,result:d.result,memo:(d.memo||'').trim()||null};
  $('bRec').disabled=true;
  SB.from('bb_attempts').insert(row).select().single().then(function(r){
    $('bRec').disabled=false;
    if(r.error||!r.data){toast('⚠ 기록하지 못했습니다 — 인터넷을 확인해 주세요');return;}
    logEvent('attempt.save',b.id,{name:b.name,result:d.result,speed:d.speed});
    /* 선·당점·속도는 남긴다(조금씩 바꿔 다시 쳐 보는 게 보통이다). 결과·메모·실제 길만 비운다 */
    pushUndo();d.result=null;d.memo='';d.actual=[];if(LAYER==='actual'){LAYER='predict';}
    saveSoon();renderAll();
    SB.from('bb_attempts').select('id').eq('board_id',b.id).is('deleted_at',null).then(function(c){
      var n=(c&&c.data)?c.data.length:null;
      toast('✅ 기록했습니다'+(n?' — 이 판의 '+n+'번째 시도':''));
    });
  },function(){$('bRec').disabled=false;toast('⚠ 기록하지 못했습니다 — 인터넷을 확인해 주세요');});
}

/* ═════════ 기록 화면 ═════════ */
function openLog(){
  if(saveTimer)flush();
  $('workv').classList.add('hide');$('logv').classList.remove('hide');hidePop();
  var opts='<option value="">전체</option>'+BOARDS.map(function(b){return '<option value="'+b.id+'">'+esc(b.name)+'</option>';}).join('');
  $('lBoard').innerHTML=opts;$('lBoard').value=LOGBOARD&&BOARDS.some(function(b){return b.id===LOGBOARD;})?LOGBOARD:'';
  loadLog();
}
function closeLog(){$('logv').classList.add('hide');$('workv').classList.remove('hide');renderAll();}
function boardName(id){var b=BOARDS.filter(function(x){return x.id===id;})[0];return b?b.name:'(지운 판)';}
function loadLog(){
  LOGBOARD=$('lBoard').value;
  ['vAtt','vEvt'].forEach(function(id){$(id).classList.toggle('on',$(id).dataset.v===LOGVIEW);});
  $('logBody').innerHTML='<div class="empty">불러오는 중…</div>';
  if(LOGVIEW==='att'){
    var q=SB.from('bb_attempts').select('*').is('deleted_at',null);
    if(LOGBOARD)q=q.eq('board_id',LOGBOARD);
    q.order('created_at',{ascending:false}).limit(1000).then(function(r){
      if(r.error){$('logBody').innerHTML='<div class="empty">⚠ 불러오지 못했습니다</div>';return;}
      ATTS=r.data||[];renderAttempts();
    });
  }else{
    var e=SB.from('bb_events').select('*');
    if(LOGBOARD)e=e.eq('board_id',LOGBOARD);
    e.order('at',{ascending:false}).limit(500).then(function(r){
      if(r.error){$('logBody').innerHTML='<div class="empty">⚠ 불러오지 못했습니다</div>';return;}
      EVTS=r.data||[];renderEvents();
    });
  }
}
function pct(a,b){return b?Math.round(a/b*100)+'%':'—';}
function renderAttempts(){
  var A=ATTS, hit=A.filter(function(a){return a.result==='hit';}).length, miss=A.filter(function(a){return a.result==='miss';}).length;
  var h=[];
  h.push('<div class="stats">'+
    '<div class="stat"><div class="k">시도</div><div class="v">'+A.length+'번</div></div>'+
    '<div class="stat"><div class="k">⭕ 성공</div><div class="v" style="color:#0d3aa3">'+hit+'번</div></div>'+
    '<div class="stat"><div class="k">❌ 실패</div><div class="v" style="color:#7d1a14">'+miss+'번</div></div>'+
    '<div class="stat"><div class="k">성공률 <small>(결과 적은 '+(hit+miss)+'번 중)</small></div><div class="v">'+pct(hit,hit+miss)+'</div></div></div>');
  if(!A.length){$('logBody').innerHTML=h.join('')+'<div class="empty">아직 기록한 시도가 없습니다.<br>당구대에서 선을 긋고 [✅ 이 시도 기록하기]를 누르면 여기에 쌓입니다.</div>';return;}
  /* 속도별 */
  h.push('<table class="t spdt"><tr><th>속도별</th>'+SPEEDS.map(function(t,i){return '<th>'+(i+1)+' '+t+'</th>';}).join('')+'</tr><tr><td><b>성공률</b></td>'+
    SPEEDS.map(function(t,i){var s=A.filter(function(a){return a.speed===i+1;}),sh=s.filter(function(a){return a.result==='hit';}).length,sm=s.filter(function(a){return a.result==='miss';}).length;
      return '<td class="num"><b>'+pct(sh,sh+sm)+'</b> <small>('+s.length+'번)</small></td>';}).join('')+'</tr></table>');
  h.push('<table class="t"><tr><th>날짜</th><th>판</th><th>쿠션 지점</th><th>당점</th><th>속도</th><th>결과</th><th>메모</th></tr>');
  A.forEach(function(a,i){
    var seq=railSeq(a.predict||[]);
    h.push('<tr class="click" data-i="'+i+'"><td class="num">'+fmtDT(a.created_at)+'</td><td>'+esc(boardName(a.board_id))+'</td>'+
      '<td class="num">'+(seq.length?seq.join(' → '):'—')+'</td><td>'+esc(tipDesc(a.tip)[0])+'</td>'+
      '<td class="num">'+(a.speed?a.speed+' '+SPEEDS[a.speed-1]:'—')+(a.kmh!=null?' · '+a.kmh+'km/h':'')+'</td>'+
      '<td>'+resTag(a.result)+'</td><td>'+esc(a.memo||'')+'</td></tr>');
  });
  h.push('</table>');
  if(A.length>=1000)h.push('<p>최근 1,000번만 보여 줍니다.</p>');
  $('logBody').innerHTML=h.join('');
  $('logBody').querySelectorAll('tr.click').forEach(function(tr){tr.addEventListener('click',function(){openAttempt(ATTS[+tr.dataset.i]);});});
}
function resTag(r){return r==='hit'?'<span class="tag hit">⭕ 성공</span>':r==='miss'?'<span class="tag miss">❌ 실패</span>':'<span class="tag none">안 적음</span>';}
function miniSvg(a){
  var bl=a.balls||defaultBalls();
  function line(path,col){if(!path||path.length<2)return '';var pts=path.map(function(p){return p.x*S+','+p.y*S;}).join(' ');
    return '<polyline points="'+pts+'" fill="none" stroke="#fff" stroke-width="12" stroke-linejoin="round"/><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="7" stroke-linejoin="round"/>';}
  var h='<svg class="mini" viewBox="-94 -94 988 588" xmlns="http://www.w3.org/2000/svg">'+staticTable()+line(a.predict,'#1650d8')+line(a.actual,'#d0231a');
  ['r','y','w'].forEach(function(n){if(!bl[n])return;var c={w:'#fbfbf5',y:'#f5c400',r:'#d8231b'}[n];
    h+='<circle cx="'+bl[n].x*S+'" cy="'+bl[n].y*S+'" r="'+BR*S+'" fill="'+c+'" stroke="#222" stroke-width="2"/>';});
  return h+'</svg>';
}
function openAttempt(a){
  var tp=tipDesc(a.tip),seq=railSeq(a.predict||[]),aseq=railSeq(a.actual||[]);
  var html=miniSvg(a)+
    '<table class="t"><tr><th>날짜</th><td>'+fmtDT(a.created_at)+'</td><th>판</th><td>'+esc(boardName(a.board_id))+'</td></tr>'+
    '<tr><th>예측 쿠션</th><td style="color:#1650d8"><b>'+(seq.join(' → ')||'—')+'</b></td><th>실제 쿠션</th><td style="color:#d0231a"><b>'+(aseq.join(' → ')||'—')+'</b></td></tr>'+
    '<tr><th>당점</th><td>'+esc(tp[0])+(tp[1]?' <small>('+esc(tp[1])+')</small>':'')+'</td><th>속도</th><td>'+(a.speed?a.speed+' '+SPEEDS[a.speed-1]:'—')+(a.kmh!=null?' · '+a.kmh+'km/h':'')+'</td></tr>'+
    '<tr><th>결과</th><td>'+resTag(a.result)+'</td><th>메모</th><td>'+esc(a.memo||'')+'</td></tr></table>';
  var alive=BOARDS.some(function(b){return b.id===a.board_id;});
  modal({title:'🎯 지난 시도 보기',wide:true,html:html,buttons:[
    {label:'<span class="ic">🗑</span> 이 기록 지우기',value:'del',cls:'danger'},
    {label:'닫기',value:null},
    {label:'<span class="ic">🔁</span> 이 조건으로 다시 해보기',value:'again',cls:'primary'}]}).then(function(r){
    if(r.value==='again')replay(a,alive);
    else if(r.value==='del')delAttempt(a);
  });
}
function replay(a,alive){
  function go(){
    pushUndo();
    ST.balls=Object.assign(defaultBalls(),clone(a.balls||{}));
    ST.draft={predict:clone(a.predict||[]),actual:[],tip:a.tip?clone(a.tip):null,speed:a.speed||null,kmh:a.kmh,result:null,memo:''};
    LAYER='predict';MODE='edit';saveSoon();closeLog();toast('🔁 그때 조건을 불러왔습니다');
  }
  if(alive&&a.board_id!==CUR)switchBoard(a.board_id);
  else if(!alive){toast('그 판은 지워져서, 지금 보던 판에 불러옵니다');}
  go();
}
function delAttempt(a){
  confirmBox('🗑 이 기록을 지울까요?','휴지통으로 옮깁니다. '+KEEP_DAYS+'일 안에는 다시 살릴 수 있습니다.','지우기',true).then(function(ok){
    if(!ok)return;
    SB.from('bb_attempts').update({deleted_at:new Date().toISOString()}).eq('id',a.id).then(function(x){
      if(x&&x.error){toast('⚠ 지우지 못했습니다');return;}
      logEvent('attempt.delete',a.board_id,{name:boardName(a.board_id),at:a.created_at});
      toast('기록을 휴지통으로 옮겼습니다');loadLog();
    });
  });
}
function evtText(e){
  var p=e.payload||{};
  switch(e.kind){
    case 'board.create': return '새 판 ‘'+p.name+'’을 만들었습니다';
    case 'board.rename': return '판 이름을 ‘'+p.from+'’ → ‘'+p.to+'’(으)로 바꿨습니다';
    case 'board.copy': return '‘'+p.from+'’을 복제해 ‘'+p.name+'’을 만들었습니다';
    case 'board.delete': return '‘'+p.name+'’을 휴지통으로 옮겼습니다';
    case 'board.restore': return '‘'+p.name+'’을 휴지통에서 살렸습니다';
    case 'attempt.save': return '‘'+p.name+'’에 시도를 기록했습니다'+(p.result==='hit'?' (⭕ 성공)':p.result==='miss'?' (❌ 실패)':'');
    case 'attempt.delete': return '‘'+p.name+'’의 시도 기록을 휴지통으로 옮겼습니다';
    case 'attempt.restore': return '시도 기록을 휴지통에서 살렸습니다';
    case 'password.change': return '비밀번호를 바꿨습니다';
  }
  return e.kind;
}
function renderEvents(){
  if(!EVTS.length){$('logBody').innerHTML='<div class="empty">아직 변경 이력이 없습니다.</div>';return;}
  $('logBody').innerHTML='<table class="t"><tr><th style="width:18rem">언제</th><th>무엇을</th></tr>'+
    EVTS.map(function(e){return '<tr><td class="num">'+fmtDT(e.at)+'</td><td>'+esc(evtText(e))+'</td></tr>';}).join('')+'</table>'+
    (EVTS.length>=500?'<p>최근 500개만 보여 줍니다.</p>':'');
}

/* ═════════ 휴지통 ═════════ */
function daysLeft(t){return Math.max(0,KEEP_DAYS-Math.floor((Date.now()-new Date(t))/864e5));}
function openTrash(){
  Promise.all([
    SB.from('bb_boards').select('*').not('deleted_at','is',null).order('deleted_at',{ascending:false}),
    SB.from('bb_attempts').select('*').not('deleted_at','is',null).order('deleted_at',{ascending:false}).limit(200)
  ]).then(function(rs){
    var bs=rs[0].data||[],as=rs[1].data||[];
    var names={};bs.forEach(function(b){names[b.id]=b.name;});BOARDS.forEach(function(b){names[b.id]=b.name;});
    var h='<p>지운 것은 <b>'+KEEP_DAYS+'일</b> 동안 여기 있다가 저절로 없어집니다.</p>';
    h+='<h3>판 ('+bs.length+'개)</h3>'+(bs.length?'<div class="list">'+bs.map(function(b){
      return '<div class="litem"><span class="grow"><b>'+esc(b.name)+'</b><br><small>'+fmtDT(b.deleted_at)+' 지움 · '+daysLeft(b.deleted_at)+'일 남음</small></span><button class="primary" data-rb="'+b.id+'">↺ 되살리기</button></div>';}).join('')+'</div>':'<p>없음</p>');
    h+='<h3>시도 기록 ('+as.length+'개)</h3>'+(as.length?'<div class="list">'+as.map(function(a){
      return '<div class="litem"><span class="grow"><b>'+esc(names[a.board_id]||'(판 없음)')+'</b> · '+fmtDT(a.created_at)+' '+resTag(a.result)+'<br><small>'+fmtDT(a.deleted_at)+' 지움 · '+daysLeft(a.deleted_at)+'일 남음</small></span><button class="primary" data-ra="'+a.id+'">↺ 되살리기</button></div>';}).join('')+'</div>':'<p>없음</p>');
    modal({title:'🗑 휴지통',wide:true,html:h,buttons:[{label:'닫기',value:null,cls:'primary'}],onOpen:function(m){
      m.querySelectorAll('[data-rb]').forEach(function(x){x.addEventListener('click',function(){
        var b=bs.filter(function(y){return y.id===x.dataset.rb;})[0];x.disabled=true;
        SB.from('bb_boards').update({deleted_at:null}).eq('id',b.id).then(function(r){
          if(r&&r.error){toast('⚠ 되살리지 못했습니다');x.disabled=false;return;}
          b.deleted_at=null;BOARDS.push(normBoard(b));logEvent('board.restore',b.id,{name:b.name});
          x.closest('.litem').remove();renderTabs();toast('‘'+b.name+'’을 되살렸습니다');
        });});});
      m.querySelectorAll('[data-ra]').forEach(function(x){x.addEventListener('click',function(){
        var a=as.filter(function(y){return y.id===x.dataset.ra;})[0];x.disabled=true;
        SB.from('bb_attempts').update({deleted_at:null}).eq('id',a.id).then(function(r){
          if(r&&r.error){toast('⚠ 되살리지 못했습니다');x.disabled=false;return;}
          logEvent('attempt.restore',a.board_id,{});x.closest('.litem').remove();toast('시도 기록을 되살렸습니다');
          if(!$('logv').classList.contains('hide'))loadLog();
        });});});
    }});
  });
}

/* ═════════ 설정 ═════════ */
function openSettings(){
  modal({title:'⚙ 설정',html:'<p>로그인한 계정: <b>'+esc(USER&&USER.email||'')+'</b></p>',buttons:[
    {label:'<span class="ic">🔑</span> 비밀번호 바꾸기',value:'pw'},
    {label:'<span class="ic">🚪</span> 나가기 (로그아웃)',value:'out',cls:'danger'},
    {label:'닫기',value:null,cls:'primary'}]}).then(function(r){
    if(r.value==='pw')changePw();
    else if(r.value==='out')confirmBox('🚪 나갈까요?','다음에 들어올 때 아이디와 비밀번호를 다시 넣어야 합니다.','나가기',true).then(function(ok){
      if(!ok)return;(saveTimer?flush():Promise.resolve()).then(function(){SB.auth.signOut().then(function(){location.reload();});});
    });
  });
}
function changePw(){
  modal({title:'🔑 비밀번호 바꾸기',body:'새 비밀번호를 두 번 적어 주세요. (8자 이상)',input:{type:'password',ac:'new-password',max:72},input2:{type:'password',ac:'new-password',placeholder:'한 번 더'},
    buttons:[{label:'취소',value:null},{label:'바꾸기',value:'ok',cls:'primary'}]}).then(function(r){
    if(r.value!=='ok')return;
    if((r.text||'').length<8){modal({title:'8자 이상으로 적어 주세요',buttons:[{label:'다시 하기',value:1,cls:'primary'}]}).then(changePw);return;}
    if(r.text!==r.text2){modal({title:'두 번 적은 비밀번호가 다릅니다',buttons:[{label:'다시 하기',value:1,cls:'primary'}]}).then(changePw);return;}
    SB.auth.updateUser({password:r.text}).then(function(x){
      if(x&&x.error){toast('⚠ 바꾸지 못했습니다 ('+x.error.message+')');return;}
      logEvent('password.change',null,null);toast('🔑 비밀번호를 바꿨습니다');
    });
  });
}

/* ═════════ 연결 ═════════ */
function bind(){
  $('lform').addEventListener('submit',doLogin);
  $('pwEye').addEventListener('click',function(){var p=$('pw');var s=p.type==='password';p.type=s?'text':'password';this.innerHTML='<span class="ic">'+(s?'🙈':'👁')+'</span> '+(s?'숨기기':'보기');});
  $('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b&&b.dataset.id&&b.dataset.id!==CUR)switchBoard(b.dataset.id);});
  $('bMore').addEventListener('click',boardList);
  $('bNew').addEventListener('click',newBoard);
  $('bRename').addEventListener('click',renameBoard);
  $('bCopy').addEventListener('click',copyBoard);
  $('bDel').addEventListener('click',deleteBoard);
  $('bLog').addEventListener('click',openLog);
  $('bBack').addEventListener('click',closeLog);
  $('bTrash').addEventListener('click',openTrash);
  $('bSet').addEventListener('click',openSettings);
  ['vAtt','vEvt'].forEach(function(id){$(id).addEventListener('click',function(){LOGVIEW=this.dataset.v;loadLog();});});
  $('lBoard').addEventListener('change',loadLog);
  ['mBall','mDraw','mEdit'].forEach(function(id){$(id).addEventListener('click',function(){setMode(this.dataset.m);});});
  ['lPre','lAct'].forEach(function(id){$(id).addEventListener('click',function(){LAYER=this.dataset.l;SEL=null;hidePop();if(MODE==='ball')MODE='draw';renderAll();});});
  ['cW','cY'].forEach(function(id){$(id).addEventListener('click',function(){if(ST.balls.cue===this.dataset.c)return;pushUndo();ST.balls.cue=this.dataset.c;saveSoon();renderAll();});});
  $('bReset').addEventListener('click',function(){pushUndo();var c=ST.balls.cue,d=defaultBalls();d.cue=c;ST.balls=d;saveSoon();renderAll();toast('공을 처음 자리로 옮겼습니다 (↶ 되돌리기 가능)');});
  $('bDone').addEventListener('click',doneDraw);
  $('bClear').addEventListener('click',clearLayer);
  $('bUndo').addEventListener('click',undo);$('bRedo').addEventListener('click',redo);
  $('ptDel').addEventListener('click',delPoint);
  $('bRec').addEventListener('click',record);
  var s=svg();
  s.addEventListener('pointerdown',onDown);s.addEventListener('pointermove',onMove);
  s.addEventListener('pointerup',onUp);s.addEventListener('pointercancel',onUp);s.addEventListener('pointerleave',onLeave);
  s.addEventListener('contextmenu',function(e){e.preventDefault();});
  /* 당점 */
  $('tipGuide').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;GUIDE=b.dataset.g;pref('guide',GUIDE);renderSide();});
  $('tip').addEventListener('pointerdown',function(e){
    var t=$('tip'),p=t.createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform(t.getScreenCTM().inverse());
    var x=p.x/100,y=p.y/100,d=Math.hypot(x,y);if(d>1.1)return;
    if(d>0.92){x=x/d*0.92;y=y/d*0.92;}
    setTip({x:r2(x),y:r2(y)});
  });
  $('tipMid').addEventListener('click',function(){setTip({x:0,y:0});});
  $('tipClr').addEventListener('click',function(){setTip(null);});
  $('spd').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var v=+b.dataset.s;pushUndo();ST.draft.speed=ST.draft.speed===v?null:v;saveSoon();renderSide();renderTools();});
  $('kmh').addEventListener('change',function(){var v=this.value===''?null:Math.round(parseFloat(this.value)*10)/10;if(v!==null&&(isNaN(v)||v<0))v=null;pushUndo();ST.draft.kmh=v;saveSoon();renderTools();});
  ['rHit','rMiss'].forEach(function(id){$(id).addEventListener('click',function(){var v=id==='rHit'?'hit':'miss';pushUndo();ST.draft.result=ST.draft.result===v?null:v;saveSoon();renderSide();renderTools();});});
  $('memo').addEventListener('input',function(){ST.draft.memo=this.value;saveSoon();});
  /* 키보드 */
  document.addEventListener('keydown',function(e){
    if($('app').classList.contains('hide')||!$('mask').classList.contains('hide')||!$('logv').classList.contains('hide'))return;
    var inField=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
    if((e.ctrlKey||e.metaKey)&&!inField){
      if(e.key==='z'||e.key==='Z'){e.preventDefault();if(e.shiftKey)redo();else undo();}
      else if(e.key==='y'||e.key==='Y'){e.preventDefault();redo();}
      return;
    }
    if(inField)return;
    if((e.key==='Enter'||e.key==='Escape')&&MODE==='draw'){e.preventDefault();doneDraw();}
    else if(e.key==='Escape'){SEL=null;hidePop();renderTable();}
    else if((e.key==='Delete'||e.key==='Backspace')&&MODE==='edit'&&SEL!==null){e.preventDefault();delPoint();}
  });
  var rt=null;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){hidePop();renderTable();},80);});
}

bind();
SB.auth.getSession().then(function(r){
  var s=r&&r.data&&r.data.session;
  if(s)enter(s.user);else showLogin('');
},function(){showLogin('인터넷 연결을 확인해 주세요.');});
</script>
