<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>당구 연습장</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="physics.js"></script>
<!--
  🎱 아버지 당구 연습장 — 로한북과 완전히 별개인 앱. (2026-09-26 v1 · v2 4구 훈련)
  🔒 v2: 3구가 아니라 **4구**다(흰·노랑·빨강 ①②). 중대 규격. 물리 시뮬레이션은 physics.js
     판 종류 — 🎱 자유 연습(두 빨강 득점 판정) · 📐 분리각 훈련(예측 → 정답 → 오차°)
  🔒 같은 Supabase 프로젝트를 쓰지만 코드·테이블·계정은 공유하지 않는다.
     · 테이블: bb_boards · bb_attempts · bb_events (RLS: 본인 + app_metadata.app='billiards')
     · 로한 계정으로 들어오면 로그아웃시킨다(반대쪽 로한북도 똑같이 아버지를 막는다)
  🔒 실버 UX 원칙 — 60세 이상 · 32인치 이상 모니터 · 마우스
     1. 글자 20px↑ · 버튼 56px↑ · 아이콘엔 반드시 글자를 같이
     2. 클릭만으로 전부 된다. 더블클릭·우클릭·마우스 올려야 보이는 기능 없음
     3. 지금 무슨 모드인지 글자로 늘 보인다
     4. 자동 저장. 지우기는 휴지통(30일). 되돌리기는 늘 보인다
  좌표: 다이아 단위. 가로 0~8 · 세로 0~4 (화면은 ×100)
-->
<style>
:root{
  --bg:#f3efe6; --card:#ffffff; --ink:#161616; --sub:#4d4d4d; --line:#bdb5a4;
  --green:#1d6b3f; --green-d:#11482a; --cloth:#2a8a52; --cushion:#17613a; --wood:#5b3a22;
  --blue:#1650d8; --red:#d0231a; --warn:#b3261e; --focus:#ff9f1a; --pick:#fff3cf;
}
*{box-sizing:border-box}
/* 글자 크기 = 화면 폭·높이 중 작은 쪽에 맞춘다(스크롤이 안 생기게).
   32인치 브라우저 창(2560×1300) ≈ 24px · 4K 100% 배율이면 30px 까지.
   🔒 v1.1: 폭만 보고 키웠더니 실제 브라우저 창(주소창·탭 빼면 높이 ~1300)에서 오른쪽 패널에 스크롤이 생겼다 */
html{font-size:clamp(15px,min(0.95vw,1.85vh),30px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:1rem;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{min-height:2.6rem;padding:.25rem .8rem;border:2px solid #857d6c;border-radius:.6rem;background:#fff;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:700;white-space:nowrap}
button:hover{background:var(--pick);border-color:#4d4637}
button:disabled{opacity:.4;cursor:not-allowed;background:#fff}
button.on{background:var(--green);border-color:var(--green-d);color:#fff}
button.primary{background:var(--green);border-color:var(--green-d);color:#fff}
button.primary:hover{background:#15552f}
button.danger{border-color:var(--warn);color:var(--warn)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
.ic{font-size:1.35em;line-height:1}
input[type=text],input[type=email],input[type=password],input[type=number],select{
  min-height:2.8rem;padding:.3rem .7rem;border:2px solid #857d6c;border-radius:.5rem;background:#fff;width:100%}
.hide{display:none!important}

#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;color:var(--sub)}
/* ── 로그인 ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.lcard{background:var(--card);border:2px solid var(--line);border-radius:1rem;padding:2rem 2.2rem;width:min(30rem,94vw);box-shadow:0 .4rem 1.4rem rgba(0,0,0,.08)}
.lcard h1{font-size:1.6rem;margin:0 0 1.4rem;text-align:center}
.lcard label{display:block;font-weight:700;margin:1rem 0 .35rem}
.lcard input{min-height:3.2rem;font-size:1.1rem}
.pwrow{display:flex;gap:.5rem}
.pwrow button{flex:none}
#loginBtn{width:100%;min-height:3.6rem;font-size:1.25rem;margin-top:1.5rem}
#loginErr{margin-top:1rem;color:var(--warn);font-weight:700;min-height:1.5em}

/* ── 앱 머리 ── */
.top{display:flex;align-items:center;gap:.5rem;padding:.35rem .8rem;background:#fff;border-bottom:2px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;font-size:1.2rem;margin-right:.5rem}
.tabzone{flex:1;min-width:0;display:flex;align-items:center;gap:.5rem}
.tabzone>button{flex:none}
#tabs{display:flex;gap:.35rem;flex-wrap:nowrap;min-width:0;overflow:hidden;flex:0 1 auto}
#tabs button{flex:none}
#tabs button{min-height:2.6rem;border-radius:.6rem .6rem 0 0;border-bottom-width:4px}
#tabs button.on{border-bottom-color:var(--focus)}
.sp{flex:1}
.stepgrp .lbl{font-weight:700;margin-right:.2rem}
.bbar{display:flex;align-items:center;gap:.5rem;padding:.35rem .8rem;flex-wrap:wrap}
.bname{font-size:1.25rem;font-weight:800;margin-right:.5rem}
.save{font-weight:700;color:var(--green)}
.setchip{display:inline-flex;align-items:center;gap:.4rem;font-weight:800;font-size:1.1rem;padding:.1rem .2rem .1rem .7rem;border-radius:.6rem;background:#fff3cf;border:2px solid #e6c46a}
.save.bad{color:var(--warn)}

/* ── 작업판 ──
   🔒 한 화면에 전부 들어간다(스크롤 없음). 당구대는 "남은 자리"를 채운다 —
      도구줄이 두 줄로 접혀도 당구대가 줄어들 뿐, [기록하기]·[긋기 끝] 이 화면 밖으로 밀리지 않는다.
      (v1 첫 판: 도구줄을 당구대 아래에 뒀더니 32인치에서 잘렸다) */
#app{height:100vh;display:flex;flex-direction:column}
#workv{flex:1;min-height:0;display:flex;flex-direction:column}
#logv{flex:1;min-height:0;overflow:auto}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 19rem;gap:.7rem;padding:0 .8rem .6rem}
.stage,.box{background:var(--card);border:2px solid var(--line);border-radius:.9rem}
.stage{padding:.4rem .5rem .4rem;display:flex;flex-direction:column;min-height:0}
.hint{flex:1;min-width:14rem;min-height:2.6rem;display:flex;align-items:center;font-size:1rem;line-height:1.25;font-weight:700;padding:.15rem .7rem;margin-left:.4rem;border-radius:.5rem;background:#eef6f0;border:2px solid #b9d9c4}
.tblwrap{flex:1;min-height:10rem;position:relative;margin-top:.35rem}
#tbl{position:absolute;inset:0;display:block;width:100%;height:100%;user-select:none;touch-action:none}
#tbl.m-ball{cursor:default}
#tbl.m-draw{cursor:crosshair}
.seq{font-size:1.05rem;margin:0 .6rem;white-space:nowrap}
.seq b{font-size:1.1rem}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.tools .lbl{font-weight:700}
.tools .div{width:2px;align-self:stretch;background:var(--line);margin:0 .15rem}
.grp{display:inline-flex;gap:.3rem;align-items:center}
.side{display:flex;flex-direction:column;gap:.35rem;min-height:0;overflow:auto}
.box{padding:.35rem .7rem .5rem}
.box h3{margin:0 0 .3rem;font-size:1.05rem}
.box h3 small{font-weight:400;color:var(--sub)}
.row{display:flex;gap:.4rem;flex-wrap:wrap}
.row button{flex:1}
.tipgrid{display:flex;align-items:center;gap:.6rem;margin-top:.35rem}
#tip{display:block;flex:none;width:7rem;height:7rem;cursor:crosshair}
.tipbtn{flex:1;display:flex;flex-direction:column;gap:.5rem}
#tipTxt{text-align:center;font-weight:800;font-size:1.05rem;min-height:1.4em;margin-top:.2rem}
#tipTxt2{text-align:center;color:var(--sub);font-size:.9rem;min-height:1.3em}
.spd{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem}
.spd button{flex-direction:column;gap:0;padding:.15rem 0;min-height:3rem;line-height:1.1}
.spd button b{font-size:1.2rem}
.spd button span{font-size:.72rem;font-weight:600}
.kmh{display:flex;align-items:center;gap:.5rem;margin-top:.35rem}
.kmh input{width:7rem}
.res button{min-height:2.8rem;font-size:1.05rem}
.res button.hit.on{background:var(--blue);border-color:#0d3aa3}
.res button.miss.on{background:var(--warn);border-color:#7d1a14}
#memo{margin-top:.35rem}
.recrow{display:flex;gap:.35rem;flex:none}
#bRec{min-height:2.9rem;font-size:1.15rem;flex:1}
#bNextT{min-height:2.9rem;flex:none}
/* 높이가 낮은 창(노트북)에서만 당점 원·속도칸을 줄인다 */
@media (max-height:800px){#tip{width:6rem;height:6rem}.spd button{min-height:2.6rem}#tipGuide{display:none}.aimtxt{min-height:0}}
.hint.ok{background:#e3ecff;border-color:#9db6f5;color:#0d3aa3}
.hint.bad{background:#fde7e4;border-color:#f0b0a8;color:#7d1a14}
.hint.foul{background:#fff1d6;border-color:#f0c878;color:#7a4b00}
.hint.run{background:#f1e6fb;border-color:#c9a7ec;color:#4a1a7a}
.aimtxt{font-weight:800;font-size:1rem;line-height:1.25;margin:0 0 .25rem;min-height:2.5em}
.simrow{display:flex;gap:.4rem}
#bSim{flex:1;min-height:2.8rem;font-size:1.12rem;background:#6a2bb0;border-color:#4a1a7a;color:#fff}
#bSim:hover{background:#56209a}
#bSlow{flex:none}
/* 두께: [◐ 왼쪽] 1/8 2/8 3/8 4/8 · [◑ 오른쪽] 5/8 6/8 7/8 8/8 — 두 줄 */
.thk{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:.3rem}
.thk button{padding:0;min-height:2.6rem}
.thk button.lr{font-size:.92rem}
.tag.foul{background:#fff1d6;color:#7a4b00}
.modal .btns button.hitb{background:var(--blue);border-color:#0d3aa3;color:#fff}
.kindpick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem;margin-top:.6rem}
.kindpick button{flex-direction:column;min-height:6.5rem;padding:.6rem;white-space:normal;line-height:1.3;border-width:3px}
.kindpick button b{font-size:1.25rem}
.kindpick button span{font-weight:400;font-size:.92rem}
/* 판 종류에 따라 보이는 도구 — data-k="free sep cush" 중 지금 종류가 없으면 숨긴다 (🎱 자유 · 📐 분리각 · 🔁 원·투쿠션) */
body.k-free [data-k]:not([data-k~="free"]),body.k-sep [data-k]:not([data-k~="sep"]),body.k-cush [data-k]:not([data-k~="cush"]){display:none!important}
.kindpick button.on{background:#eef6f0;color:var(--ink);border-color:var(--green)}

/* 점 지우기 떠 있는 버튼 */
#ptPop{position:fixed;z-index:30;display:flex;gap:.35rem;background:#fff;border:2px solid var(--line);border-radius:.6rem;padding:.3rem;box-shadow:0 .3rem 1rem rgba(0,0,0,.18)}

/* ── 기록 화면 ── */
#logv{padding:0 1rem 1rem}
.lhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:.5rem 0 .8rem}
.lhead select{width:auto;min-width:12rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;margin-bottom:.8rem}
.stat{background:#fff;border:2px solid var(--line);border-radius:.8rem;padding:.5rem .8rem}
.stat .k{color:var(--sub);font-weight:700}
.stat .v{font-size:1.7rem;font-weight:800;white-space:nowrap}
table.t{width:100%;border-collapse:collapse;background:#fff;border:2px solid var(--line);border-radius:.8rem;overflow:hidden}
.t th,.t td{padding:.55rem .7rem;border-bottom:1px solid #e3ddd0;text-align:left;vertical-align:middle}
.t th{background:#f7f3ea;font-size:.95rem}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--pick)}
.t td.num{white-space:nowrap}
.tag{display:inline-block;padding:.05rem .6rem;border-radius:1rem;font-weight:800;white-space:nowrap}
.tag.hit{background:#dfe8ff;color:#0d3aa3}
.tag.miss{background:#fde0dd;color:#7d1a14}
.tag.none{background:#eee;color:#555}
.tag.sim{background:#f1e6fb;color:#4a1a7a}
.spdt{margin-bottom:.8rem}
/* 📈 실력 추이 — 선 그래프(범주 색 2개: 파랑·주황, 색각 검사 통과) */
.chart{position:relative;background:#fff;border:2px solid var(--line);border-radius:.8rem;padding:.6rem .8rem .4rem;margin-bottom:.8rem}
.chart h4{margin:0 0 .3rem;font-size:1.1rem}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:1.2rem;flex-wrap:wrap;font-weight:700;margin:.1rem 0 .3rem}
.legend i{display:inline-block;width:1.4rem;height:.35rem;border-radius:.2rem;vertical-align:middle;margin-right:.35rem}
.ctip{position:absolute;pointer-events:none;background:#1c1c1c;color:#fff;border-radius:.5rem;padding:.4rem .7rem;font-size:.95rem;line-height:1.4;white-space:nowrap;z-index:5}
.chart details{margin-top:.2rem}
.chart summary{cursor:pointer;font-weight:700;color:var(--sub)}
.weak{background:#fff8e6;border:2px solid #efd28a;border-radius:.8rem;padding:.5rem .9rem;margin-bottom:.6rem;font-size:1.1rem}
.weak p{margin:.25rem 0}
tr.worst td{background:#fff3cf;font-weight:800}
.sec2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:1300px){.sec2{grid-template-columns:1fr}}
.empty{padding:2rem;text-align:center;color:var(--sub);background:#fff;border:2px dashed var(--line);border-radius:.8rem}

/* ── 모달 · 알림 ── */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:#fff;border-radius:1rem;padding:1.4rem 1.6rem;width:min(38rem,96vw);max-height:92vh;overflow:auto;box-shadow:0 1rem 3rem rgba(0,0,0,.3)}
.modal.wide{width:min(70rem,96vw)}
.modal h2{margin:0 0 .8rem;font-size:1.35rem}
.modal .body{font-size:1.1rem;margin-bottom:1rem}
.modal input{min-height:3.2rem;font-size:1.15rem;margin-bottom:1rem}
.modal .btns{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap}
.modal .btns button{min-height:3.2rem;min-width:7rem;font-size:1.1rem}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);z-index:60;background:#1c1c1c;color:#fff;
  padding:.8rem 1.4rem;border-radius:.8rem;font-size:1.15rem;font-weight:700;box-shadow:0 .4rem 1.2rem rgba(0,0,0,.3)}
.list{display:flex;flex-direction:column;gap:.4rem}
.litem{display:flex;align-items:center;gap:.6rem;padding:.45rem .6rem;border:2px solid #e3ddd0;border-radius:.6rem}
.litem .grow{flex:1}
.litem.on{border-color:var(--green);background:#eef6f0}
.mini{width:100%;height:auto;display:block;margin-bottom:.8rem}

/* 원·투쿠션 판은 도구줄 버튼이 가장 많다(종류 4개가 올라와 있다) — 늘 좁은 여백 */
body.k-cush .tools button{padding:.25rem .55rem;gap:.25rem}
body.k-cush .tools .lbl{display:none}
/* 좁은 창(125% 배율 노트북 등): 도구줄이 두 줄로 접히지 않게 여백만 줄인다 */
@media (max-width:1700px){
  .tools button{padding:.25rem .55rem;gap:.25rem}
  .tools .lbl{display:none}
}
@media (max-width:1100px){
  #app{height:auto}
  .work{grid-template-columns:1fr}
  .tblwrap{min-height:55vw}
  .side{overflow:visible}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>

<!-- ═════════ 로그인 ═════════ -->
<!-- 🔒 첫 화면: 판을 다 불러와 그릴 준비가 될 때까지 이것만 보인다(새로고침 때 다른 화면이 잠깐 비쳤다) -->
<div id="boot">🎱 불러오는 중…</div>

<div id="login" class="hide">
  <form class="lcard" id="lform" autocomplete="on" onsubmit="return false">
    <h1>🎱 당구 연습장</h1>
    <label for="email">아이디 (이메일)</label>
    <input id="email" type="email" autocomplete="username" inputmode="email">
    <label for="pw">비밀번호</label>
    <div class="pwrow">
      <input id="pw" type="password" autocomplete="current-password">
      <button type="button" id="pwEye"><span class="ic">👁</span> 보기</button>
    </div>
    <button type="submit" id="loginBtn" class="primary">로그인하기</button>
    <div id="loginErr" role="alert"></div>
  </form>
</div>

<!-- ═════════ 앱 ═════════ -->
<div id="app" class="hide">
  <header class="top">
    <div class="brand">🎱 당구 연습장</div>
    <!-- 🔒 탭은 들어가는 만큼 전부 — 넘치는 판만 [판 목록 (외 N개)] 로 (로한: "판들을 최대한 여러 개 띄우자") -->
    <div class="tabzone">
      <nav id="tabs"></nav>
      <button id="bMore"><span class="ic">📂</span> 판 목록</button>
      <button id="bNew" class="primary"><span class="ic">＋</span> 새 판</button>
    </div>
    <!-- v1.2 쿠션 눈금 간격 — 1 단위(0~80 정수) 또는 0.5 단위(32.5) · 오른쪽으로 옮겨 탭 자리를 넓혔다 -->
    <span class="grp stepgrp" id="stepGrp">
      <span class="lbl">눈금 간격</span>
      <button data-st="1">1 단위</button>
      <button data-st="0.5">0.5 단위</button>
    </span>
    <button id="bLog"><span class="ic">📋</span> 기록</button>
    <button id="bTrash"><span class="ic">🗑</span> 휴지통</button>
    <button id="bSet"><span class="ic">⚙</span> 설정</button>
  </header>

  <div id="workv">
    <div class="bbar">
      <span class="bname" id="bName"></span>
      <button id="bRename"><span class="ic">✏️</span> 이름 바꾸기</button>
      <button id="bCopy"><span class="ic">📄</span> 복제</button>
      <button id="bDel" class="danger"><span class="ic">🗑</span> 이 판 지우기</button>
      <!-- v2.3 🎲 문제 모드 -->
      <button id="bNewQ"><span class="ic">🎲</span> 새 문제</button>
      <button id="bSet10" data-k="sep cush"><span class="ic">📝</span> 10문제 풀기</button>
      <span id="setChip" class="setchip hide">📝 <b id="setNo"></b> <button id="bSetStop">그만하기</button></span>
      <div class="hint" id="hint"></div>
      <div class="seq" id="seq"></div>
      <span id="saveSt" class="save"></span>
    </div>
    <div class="work">
      <section class="stage">
        <!-- 🔒 v1.1 도구는 한 줄. 모드 | 선 종류 | 모드별 도구 | 되돌리기
             v2: 판 종류마다 모드가 다르다 — 자유 연습(공·긋기·고치기) / 분리각(공·①1적구 방향·②수구 방향) -->
        <div class="tools">
          <span class="grp">
            <button id="mBall" data-m="ball"><span class="ic">✋</span> 공 옮기기</button>
            <button id="mDraw" data-m="draw" data-k="free"><span class="ic">✏️</span> 선 긋기</button>
            <button id="mEdit" data-m="edit" data-k="free"><span class="ic">🖐</span> 선 고치기</button>
            <button id="mObj" data-m="pobj" data-k="sep"><span class="ic">🔴</span> ① 1적구 방향</button>
            <button id="mCue" data-m="pcue" data-k="sep"><span class="ic">⚪</span> ② 수구 방향</button>
            <button id="mCpt" data-m="cpt" data-k="cush"><span class="ic">📍</span> 쿠션 지점 찍기</button>
          </span>
          <!-- 🔁 원·투쿠션 종류 — 오른쪽 패널이 넘쳐서 도구줄로 올렸다(v2.1) -->
          <span class="div" data-k="cush"></span>
          <span class="grp" id="ctype" data-k="cush"><button data-ct="first">쿠션 먼저</button><button data-ct="after">1적구 뒤 쿠션</button></span>
          <span class="grp" id="ncush" data-k="cush"><button data-n="1">원쿠션</button><button data-n="2">투쿠션</button></span>
          <span class="div" data-k="free"></span>
          <span class="grp" data-k="free">
            <button id="lPre" data-l="predict"><span style="color:#1650d8">━</span> 예측선</button>
            <button id="lAct" data-l="actual"><span style="color:#d0231a">━</span> 실제선</button>
          </span>
          <span class="div"></span>
          <span id="tBall" class="grp">
            <span class="lbl">내 공</span>
            <button id="cW" data-c="w">⚪ 흰 공</button>
            <button id="cY" data-c="y">🟡 노란 공</button>
            <button id="bReset"><span class="ic">↺</span> 처음 자리</button>
          </span>
          <span id="tDraw" class="grp">
            <button id="bDone" class="primary"><span class="ic">✔</span> 긋기 끝</button>
            <button id="bClear" class="danger"><span class="ic">🧹</span> 선 지우기</button>
          </span>
          <span class="sp"></span>
          <span class="grp">
            <button id="bUndo"><span class="ic">↶</span> 되돌리기</button>
            <button id="bRedo"><span class="ic">↷</span> 다시하기</button>
          </span>
        </div>
        <div class="tblwrap">
        <svg id="tbl" viewBox="-94 -94 988 588" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1650d8"/></marker>
            <marker id="arR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0231a"/></marker>
          </defs>
          <g id="gStatic"></g><g id="gDyn"></g>
        </svg>
        </div>
      </section>

      <aside class="side">
        <!-- 📐 분리각 훈련: 두께를 버튼으로 고른다(조준은 두께에서 계산) -->
        <section class="box" data-k="sep cush" id="thkBox">
          <h3>📏 두께 <small>— 1적구(빨간 공 ①)의 어디를</small></h3>
          <div class="thk" id="thk"></div>
        </section>
        <section class="box">
          <h3>🎯 당점 <small>— 원을 클릭하세요</small></h3>
          <div class="row" id="tipGuide">
            <button data-g="cross">십자</button><button data-g="c12">12시</button><button data-g="c16">16방향</button>
          </div>
          <div class="tipgrid">
            <svg id="tip" viewBox="-115 -115 230 230"></svg>
            <div class="tipbtn"><button id="tipMid">⊙ 정중앙</button><button id="tipClr">지우기</button></div>
          </div>
          <div id="tipTxt"></div><div id="tipTxt2"></div>
        </section>
        <section class="box">
          <h3>💨 속도 <small>— 3 보통 = 2쿠션</small></h3>
          <div class="spd" id="spd"></div>
          <div class="kmh" data-k="free"><span>또는</span><input id="kmh" type="number" min="0" max="99" step="0.5" inputmode="decimal" placeholder="숫자"><b>km/h</b></div>
        </section>
        <section class="box">
          <h3 data-k="free">▶ 조준 · 시뮬레이션</h3>
          <div class="aimtxt" data-k="free cush" id="aimTxt"></div>
          <div class="simrow">
            <button id="bSim"><span class="ic">▶</span> <span id="bSimT">시뮬레이션</span></button>
            <button id="bSlow" title="천천히 보기">🐢 천천히</button>
          </div>
          <div class="row" data-k="free cush" style="margin-top:.3rem"><button id="bScan">🎯 맞는 범위</button><button id="bCmp" data-k="cush">💨 속도 비교</button></div>
        </section>
        <div class="recrow">
          <button id="bRec" class="primary"><span class="ic">✅</span> 이 시도 기록하기</button>
          <button id="bNextT" data-k="sep">다음 두께 ▶</button>
        </div>
      </aside>
    </div>
  </div>

  <!-- ═════════ 기록 화면 ═════════ -->
  <div id="logv" class="hide">
    <div class="lhead">
      <button id="bBack" class="primary"><span class="ic">←</span> 당구대로 돌아가기</button>
      <span class="grp" style="margin-left:.8rem">
        <button id="vAtt" data-v="att">🎯 시도 기록</button>
        <button id="vTrend" data-v="trend">📈 실력 추이</button>
        <button id="vEvt" data-v="evt">🕘 변경 이력</button>
      </span>
      <span class="sp"></span>
      <label for="lBoard" style="font-weight:700">판</label>
      <select id="lBoard"></select>
    </div>
    <div id="logBody"></div>
  </div>
</div>

<div id="ptPop" class="hide">
  <button id="ptDel" class="danger"><span class="ic">🗑</span> 이 점 지우기</button>
</div>
<div id="mask" class="hide"></div>
<div id="toast" class="hide"></div>

<script src="app.js"></script>

</body>
</html>
